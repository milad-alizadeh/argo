<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visual exploration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap');
    :root { --paper:#f6f5f2; --stage:#e8e7e3; --ink:#272925; --muted:#74776f; --line:#d9dad3; --selected:#e7e9e1; --focus:#476248; --white:#fff; --sidebar:300px; --small:12px; --body:14px; --gap:16px; --radius:7px; --motion:150ms; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font:var(--body)/1.4 'IBM Plex Sans',sans-serif; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { color:inherit; font:inherit; cursor:pointer; }
    button:disabled { opacity:.32; cursor:default; }
    button:focus-visible,a:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
    button svg { width:18px; height:18px; flex-shrink:0; }
    .shell { display:grid; grid-template-columns:var(--sidebar) minmax(0,1fr); height:100dvh; }
    aside { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); background:var(--paper); z-index:3; }
    .identity { padding:28px 24px 23px; border-bottom:1px solid var(--line); }
    .eyebrow { font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }
    .identity h1 { font-size:17px; line-height:1.3; font-weight:500; margin:10px 0 8px; }
    .identity p { margin:0; font-size:var(--small); color:var(--muted); }
    nav { flex:1; overflow:auto; padding:16px 12px; }
    .direction { margin-bottom:12px; }
    .direction-button { display:grid; grid-template-columns:88px minmax(0,1fr); align-items:center; gap:12px; width:100%; text-align:left; border:1px solid transparent; background:transparent; border-radius:var(--radius); padding:8px; }
    .direction-button:hover { background:var(--selected); }
    .direction-button[aria-expanded="true"] { font-weight:600; background:var(--selected); border-color:var(--line); }
    .direction-label { display:grid; gap:4px; }
    .number { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .file-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 4px 16px; }
    .file-button { display:flex; flex-direction:column; gap:7px; min-width:0; text-align:left; border:2px solid transparent; border-radius:var(--radius); background:transparent; padding:5px; color:var(--muted); font-size:11px; }
    .file-button:hover { color:var(--ink); background:var(--selected); }
    .file-button[aria-current="page"] { color:var(--ink); background:var(--selected); border-color:var(--focus); }
    .file-label { padding:0 2px 2px; line-height:1.35; }
    .thumbnail { position:relative; display:block; width:100%; overflow:hidden; background:var(--white); border-radius:3px; box-shadow:0 0 0 1px var(--line); pointer-events:none; }
    .thumbnail iframe { pointer-events:none; }
    .thumbnail img { position:absolute; inset:0; }
    .thumbnail-unavailable { position:absolute; inset:0; display:grid; place-items:center; padding:6px; text-align:center; color:var(--muted); font-size:10px; font-weight:400; }
    .side-footer { padding:18px 24px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
    main { min-width:0; min-height:0; display:grid; grid-template-rows:65px minmax(0,1fr) 66px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:var(--gap); padding:0 26px; border-bottom:1px solid var(--line); }
    .heading { min-width:0; display:flex; align-items:center; gap:12px; }
    .heading-text { min-width:0; }
    #direction-title { font-weight:500; }
    #file-title { color:var(--muted); font-size:var(--small); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .actions { display:flex; align-items:center; gap:8px; }
    .tool { border:1px solid var(--line); background:transparent; border-radius:var(--radius); min-height:34px; padding:7px 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; color:var(--ink); font-size:var(--small); }
    .tool:hover { background:var(--selected); }
    .icon-tool { width:35px; padding:7px; }
    #stage { min-width:0; min-height:0; overflow:auto; display:flex; align-items:center; justify-content:center; position:relative; background:var(--stage); padding:24px; }
    #stage.actual { align-items:flex-start; justify-content:flex-start; }
    #canvas { flex-shrink:0; position:relative; background:var(--white); box-shadow:0 2px 12px #0000000b; }
    iframe,img { display:block; border:0; }
    iframe { transform-origin:top left; position:absolute; left:0; top:0; }
    img { width:100%; height:100%; object-fit:contain; }
    #message { max-width:420px; text-align:center; color:var(--muted); padding:30px; }
    footer { display:flex; align-items:center; justify-content:space-between; gap:18px; border-top:1px solid var(--line); padding:0 26px; }
    #summary { color:var(--muted); font-size:var(--small); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pager { display:flex; align-items:center; gap:14px; flex-shrink:0; }
    #position { font-size:var(--small); color:var(--muted); min-width:51px; text-align:center; font-variant-numeric:tabular-nums; }
    .arrow { width:35px; height:35px; border:1px solid var(--line); background:transparent; border-radius:50%; display:grid; place-items:center; }
    .arrow:not(:disabled):hover { background:var(--selected); }
    #menu,#scrim { display:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    [hidden] { display:none !important; }
    @media(max-width:760px) {
      .shell { grid-template-columns:minmax(0,1fr); }
      aside { position:fixed; inset:0 auto 0 0; width:min(290px,84vw); transform:translateX(-100%); transition:transform var(--motion) ease; }
      body.menu-open aside { transform:translateX(0); }
      #menu { display:inline-flex; }
      #scrim { position:fixed; inset:0; z-index:2; border:0; background:#00000033; }
      body.menu-open #scrim { display:block; }
      header,footer { padding-left:14px; padding-right:14px; }
      #stage { padding:12px; }
      #summary { display:none; }
      footer { justify-content:center; }
      #source { display:none; }
      .actions { gap:5px; }
    }
    @media(prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <button id="scrim" aria-label="Close variations"></button>
    <aside aria-label="Visual directions">
      <div class="identity"><div class="eyebrow">Visual exploration</div><h1 id="project-title">Style directions</h1><p id="inventory">Loading presentation</p></div>
      <nav id="navigation" aria-label="Variations and specimens"></nav>
      <div class="side-footer">Exploratory / no direction approved<br>Use left and right arrows to browse</div>
    </aside>
    <main>
      <header>
        <div class="heading"><button id="menu" class="tool icon-tool" aria-label="Open variations" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="heading-text"><div id="direction-title">Visual direction</div><div id="file-title">Presentation</div></div></div>
        <div class="actions"><button id="zoom" class="tool" aria-pressed="false" disabled>Actual size</button><a id="source" class="tool" target="_blank" rel="noopener" hidden>Open file</a><button id="fullscreen" class="tool icon-tool" aria-label="Enter full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
      </header>
      <section id="stage" aria-label="Current specimen"><div id="message" role="status">Loading the style set...</div><div id="canvas" hidden></div></section>
      <footer><div id="summary"></div><div class="pager"><button id="previous" class="arrow" aria-label="Previous specimen" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m14 5-7 7 7 7"/></svg></button><span id="position">0 / 0</span><button id="next" class="arrow" aria-label="Next specimen" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 5 7 7-7 7"/></svg></button></div></footer>
      <div id="announcement" class="sr-only" aria-live="polite"></div>
    </main>
  </div>
  <script>
    const elements = Object.fromEntries(['project-title','inventory','navigation','direction-title','file-title','stage','canvas','message','summary','position','previous','next','zoom','source','fullscreen','menu','scrim','announcement'].map(id => [id, document.getElementById(id)]));
    let directions = [], pages = [], current = 0, actualSize = false, currentMedia = null, canvasWidth = 1440, canvasHeight = 1000;
    const navigationGroups = [];
    const thumbnailObserver = new ResizeObserver(entries => {
      for (const entry of entries) {
        const frame = entry.target.firstElementChild;
        if (frame?.tagName === 'IFRAME' && entry.contentRect.width > 0) frame.style.transform = `scale(${entry.contentRect.width/Number(frame.width)})`;
      }
    });
    function createThumbnail(file) {
      const preview = document.createElement('span'); preview.className = 'thumbnail'; preview.setAttribute('aria-hidden','true');
      const width = file.width || 1440, height = file.height || 1000; preview.style.aspectRatio = `${width} / ${height}`;
      const isImage = Boolean(file.thumbnail) || file.kind === 'image';
      const media = document.createElement(isImage ? 'img' : 'iframe'); media.loading = 'lazy';
      if (isImage) {
        media.alt = '';
        media.onload = () => { if (media.naturalWidth && media.naturalHeight) preview.style.aspectRatio = `${media.naturalWidth} / ${media.naturalHeight}`; };
      } else {
        media.title = ''; media.tabIndex = -1; media.setAttribute('inert',''); media.setAttribute('sandbox','allow-same-origin');
        media.width = String(width); media.height = String(height); media.style.width = `${width}px`; media.style.height = `${height}px`; media.style.transform = 'scale(0)';
        thumbnailObserver.observe(preview);
      }
      media.onerror = () => { const label = document.createElement('span'); label.className = 'thumbnail-unavailable'; label.textContent = 'Preview unavailable'; preview.replaceChildren(label); };
      media.src = file.thumbnail || file.src; preview.append(media); return preview;
    }
    function setMenu(open) { document.body.classList.toggle('menu-open',open); elements.menu.setAttribute('aria-expanded',String(open)); }
    function fitCanvas() {
      if (!currentMedia) return;
      const padding = window.innerWidth <= 760 ? 24 : 48;
      const scale = actualSize ? 1 : Math.min((elements.stage.clientWidth-padding)/canvasWidth,(elements.stage.clientHeight-padding)/canvasHeight,1);
      const safeScale = Math.max(scale,.05);
      elements.canvas.style.width = `${canvasWidth*safeScale}px`;
      elements.canvas.style.height = `${canvasHeight*safeScale}px`;
      if (currentMedia.tagName === 'IFRAME') { currentMedia.style.width = `${canvasWidth}px`; currentMedia.style.height = `${canvasHeight}px`; currentMedia.style.transform = `scale(${safeScale})`; }
      elements.stage.classList.toggle('actual',actualSize);
      elements.zoom.textContent = actualSize ? 'Fit to view' : 'Actual size';
      elements.zoom.setAttribute('aria-pressed',String(actualSize));
    }
    function renderNavigation() {
      const selected = pages[current];
      if (!navigationGroups.length) {
        directions.forEach((direction,directionIndex) => {
          const group = document.createElement('div'); group.className = 'direction';
          const button = document.createElement('button'); button.className = 'direction-button'; button.setAttribute('aria-label',`${String(directionIndex+1).padStart(2,'0')} ${direction.name}`);
          const label = document.createElement('span'); label.className = 'direction-label';
          const number = document.createElement('span'); number.className = 'number'; number.textContent = String(directionIndex+1).padStart(2,'0');
          const name = document.createElement('span'); name.textContent = direction.name; label.append(number,name); button.append(createThumbnail(direction.files[0]),label);
          button.onclick = () => { const active = pages[current]; showPage(pages.findIndex(page => page.directionIndex === directionIndex && page.fileIndex === Math.min(active.fileIndex,direction.files.length-1))); };
          const list = document.createElement('div'); list.className = 'file-list';
          const items = [];
          direction.files.forEach((file,fileIndex) => {
            const item = document.createElement('button'); item.className = 'file-button'; item.setAttribute('aria-label',`${direction.name}: ${file.title}`);
            const caption = document.createElement('span'); caption.className = 'file-label'; caption.textContent = file.title; item.append(createThumbnail(file),caption);
            item.onclick = () => showPage(pages.findIndex(page => page.directionIndex === directionIndex && page.fileIndex === fileIndex));
            list.append(item); items.push(item);
          });
          group.append(button,list); elements.navigation.append(group); navigationGroups.push({button,list,items});
        });
      }
      navigationGroups.forEach((group,directionIndex) => {
        const active = selected.directionIndex === directionIndex;
        group.button.setAttribute('aria-expanded',String(active)); group.list.hidden = !active;
        group.items.forEach((item,fileIndex) => { if (active && fileIndex === selected.fileIndex) item.setAttribute('aria-current','page'); else item.removeAttribute('aria-current'); });
      });
    }
    function showPage(index) {
      if (index < 0 || index >= pages.length) return;
      current = index; const page = pages[current], direction = directions[page.directionIndex], file = direction.files[page.fileIndex];
      elements['direction-title'].textContent = direction.name; elements['file-title'].textContent = file.title; elements.summary.textContent = direction.summary || '';
      elements.position.textContent = `${current+1} / ${pages.length}`; elements.previous.disabled = current === 0; elements.next.disabled = current === pages.length-1;
      elements.source.href = file.src; elements.source.hidden = false; elements.zoom.disabled = false;
      elements.message.hidden = true; elements.canvas.hidden = false; elements.canvas.replaceChildren();
      canvasWidth = file.width || 1440; canvasHeight = file.height || 1000;
      const media = document.createElement(file.kind === 'image' ? 'img' : 'iframe'); currentMedia = media;
      if (file.kind === 'image') {
        media.alt = `${direction.name}: ${file.title}`;
        media.onload = () => { if (media !== currentMedia) return; canvasWidth = media.naturalWidth; canvasHeight = media.naturalHeight; fitCanvas(); };
      } else {
        media.title = `${direction.name}: ${file.title}`; media.setAttribute('sandbox','allow-same-origin');
        media.onload = () => { try { media.contentWindow.addEventListener('keydown',handleKeys); } catch {} };
      }
      media.onerror = () => { if (media !== currentMedia) return; elements.canvas.hidden = true; elements.message.hidden = false; elements.message.textContent = 'This file could not be displayed. Use Open file to inspect it directly.'; };
      media.src = file.src; elements.canvas.append(media); elements.stage.scrollTop = 0; elements.stage.scrollLeft = 0;
      renderNavigation(); fitCanvas(); setMenu(false);
      elements.announcement.textContent = `${direction.name}, ${file.title}, ${current+1} of ${pages.length}`;
      history.replaceState(null,'',`#${current+1}`);
    }
    function handleKeys(event) {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.closest?.('input,textarea,select,[contenteditable="true"]')) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); showPage(current-1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); showPage(current+1); }
      if (event.key === 'Escape') setMenu(false);
    }
    elements.previous.onclick = () => showPage(current-1); elements.next.onclick = () => showPage(current+1);
    elements.zoom.onclick = () => { actualSize = !actualSize; fitCanvas(); };
    elements.menu.onclick = () => setMenu(!document.body.classList.contains('menu-open')); elements.scrim.onclick = () => { setMenu(false); elements.menu.focus(); };
    elements.fullscreen.hidden = !document.fullscreenEnabled;
    elements.fullscreen.onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch { elements.announcement.textContent = 'Full screen is unavailable in this browser.'; } };
    document.addEventListener('fullscreenchange',() => elements.fullscreen.setAttribute('aria-label',document.fullscreenElement ? 'Exit full screen' : 'Enter full screen'));
    document.addEventListener('keydown',handleKeys); new ResizeObserver(fitCanvas).observe(elements.stage);
    (async () => {
      try {
        const response = await fetch('./directions.json'); if (!response.ok) throw new Error('Place directions.json beside this viewer and serve the folder over HTTP.');
        const data = await response.json();
        if (!Array.isArray(data.directions) || !data.directions.length) throw new Error('Add at least one direction to directions.json.');
        directions = data.directions.map(direction => {
          if (typeof direction.name !== 'string' || !Array.isArray(direction.files) || !direction.files.length) throw new Error('Each direction needs a name and at least one file.');
          return {...direction, files:direction.files.map(file => {
            if (typeof file.title !== 'string' || typeof file.src !== 'string' || !['image','html'].includes(file.kind)) throw new Error('Each file needs a title, src, and kind (image or html).');
            const url = new URL(file.src,location.href); if (!['http:','https:'].includes(url.protocol)) throw new Error('Specimen files must use HTTP or HTTPS.');
            let thumbnail;
            if (file.thumbnail !== undefined) {
              if (typeof file.thumbnail !== 'string' || !file.thumbnail.trim()) throw new Error('A thumbnail must be a preview image path.');
              const preview = new URL(file.thumbnail,location.href); if (!['http:','https:'].includes(preview.protocol)) throw new Error('Thumbnails must use HTTP or HTTPS.');
              thumbnail = preview.href;
            }
            for (const dimension of ['width','height']) if (file[dimension] !== undefined && (!Number.isFinite(file[dimension]) || file[dimension] <= 0)) throw new Error('Canvas dimensions must be positive numbers.');
            return {...file,src:url.href,thumbnail};
          })};
        });
        directions.forEach((direction,directionIndex) => direction.files.forEach((file,fileIndex) => pages.push({directionIndex,fileIndex})));
        elements['project-title'].textContent = typeof data.title === 'string' ? data.title : 'Style directions'; document.title = elements['project-title'].textContent;
        elements.inventory.textContent = `${directions.length} directions / ${pages.length} specimens`;
        const requested = Number(location.hash.slice(1)); showPage(Number.isInteger(requested) && requested > 0 && requested <= pages.length ? requested-1 : 0);
      } catch (error) { elements.message.textContent = error.message || 'The presentation could not be loaded.'; elements.inventory.textContent = 'Presentation unavailable'; }
    })();
  </script>
</body>
</html>
