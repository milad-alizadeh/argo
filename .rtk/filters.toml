/repo/Sources/ArgoUI/MermaidDiagram.swift:12:9: note: in declaration of 'Broken'
** BUILD FAILED **
"""
expected = "/repo/Sources/ArgoUI/MermaidDiagram.swift:118:1: error: expected declaration\n/repo/Sources/ArgoUI/MermaidDiagram.swift:12:9: note: in declaration of 'Broken'\n** BUILD FAILED **"
