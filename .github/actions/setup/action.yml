name: Setup toolchain
description: Install bun and Node, restore bun's module cache, and install dependencies.

inputs:
  save-cache:
    description: >-
      Write bun's module cache back. Exactly one job per workflow should do this:
      parallel writers race for the same key and all but one lose the reservation.
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # setup-bun ships no Node, and vitest's `#!/usr/bin/env node` bin hangs silently
    # without one rather than failing (vitest#7681).
    #
    # `node-version-file` and never a literal here: `.node-version` is the repository's single
    # source for the pin (#1751), `scripts/node-version-gate.mjs` refuses any Node that does not
    # match it, and the root `preinstall` below runs that gate. A hard-coded version in this file
    # would make CI the one machine that installs on an unpinned Node and then fails the gate it
    # just paid to reach. Nothing checks this line any more: the test that refused a hard-coded
    # `node-version:` in ANY workflow or composite action went with the hook suite, so a literal
    # version here is caught by review or not at all.
    - uses: actions/setup-node@v5
      with:
        node-version-file: .node-version

    - id: cache-key
      shell: bash
      run: echo "key=${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}" >> "$GITHUB_OUTPUT"

    # setup-bun caches only the bun executable, never ~/.bun/install/cache.
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ runner.os }}-bun-

    - run: bun install --frozen-lockfile
      shell: bash

    - if: inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.cache-key.outputs.key }}
