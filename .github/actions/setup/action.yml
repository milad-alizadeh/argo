name: Setup toolchain
description: Install bun and Node, restore bun's module cache, and install dependencies.

inputs:
  save-cache:
    description: >-
      Write bun's module cache back. Exactly one job per workflow should do this:
      parallel writers race for the same key and all but one lose the reservation.
    default: "false"
  node-version:
    description: >-
      The Node to install. The default is what the Linux gate has always used. The desktop
      artifact job overrides it with the version the repo actually ships on, because the
      yauzl@2 hang the root override exists to prevent only appears on Node 24.16 and later
      (forge#4277) — a gate on an older Node would never see it. Pin #1751 lands as
      `.node-version` in #1777, and this input becomes `node-version-file` then.
    default: "22"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # setup-bun ships no Node, and vitest's `#!/usr/bin/env node` bin hangs silently
    # without one rather than failing (vitest#7681).
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - id: cache-key
      shell: bash
      run: echo "key=${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}" >> "$GITHUB_OUTPUT"

    # setup-bun caches only the bun executable, never ~/.bun/install/cache.
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ runner.os }}-bun-

    - run: bun install --frozen-lockfile
      shell: bash

    - if: inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.cache-key.outputs.key }}
