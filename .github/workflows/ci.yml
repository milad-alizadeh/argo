# The default gate for every PR: biome, the duplication gate and the guardrail-hook tests, on
# Linux. That is the whole of it.
#
# The Swift half — build, swift-testing, SwiftLint, SwiftFormat, module boundaries — used to be
# a `macos-26` job here. It is now `.husky/pre-push`, which calls `scripts/swift-gate.sh` (#1340).
# The reason is money, and the numbers were one-sided: GitHub bills a macOS runner at about ten
# times a Linux one, and over one measured day that job took 228 minutes against 21 for
# everything else on this workflow put together. It was about 99% of the bill, to repeat from a
# cold cache what the author's own Mac had already built.
#
# The gate itself did not shrink. `scripts/swift-gate.sh` runs the same three commands, in the
# same order, under the same `ARGO_REQUIRE_SWIFT_TOOLS=1`, over the same pathspec this file's
# `changes` job used to compute — and it BLOCKS THE PUSH, which is one step earlier than a red
# CI run. `scripts/swift-gate.test.mjs` is the proof it fires, and it runs in the `check` job
# below, so this workflow still gates the gate.
#
# What is genuinely lost, and is the accepted trade in #1340: nothing verifies the Swift tree on
# a machine that is not the author's. With one contributor, all on macOS, that machine does not
# exist. Bring the job back for `pull_request` only — never for `push` — the day it does.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Runs on main are left alone: their caches are the only ones a PR can restore
  # from (a PR's own cache is scoped to its merge ref).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: lint · duplication · hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The one job left, so it owns the bun cache write for the whole workflow.
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      # Each gate runs even after an earlier one fails, so a PR gets every
      # verdict in one push instead of one round trip per breach.
      - name: Lint and format
        run: bun run format-and-lint

      # The one cap biome can't express: duplication is whole-tree, and a linter reads one
      # file at a time. Its own step so a breach doesn't hide the hook tests' output
      # (see AGENTS.md "Quality gates").
      - name: Duplication gate
        if: ${{ !cancelled() }}
        run: bun run quality:duplication

      # Guardrail-hook tests (worktree edit guard, cross-CLI hook projection, and the push-time
      # Swift gate) live outside the turbo `test` pipeline — plain node scripts, not a workspace
      # suite. They are the only executable suite on Linux: retiring the Electron cockpit took
      # the last TypeScript workspace with it, so `turbo run test` reaches nothing here and the
      # Swift suites run at push time via `scripts/swift-gate.sh`.
      - name: Hook tests
        if: ${{ !cancelled() }}
        run: bun run test:hooks
