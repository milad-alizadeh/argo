# The default gate for every PR: biome, the duplication gate and the guardrail-hook tests, on
# Linux. That is the whole of it, and for now it is the whole of the repo's verification.
#
# The history, because it was wrong and the correction matters (#1758). A `macos-26` job used to
# build and test `apps/macOS` here. #1340 removed it on the grounds that it "billed about 99% of
# this repo's Actions spend". That was read off the GROSS column of the billing page. The BILLED
# column was $0, every day, and still is: the SKU is `Actions macOS 3-core`, a standard runner,
# and GitHub's own reference says use of the standard hosted runners "is free and unlimited on
# public repositories". `argo` is public. The 228 minutes were real; the money was not.
#
# The gate that replaced it lived in `.husky/pre-push` and blocked every push on a branch with an
# open PR. It is gone too, along with `scripts/swift-gate.sh` and the cache, build-lock and
# metrics machinery built around it. The reason is not the correction above: it is that
# `apps/macOS` is deprecated in favour of the Electron app, so there is no longer a Swift tree
# worth gating. `apps/macOS` keeps its source and has no build tooling; nothing verifies it.
#
# When `apps/desktop` lands, its suites run here on `ubuntu-latest` for free, and `turbo run test`
# reaches a workspace again. The parts that Linux cannot do — `codesign`, `notarytool`, the DMG
# maker, and running the shipped arm64 artifact — need a macOS job, which is also free on the
# standard runner. Two limits to design around rather than discover: GitHub Free allows 5
# concurrent macOS jobs, and a fork PR gets no secrets, so it can build and read the fuse wire
# back but cannot sign.
#
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Runs on main are left alone: their caches are the only ones a PR can restore
  # from (a PR's own cache is scoped to its merge ref).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: lint · duplication · hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The one job left, so it owns the bun cache write for the whole workflow.
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      # Each gate runs even after an earlier one fails, so a PR gets every
      # verdict in one push instead of one round trip per breach.
      - name: Lint and format
        run: bun run format-and-lint

      # The one cap biome can't express: duplication is whole-tree, and a linter reads one
      # file at a time. Its own step so a breach doesn't hide the hook tests' output
      # (see AGENTS.md "Quality gates").
      - name: Duplication gate
        if: ${{ !cancelled() }}
        run: bun run quality:duplication

      # Guardrail-hook tests (worktree edit guard, cross-CLI hook projection, the worktree-gc
      # sweep) live outside the turbo `test` pipeline — plain node scripts, not a workspace
      # suite. They are the only executable suite in the repo: retiring the Electron cockpit took
      # the last TypeScript workspace with it and #1758 took the Swift tooling, so `turbo run
      # test` reaches nothing at all until `apps/desktop` lands.
      - name: Hook tests
        if: ${{ !cancelled() }}
        run: bun run test:hooks
