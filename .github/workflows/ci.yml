# The default gate for every PR: biome, typecheck, unit, story tests, Electron e2e (#34) and
# the native macOS app — build, swift-testing, SwiftLint (#415).
# Unfiltered on purpose — a workflow skipped by path filtering stays Pending forever when
# required, so the expensive jobs opt out per-job instead (a skipped job reports Success).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Runs on main are left alone: their caches are the only ones a PR can restore
  # from (a PR's own cache is scoped to its merge ref).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: detect non-markdown changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v5
        # fetch-depth: 0 is what makes origin/$BASE_REF resolvable below.
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo 'non_docs=true' >> "$GITHUB_OUTPUT"
            echo 'swift=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() { [ -n "$(git diff --name-only "origin/$BASE_REF...HEAD" -- "$@")" ]; }

          # A git pathspec glob spans '/', so ':(exclude)*.md' drops nested markdown too.
          if changed . ':(exclude)*.md'; then
            echo 'non_docs=true' >> "$GITHUB_OUTPUT"
          else
            echo 'non_docs=false' >> "$GITHUB_OUTPUT"
          fi

          # The macOS job's own scope: the app (sources, Xcode project, its scripts), the
          # shared Swift shell entrypoints it runs, and the workflow that defines it.
          if changed apps/macOS 'scripts/swift-*.sh' .github/workflows/ci.yml ':(exclude)*.md'; then
            echo 'swift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'swift=false' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The one unconditional job, so it owns the bun cache write for the whole workflow.
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      # Each gate runs even after an earlier one fails, so a PR gets every
      # verdict in one push instead of one round trip per breach.
      - name: Lint and format
        run: bun run format-and-lint

      # The one cap biome can't express: duplication is whole-tree, and a linter reads one
      # file at a time. Its own step so a breach doesn't hide the placement gates' counts
      # (see AGENTS.md "Quality gates").
      - name: Duplication gate
        if: ${{ !cancelled() }}
        run: bun run quality:duplication

      # Where files may LIVE, which the boundary linter cannot see: it judges imports, and a
      # misplaced file's imports are all legal. One step per gate, same reason as above.
      - name: Composition-root gate
        if: ${{ !cancelled() }}
        run: bun run quality:placement:root

      - name: Kind-folder gate
        if: ${{ !cancelled() }}
        run: bun run quality:placement:kind

      - name: Earned-shared gate
        if: ${{ !cancelled() }}
        run: bun run quality:placement:shared

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: bun run test

      # Guardrail-hook tests (worktree edit guard + cross-CLI hook projection) live
      # outside the turbo `test` pipeline — plain node scripts, not a workspace suite.
      - name: Hook tests
        if: ${{ !cancelled() }}
        run: bun run test:hooks

      # Story tests render stories, never the generated Docs pages, so a broken .mdx or a
      # component react-docgen cannot parse fails only here. It sits in this unconditional job
      # so an MDX typo is caught even on a docs-only change that skips the `stories` job.
      - name: Build Storybook
        if: ${{ !cancelled() }}
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: bun run build-storybook

  stories:
    name: story tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    timeout-minutes: 15
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Chromium only: vitest.config.ts declares a single `{ browser: 'chromium' }` instance.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Story tests
        run: bun run test:stories

  macos:
    name: macos build · swift tests · lint
    # Pinned image, no OS matrix: apps/macOS declares `platforms: [.macOS("26.0")]` and
    # ships to exactly that. macos-latest would move under us on GitHub's own schedule.
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    timeout-minutes: 30
    env:
      # Every skip in the three Swift shell scripts becomes a failure here. Without it a
      # runner missing a binary reports Success having checked nothing — the exact way a
      # gate rots (scripts/swift-tooling.test.mjs is the proof it holds).
      ARGO_REQUIRE_SWIFT_TOOLS: "1"
      # The image's default today, named anyway: a default is not a pin.
      XCODE_APP: /Applications/Xcode_26.6.app
      # SwiftLint is not on the image. Pinned because a new SwiftLint means new rules, and a
      # gate that changes its mind on a schedule fails PRs that changed nothing.
      SWIFTLINT_VERSION: 0.65.0
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Select the pinned Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      # No SwiftFormat step: it ships on the image, and .swiftformat's own --minversion
      # rejects one too old — a stale formatter fails the check rather than passing it.
      - name: Cache the pinned SwiftLint
        id: swiftlint-cache
        uses: actions/cache@v5
        with:
          path: ~/.swiftlint/bin
          key: swiftlint-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFTLINT_VERSION }}

      - name: Install the pinned SwiftLint
        if: steps.swiftlint-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.swiftlint/bin
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint
          mv /tmp/swiftlint/swiftlint ~/.swiftlint/bin/swiftlint
          chmod +x ~/.swiftlint/bin/swiftlint

      - name: Put SwiftLint on PATH
        run: echo "$HOME/.swiftlint/bin" >> "$GITHUB_PATH"

      # Keyed on the sources themselves, with a prefix fallback so a one-file change restores
      # the previous run's products and rebuilds incrementally instead of from scratch.
      - name: Cache Swift build products
        uses: actions/cache@v5
        with:
          path: |
            apps/macOS/build
            apps/macOS/Packages/ArgoEngine/.build
            apps/macOS/Packages/ArgoUI/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-build-${{ runner.os }}-${{ hashFiles('apps/macOS/**/*.swift', 'apps/macOS/**/project.pbxproj') }}
          restore-keys: swift-build-${{ runner.os }}-

      # Same gates, same order, same scripts a commit runs locally — the formatter first,
      # since a reformat would change what the linter reads.
      - name: SwiftFormat · SwiftLint · module boundaries
        run: bun run quality:swift

      - name: Build the app
        if: ${{ !cancelled() }}
        run: bun run build --filter=@argo/macos

      - name: Swift tests
        if: ${{ !cancelled() }}
        run: bun run test --filter=@argo/macos

  e2e:
    name: electron e2e
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Resolve the pinned Electron version
        id: electron
        run: echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      # No restore-keys: a partial hit restores a different version's zip, so the
      # download still happens and the transfer is pure waste.
      - name: Cache the Electron binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      # No postinstall since electron@42: the binary is fetched lazily on first
      # `require()`, which inside a Playwright worker reads as a test timeout.
      - name: Download the Electron binary
        # By path, not `bunx install-electron` — that bin name is also an unrelated
        # package on npm, which bunx would fetch if local bin linking ever missed.
        run: node node_modules/electron/install.js

      # Electron bundles Chromium but not its shared libraries, and the runner image
      # is only incidentally stocked with them.
      - name: Install Chromium system libraries
        run: bunx playwright install-deps chromium

      # Electron is Chromium: it needs an X display even headless. `-a` picks a free
      # server number instead of colliding with a concurrent job on :99.
      - name: Electron app-launch smokes
        run: xvfb-run -a bun run test:e2e

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 7
