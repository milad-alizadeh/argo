# Two tiers. On Linux, for every PR, `gates`, `storybook` and `darwin-manifest` run in parallel:
# biome, the typecheck, the duplication gate, the tests, the Storybook interaction tests and the
# packaged-contents manifest (#1806). The manifest has no path filter, because a lockfile refresh
# can change what ships without touching an `apps/desktop` file. `check` passes when all three do.
# `desktop-artifact` packages `apps/desktop` for arm64 on macOS and runs its packaged tests (#1769)
# on a PR only when it touches the desktop app, the root manifest, the lockfile or `.github/`, and
# its filter fails CLOSED. It also runs on every push to `main`, unfiltered, to write the
# base-branch `macOS-bun-*` and `macOS-electron-*` caches a PR restores from (#2214).
#
# The macOS job is free: standard GitHub-hosted runners are unlimited on public repositories, and
# `argo` is public. The "99% of the Actions bill" figure that removed the previous macOS job read
# the GROSS column; the BILLED column is $0. AGENTS.md holds that correction in full.
#
# Two limits to design around rather than discover: GitHub Free allows 5 concurrent macOS jobs, and
# a fork PR gets no secrets — so it can build and read the fuse wire back, but cannot sign.
#
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Runs on main are left alone: their caches are the only ones a PR can restore
  # from (a PR's own cache is scoped to its merge ref).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The Linux tier runs as three parallel jobs, because in one job the darwin package, Storybook and
  # the gates ran in sequence and a desktop source change waited about four minutes (#2225).
  gates:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The only job that writes the `Linux-bun-*` cache: parallel writers race for one key, and
      # `desktop-artifact` writes its own `macOS-bun-*` cache (#2214).
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      # Turbo's remote cache, backed by this repository's own Actions cache. The action runs a
      # cache server on localhost for the life of the job and exports TURBO_API, TURBO_TOKEN and
      # TURBO_TEAM at it, so `turbo run` restores a task it has already judged instead of running
      # it again. Each Linux job starts its own server over the same store.
      #
      # It has to sit above the first `turbo run` step, which is the typecheck.
      #
      # What it can and cannot do follows the Actions cache's own scoping, the same rule the bun
      # cache above lives under: a cache written on a pull request is readable only by that pull
      # request, so the wins are a re-push to the same branch and a pull request restoring what a
      # `main` run wrote. A first push on a fresh branch after a `main` run that touched the same
      # files is the case this is for; the first run of all is still a full run, and should be.
      #
      # The budget is 10 GB per repository, shared with the bun module cache, and GitHub evicts
      # the least recently used entry rather than failing a write.
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.1

      # Each gate runs even after an earlier one fails, so a PR gets every
      # verdict in one push instead of one round trip per breach.
      - name: Lint and format
        run: bun run format-and-lint

      - name: Fetch main baseline
        if: ${{ !cancelled() }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: i18n guard
        if: ${{ !cancelled() }}
        run: bun run quality:i18n

      # Biome does not type-check, so this is the gate that reads types. `apps/desktop` landed
      # with a `typecheck` script no caller ran, which meant a type error in the Electron app
      # was caught by nothing (#1733). `tsc --noEmit` needs no Mac and no packaging, so it
      # belongs here rather than at push time.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run quality:types

      # The one cap biome can't express: duplication is whole-tree, and a linter reads one
      # file at a time. Its own step so a breach doesn't hide the hook tests' output
      # (see AGENTS.md "Quality gates").
      - name: Duplication gate
        if: ${{ !cancelled() }}
        run: bun run quality:duplication

      # The shadcn primitive base (#1767). `components.json` records what the generator was told;
      # this step reads what the components under the alias actually import, which is the only
      # place a pasted Radix component shows up before its focus behaviour does.
      - name: Component base gate
        if: ${{ !cancelled() }}
        run: bun run quality:components

      # A design constant that escaped the token contract: a raw hex colour or a Tailwind
      # arbitrary value, outside the allowlisted vendored and fixture paths (#1913).
      - name: Design token gate
        if: ${{ !cancelled() }}
        run: bun run quality:design-tokens

      # Named ahead of the broader workspace run so a Session Feed regression fails fast, under
      # its own label, instead of surfacing inside the wider "Workspace tests" output (#2201).
      - name: Session Feed tests
        if: ${{ !cancelled() }}
        run: bun run turbo run test:feed --filter=@argo/desktop

      # The workspace suites. `apps/desktop` now answers `test` with the SOURCE tier of #1769:
      # everything about the packaged PTY that can be judged without a Mac — the yauzl override,
      # node-pty being a production dependency, the unpack glob, the fuse value, the hooks being
      # wired, and the checks themselves against fixture trees. The half that needs a Mac is the
      # `desktop-artifact` job below.
      - name: Workspace tests
        if: ${{ !cancelled() }}
        run: bun run test

      # Guardrail-hook tests (the publish guard, the worktree edit and naming guards, the shell
      # command reader) live outside the turbo `test` pipeline — plain node scripts, not a
      # workspace suite. They are what stands between a guard's prose and its behaviour.
      - name: Hook tests
        if: ${{ !cancelled() }}
        run: bun run test:hooks

  storybook:
    name: storybook interaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.1

      - id: replay
        uses: ./.github/actions/turbo-replay
        with:
          task: test:storybook

      # Keyed on the CLI that installs, so a Playwright bump fetches its own browser revision (#1966).
      - id: playwright
        name: Read the Playwright version
        if: steps.replay.outputs.status != 'HIT'
        run: |
          version=$(bunx playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      # The browsers only: `install` skips a present one but still runs apt for the fonts.
      - name: Playwright browser cache
        if: steps.replay.outputs.status != 'HIT'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Storybook interaction tests
        if: steps.replay.outputs.status != 'HIT'
        run: bunx playwright install --with-deps chromium

      - name: Storybook interaction tests
        run: bun run test:storybook

  # The package contents, on EVERY pull request and with no path filter (#1806). The manifest's
  # likeliest regression is a lockfile refresh, and a dependency bump may touch no `apps/desktop`
  # file at all, so the filter the macOS job carries would be wrong here.
  #
  # Forge packages for darwin on Linux, and the asar entry list is plain JavaScript over the built
  # app. Nothing here signs, notarizes or builds the DMG, and none of that is what the manifest
  # reads. This job needs no `Install the Electron binary` step, unlike the macOS one below: a
  # cross-platform target is never the local `node_modules/electron`, so @electron/packager
  # downloads the darwin zip through @electron/get itself. Verified by packaging darwin arm64 in a
  # Linux container on the pinned Node.
  #
  # arm64: the architecture that actually ships, so both tiers read one package shape. A
  # non-darwin host can build it only because `resetAdHocDarwinSignature` is narrowed to a darwin
  # build host in forge.config.ts, which is where the reason for it is written down.
  darwin-manifest:
    name: darwin package manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.1

      - id: replay
        uses: ./.github/actions/turbo-replay
        with:
          task: test:darwin-manifest

      - if: steps.replay.outputs.status != 'HIT'
        uses: ./.github/actions/electron-cache

      # One turbo task packages and then reads the manifest, so turbo replays the pair when nothing
      # it hashes changed, a lockfile included (#2217).
      - name: Package for darwin and test its manifest
        run: bun run turbo run test:darwin-manifest --filter=@argo/desktop

  # This job's `name:` is `main`'s required status check, matched literally, and renaming it
  # strands every open pull request on a check that never reports (#1733). So it keeps the name
  # the single Linux job had, and passes only when every Linux job passed.
  check:
    name: lint · types · duplication · hook tests
    needs: [gates, storybook, darwin-manifest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Linux job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gates, storybook, darwin-manifest: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done

  # The artifact tier (#1758). It exists for what Linux genuinely cannot do: package a macOS app,
  # read the fuse wire back out of the shipped binary, and test it. Everything #1769 tests about
  # the packaged PTY fails silently, so the only honest test reads the artifact itself.
  #
  # macOS runners are free on this public repository — the ~$50/day that removed the old Swift job
  # was the gross column of the billing page, never the billed one. The limits that are real are 5
  # concurrent macOS jobs on GitHub Free and no secrets on a fork pull request, which is why the
  # pull-request side of this job stays scoped to pull requests that touch the desktop app rather
  # than to every push. The push-to-main side always runs: it is the only writer of the base-branch
  # `macOS-bun-*` and `macOS-electron-*` caches a pull request can restore from (#2214).
  #
  # It packages, it does not sign. `osxSign` is unconfigured until the entitlement set is chosen
  # (#1771) and this repository holds no signing identity. When both arrive, the signing steps
  # belong in this job between the package and the launch, and `test:packaged-contents` should run
  # again after them: a re-signature can invalidate what the package proved.
  desktop-artifact:
    name: package · run packaged tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. The filter below needs a merge base, and a depth-1 clone has none: both
          # sides are grafted shallow roots and `A...B` aborts with "no merge base".
          fetch-depth: 0

      # A step-level filter rather than a workflow-level `paths:`, which would gate the Linux job
      # with it and leave a desktop-only pull request unlinted. A push to `main` always runs: it
      # exists to seed the base-branch cache, not to judge what that push touched.
      #
      # It fails CLOSED, and that is the whole design of it. Written the obvious way — a pipeline
      # inside an `if` — every failure mode writes `desktop=false` and skips the package, the
      # tests, and the job then reports GREEN having proved nothing. `bash -e`
      # is suspended inside an `if` condition by definition, GitHub's default shell sets no
      # `pipefail`, and grep on an empty stream exits 1. So the diff runs on its own line, under
      # `set -euo pipefail`, where a broken filter turns the job red instead of quietly disarming
      # it. The branch taken is printed either way, so a reader can tell "no desktop changes" from
      # "the filter broke".
      - id: touched
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push to main; the artifact tier runs to seed the shared macOS cache"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "FETCH_HEAD...HEAD")
          if grep -qE '^(apps/desktop/|package\.json|bun\.lock|\.github/)' <<<"$changed"; then
            echo "the desktop app is touched by this pull request; the artifact tier runs"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "no desktop files changed; the artifact tier is skipped deliberately"
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}

      # Every job takes Node from `.node-version` (#1800), which is what this job needs anyway: the
      # yauzl@2 hang the root override prevents only appears from Node 24.16 (forge#4277), so a
      # gate on an older Node would never see the thing the override is there for.
      #
      # `save-cache: "true"`: this job's own writer of the `macOS-bun-*` cache. The Linux `gates`
      # job writes under a `Linux-` key, so the two never race for the same entry (#2214).
      - if: steps.touched.outputs.desktop == 'true'
        uses: ./.github/actions/setup
        with:
          save-cache: "true"

      # The same turbo cache server the Linux jobs use. `build` is the packaged app and each packaged
      # proof is its own task over it, so an unchanged app is restored rather than packaged, and an
      # unchanged proof over it replays its log rather than launching the app (#2324).
      - if: steps.touched.outputs.desktop == 'true'
        name: Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.1

      - id: replay
        if: steps.touched.outputs.desktop == 'true'
        uses: ./.github/actions/turbo-replay
        with:
          task: build

      # `actions/cache` saves on every miss regardless of branch, so this writes a base-branch
      # `macOS-electron-*` cache on push to `main`, which a pull request's restore can then fall
      # back to (#2214): GitHub only restores a cache from the current branch or the default one.
      - if: steps.touched.outputs.desktop == 'true' && steps.replay.outputs.status != 'HIT'
        uses: ./.github/actions/electron-cache

      # Electron 44 ships no `postinstall`, so `bun install` leaves no Electron binary at all and
      # Forge dies on a missing one. `trustedDependencies` does not help: there is no script to
      # trust. Do NOT reach for `npx install-electron --no` — it deletes `node_modules/electron`
      # first and npx's own `--no` then refuses to reinstall it.
      #
      # Bun's linker decides whether the root or apps/desktop holds `electron`, so probe both
      # rather than assume a layout — `electronBinary()` in packaged-app.mjs makes the same point.
      - name: Install the Electron binary
        if: steps.touched.outputs.desktop == 'true' && steps.replay.outputs.status != 'HIT'
        shell: bash
        run: |
          set -euo pipefail
          for root in node_modules apps/desktop/node_modules; do
            if [ -f "$root/electron/install.js" ]; then
              node "$root/electron/install.js"
              exit 0
            fi
          done
          echo "no electron/install.js under node_modules or apps/desktop/node_modules" >&2
          exit 1

      # `forge package` runs both hooks — the production npm install that gives flora-colossus an
      # npm-shaped tree to walk, and the postPackage assertion that refuses an app whose node-pty
      # is absent, packed inside the asar, or stripped of its spawn-helper exec bit.
      - name: Package arm64
        if: steps.touched.outputs.desktop == 'true'
        run: bun run turbo run build --filter=@argo/desktop

      # The same assertions again, standalone against the artifact on disk, plus the check that no
      # mock CLI reached the bundle. This is the form a downloaded release artifact would be checked
      # in, and it keeps the checks honest if the hook is ever detached from the config.
      #
      # `success()`, not `!cancelled()`: unlike the Linux gates, which are independent and worth
      # running all of, these are strictly downstream of the package. Running them after a failed
      # package adds red steps whose messages ("no app.asar", "no packaged binary") describe the
      # symptom and bury the cause.
      - name: Test packaged app contents
        if: ${{ success() && steps.touched.outputs.desktop == 'true' }}
        run: bun run turbo run test:packaged-contents --filter=@argo/desktop

      # The same manifest the Linux tier compared, re-read off the app THIS job packaged (#1806).
      # It is not a duplicate run: signing adds files to a bundle, so the shipped bytes are the
      # ones the exact set has to hold for. Until `osxSign` is configured (#1771) the two readings
      # agree, and that agreement is itself worth a step once they stop.
      - name: Test package manifest
        if: ${{ success() && steps.touched.outputs.desktop == 'true' }}
        run: bun run turbo run test:packaged-manifest --filter=@argo/desktop

      # The #1749 acceptance boundary, inside the shipped binary: start, input, output, resize,
      # interrupt, exactly-once exit, crash cleanup, app shutdown, and 600 spawn/exit cycles at a
      # flat descriptor count.
      - name: Test the shipped app
        if: ${{ success() && steps.touched.outputs.desktop == 'true' }}
        run: bun run turbo run test:packaged-pty --filter=@argo/desktop

      # Every flow under `apps/desktop/e2e/`, one Playwright project each, against a packaged copy:
      # the Project contract, the Session Feed and journeys (#1831), and the Tickets workflow with
      # GitHub and Linear mocked on loopback ports (#1848). Nothing takes a screenshot (#1910): the
      # assertions read the DOM, and reviewers inspect pixels in Storybook.
      - name: Test the e2e flows in a packaged copy
        if: ${{ success() && steps.touched.outputs.desktop == 'true' }}
        run: bun run turbo run test:e2e --filter=@argo/desktop

      - name: Test adversarial Session flows in a packaged copy
        if: ${{ success() && steps.touched.outputs.desktop == 'true' }}
        working-directory: apps/desktop
        run: bun run test:e2e:adversarial

      # The Playwright HTML report and any trace a failing case wrote (#2325): `playwright.config.ts`
      # keeps both only on failure, so a red run here is the one place they exist to read.
      - name: Upload e2e failure artifacts
        id: e2e-artifacts
        if: ${{ failure() && steps.touched.outputs.desktop == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failure
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

      # The annotation shows on the PR's Checks tab and the summary on the run page, so the zip is one
      # click from the red check instead of buried at the foot of the run.
      - name: Link the e2e failure artifacts
        if: ${{ failure() && steps.e2e-artifacts.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.e2e-artifacts.outputs.artifact-url }}
        run: |
          echo "::error title=e2e failed::Report and traces: $ARTIFACT_URL"
          {
            echo "### e2e failure artifacts"
            echo ""
            echo "[Download the Playwright report and traces]($ARTIFACT_URL)."
            echo "Unzip it, then run \`npx playwright show-report playwright-report\` or \`npx playwright show-trace test-results/<case>/trace.zip\`."
          } >> "$GITHUB_STEP_SUMMARY"
