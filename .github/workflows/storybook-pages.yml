# The component site (#1910). `main` is published to GitHub Pages at
# https://milad-alizadeh.github.io/argo/, and a pull request is given deep links into it by the
# `storybook` job in `ci.yml`. There is no per-pull-request preview and none is wanted: one site
# that always shows what shipped is what a reviewer can trust, and it costs nothing to keep.
#
# Pages must be enabled with "GitHub Actions" as its source in the repository settings before this
# workflow can deploy. That is the human's step, and until it is taken the deploy job fails with
# "Get Pages site failed" while the build job stays green.
#
# The site is served from `/argo/`, not from the domain root, so the build carries
# `STORYBOOK_BASE`. Without it every asset URL points one path segment too high and the site loads
# a blank manager.
name: storybook-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No `paths:` filter. The site's whole claim is that it matches `main`, and a filter that misses
# one path publishes a stale site that still looks current. A Linux build is cheap enough that
# rebuilding on a docs-only push is the better trade.

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancelled: Pages keeps whatever was deployed last, so a
# cancelled run in the middle of a deploy would leave the site behind `main` with nothing saying so.
concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    name: build the component site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build Storybook
        working-directory: apps/desktop
        env:
          STORYBOOK_BASE: /argo/
        run: bun run build:storybook

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/desktop/storybook-static

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
