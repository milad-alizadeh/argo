<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<title>Decision map — two shapes over real wayfinder data</title>
<style>
/*
 * Study-side token vocabulary. Imports the REAL contract (argo-tokens.css) so
 * studies and the app share one source and cannot drift — never copy values in
 * here. The classes below mirror the text-* utilities globals.css generates for
 * the app. Style only via var(--token) and these classes; a value the contract
 * lacks is a proposal to snap or promote when the study settles, never a bare
 * literal to keep (rules/design-studies.md).
 */
/*
 * Argo design tokens — the single source of raw values (ADR-0006: argo-tokens.css → globals.css).
 * globals.css imports this and maps these onto Tailwind's @theme. shadcn/ui semantic
 * roles resolve to these variables; do not hardcode colours in components.
 *
 * Two-layer colour contract (settled by the /design-foundations ceremony from the
 * Penumbra reference + the four room prototypes in docs/designs/ — living specimen:
 * docs/designs/foundations.html):
 *
 *   1. CORE ramps — raw values live ONLY here. Theme-agnostic, named by what
 *      they are. Never referenced by components or studies directly.
 *   2. SEMANTIC roles — named by job, bound per theme (:root light / .dark dark),
 *      referencing core steps only. Alpha variants are color-mix derivations of
 *      a core step, never a new hex.
 *
 * Palette: Penumbra (#158, locked). A cool warm-biased near-black graphite scene lit by
 * the Concierge orb as key light, with Eclipse gold as the single accent. Colour is scarce
 * and attention is brightness. One frosted `panel` surface per region, flat `inset` cards
 * inside it, and `plane` for a card that floats in the lit scene (never glass-on-glass).
 *
 * Gold means attention, full stop: `needs you` IS the accent. That is why selection and
 * hover are an INK wash plus a brighter cove lip, never a gold wash — a gold row and a
 * selected row must never be confusable.
 *
 * Lifecycle status, review verdict and signal inks are DISJOINT families: verdict sits one
 * ramp step further toward the theme's ink end than lifecycle (dark: 300 vs 500; light:
 * 700 vs 600), so they never render the same value. `done` is quiet slate rather than
 * green — completion is not an event that wants the eye.
 *
 * Orientation follows the shadcn convention: :root is light, `.dark` is dark. The
 * Cockpit is dark-first, so index.html sets `<html class="dark">` — keeping the
 * `.dark` mechanism live is what makes shadcn's `dark:` variants work. Penumbra is
 * drawn in the dark; light is a working re-binding of the same ramps, not a second design.
 */

/* ---------------------------------------------------------------- core ramps */
:root {
  /* Graphite — the scene and its surfaces. Cool-biased near-blacks; higher = deeper. */
  --graphite-400: #3b3e46;
  --graphite-500: #26282e;
  --graphite-600: #1c1d23;
  --graphite-700: #101218;
  --graphite-800: #0c0d10;
  --graphite-850: #0a0b0d; /* the locked Penumbra base */
  --graphite-900: #08090b;
  --graphite-950: #070709;

  /* Bone — the warm inks that read on graphite (and the light theme's surfaces). */
  --bone-50: #f6f2e9;
  --bone-100: #f2ede2;
  --bone-200: #e7e3da;
  --bone-300: #dad5c9;
  --bone-400: #c6c1b5;
  --bone-500: #9a968c;
  --bone-600: #7c786f;
  --bone-700: #615e58;

  /* Eclipse gold — the single accent, and `needs you`. */
  --gold-300: #dfc591;
  --gold-500: #c8a968;
  --gold-600: #a5854a;
  --gold-700: #8a7038;

  /* Monolith teal — running. */
  --teal-300: #8fc0ab;
  --teal-500: #6fa890;
  --teal-600: #4e8570;
  --teal-700: #3f6e5b;

  /* Moss — approve, and a diff addition. Deliberately duller than teal so a
   * running dot and an added line never read as the same green. */
  --moss-300: #8fbf9c;
  --moss-500: #5c8a6b;
  --moss-600: #4a7357;
  --moss-700: #3e6349;

  /* Terracotta — failed, blocked, a diff deletion. A muted red: the scene has no
   * saturated alarm colour. */
  --terracotta-300: #d08c83;
  --terracotta-500: #b5675e;
  --terracotta-600: #9a5249;
  --terracotta-700: #8a4a43;

  /* Slate — done, and stale. Quiet by design: finished work leaves the eye. */
  --slate-300: #97a0ab;
  --slate-500: #5b6673;
  --slate-600: #4a5460;
  --slate-700: #3e4650;
}

/* -------------------------------------------------- semantic roles — light */
:root {
  --background: var(--bone-100);
  --foreground: var(--graphite-900);

  --card: var(--bone-50);
  --card-foreground: var(--graphite-900);

  --popover: var(--bone-50);
  --popover-foreground: var(--graphite-900);

  --primary: var(--gold-700);
  --primary-foreground: var(--bone-50);
  /* Primary ladder: bright = the light end of the primary gradient; soft = the
   * agent/auto accent ink (AI presence), quieter than primary. */
  --primary-bright: var(--gold-600);
  /* On light there is no dimmer gold step below primary (gold-700 IS primary), so the
   * quieter agent-presence ink is a wash of it rather than a fifth ramp step. */
  --primary-soft: color-mix(in srgb, var(--gold-700) 72%, transparent);

  --secondary: var(--bone-300);
  --secondary-foreground: var(--graphite-700);

  /* `muted` is bound identically to `secondary` (no distinct job in the design);
   * kept for shadcn compatibility — prefer `secondary` in new code. */
  --muted: var(--bone-300);
  --muted-foreground: var(--bone-700);

  /* Selection/hover wash — an INK wash, never gold (gold means attention), and two
   * quiet steps rather than one loud one: `accent` is hover, `accent-strong` is the
   * current row. Nothing else marks selection — no lip, no border, no shift. */
  --accent: color-mix(in srgb, var(--graphite-900) 3%, transparent);
  --accent-strong: color-mix(in srgb, var(--graphite-900) 6%, transparent);
  --accent-foreground: var(--graphite-900);

  /* Terminal text-selection wash: translucent ink, glass not a solid block, so the
   * panel reads through the highlight. Heavier than `--accent` so a selection still
   * registers. `LiveTerminal` resolves this to rgba() at runtime — xterm's parser
   * can't read color-mix(). */
  --terminal-selection: color-mix(in srgb, var(--graphite-900) 16%, transparent);

  --destructive: var(--terracotta-600);
  --destructive-foreground: var(--bone-50);

  --border: color-mix(in srgb, var(--graphite-900) 9%, transparent);
  --input: color-mix(in srgb, var(--graphite-900) 13%, transparent);
  --ring: var(--gold-600);

  /* Ink ladder: foreground → bright (ghost buttons, emphasized values) →
   * soft (long-dwell reading) → muted → faint (metas). */
  --foreground-bright: var(--graphite-950);
  --foreground-soft: var(--graphite-700);
  --foreground-faint: var(--bone-700);

  /* One frosted surface per region (panel); flat inset cards live inside it. */
  --panel: color-mix(in srgb, var(--bone-50) 70%, transparent);
  --inset: color-mix(in srgb, var(--graphite-900) 3%, transparent);
  --inset-hair: color-mix(in srgb, var(--graphite-900) 6%, transparent);
  --inset-lip: color-mix(in srgb, var(--graphite-900) 4%, transparent);

  /* Plane — a card that floats in the lit scene, on its own depth. Ingredients
   * only; the recipe is the `plane` utility in globals.css. On light there is no
   * cove to conceal, so the lip is an ink hair and the bloom stays faint. */
  --plane-top: color-mix(in srgb, var(--bone-50) 70%, transparent);
  --plane-bottom: color-mix(in srgb, var(--bone-200) 60%, transparent);
  --plane-top-lit: var(--bone-50);
  --plane-bottom-lit: color-mix(in srgb, var(--bone-100) 90%, transparent);
  --cove-lip: color-mix(in srgb, var(--graphite-900) 5%, transparent);
  --cove-lip-lit: color-mix(in srgb, var(--graphite-900) 9%, transparent);
  --bloom-warm: color-mix(in srgb, var(--gold-600) 10%, transparent);
  --bloom-warm-lit: color-mix(in srgb, var(--gold-600) 18%, transparent);
  --plane-cast: color-mix(in srgb, var(--graphite-900) 14%, transparent);
  --plane-cast-lit: color-mix(in srgb, var(--graphite-900) 22%, transparent);

  /* The room's dust scrim — a multiply pass over the whole scene. */
  --scrim-edge: color-mix(in srgb, var(--graphite-900) 8%, transparent);
  --scrim-top: color-mix(in srgb, var(--graphite-900) 5%, transparent);
  --scrim-bottom: color-mix(in srgb, var(--graphite-900) 10%, transparent);

  /* ONE value per meaning, across every family: a failure is a failure whether it is a
   * failed check, a blocked ticket or a bad signal, and the same holds for the gold that
   * asks for you. Two steps of the same hue read as sloppiness, not as hierarchy, so
   * these two anchors override the family-disjointness rule for red and gold. */
  --status-fail: var(--terracotta-700);
  --status-attention: var(--gold-700);
  --status-ok: var(--moss-700);

  /* Roster tones — named for the TONE the delivery derivation emits, not a lifecycle state,
   * because tone↔state is not 1:1 (the matrix keeps colour off the state deliberately).
   * `landed` (Merged) is moss pulled toward gold so Landed ≠ approve-moss and ≠ done-slate
   * (ADR-0009). */
  --tone-run: var(--teal-600);
  --tone-gray: var(--bone-700);
  --tone-amber: var(--status-attention);
  --tone-stale: var(--slate-600);
  --tone-red: var(--status-fail);
  --tone-done: var(--slate-600);
  --tone-landed: color-mix(in srgb, var(--moss-600) 55%, var(--gold-600));

  /* Review verdict — the same three anchors as every other family. A verdict is not a
   * different kind of good or bad from a check's. */
  --verdict-approve: var(--status-ok);
  --verdict-changes: var(--status-attention);
  --verdict-block: var(--status-fail);
  /* Verdict tints — the loud-step anchor verdict surfaces wash/border from
   * (use-sites alpha them: 12% wash, 40% border); text ink stays --verdict-*.
   * Deliberately the same steps as lifecycle's loud tier — separate names keep
   * the two families re-bindable apart. */
  --verdict-approve-tint: var(--moss-600);
  --verdict-changes-tint: var(--gold-600);
  --verdict-block-tint: var(--terracotta-600);

  /* Signal inks — reading-intensity outcome text on code/meta surfaces (diff
   * add/del, captured-feed colorization, check values). The same three anchors: these
   * names exist so a use site reads its own vocabulary, not so it gets its own hue. */
  --signal-ok: var(--status-ok);
  --signal-warn: var(--status-attention);
  --signal-bad: var(--status-fail);

  /* `well` is a recessed fill, not a shadow: #262 settled depth as brightness only,
   * so the plane family carries cast and there is no shadow ladder. */
  --well: color-mix(in srgb, var(--graphite-900) 4%, transparent);

  /* Weaker on light, where a halo reads as blur rather than as light. */
  --glow-strength: 35%;

  /* Frost — the panel's blur pass. Light needs less to stay legible. */
  --frost: 10px;
  --frost-saturate: 1;
}

/* --------------------------------------------------- semantic roles — dark */
.dark {
  --background: var(--graphite-850);
  --foreground: var(--bone-200);

  --card: var(--graphite-800);
  --card-foreground: var(--bone-200);

  --popover: var(--graphite-700);
  --popover-foreground: var(--bone-200);

  --primary: var(--gold-500);
  --primary-foreground: var(--graphite-950);
  --primary-bright: var(--gold-300);
  --primary-soft: var(--gold-700);

  --secondary: var(--graphite-600);
  --secondary-foreground: var(--bone-300);

  --muted: var(--graphite-600);
  --muted-foreground: var(--bone-500);

  --accent: color-mix(in srgb, var(--bone-100) 3%, transparent);
  --accent-strong: color-mix(in srgb, var(--bone-100) 6%, transparent);
  --accent-foreground: var(--bone-100);

  /* See the light-theme note: the selection wash reads brighter on the dark panel, so a
   * lighter mix keeps the same glassy weight. */
  --terminal-selection: color-mix(in srgb, var(--bone-100) 18%, transparent);

  --destructive: var(--terracotta-500);
  --destructive-foreground: var(--bone-100);

  --border: color-mix(in srgb, var(--bone-100) 6%, transparent);
  --input: color-mix(in srgb, var(--bone-100) 9%, transparent);
  --ring: var(--gold-500);

  --foreground-bright: var(--bone-50);
  --foreground-soft: var(--bone-300);
  --foreground-faint: var(--bone-700);

  --panel: color-mix(in srgb, var(--graphite-700) 50%, transparent);
  --inset: color-mix(in srgb, var(--bone-100) 3%, transparent);
  --inset-hair: color-mix(in srgb, var(--bone-100) 6%, transparent);
  --inset-lip: color-mix(in srgb, var(--bone-100) 5%, transparent);

  /* Plane — the signature Penumbra card: a cool translucent slab with a concealed
   * cove lip along its top edge and a warm bloom washing in from above. `-lit` is
   * the driven plane (the session you are in), which warms and gains an outer spill.
   * Depth is carried by BRIGHTNESS ONLY — see the recede tokens. */
  --plane-top: color-mix(in srgb, var(--graphite-500) 42%, transparent);
  --plane-bottom: color-mix(in srgb, var(--graphite-700) 50%, transparent);
  --plane-top-lit: color-mix(in srgb, var(--bone-700) 55%, transparent);
  --plane-bottom-lit: color-mix(in srgb, var(--graphite-600) 60%, transparent);
  --cove-lip: color-mix(in srgb, var(--bone-100) 5%, transparent);
  --cove-lip-lit: color-mix(in srgb, var(--bone-100) 12%, transparent);
  --bloom-warm: color-mix(in srgb, var(--gold-500) 14%, transparent);
  --bloom-warm-lit: color-mix(in srgb, var(--gold-500) 30%, transparent);
  --plane-cast: color-mix(in srgb, black 70%, transparent);
  --plane-cast-lit: color-mix(in srgb, black 78%, transparent);

  --scrim-edge: color-mix(in srgb, black 34%, transparent);
  --scrim-top: color-mix(in srgb, black 22%, transparent);
  --scrim-bottom: color-mix(in srgb, black 40%, transparent);

  /* One value per meaning — see the light block. On dark the anchors sit at the 300
   * step: a failure or a request for you is the brightest thing in the region, which is
   * how "attention = brightness" is spelled. */
  --status-fail: var(--terracotta-300);
  --status-attention: var(--gold-300);
  --status-ok: var(--moss-300);

  --tone-run: var(--teal-500);
  --tone-gray: var(--bone-500);
  --tone-amber: var(--status-attention);
  --tone-stale: var(--slate-600);
  --tone-red: var(--status-fail);
  --tone-done: var(--slate-500);
  --tone-landed: color-mix(in srgb, var(--moss-500) 55%, var(--gold-500));

  --verdict-approve: var(--status-ok);
  --verdict-changes: var(--status-attention);
  --verdict-block: var(--status-fail);
  --verdict-approve-tint: var(--moss-500);
  --verdict-changes-tint: var(--gold-500);
  --verdict-block-tint: var(--terracotta-500);

  --signal-ok: var(--status-ok);
  --signal-warn: var(--status-attention);
  --signal-bad: var(--status-fail);

  --well: color-mix(in srgb, black 15%, transparent);

  --glow-strength: 60%;

  --frost: 14px;
  --frost-saturate: 1.05;
}

/* ---- Non-themed families (identical in light and dark, defined once) ---- */
:root {
  /* Font stacks — studies and the app both speak these names. Inter ships with the
   * app (@fontsource-variable/inter, imported by globals.css) rather than loading
   * from a CDN: the cockpit runs offline, and the 200-weight wide-tracked mark
   * renders visibly differently in SF. */
  --sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

  /* Typography roles — ONE sans ladder at 9/11/13/15 (+23 hero), every step 2px.
   * This ladder IS the cockpit's density: it is the Penumbra prototypes' own
   * measure, decided here rather than deferred per surface. All further hierarchy
   * is carried inside a size by weight, case+tracking, or line-height, never by a
   * 1px size step — the half-steps the prototypes explored in (8.5/9.5/10.5/11.5/
   * 12.5) are jitter and do not exist in the contract. Full tuple per role; wired
   * to text-* utilities in globals.css (which also adds the uppercase /
   * tabular-nums / mono facets where a role demands them). A new size snaps to a
   * role or gets promoted here, never inlined. */
  /* The one large role: a screen's own title (a ticket's hero line, a stage heading, a
   * rendered markdown h1). Light weight rather than bold — at this size the scene's
   * quiet is carried by the stroke, not by the size. There is deliberately NO wordmark
   * role: the shell has no wordmark (#264), so the reference's wide-tracked ARGO mark
   * has no use site and does not enter the contract. */
  --type-hero: 23px;
  --type-hero-leading: 28px;
  --type-hero-weight: 200;
  --type-hero-tracking: 0.01em;

  --type-headline: 15px; /* verdict hero, session-level headings */
  --type-headline-leading: 20px;
  --type-headline-weight: 600;
  --type-headline-tracking: -0.01em;

  --type-title: 13px; /* now-line, a panel's or plane's single hero row */
  --type-title-leading: 18px;
  --type-title-weight: 500;
  --type-title-tracking: -0.005em;

  --type-row: 11px; /* list primary text */
  --type-row-leading: 16px;
  --type-row-weight: 400;
  --type-row-tracking: 0em;

  --type-row-strong: 11px; /* same size — weight differentiates: row titles, buttons */
  --type-row-strong-leading: 16px;
  --type-row-strong-weight: 600;
  --type-row-strong-tracking: 0em;

  --type-prose: 11px; /* same size — leading differentiates: multi-line reading */
  --type-prose-leading: 18px;
  --type-prose-weight: 400;
  --type-prose-tracking: 0em;

  --type-meta: 9px; /* timestamps, counts, k/v keys (+ tabular-nums) */
  /* 14, not 13: it matches the observed 1.5–1.6 leading cluster, and an even leading is
   * what keeps a meta-only chip an even number of pixels tall against the 4px rhythm
   * (ConsoleChannelTab's height canary counts this box). */
  --type-meta-leading: 14px;
  --type-meta-weight: 500;
  --type-meta-tracking: 0.02em;

  --type-tag: 9px; /* state chips, severity words (+ uppercase) */
  --type-tag-leading: 12px;
  --type-tag-weight: 600;
  --type-tag-tracking: 0.14em;

  --type-eyebrow: 9px; /* section headers (+ uppercase, wider tracking, lighter) */
  --type-eyebrow-leading: 12px;
  --type-eyebrow-weight: 500;
  --type-eyebrow-tracking: 0.22em;

  --type-code: 11px; /* terminal, diff hunks, code blocks (+ mono) */
  --type-code-leading: 18px;
  --type-code-weight: 400;
  --type-code-tracking: 0em;

  /* The one deliberately off-ladder size: mono renders ~1px larger than sans at the
   * same value, so an inline path or SHA inside an 11px row is set at 10px to match
   * it optically. Never a starting point for a new size. */
  --type-code-inline: 10px;
  --type-code-inline-leading: 15px;
  --type-code-inline-weight: 400;
  --type-code-inline-tracking: 0em;

  /* Spacing rhythm — the nine steps the design actually uses. */
  --space-hair: 2px;
  --space-tight: 4px;
  --space-snug: 6px;
  --space-gap: 8px;
  --space-row: 10px; /* a list row's own vertical inset — the density's smallest padding */
  --space-inset: 12px;
  --space-region: 16px;
  --space-plane: 20px; /* a floating plane's own inset, one step above a region */
  /* Nesting depth — how far a tree's children sit in from their parent row. Above the
   * region step because it is a structural offset, not a gap between neighbours. */
  --space-nest: 24px;
  /* Roster tree marker column — ONE fixed box shared by the caret and the glyph, so a
   * caret and an icon that share a column centre on the same vertical axis. Sized to the
   * icon (16px). Structural icon-box width like --space-nest, not a rhythm step: a fixed
   * box is what holds a marker in its column as a row nests deeper. One marker box (16) +
   * one row gap (8) = 24 = --space-nest, so each tree level steps by exactly one nest. */
  --space-marker-col: 16px;

  /* Shell chrome geometry (#264). Structural boxes rather than rhythm steps: they hold
   * the chrome's columns, and the traffic-light reserve is fixed by macOS rather than by
   * the design. Proposals promoted from the Code-room prototype's own measure. */
  --project-strip-width: 60px;
  --project-tab-size: 38px;
  --traffic-lights-clearance: 52px;

  /* Row heights — the density's vertical half, as the prototypes measured it. */
  --row-h-tight: 20px; /* a tree row, a chip row */
  --row-h: 22px; /* a roster/list row */

  /* The one shared strip height: the Delivery panel's tab strip IS its header, sized to
   * match the Delivery lifecycle's own strip so the two stack with no visual seam. Named
   * rather than left implicit so a future build reads the same constant instead of
   * re-measuring a prototype. */
  --strip-height: 38px;

  /* Radius ladder — a doubling from the hair to the plane. `--radius` is the shadcn
   * base and stays bound to the md step. */
  --radius-step-hair: 2px;
  --radius-step-sm: 4px;
  --radius-step-md: 8px;
  --radius-step-lg: 12px;
  --radius-plane: 16px;
  --radius: var(--radius-step-md);
  --radius-full: 999px; /* pills/chips; the app's rounded-full already covers this */

  --border-roster: 3px; /* the severity/state accent bar (finding, rvrow, phase group) */

  /* Glow — the lit halo a status signal carries (status dots, the ctx fill). Its
   * colour is the element's own currentColor, so one utility covers every tone;
   * only the strength is themed.
   * EVERY state glows and the WEIGHT is the state's liveness: `live` burns at the
   * themed strength, `quiet` (a state at rest — idle, landed) at a fraction of it,
   * `faint` at the least — the hollow ring of a session Argo only observes. A failure
   * keeps `live`: it burns as bright as needs-you, it just does not breathe. The two
   * steps down are derived from the themed base so a theme still makes ONE glow
   * decision. */
  --glow-blur: 8px;
  --glow-strength-quiet: calc(var(--glow-strength) * 0.4);
  --glow-strength-faint: calc(var(--glow-strength) * 0.22);
  --glow-blur-quiet: calc(var(--glow-blur) * 0.75);
  --glow-blur-faint: calc(var(--glow-blur) * 0.5);

  /* Icon glyph box — em-relative, so a glyph tracks the type role it sits in
   * rather than needing a size per call site (the default box is the icon's own
   * 1em). The baseline nudge optically centres a glyph against lowercase text
   * instead of sitting it on the baseline. */
  --icon-box-sm: 0.86em;
  --icon-baseline: -0.14em;

  /* Motion. `pulse` is the period a status dot breathes at — a property of the STATE
   * (live or asking), not a budget handed to one element. The rationed animation is the
   * attention sweep below, which only a row asking for you ever gets. */
  --time-fast: 150ms;
  --time-slow: 300ms;
  --time-pulse: 2s;
  --time-ease: cubic-bezier(0.4, 0, 0.2, 1);
  --pulse-dim: 0.45; /* the opacity a pulsing dot dips to */

  /* Attention sweep — a faint ray of light travelling the ring of the one row asking for
   * you. The mix steps keep it a ray of the attention ink rather than a drawn border:
   * `base` is the always-on ring so the edge never drops out behind the ray, and `still`
   * is the whole ring under reduced motion. The ray's BODY is deliberately long (see the
   * gradient in globals.css): an angle crosses a row's long edges and its short ones at
   * different speeds, and a long soft body is what keeps that from reading as a stutter. */
  --sweep-ring: 1.5px;
  --sweep-period: 2.4s;
  --sweep-ray: 30%;
  --sweep-tail: 10%;
  --sweep-base: 7%;
  --sweep-still: 12%;

  /* Depth staging — how far a dormant plane recedes behind the driven one. Two steps
   * only (the scene never stacks deeper than second-back), and BRIGHTNESS only: the
   * reference also scaled and shifted each step, which at cockpit width reads as cards
   * of inconsistent size rather than as depth. Attention is brightness; that is enough. */
  --recede-1-opacity: 0.66;
  --recede-2-opacity: 0.5;
}


/* Cockpit is dark-first: studies set <html class="dark"> (see study-template.html). */
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font: var(--type-row-weight) var(--type-row) / var(--type-row-leading) var(--sans);
  letter-spacing: var(--type-row-tracking);
}

/* Typography roles — the same tuples the app gets as text-hero … text-code-inline.
 * One sans ladder (9/11/13/15 + 23 hero) — that ladder IS the cockpit's density;
 * within a size, weight/case/tracking/leading differentiate, never a 1px size step. */
.text-hero {
  font: var(--type-hero-weight) var(--type-hero) / var(--type-hero-leading) var(--sans);
  letter-spacing: var(--type-hero-tracking);
}
.text-headline {
  font: var(--type-headline-weight) var(--type-headline) / var(--type-headline-leading) var(--sans);
  letter-spacing: var(--type-headline-tracking);
}
.text-title {
  font: var(--type-title-weight) var(--type-title) / var(--type-title-leading) var(--sans);
  letter-spacing: var(--type-title-tracking);
}
.text-row {
  font: var(--type-row-weight) var(--type-row) / var(--type-row-leading) var(--sans);
  letter-spacing: var(--type-row-tracking);
}
.text-row-strong {
  font: var(--type-row-strong-weight) var(--type-row-strong) / var(--type-row-strong-leading)
    var(--sans);
  letter-spacing: var(--type-row-strong-tracking);
}
.text-prose {
  font: var(--type-prose-weight) var(--type-prose) / var(--type-prose-leading) var(--sans);
  letter-spacing: var(--type-prose-tracking);
}
.text-meta {
  font: var(--type-meta-weight) var(--type-meta) / var(--type-meta-leading) var(--sans);
  letter-spacing: var(--type-meta-tracking);
  font-variant-numeric: tabular-nums;
}
.text-tag {
  font: var(--type-tag-weight) var(--type-tag) / var(--type-tag-leading) var(--sans);
  letter-spacing: var(--type-tag-tracking);
  text-transform: uppercase;
}
.text-eyebrow {
  font: var(--type-eyebrow-weight) var(--type-eyebrow) / var(--type-eyebrow-leading) var(--sans);
  letter-spacing: var(--type-eyebrow-tracking);
  text-transform: uppercase;
}
.text-code {
  font: var(--type-code-weight) var(--type-code) / var(--type-code-leading) var(--mono);
  letter-spacing: var(--type-code-tracking);
}
.text-code-inline {
  font: var(--type-code-inline-weight) var(--type-code-inline) / var(--type-code-inline-leading)
    var(--mono);
  letter-spacing: var(--type-code-inline-tracking);
}
.mono {
  font-family: var(--mono);
}

/* The lit halo on a live signal — mirrors the app's `glow` utility. The colour is the
 * element's own currentColor, so one class covers every tone. */
.glow {
  box-shadow: 0 0 var(--glow-blur) color-mix(in srgb, currentColor var(--glow-strength), transparent);
}

/* The Penumbra plane and its depth states — mirrors the app's `plane` / `plane-lit` /
 * `plane-recede-*` utilities. A plane floats in the lit scene; an `inset` card sits flat
 * on a panel. Never assemble one by hand from the ingredients. */
.plane {
  border-radius: var(--radius-plane);
  background: linear-gradient(180deg, var(--plane-top), var(--plane-bottom));
  backdrop-filter: blur(var(--frost)) saturate(var(--frost-saturate));
  box-shadow:
    inset 0 1px 0 var(--cove-lip),
    inset 0 22px 40px -30px var(--bloom-warm),
    0 20px 34px -22px var(--plane-cast);
}
.plane-lit {
  background: linear-gradient(180deg, var(--plane-top-lit), var(--plane-bottom-lit));
  box-shadow:
    inset 0 1px 0 var(--cove-lip-lit),
    inset 0 26px 46px -30px var(--bloom-warm-lit),
    0 30px 50px -20px var(--plane-cast-lit),
    0 0 46px -6px var(--bloom-warm);
}
/* Depth by brightness alone — a plane never changes size or position to express it. */
.plane-recede-1 {
  opacity: var(--recede-1-opacity);
}
.plane-recede-2 {
  opacity: var(--recede-2-opacity);
}

/* Status is a dot plus a word — never a filled or outlined pill. The colour is the
 * status tone as currentColor, so the dot and the word always agree. */
.status {
  display: inline-flex;
  align-items: center;
  gap: var(--space-snug);
}
.status > .dot {
  width: var(--space-snug);
  height: var(--space-snug);
  border-radius: var(--radius-full);
  background: currentColor;
  flex: none;
}
.room-scrim {
  background:
    radial-gradient(1150px 950px at 85% 50%, transparent 44%, var(--scrim-edge) 100%),
    linear-gradient(to bottom, var(--scrim-top), transparent 12%, transparent 82%, var(--scrim-bottom));
  mix-blend-mode: multiply;
}

body { margin: 0; background: var(--background); color: var(--foreground);
  font-family: var(--sans); }
.wrap { padding: 20px 26px 34px; max-width: 1400px; margin: 0 auto; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; align-items: center; }
.bar .cap { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--foreground-faint); width: 62px; flex: none; }
.bar > span[id] { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { appearance: none; border: 0; cursor: pointer; font: 11px var(--sans);
  color: var(--muted-foreground); background: var(--plane-top); padding: 5px 12px;
  border-radius: 999px; box-shadow: inset 0 1px 0 var(--cove-lip); }
.tab:hover { color: var(--foreground-soft); }
.tab[aria-pressed="true"] { color: var(--foreground-bright);
  box-shadow: inset 0 1px 0 var(--cove-lip), 0 0 0 1px var(--primary); }
.head { display: flex; align-items: baseline; gap: 14px; margin: 18px 0 5px; }
.head h1 { font-size: 15px; font-weight: 500; margin: 0; color: var(--foreground-bright); }
.head .m { color: var(--muted-foreground); font-size: 10.5px; font-family: var(--mono); }
.blurb { color: var(--foreground-soft); font-size: 12px; max-width: 96ch;
  margin: 0 0 14px; line-height: 1.55; }

#stage { position: relative; border-radius: var(--radius-plane); min-height: 600px;
  background: radial-gradient(900px 620px at 60% 44%, rgba(255,247,232,0.035), transparent 70%),
    linear-gradient(180deg, var(--plane-top), var(--plane-bottom));
  box-shadow: inset 0 1px 0 var(--cove-lip); overflow: hidden; }
#stage.flow { overflow: auto; }

/* ------------------------------------------------------------- constellation */
.con { display: grid; grid-template-columns: 1fr 330px; gap: 8px; height: 600px; }
.sky { width: 100%; height: 100%; }
.st .glow { fill: none; }
.st .disc { fill: var(--plane-top); stroke: var(--foreground-faint); stroke-width: 1; }
.st .num { font: 10px var(--mono); fill: var(--muted-foreground); }
.st .claim { fill: none; stroke: var(--primary); stroke-width: 1; opacity: 0.9; }
.st[data-s="takeable"] .disc { fill: var(--bone-50); stroke: none; }
.st[data-s="takeable"] .glow { fill: url(#gw); }
.st[data-s="takeable"] .num { fill: var(--background); }
.st[data-s="claimed"] .disc { fill: var(--bone-50); stroke: none; }
.st[data-s="claimed"] .glow { fill: url(#gw); }
.st[data-s="claimed"] .num { fill: var(--background); }
.st[data-s="blocked"] .disc { fill: none; stroke: var(--status-fail); }
.st[data-s="blocked"] .num { fill: var(--status-fail); }
.st[data-s="stranded"] .disc { fill: var(--status-fail); stroke: none; }
.st[data-s="stranded"] .glow { fill: url(#gf); }
.st[data-s="stranded"] .num { fill: var(--background); }
/* Resolved work recedes, but it is still a star — an outline so faint it vanished left
   the numbers floating on the plane with nothing under them. Depth is brightness, not
   absence: it keeps its disc and gives up its glow. */
.st[data-s="decided"] .disc { fill: var(--plane-top); stroke: var(--foreground-faint);
  stroke-opacity: 0.55; }
.st[data-s="decided"] .num { fill: var(--muted-foreground); }
.st[data-s="ruled_out"] .disc { fill: var(--plane-bottom); stroke: var(--foreground-faint);
  stroke-opacity: 0.45; stroke-dasharray: 2 2.5; }
.st[data-s="ruled_out"] .num { fill: var(--foreground-faint); }
.ln { stroke: var(--foreground-faint); stroke-width: 1; opacity: 0.45; fill: none; }
.ln.held { stroke: var(--status-fail); opacity: 0.7; }
.ah { fill: var(--foreground-faint); opacity: 0.5; }
.ah.held { fill: var(--status-fail); opacity: 0.8; }

.road { stroke: var(--foreground-faint); stroke-width: 1; opacity: 0.45; }
.stem { stroke: var(--foreground-faint); stroke-width: 1; opacity: 0.3; }
.fogband { fill: url(#fog); }
.cap { font: 8.5px var(--sans); letter-spacing: 0.14em; fill: var(--foreground-faint); }
.cap.dest { fill: var(--muted-foreground); }
.destmark { fill: none; stroke: var(--primary); stroke-width: 1; opacity: 0.75; }

.con.solo { grid-template-columns: 1fr; }
/* On-canvas titles, next to their dot — state carries the ink, as everywhere else.
   The plane-coloured halo knocks lines out from behind the letterforms, so the NOW
   line and the edges pass visually BEHIND type instead of through it. */
.st .ttl { font: 9.5px var(--sans); fill: var(--muted-foreground);
  paint-order: stroke; stroke: var(--plane-top); stroke-width: 3px; }
.st[data-s="takeable"] .ttl, .st[data-s="stranded"] .ttl { fill: var(--foreground-bright); }
.st[data-s="claimed"] .ttl { fill: var(--foreground-soft); }
.st[data-s="blocked"] .ttl { fill: var(--foreground-soft); }
.st[data-s="decided"] .ttl, .st[data-s="ruled_out"] .ttl { fill: var(--foreground-faint); }
.st .rtag { fill: var(--foreground-faint); font: 7.5px var(--mono);
  letter-spacing: 0.09em; text-transform: uppercase;
  paint-order: stroke; stroke: var(--plane-top); stroke-width: 3px; }
.st[data-s="takeable"] .rtag { fill: var(--muted-foreground); }
/* waiting — open but not takeable and not dependency-blocked: a human step (needs-info,
   needs-triage) stands before it. Neutral, never red: nothing is wrong, it is just early. */
.st[data-s="waiting"] .disc { fill: var(--plane-top); stroke: var(--muted-foreground); }
.st[data-s="waiting"] .num { fill: var(--muted-foreground); }
.st[data-s="waiting"] .ttl { fill: var(--foreground-soft); }
.nowline { stroke: var(--primary); stroke-width: 1.5; opacity: 0.8; }
.cap.now { fill: var(--primary); opacity: 0.85; }

/* ---- hub shapes: membership wiring + the map-as-hub mark */
.mem { stroke: var(--foreground-faint); opacity: 0.22; }
.hub .hubdisc { fill: var(--plane-top); stroke: var(--primary); stroke-opacity: 0.5; }
.hub .hubnum { fill: var(--muted-foreground); font: 8.5px var(--mono); }
.wfog { fill: var(--muted-foreground); }
#stage.dim .mem { opacity: 0.07; }
#stage.dim .hub { opacity: 0.4; }

.rail { overflow: auto; padding: 6px 4px 6px 0; display: flex; flex-direction: column; gap: 1px; }
.rail .row { display: grid; grid-template-columns: 24px 1fr; gap: 9px; align-items: baseline;
  padding: 4px 8px; border-radius: var(--radius-inset); cursor: default; }
.rail .ro { font: 10px var(--mono); color: var(--foreground-faint); }
.rail .rt { font-size: 11.5px; color: var(--muted-foreground); line-height: 1.35; }
.rail .row[data-s="takeable"] .rt, .rail .row[data-s="stranded"] .rt { color: var(--foreground-bright); }
.rail .row[data-s="claimed"] .rt { color: var(--foreground-soft); }
.rail .row[data-s="claimed"] .ro { color: var(--primary); }
.rail .row[data-s="blocked"] .ro, .rail .row[data-s="stranded"] .ro { color: var(--status-fail); }
.rail .row[data-s="decided"] .rt, .rail .row[data-s="ruled_out"] .rt { color: var(--foreground-faint); }

/* --------------------------------------------------------------------- flow */
.flow { padding: 22px; }
.board { position: relative; }
.wires { position: absolute; inset: 0; overflow: visible; }
.wr { stroke: var(--foreground-faint); stroke-width: 1; opacity: 0.5; }
.wr.held { stroke: var(--status-fail); opacity: 0.75; }
.card { position: absolute; width: 168px; height: 42px; box-sizing: border-box;
  display: grid; grid-template-columns: 22px 1fr; gap: 7px; align-items: center;
  padding: 6px 9px; border-radius: var(--radius-inset); background: var(--plane-top);
  box-shadow: inset 0 1px 0 var(--cove-lip), 0 0 0 1px var(--border-inset-hair); }
.card .co { font: 10px var(--mono); color: var(--foreground-faint); align-self: start; }
.card .ct { font-size: 10.5px; line-height: 1.28; color: var(--muted-foreground);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card[data-s="takeable"] { box-shadow: inset 0 1px 0 var(--cove-lip), 0 0 0 1px var(--primary); }
.card[data-s="takeable"] .ct { color: var(--foreground-bright); }
.card[data-s="takeable"] .co { color: var(--primary); }
.card[data-s="claimed"] .co { color: var(--primary); }
.card[data-s="claimed"] .ct { color: var(--foreground-soft); }
.card[data-s="blocked"] .co, .card[data-s="stranded"] .co { color: var(--status-fail); }
.card[data-s="stranded"] .ct { color: var(--foreground-bright); }
.card[data-s="decided"] .ct, .card[data-s="ruled_out"] .ct { color: var(--foreground-faint); }
.card[data-s="ruled_out"] { opacity: 0.6; }
.tray { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--border-inset-hair); }
.trayhead { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--foreground-faint); margin-bottom: 12px; }
.traygrid { display: flex; flex-wrap: wrap; gap: 10px; }
.traygrid .card { position: static; }

/* ------------------------------------------------- one hovered ticket, everywhere */
#stage.dim .st, #stage.dim .card, #stage.dim .row { opacity: 0.34; }
#stage.dim .ln, #stage.dim .wr, #stage.dim .ah { opacity: 0.12; }
#stage .hot { opacity: 1 !important; }
.st.hot .disc { stroke: var(--primary); stroke-width: 1.5; }
.card.hot { box-shadow: inset 0 1px 0 var(--cove-lip), 0 0 0 1px var(--primary); }
.row.hot { background: var(--plane-top); }
.ln.hot, .wr.hot { stroke: var(--primary); opacity: 0.95 !important; }
.ah.hot { fill: var(--primary); opacity: 0.95 !important; }
.st.sel .disc, .card.sel { outline: 1px solid var(--primary); outline-offset: 3px; }

</style>
</head>

<script>
/* Two candidate presentations of a wayfinder map, over the real data.

   The lesson from the nine-layout lab: legibility is decided by what a NODE CARRIES,
   not by the layout engine. A 30-character title beside every star needs ~186 units of
   clearance, so the layout gets driven apart by type and the shape stops reading. Both
   shapes below shrink the node instead — the constellation to a numbered dot with the
   naming moved off-canvas, the flow to a card that carries its own title and is packed
   in a grid where cards cannot collide by construction. */
(() => {
  const SVG = "http://www.w3.org/2000/svg";
  const el = (n, a = {}) => {
    const e = document.createElementNS(SVG, n);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    return e;
  };
  const div = (cls, text) => {
    const d = document.createElement("div");
    d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  };
  // The ordinal is LOCAL to the map and stable: reading order, two digits. It is what
  // makes a node small enough to lay out, and what lets the rail and the map refer to
  // the same ticket without repeating its title.
  const ordinals = (map) => {
    const o = {};
    map.nodes.forEach((n, i) => (o[n.id] = String(i + 1).padStart(2, "0")));
    return o;
  };
  const depthsOf = (map) => {
    const d = {};
    const blockers = {};
    map.edges.forEach(([b, x]) => (blockers[x] ??= []).push(b));
    const walk = (id, seen = new Set()) => {
      if (d[id] !== undefined) return d[id];
      if (seen.has(id)) return 0;
      seen.add(id);
      const bs = blockers[id] ?? [];
      return (d[id] = bs.length ? 1 + Math.max(...bs.map((b) => walk(b, seen))) : 0);
    };
    map.nodes.forEach((n) => walk(n.id));
    return d;
  };

  /* The rail is where the map is READ. Ordinal + full title, in the order the ordinals
     run, so the eye goes number → name and the canvas carries no prose at all. Shared by
     every shape whose node is a numbered star. */
  const railOf = (map, ord, on) => {
    const rail = div("rail");
    map.nodes.forEach((n) => {
      const row = div(`row${n.sel ? " sel" : ""}`);
      row.dataset.id = n.id;
      row.dataset.s = n.state;
      row.append(div("ro", ord[n.id]), div("rt", n.title));
      row.addEventListener("mouseenter", () => on(n.id));
      row.addEventListener("mouseleave", () => on(null));
      rail.append(row);
    });
    return rail;
  };

  /* ---------------------------------------------------------------- constellation */

  const SIM = { W: 760, H: 560, R: 15, ITER: 420, REST: 96, SPRING: 0.05,
    REPEL: 2600, GRAV: 0.006, BIAS: 0.02, STEP: 0.55, DAMP: 0.86, MIN: 46 };

  /* Deterministic golden-angle seed — the same map must always yield the same sky, or
     it is a slot machine rather than a design study. */
  const seed = (map) => {
    const pos = {};
    const golden = Math.PI * (3 - Math.sqrt(5));
    map.nodes.forEach((n, i) => {
      const a = i * golden, r = Math.sqrt(i + 0.5) / Math.sqrt(map.nodes.length);
      pos[n.id] = { x: SIM.W / 2 + r * Math.cos(a) * SIM.W * 0.44,
        y: SIM.H / 2 + r * Math.sin(a) * SIM.H * 0.44, vx: 0, vy: 0 };
    });
    return pos;
  };

  const relax = (map, pos, depth) => {
    const ids = map.nodes.map((n) => n.id);
    const maxD = Math.max(1, ...Object.values(depth));
    const deg = {};
    map.edges.flat().forEach((id) => (deg[id] = (deg[id] ?? 0) + 1));
    for (let step = 0; step < SIM.ITER; step++) {
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          const a = pos[ids[i]], b = pos[ids[j]];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d = Math.hypot(dx, dy) || 0.01;
          if (d > 340) continue;
          const f = SIM.REPEL / (d * d);
          dx /= d; dy /= d;
          a.vx -= dx * f; a.vy -= dy * f;
          b.vx += dx * f; b.vy += dy * f;
        }
      map.edges.forEach(([p, q]) => {
        const a = pos[p], b = pos[q];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const f = (d - SIM.REST) * SIM.SPRING;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f;
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      });
      // A blocker sits left of what it blocks — only for nodes that HAVE an edge. A
      // ticket with no dependency has no column to belong to, and anchoring it would
      // stack every loose one into a wall, which is the bug the lab surfaced.
      ids.forEach((id) => {
        const p = pos[id];
        if (deg[id]) p.vx += (SIM.W * (0.16 + 0.68 * (depth[id] / maxD)) - p.x) * SIM.BIAS;
        p.vx += (SIM.W / 2 - p.x) * SIM.GRAV;
        p.vy += (SIM.H / 2 - p.y) * SIM.GRAV;
        p.x += (p.vx *= SIM.DAMP) * SIM.STEP;
        p.y += (p.vy *= SIM.DAMP) * SIM.STEP;
        p.x = Math.min(SIM.W - SIM.R, Math.max(SIM.R, p.x));
        p.y = Math.min(SIM.H - SIM.R, Math.max(SIM.R, p.y));

    // Hard de-overlap pass: the sim keeps stars apart on average, this guarantees it.
    for (let pass = 0; pass < 90; pass++)
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          const a = pos[ids[i]], b = pos[ids[j]];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.01;
          if (d >= SIM.MIN) continue;
          const push = (SIM.MIN - d) / 2;
          a.x -= (dx / d) * push; a.y -= (dy / d) * push;
          b.x += (dx / d) * push; b.y += (dy / d) * push;
          [a, b].forEach((p) => {
            p.x = Math.min(SIM.W - SIM.R, Math.max(SIM.R, p.x));
            p.y = Math.min(SIM.H - SIM.R, Math.max(SIM.R, p.y));

    // which on a 10-ticket map is a knot in the middle of an empty stage — the shape is
    // right, the scale is not, and only the scale is free to change.
    const xs = ids.map((id) => pos[id].x), ys = ids.map((id) => pos[id].y);

    const spanY = Math.max(1, Math.max(...ys) - Math.min(...ys));

    const depth = depthsOf(map);

    const wrap = div("con");
    const sky = el("svg", { viewBox: `0 0 ${SIM.W} ${SIM.H}`, class: "sky" });

      const ang = Math.atan2(B.y - my, B.x - mx) * 180 / Math.PI;
      const t = 0.72;
      const px = (1 - t) ** 2 * A.x + 2 * (1 - t) * t * mx + t * t * B.x;
      const py = (1 - t) ** 2 * A.y + 2 * (1 - t) * t * my + t * t * B.y;
      gEdge.append(el("path", { class: `ah${held ? " held" : ""}`,
        transform: `translate(${px} ${py}) rotate(${ang})`, d: "M0 0 L-6 3 L-6 -3 Z" }));
    });

    map.nodes.forEach((n) => {
      const p = pos[n.id];
      const g = el("g", { class: `st${n.sel ? " sel" : ""}`, "data-s": n.state, "data-id": n.id });
      g.append(el("circle", { class: "glow", cx: p.x, cy: p.y, r: SIM.R * 2.6 }));
      g.append(el("circle", { class: "disc", cx: p.x, cy: p.y, r: SIM.R }));
      if (n.claimed) g.append(el("circle", { class: "claim", cx: p.x, cy: p.y, r: SIM.R + 4 }));
      Object.assign(g.appendChild(el("text", { class: "num", x: p.x, y: p.y + 3.6,
        "text-anchor": "middle" })), { textContent: ord[n.id] });
      const ttl = el("title");
      ttl.textContent = `${n.id} · ${n.title} — ${n.state}`;
      g.append(ttl);
      g.addEventListener("mouseenter", () => on(n.id));
      g.addEventListener("mouseleave", () => on(null));

  /* ----------------------------------------------------------------------- spine */

  const SP = { W: 1020, H: 520, R: 12, pad: 62, lift: [92, 148] };

  /* The spine is the ROUTE WALKED — tickets in the order the map authored them, start
     on the left, destination on the right. It is chronology, not dependency, and those
     are different truths: the arcs above carry what waits on what, so neither is made
     to stand in for the other. Resolved work sits ON the line, because it is the road;
     live work lifts OFF it on a stem, because it is not road yet. */
  const spine = (host, map, on) => {
    const ord = ordinals(map);
    const done = (n) => ["decided", "ruled_out"].includes(n.state);

    // and the map is only honest if there is visibly road left to walk.

      // near one is already taken by its neighbour — two lifted stars one step apart
      // at the same height would touch.
      const near = pos[map.nodes[i - 1]?.id];
      const far = near?.off && Math.abs(near.x - x) < SP.R * 2.6;
      pos[node.id] = { x, y: mid + (up ? -1 : 1) * SP.lift[far ? 1 : 0], off: true };
      up = !up;
    });

    const wrap = div("con");
    const sky = el("svg", { viewBox: `0 0 ${SP.W} ${SP.H}`, class: "sky" });
    const gRoad = el("g"), gEdge = el("g"), gStar = el("g");
    sky.append(gRoad, gEdge, gStar);

    // The fog runs the full height of the sky: a banded rectangle has hard top and
    // bottom edges, which read as a drawn box rather than as the way ahead dissolving.
    const x0 = SP.pad - 34, xN = SP.pad + (n - 1) * step;
    const xDest = SP.W - 30;
    gRoad.append(el("rect", { class: "fogband", x: xN + 6, y: 0,
      width: SP.W - xN - 6, height: SP.H }));
    gRoad.append(el("line", { class: "road", x1: x0, y1: mid, x2: xDest - 12, y2: mid }));
    Object.assign(gRoad.appendChild(el("text", { class: "cap", x: x0, y: mid - 26 })),
      { textContent: "START" });
    Object.assign(gRoad.appendChild(el("text", { class: "cap dest", x: xDest + 9,
      y: mid - 26, "text-anchor": "end" })), { textContent: "DESTINATION" });

      transform: `translate(${xDest} ${mid})`, d: "M0 -9 L9 0 L0 9 L-9 0 Z" }));
