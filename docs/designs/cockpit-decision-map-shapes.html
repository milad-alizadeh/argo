    map.edges.forEach(([b, d]) => {
      const A = pos[b], B = pos[d];
      if (!A || !B) return;
      const held = ["blocked", "stranded"].includes(map.byId[d].state);
      const rise = Math.min(196, 46 + Math.abs(B.x - A.x) * 0.34);
      const cy = Math.min(A.y, B.y) - rise;
      gEdge.append(el("path", { class: `ln${held ? " held" : ""}`, fill: "none",
        "data-a": b, "data-b": d,
        d: `M${A.x} ${A.y} C${A.x} ${cy} ${B.x} ${cy} ${B.x} ${B.y}` }));
      gEdge.append(el("path", { class: `ah${held ? " held" : ""}`,
        transform: `translate(${B.x} ${B.y - SP.R - 2}) rotate(90)`,
        d: "M0 0 L-6 3 L-6 -3 Z" }));
    });

    map.nodes.forEach((node) => {
      const p = pos[node.id];
      const g = el("g", { class: `st${node.sel ? " sel" : ""}`, "data-s": node.state,
        "data-id": node.id });
      if (p.off) g.append(el("line", { class: "stem", x1: p.x, y1: mid, x2: p.x, y2: p.y }));
      g.append(el("circle", { class: "glow", cx: p.x, cy: p.y, r: SP.R * 2.8 }));
      g.append(el("circle", { class: "disc", cx: p.x, cy: p.y, r: SP.R }));
      if (node.claimed) g.append(el("circle", { class: "claim", cx: p.x, cy: p.y, r: SP.R + 4 }));
      Object.assign(g.appendChild(el("text", { class: "num", x: p.x, y: p.y + 3.4,
        "text-anchor": "middle" })), { textContent: ord[node.id] });
      const ttl = el("title");
      ttl.textContent = `${node.id} · ${node.title} — ${node.state}`;
      g.append(ttl);
      g.addEventListener("mouseenter", () => on(node.id));
      g.addEventListener("mouseleave", () => on(null));
      gStar.append(g);
    });

    wrap.append(sky, railOf(map, ord, on));
    host.append(wrap);
  };

  /* ------------------------------------------------------- hub variations (chartr) */

  /* chartr's constellations hold together because every node is wired to its PARENT —
     membership, not dependency. A wayfinder map has membership too, but it is FLAT:
     every ticket's parent is the same one map issue, so the graph it makes is a star
     with a single hub. These three shapes draw that star three ways. Membership spokes
     are drawn only where a chain does not already imply them — a chain member is
     connected to the hub THROUGH its blocker, and a second line would only cross. */

  const paintDep = (gEdge, map, pos, heldStates = ["blocked", "stranded"]) => {
    map.edges.forEach(([b, d]) => {
      const A = pos[b], B = pos[d];
      const held = heldStates.includes(map.byId[d].state);
      const mx = (A.x + B.x) / 2 - (B.y - A.y) * 0.13;
      const my = (A.y + B.y) / 2 + (B.x - A.x) * 0.13;
      gEdge.append(el("path", { class: `ln${held ? " held" : ""}`, fill: "none",
        "data-a": b, "data-b": d, d: `M${A.x} ${A.y} Q${mx} ${my} ${B.x} ${B.y}` }));
      const ang = Math.atan2(B.y - my, B.x - mx) * 180 / Math.PI;
      const t = 0.72;
      const px = (1 - t) ** 2 * A.x + 2 * (1 - t) * t * mx + t * t * B.x;
      const py = (1 - t) ** 2 * A.y + 2 * (1 - t) * t * my + t * t * B.y;
      gEdge.append(el("path", { class: `ah${held ? " held" : ""}`,
        transform: `translate(${px} ${py}) rotate(${ang})`, d: "M0 0 L-6 3 L-6 -3 Z" }));
    });
  };

  /* The label sits NEXT TO its dot, on the canvas — not in a side list. Radial labelling:
     the title extends AWAY from the hub, which is the one direction guaranteed to point at
     empty sky rather than at another ring of the map. */
  const paintStars = (gStar, map, pos, ord, on, Rr, hub, opts = {}) => {
    const below = opts.below ?? new Set();
    const leftSide = opts.left ?? new Set();
    map.nodes.forEach((n) => {
      const p = pos[n.id];
      const g = el("g", { class: `st${n.sel ? " sel" : ""}`, "data-s": n.state, "data-id": n.id });
      g.append(el("circle", { class: "glow", cx: p.x, cy: p.y, r: Rr * 2.6 }));
      g.append(el("circle", { class: "disc", cx: p.x, cy: p.y, r: Rr }));
      if (n.claimed) g.append(el("circle", { class: "claim", cx: p.x, cy: p.y, r: Rr + 4 }));
      Object.assign(g.appendChild(el("text", { class: "num", x: p.x, y: p.y + 3.4,
        "text-anchor": "middle" })), { textContent: ord[n.id] });
      const right = leftSide.has(n.id) ? false : !hub || p.x >= hub.x;
      const short = n.title.length > 26 ? `${n.title.slice(0, 25)}…` : n.title;
      // The ticket's own label, worn as a tag on its OWN line under the title —
      // wayfinder:<type> on a decision map, the triage label on a spec's sub-tickets.
      // Micro mono, letter-spaced, quiet: metadata, not a second title. History wears none.
      const tag = n.tag && !["decided", "ruled_out"].includes(n.state) ? n.tag : null;
      if (opts.row) {
        // Row form: a LEFT-ALIGNED two-line block beside the dot — title over tag —
        // exactly the hierarchy a cockpit row uses. Nothing is ever centered under a
        // dot, so no vertical line can pass through type.
        const lx = p.x + Rr + 9;
        Object.assign(g.appendChild(el("text", { class: "ttl", x: lx,
          y: p.y + (tag ? -1 : 3), "text-anchor": "start" })), { textContent: short });
        if (tag)
          Object.assign(g.appendChild(el("text", { class: "rtag", x: lx,
            y: p.y + 10, "text-anchor": "start" })), { textContent: tag });
      } else {
        const und = below.has(n.id);
        const lx = und ? p.x : p.x + (Rr + 6) * (right ? 1 : -1);
        const anchor = und ? "middle" : right ? "start" : "end";
        Object.assign(g.appendChild(el("text", { class: "ttl", x: lx,
          y: und ? p.y + Rr + 13 : p.y + 3, "text-anchor": anchor })),
          { textContent: short });
        if (tag)
          Object.assign(g.appendChild(el("text", { class: "rtag", x: lx,
            y: und ? p.y + Rr + 24 : p.y + 14, "text-anchor": anchor })),
            { textContent: tag });
      }
      const ttl = el("title");
      ttl.textContent = `${n.id} · ${n.title} — ${n.state}`;
      g.append(ttl);
      g.addEventListener("mouseenter", () => on(n.id));
      g.addEventListener("mouseleave", () => on(null));
      gStar.append(g);
    });
  };

  const paintHub = (g, map, p) => {
    const hg = el("g", { class: "hub" });
    hg.append(el("circle", { class: "hubdisc", cx: p.x, cy: p.y, r: 19 }));
    Object.assign(hg.appendChild(el("text", { class: "hubnum", x: p.x, y: p.y + 3,
      "text-anchor": "middle" })), { textContent: `#${map.id}` });
    const ttl = el("title");
    ttl.textContent = `#${map.id} · ${map.title} — the map`;
    hg.append(ttl);
    g.append(hg);
  };

  /* Horizontal margin is label-sized, vertical is dot-sized: every title extends
     outward, so the widest thing on the canvas is a dot plus ~150 units of type. */
  const fitBox = (pos, W, H, mx, my) => {
    const ps = Object.values(pos);
    const xs = ps.map((p) => p.x), ys = ps.map((p) => p.y);
    const spanX = Math.max(1, Math.max(...xs) - Math.min(...xs));
    const spanY = Math.max(1, Math.max(...ys) - Math.min(...ys));
    const s = Math.min((W - mx * 2) / spanX, (H - my * 2) / spanY, 1.5);
    const ox = mx + (W - mx * 2 - spanX * s) / 2 - Math.min(...xs) * s;
    const oy = my + (H - my * 2 - spanY * s) / 2 - Math.min(...ys) * s;
    ps.forEach((p) => { p.x = p.x * s + ox; p.y = p.y * s + oy; });
  };

  const components = (map) => {
    const parent = {};
    const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])));
    map.nodes.forEach((n) => (parent[n.id] = n.id));
    map.edges.forEach(([a, b]) => (parent[find(a)] = find(b)));
    const comps = {};
    map.nodes.forEach((n) => (comps[find(n.id)] ??= []).push(n.id));
    return Object.values(comps);
  };

  const RAD = { W: 1180, H: 560 };
  const radialShell = (host, map, on, build) => {
    const ord = ordinals(map);
    const wrap = div("con solo");
    const sky = el("svg", { viewBox: `0 0 ${RAD.W} ${RAD.H}`, class: "sky" });
    const gMem = el("g"), gEdge = el("g"), gStar = el("g");
    sky.append(gMem, gEdge, gStar);
    const { pos, hub, spokes, extra } = build();
    spokes.forEach((id) => gMem.append(el("line", { class: "mem",
      x1: hub.x, y1: hub.y, x2: pos[id].x, y2: pos[id].y })));
    paintDep(gEdge, map, pos);
    if (extra) extra(gMem);
    paintHub(gStar, map, hub);
    paintStars(gStar, map, pos, ord, on, 13, hub);
    wrap.append(sky);
    host.append(wrap);
  };

  /* Dandelion — chartr's actual mechanics: a spring sim where every chain root and
     singleton is wired to the hub, and the hub is PINNED at the centre. Organic like
     chartr's canvas; and like chartr's canvas, position means nothing but adjacency. */
  const dandelion = (host, map, on) => {
    const depth = depthsOf(map);
    const ids = map.nodes.map((n) => n.id);
    const C = { x: SIM.W / 2, y: SIM.H / 2 };
    const pos = seed(map);
    const roots = ids.filter((id) => depth[id] === 0);
    const springs = [
      ...map.edges.map(([a, b]) => [a, b, 80]),
      ...roots.map((id) => [null, id, 126]),
    ];
    const at = (id) => (id === null ? C : pos[id]);
    for (let step = 0; step < 420; step++) {
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          const a = pos[ids[i]], b = pos[ids[j]];
          let dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.01;
          if (d > 320) continue;
          const f = 2400 / (d * d);
          dx /= d; dy /= d;
          a.vx -= dx * f; a.vy -= dy * f;
          b.vx += dx * f; b.vy += dy * f;
        }
      ids.forEach((id) => { // the hub repels: nothing may sit on the middle
        const p = pos[id];
        const dx = p.x - C.x, dy = p.y - C.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const f = 5200 / (d * d);
        p.vx += (dx / d) * f; p.vy += (dy / d) * f;
      });
      springs.forEach(([a, b, rest]) => {
        const A = at(a), B = at(b);
        const dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const f = (d - rest) * 0.05;
        if (a !== null) { A.vx += (dx / d) * f; A.vy += (dy / d) * f; }
        B.vx -= (dx / d) * f; B.vy -= (dy / d) * f;
      });
      ids.forEach((id) => {
        const p = pos[id];
        p.vx += (C.x - p.x) * 0.008;
        p.vy += (C.y - p.y) * 0.008;
        p.x += (p.vx *= 0.86) * 0.55;
        p.y += (p.vy *= 0.86) * 0.55;
      });
    }
    for (let pass = 0; pass < 80; pass++)
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          const a = pos[ids[i]], b = pos[ids[j]];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.01;
          if (d >= 42) continue;
          const push = (42 - d) / 2;
          a.x -= (dx / d) * push; a.y -= (dy / d) * push;
          b.x += (dx / d) * push; b.y += (dy / d) * push;
        }
    const all = { ...pos, hub: { x: C.x, y: C.y } };
    fitBox(all, RAD.W, RAD.H, 155, 34);
    radialShell(host, map, on, () => ({ pos, hub: all.hub, spokes: roots }));
  };

  /* Comet — the dandelion given an arrow of time. The hub is pinned at the LEFT edge as
     START; every ticket is anchored to an x set by its place in the map's chronology, and
     the sim only ever bends things vertically around that. The right edge is the fog and
     the destination, so start and finish are the first things the shape says. */
  const comet = (host, map, on) => {
    const depth = depthsOf(map);
    const ids = map.nodes.map((n) => n.id);
    const n = ids.length;
    const hub = { x: 84, y: RAD.H / 2 };
    const x0 = 225, x1 = RAD.W - 300;
    const xa = {};
    ids.forEach((id, i) => (xa[id] = x0 + (x1 - x0) * (n === 1 ? 0 : i / (n - 1))));
    const pos = {};
    ids.forEach((id, i) => (pos[id] = { x: xa[id],
      y: RAD.H / 2 + (i % 2 ? 1 : -1) * (30 + ((i * 37) % 150)), vx: 0, vy: 0 }));
    const roots = ids.filter((id) => depth[id] === 0);
    const springs = [
      ...map.edges.map(([a, b]) => [a, b, 90]),
      ...roots.map((id) => [null, id, 170]),
    ];
    const at = (id) => (id === null ? hub : pos[id]);
    for (let step = 0; step < 380; step++) {
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          const a = pos[ids[i]], b = pos[ids[j]];
          let dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.01;
          if (d > 240) continue;
          const f = 2200 / (d * d);
          dx /= d; dy /= d;
          a.vx -= dx * f; a.vy -= dy * f;
          b.vx += dx * f; b.vy += dy * f;
        }
      springs.forEach(([a, b]) => {
        const A = at(a), B = at(b);
        const dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const f = (d - 90) * 0.03;
        if (a !== null) { A.vx += (dx / d) * f; A.vy += (dy / d) * f; }
        B.vx -= (dx / d) * f; B.vy -= (dy / d) * f;
      });
      ids.forEach((id) => {
        const p = pos[id];
        p.vx += (xa[id] - p.x) * 0.06; // chronology is firm; the sim only bends y
        p.vy += (RAD.H / 2 - p.y) * 0.012;
        p.x += (p.vx *= 0.85) * 0.5;
        p.y += (p.vy *= 0.85) * 0.5;
        p.y = Math.min(RAD.H - 40, Math.max(40, p.y));
      });
    }
    for (let pass = 0; pass < 70; pass++)
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++) {
          const a = pos[ids[i]], b = pos[ids[j]];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.01;
          if (d >= 40) continue;
          const push = (40 - d) / 2;
          a.x -= (dx / d) * push; a.y -= (dy / d) * push;
          b.x += (dx / d) * push; b.y += (dy / d) * push;
        }
    radialShell(host, map, on, () => ({
      pos, hub, spokes: roots,
      extra: (g) => {
        const mid = RAD.H / 2;
        Object.assign(g.appendChild(el("text", { class: "cap", x: hub.x - 20, y: mid - 34 })),
          { textContent: "START" });
        for (let i = 0; i < map.fog; i++)
          g.append(el("circle", { class: "wfog", cx: x1 + 96 + i * 26, cy: mid, r: 2.6,
            opacity: Math.max(0.12, 0.4 - i * 0.08) }));
        const xd = RAD.W - 44;
        g.append(el("path", { class: "destmark", transform: `translate(${xd} ${mid})`,
          d: "M0 -9 L9 0 L0 9 L-9 0 Z" }));
        Object.assign(g.appendChild(el("text", { class: "cap dest", x: xd + 9, y: mid - 26,
          "text-anchor": "end" })), { textContent: "DESTINATION" });
      },
    }));
  };

  /* Wheel — the hub star made to also carry ORDER: angle is the map's own chronology,
     radius is dependency depth. The gap in the sweep is the fog, and the destination
     closes the circle the route has not yet reached. */
  const wheel = (host, map, on) => {
    const depth = depthsOf(map);
    const C = { x: SIM.W / 2, y: SIM.H / 2 };
    const n = map.nodes.length;
    const slots = n + map.fog + 1;
    const stepA = (Math.PI * 2 - 0.55) / slots;
    const a0 = -Math.PI / 2 + 0.28;
    const angle = (i) => a0 + stepA * i;
    const pos = {};
    map.nodes.forEach((node, i) => {
      const a = angle(i), r = 145 + depth[node.id] * 72;
      pos[node.id] = { x: C.x + Math.cos(a) * r, y: C.y + Math.sin(a) * r };
    });
    const all = { ...pos, hub: { x: C.x, y: C.y } };
    fitBox(all, SIM.W, SIM.H, 40);
    const hub = all.hub;
    radialShell(host, map, on, () => ({
      pos, hub,
      spokes: map.nodes.filter((nd) => depth[nd.id] === 0).map((nd) => nd.id),
      extra: (g) => {
        // What the sweep has not reached: one faint mark per fog patch, then the
        // destination — the wheel closes only when the route does.
        const rr = Math.hypot(pos[map.nodes[0].id].x - hub.x, pos[map.nodes[0].id].y - hub.y);
        for (let i = 0; i < map.fog; i++) {
          const a = angle(n + i);
          g.append(el("circle", { class: "wfog", cx: hub.x + Math.cos(a) * rr,
            cy: hub.y + Math.sin(a) * rr, r: 2.6, opacity: Math.max(0.12, 0.4 - i * 0.08) }));
        }
        const ad = angle(n + map.fog);
        g.append(el("path", { class: "destmark",
          transform: `translate(${hub.x + Math.cos(ad) * rr} ${hub.y + Math.sin(ad) * rr})`
            + ` rotate(${(ad * 180) / Math.PI + 90})`,
          d: "M0 -9 L9 0 L0 9 L-9 0 Z" }));
      },
    }));
  };

  /* Sectors — the dandelion made deterministic: every strand gets a wedge of the
     circle sized by its ticket count, depth walks outward. Same hub star, no sim. */
  const sectors = (host, map, on) => {
    const depth = depthsOf(map);
    const units = components(map).sort((a, b) => b.length - a.length);
    const total = map.nodes.length;
    const pos = {};
    let a0 = -Math.PI / 2;
    units.forEach((u) => {
      const span = (u.length / total) * Math.PI * 2;
      const byD = {};
      u.forEach((id) => (byD[depth[id]] ??= []).push(id));
      Object.entries(byD).forEach(([d, ids2]) => {
        ids2.forEach((id, i) => {
          const a = a0 + span * ((i + 0.5) / ids2.length);
          const r = 118 + Number(d) * 78;
          pos[id] = { x: Math.cos(a) * r, y: Math.sin(a) * r };
        });
      });
      a0 += span;
    });
    const all = { ...pos, hub: { x: 0, y: 0 } };
    fitBox(all, SIM.W, SIM.H, 40);
    radialShell(host, map, on, () => ({
      pos, hub: all.hub,
      spokes: map.nodes.filter((n) => depth[n.id] === 0).map((n) => n.id),
    }));
  };

  /* ----------------------------------------------------------------------- route */

  /* The axis is PROGRESS, not chronology and not raw depth. Everything left of the NOW
     line is walked road; whatever stands ON the line is takeable today; everything right
     of it is why the map is not finished, pushed further right the more decisions must
     close before it can open. The distance from the line to the destination IS the work
     remaining, and a finished map is one where the line has walked into the fog. */
  const route = (host, map, on) => {
    const ord = ordinals(map);
    const openS = ["takeable", "claimed", "blocked", "stranded", "waiting"];
    const isOpen = (id) => openS.includes(map.byId[id].state);
    // Captions speak the TICKET'S OWN WORDS — the derived state word for a wayfinder
    // map, the triage label verbatim for a spec's sub-tickets. The view is a lens; it
    // never mints vocabulary of its own.
    const wordOf = (n) => n.word
      ?? ({ decided: "resolved", ruled_out: "ruled out" }[n.state] ?? n.state);
    const countCap = (ns) => {
      const c = {};
      ns.forEach((n) => (c[wordOf(n)] = (c[wordOf(n)] || 0) + 1));
      return Object.entries(c).map(([w, k]) => `${w} · ${k}`).join("   ");
    };
    // Remaining depth: how many OPEN decisions stand between this ticket and the line.
    const rd = {};
    const calcRd = (id, seen = new Set()) => {
      if (rd[id] !== undefined) return rd[id];
      if (seen.has(id)) return 0;
      seen.add(id);
      const obs = map.edges.filter(([b, d]) => d === id && isOpen(b)).map(([b]) => b);
      return (rd[id] = obs.length ? 1 + Math.max(...obs.map((b) => calcRd(b, seen))) : 0);
    };
    map.nodes.filter((n) => isOpen(n.id)).forEach((n) => calcRd(n.id));
    // Stranded never reaches the line — its blocker was ruled out, nothing opens it.
    // And a ticket waiting on a HUMAN step (needs-info, needs-triage) is not takeable
    // either: it stands ahead of the line with no edge, not on the frontier.
    map.nodes.forEach((n) => {
      if (n.state === "stranded" || n.notReady) rd[n.id] = Math.max(1, rd[n.id] ?? 1);
    });
    const done = map.nodes.filter((n) => !isOpen(n.id));
    const lineNodes = map.nodes.filter((n) => isOpen(n.id) && rd[n.id] === 0);
    const ahead = map.nodes.filter((n) => isOpen(n.id) && rd[n.id] > 0);

    const H = RAD.H;
    const pos = {};
    // Every label is a left-aligned block beside its dot, so a node's true footprint is
    // dot + type. Spacing derives from THESE widths — overlap is prevented by geometry,
    // not tuning — and the canvas widens rather than squashing when a map needs room.
    const R2 = 11;
    const shortLen = (n) => Math.min(n.title.length, 26);
    const tagOf = (n) => (n.tag && isOpen(n.id) ? n.tag : null);
    const labW = (n) => R2 + 12
      + Math.max(shortLen(n) * 5.2 + 12, (tagOf(n)?.length ?? 0) * 5.6 + 12);
    // Walked road: charted order, stacked in quiet columns. History is a list, and a
    // list is the honest shape of it — its dependencies are all satisfied, so they
    // draw nothing.
    const perCol = 13, rowH = 27, colW = 260;
    done.forEach((n, i) => {
      const c = Math.floor(i / perCol), r = i % perCol;
      const colLen = Math.min(perCol, done.length - c * perCol);
      pos[n.id] = { x: 64 + c * colW, y: H / 2 + (r - (colLen - 1) / 2) * rowH };
    });
    const doneCols = done.length ? Math.ceil(done.length / perCol) : 0;
    const nowX = 64 + doneCols * colW + (done.length ? 46 : 60);
    // The line compresses when the frontier is wide — day one on a 27-ticket map puts a
    // dozen tickets on it — but never below the height of a two-line label block.
    const lgap = Math.max(34, Math.min(78, (H - 116) / Math.max(1, lineNodes.length - 1)));
    lineNodes.forEach((n, i) =>
      (pos[n.id] = { x: nowX, y: H / 2 + (i - (lineNodes.length - 1) / 2) * lgap }));
    // One dependency step must clear the widest label block that can sit in a column.
    const stepX = 24 + Math.max(180,
      ...[...lineNodes, ...ahead].map((n) => labW(n)));
    // Ahead of the line: column = distance from takeable, row = near its blockers —
    // placed column by column so a chain stays roughly level, with a greedy min-gap
    // pass instead of a shove-down loop, so a crowded column spreads rather than piles.
    const cols = {};
    ahead.forEach((n) => (cols[rd[n.id]] ??= []).push(n));
    Object.keys(cols).map(Number).sort((a, b) => a - b).forEach((k) => {
      const col = cols[k];
      const want = (n) => {
        const bys = map.edges.filter(([b, d]) => d === n.id && pos[b]).map(([b]) => pos[b].y);
        return bys.length ? bys.reduce((s, v) => s + v, 0) / bys.length : H / 2;
      };
      const gap = Math.max(34, Math.min(48, (H - 116) / Math.max(1, col.length - 1)));
      let prev = -1e9;
      [...col].sort((a, b) => want(a) - want(b)).forEach((n) => {
        const y = Math.max(58, Math.min(H - 58, want(n)), prev + gap);
        pos[n.id] = { x: nowX + 46 + k * stepX, y };
        prev = y;
      });
      const over = prev - (H - 58);
      if (over > 0) col.forEach((n) => (pos[n.id].y = Math.max(58, pos[n.id].y - over)));
    });

    // The fog starts where the charted work ENDS — the gap between the line and the
    // destination is the remaining work, literally — and the canvas is exactly as wide
    // as the route needs, never squashed to a frame.
    const maxX = Math.max(nowX,
      ...[...lineNodes, ...ahead].map((n) => pos[n.id].x + labW(n)));
    const fogX = maxX + 130;
    const xd = fogX + map.fog * 26 + 110, mid = H / 2;
    const W = Math.max(RAD.W, xd + 60);

    const wrap = div("con solo");
    const sky = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "sky" });
    const gBack = el("g"), gEdge = el("g"), gStar = el("g");
    sky.append(gBack, gEdge, gStar);

    if (done.length)
      Object.assign(gBack.appendChild(el("text", { class: "cap", x: 64, y: 38 })),
        { textContent: countCap(done) });
    gBack.append(el("line", { class: "nowline", x1: nowX, y1: 54, x2: nowX, y2: H - 54 }));
    Object.assign(gBack.appendChild(el("text", { class: "cap now", x: Math.max(nowX, 190),
      y: 38, "text-anchor": "middle" })),
      { textContent: lineNodes.length
        ? `frontier — ${countCap(lineNodes)}` : "frontier — nothing unblocked" });
    if (ahead.length)
      Object.assign(gBack.appendChild(el("text", { class: "cap", x: nowX + 46 + stepX,
        y: 38 })), { textContent: countCap(ahead) });

    // Only live dependency is drawn: an edge into a ticket the line has not reached —
    // including the severed story, a stranded ticket held by a ruled-out decision.
    // Waiting is the NORMAL state of the road ahead (quiet slate); red is spent only on
    // stranded. An edge LEAVES its blocker after the label block and ENTERS its
    // dependent before the dot, with flat tangents at both ends — so no line can ever
    // cross type, because the span it travels is empty by construction.
    const liveEdges = map.edges.filter(([b, d]) => isOpen(d)
      && (isOpen(b) || map.byId[d].state === "stranded"));
    liveEdges.forEach(([b, d]) => {
      const A = pos[b], B = pos[d];
      const held = map.byId[d].state === "stranded";
      const ax = A.x + labW(map.byId[b]) + 2;
      const bx = B.x - R2 - 6;
      const r = Math.max(40, (bx - ax) * 0.35);
      gEdge.append(el("path", { class: `ln${held ? " held" : ""}`, fill: "none",
        "data-a": b, "data-b": d,
        d: `M${ax} ${A.y} C${ax + r} ${A.y} ${bx - r} ${B.y} ${bx} ${B.y}` }));
      gEdge.append(el("path", { class: `ah${held ? " held" : ""}`,
        transform: `translate(${bx} ${B.y})`, d: "M0 0 L-6 3 L-6 -3 Z" }));
    });

    for (let i = 0; i < map.fog; i++)
      gBack.append(el("circle", { class: "wfog", cx: fogX + i * 26, cy: mid, r: 2.6,
        opacity: Math.max(0.12, 0.4 - i * 0.08) }));
    gBack.append(el("path", { class: "destmark", transform: `translate(${xd} ${mid})`,
      d: "M0 -9 L9 0 L0 9 L-9 0 Z" }));
    Object.assign(gBack.appendChild(el("text", { class: "cap dest", x: xd + 9, y: mid - 26,
      "text-anchor": "end" })), { textContent: "DESTINATION" });

    paintStars(gStar, map, pos, ord, on, R2, { x: -1e9 }, { row: true });
    wrap.append(sky);
    host.append(wrap);
  };

  /* ------------------------------------------------------------------------ flow */

  const CARD = { w: 168, h: 42, gapMain: 74, gapCross: 16 };

  /* Layered by dependency depth, packed on a lattice so two cards can never occupy the
     same cell — collision is impossible by construction rather than by tuning. */
  const flowPlaces = (map, depth) => {
    const linked = map.nodes.filter((n) => map.edges.some(([b, d]) => b === n.id || d === n.id));
    const loose = map.nodes.filter((n) => !linked.includes(n));
    const cols = {};
    linked.forEach((n) => (cols[depth[n.id]] ??= []).push(n));
    const strandOf = {};
    map.strands.forEach((s, i) => s.forEach((id) => (strandOf[id] = i)));
    const cell = {};
    Object.keys(cols).map(Number).sort((a, b) => a - b).forEach((c) => {
      cols[c].sort((a, b) => strandOf[a.id] - strandOf[b.id] || a.id - b.id)
        .forEach((n, r) => (cell[n.id] = { c, r }));
    });
    return { cell, loose, cols };
  };

  const flow = (host, map, on, vertical) => {
    const ord = ordinals(map);
    const depth = depthsOf(map);
    const { cell, loose } = flowPlaces(map, depth);
    const stage = div("flow");
    const board = div("board");
    const mainStep = CARD.w + CARD.gapMain;
    const crossStep = CARD.h + CARD.gapCross;
    const at = (id) => {
      const { c, r } = cell[id];
      return vertical
        ? { x: r * (CARD.w + CARD.gapCross), y: c * (CARD.h + CARD.gapMain) }
        : { x: c * mainStep, y: r * crossStep };
    };
    const linkedIds = Object.keys(cell).map(Number);
    const W = Math.max(...linkedIds.map((id) => at(id).x), 0) + CARD.w + 8;
    const H = Math.max(...linkedIds.map((id) => at(id).y), 0) + CARD.h + 8;
    board.style.width = `${W}px`;
    board.style.height = `${H}px`;

    const wires = el("svg", { class: "wires", viewBox: `0 0 ${W} ${H}`, width: W, height: H });
    map.edges.forEach(([b, d]) => {
      if (!cell[b] || !cell[d]) return;
      const A = at(b), B = at(d);
      const held = ["blocked", "stranded"].includes(map.byId[d].state);
      const a = vertical
        ? { x: A.x + CARD.w / 2, y: A.y + CARD.h }
        : { x: A.x + CARD.w, y: A.y + CARD.h / 2 };
      const z = vertical
        ? { x: B.x + CARD.w / 2, y: B.y }
        : { x: B.x, y: B.y + CARD.h / 2 };
      const mid = vertical ? (a.y + z.y) / 2 : (a.x + z.x) / 2;
      const path = vertical
        ? `M${a.x} ${a.y} L${a.x} ${mid} L${z.x} ${mid} L${z.x} ${z.y}`
        : `M${a.x} ${a.y} L${mid} ${a.y} L${mid} ${z.y} L${z.x} ${z.y}`;
      wires.append(el("path", { class: `wr${held ? " held" : ""}`, fill: "none",
        "data-a": b, "data-b": d, d: path }));
      wires.append(el("path", { class: `ah${held ? " held" : ""}`,
        transform: `translate(${z.x} ${z.y}) rotate(${vertical ? 90 : 0})`,
        d: "M0 0 L-6 3 L-6 -3 Z" }));
    });
    board.append(wires);

    const card = (n) => {
      const c = div(`card${n.sel ? " sel" : ""}`);
      c.dataset.id = n.id;
      c.dataset.s = n.state;
      c.append(div("co", ord[n.id]), div("ct", n.title));
      c.title = `${n.id} · ${n.title} — ${n.state}`;
      c.addEventListener("mouseenter", () => on(n.id));
      c.addEventListener("mouseleave", () => on(null));
      return c;
    };
    map.nodes.filter((n) => cell[n.id]).forEach((n) => {
      const c = card(n);
      const p = at(n.id);
      c.style.left = `${p.x}px`;
      c.style.top = `${p.y}px`;
      board.append(c);
    });

    stage.append(board);
    // Tickets that block nothing and wait on nothing have no place in a flow — giving
    // them a fake column 0 is what built the wall. They get their own tray, counted.
    if (loose.length) {
      const tray = div("tray");
      tray.append(div("trayhead", `waiting on nothing, blocking nothing · ${loose.length}`));
      const grid = div("traygrid");
      loose.forEach((n) => grid.append(card(n)));
      tray.append(grid);
      stage.append(tray);
    }
    host.append(stage);
  };

  /* ------------------------------------------------------------------------ shell */

  const SHAPES = {
    route: {
      name: "The Route",
      blurb: "The axis is progress. Walked road on the left — resolved decisions, stacked and quiet. The gold NOW line is where you stand: everything ON it is takeable or claimed today. Right of the line is why the map is not finished — blocked work pushed further right the more decisions must close before it can open, held by the red lines you can trace back to the exact ticket standing in the way. Then fog, then the destination. What to take next is whatever stands on the line; a finished map is one where the line has walked into the fog.",
      run: (host, map, on) => route(host, map, on),
    },
    comet: {
      name: "Comet",
      blurb: "The dandelion given an arrow of time: the map itself is the hub, pinned at the left as START; every ticket drifts right by its place in the map's chronology while the sim bends chains around each other vertically. Fog and destination close the right edge. Organic like chartr, but it points.",
      run: (host, map, on) => comet(host, map, on),
    },
    dandelion: {
      name: "Dandelion",
      blurb: "chartr's actual mechanics on wayfinder data: every ticket is a child of the map, so the map itself is drawn as the hub and membership is the wiring — a spring sim with the hub pinned, chain roots and singletons on hub springs, dependency chains hanging outward as limbs. Organic like chartr's canvas, and honest about the same thing chartr is honest about: position means adjacency and nothing else. Chronology is gone, and every spoke says the same sentence — this belongs to the map.",
      run: (host, map, on) => dandelion(host, map, on),
    },
    wheel: {
      name: "Wheel",
      blurb: "The hub star made to carry order as well as membership: angle is the map's own chronology, radius is dependency depth — a ticket sits further out the more decisions had to close before it could open. The gap in the sweep is the fog, and the destination mark closes the circle the route has not yet reached, so a finished map is a complete wheel. The trade: depth rings are honest but coarse, and a long chain reads as a radial line rather than as a journey.",
      run: (host, map, on) => wheel(host, map, on),
    },
    sectors: {
      name: "Sectors",
      blurb: "The dandelion made deterministic: every strand gets a wedge of the circle sized by its ticket count, and dependency depth walks outward from the hub — the same map always yields the same picture, and a strand is a visible slice rather than an emergent clump. Tidier than the sim, at the cost of looking designed rather than grown; singletons ring the hub as a field of takeable-or-settled dots.",
      run: (host, map, on) => sectors(host, map, on),
    },
    constellation: {
      name: "Constellation",
      blurb: "The map is a picture, the rail is the text. A ticket is a numbered star and nothing else, so the layout is free to be driven by structure instead of by type — which is exactly how chartr's canvas stays open. Hovering either side lights the other. It makes connectedness and clustering obvious; it hides everything you would read, which is the trade: you look at the map, then read the rail.",
      run: (host, map, on) => constellation(host, map, on),
    },
    spine: {
      name: "Spine and branches",
      blurb: "The spine is the route actually walked: tickets in the order the map authored them, START on the left, DESTINATION in the fog on the right. Resolved decisions sit on the line because they are the road; live work lifts off it on a stem because it is not road yet. Dependency is deliberately NOT the spine — it arcs above, so chronology and blocking stay two separate truths instead of one misleading line. It makes progress and remaining distance obvious; it hides how much of the order is causal versus merely when someone got to it.",
      run: (host, map, on) => spine(host, map, on),
    },
    flow: {
      name: "Flow",
      blurb: "A layered DAG where a card carries its own title, packed on a lattice so cards cannot collide. Column is dependency depth, so a blocker is always upstream of what it blocks and the arrows only ever run one way. Tickets that neither block nor wait are not given a fake column 0 — they drop to a counted tray, because pretending they are the start of the graph is what built the wall.",
      run: (host, map, on, dir) => flow(host, map, on, dir === "v"),
    },
  };

  const q = new URLSearchParams(location.search);
  let shape = SHAPES[q.get("shape")] ? q.get("shape") : "route";
  let mapKey = window.LAB.MAPS[q.get("map")] ? q.get("map") : "m290";
  let dir = q.get("dir") === "v" ? "v" : "h";

  const stageEl = document.getElementById("stage");
  const tabs = (host, items, get, set) => {
    items.forEach(([k, label]) => {
      const b = document.createElement("button");
      b.className = "tab";
      b.textContent = label;
      b.dataset.k = k;
      b.onclick = () => { set(k); draw(); };
      host.append(b);
    });
    return () => [...host.querySelectorAll(".tab")]
      .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === get())));
  };
  const syncS = tabs(document.getElementById("tShape"),
    Object.entries(SHAPES).map(([k, s]) => [k, s.name]), () => shape, (k) => (shape = k));
  const syncM = tabs(document.getElementById("tMap"),
    Object.entries(window.LAB.MAPS).map(([k, m]) => [k, m.label]), () => mapKey, (k) => (mapKey = k));
  const syncD = tabs(document.getElementById("tDir"),
    [["h", "left → right"], ["v", "top → down"]], () => dir, (k) => (dir = k));

  // Cross-highlight: one hovered ticket, lit in the map, the rail and its own edges.
  const highlight = (id) => {
    document.querySelectorAll("[data-id]").forEach((e) =>
      e.classList.toggle("hot", id !== null && Number(e.dataset.id) === id));
    document.querySelectorAll("[data-a]").forEach((e) =>
      e.classList.toggle("hot", id !== null
        && (Number(e.dataset.a) === id || Number(e.dataset.b) === id)));
    stageEl.classList.toggle("dim", id !== null);
  };

  function draw() {
    syncS(); syncM(); syncD();
    document.getElementById("dirwrap").hidden = shape !== "flow";
    try { history.replaceState(null, "", `?shape=${shape}&map=${mapKey}&dir=${dir}`); } catch {}
    const map = window.LAB.MAPS[mapKey].build();
    const s = SHAPES[shape];
    document.getElementById("sname").textContent = s.name;
    document.getElementById("sblurb").textContent = s.blurb;
    document.getElementById("smeta").textContent =
      `${map.title} · ${map.nodes.length} tickets · ${map.edges.length} edges · ${map.strands.length} strands`;
    stageEl.innerHTML = "";
    stageEl.className = shape;
    s.run(stageEl, map, highlight, dir);
  }
  draw();
})();

</script>
</body>
</html>
