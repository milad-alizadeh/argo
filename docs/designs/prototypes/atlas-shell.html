<!doctype html>
<!-- PROTOTYPE — throwaway. Not the map. This asks one question only: what is the SYSTEM that
     decides where each piece of Atlas information lives? Three answers, switchable at the
     bottom (?shell=a|b|c). The map underneath is a cheap stand-in with real domain names and
     real interaction, because a grey rectangle makes an information layout impossible to judge. -->
<meta charset="utf-8">
<title>Atlas · information layout</title>
<link rel="stylesheet" href="atlas-tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #06090c; }

  /* ─── shared vocabulary ───────────────────────────────────────────────────
     Every shell draws from these. If a piece looks different between shells it
     is because the shell moved it, never because it was restyled. */
  .eyebrow { font: var(--t-footnote) var(--mono); text-transform: uppercase;
             letter-spacing: .12em; color: #5c8b99; }

  .field { position: relative; }
  .field input { width: 100%; box-sizing: border-box; padding: 8px 40px 8px 30px;
    border-radius: 8px; color: var(--text-1); font: var(--t-callout) var(--sans);
    background: rgba(140,170,190,.07); border: 1px solid rgba(150,180,200,.14); }
  .field input::placeholder { color: var(--text-off); }
  .field input:focus { outline: none; border-color: rgba(127,232,255,.45);
    background: rgba(127,232,255,.07); }
  .field .mag { position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: #5c8b99; font-size: 12px; pointer-events: none; }
  .field .n { position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font: var(--t-footnote) var(--mono); color: #7fe8ff; pointer-events: none; }

  .ctl { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 9px;
         font: var(--t-footnote) var(--mono); text-transform: uppercase;
         letter-spacing: .1em; color: #7fa7b4; }
  .ctl select { width: 100%; font: var(--t-callout) var(--sans); color: var(--text-1);
    background: rgba(126,214,240,.08); border: 1px solid rgba(126,214,240,.2);
    border-radius: 6px; padding: 4px 7px; text-transform: none; letter-spacing: 0; }
  .seg { display: flex; }
  .seg button { flex: 1; padding: 4px 0; font: var(--t-callout) var(--sans);
    color: var(--text-2); background: rgba(126,214,240,.07);
    border: 1px solid rgba(126,214,240,.2); border-left-width: 0; }
  .seg button:first-child { border-left-width: 1px; border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: rgba(126,214,240,.22);
    border-color: rgba(126,214,240,.45); color: var(--text-1); }
  .chk { display: flex; align-items: center; gap: 8px; font: var(--t-callout) var(--sans);
         color: var(--text-2); cursor: pointer; }
  .chk input { accent-color: #7fe8ff; }

  /* a domain row — the one component every shell shares, and the reason none of them
     needs to rebuild its list when the selection changes */
  .drow { display: grid; grid-template-columns: 10px 1fr auto; gap: 9px; align-items: center;
    padding: 6px 9px; border-radius: 7px; cursor: pointer; }
  .drow:hover { background: rgba(126,214,240,.08); }
  .drow[aria-selected="true"] { background: rgba(127,232,255,.15);
    box-shadow: inset 0 0 0 1px rgba(127,232,255,.28); }
  .drow .sw { width: 10px; height: 10px; border-radius: 3px; }
  .drow .nm { font: var(--t-callout) var(--sans); color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .ct { font: var(--t-footnote) var(--mono); color: var(--text-3); }

  .frow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline;
    padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .frow:hover { background: rgba(126,214,240,.08); }
  .frow[aria-selected="true"] { background: rgba(127,232,255,.15); }
  .frow b { font: 400 var(--t-callout) var(--mono); color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow em { font: var(--t-footnote) var(--mono); font-style: normal; color: var(--text-3); }
  .frow i { font: var(--t-footnote) var(--sans); font-style: normal; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .note { font: var(--t-callout)/1.55 var(--sans); color: var(--text-2); }
  .toks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .toks span { font: var(--t-footnote) var(--mono); color: #7fa7b4; padding: 2px 6px;
    border-radius: 4px; background: rgba(126,214,240,.09); }
  .chip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font: var(--t-callout) var(--sans); color: var(--text-1); padding: 3px 9px 3px 7px;
    border-radius: 20px; background: rgba(126,214,240,.11);
    border: 1px solid rgba(126,214,240,.25); }
  .chip:hover { background: rgba(126,214,240,.2); }
  .chip i { width: 8px; height: 8px; border-radius: 2px; }

  table.m { width: 100%; border-collapse: collapse; }
  table.m th { text-align: left; font: var(--t-footnote) var(--mono); font-weight: 400;
    text-transform: uppercase; letter-spacing: .1em; color: #5c8b99; padding-bottom: 5px;
    border-bottom: 1px solid rgba(126,214,240,.16); }
  table.m td { padding: 4px 0; font-size: var(--t-callout); color: var(--text-2);
    border-bottom: 1px solid rgba(126,214,240,.07); }
  table.m td.v { text-align: right; font-family: var(--mono); color: var(--text-1); }

  .prov { font: var(--t-footnote)/1.6 var(--mono); color: var(--text-3); }
  .prov b { color: var(--text-2); font-weight: 400; }
  .tier { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px;
    letter-spacing: .08em; margin-right: 5px; }
  .tier.d { background: rgba(127,232,255,.16); color: #7fe8ff; }
  .tier.w { background: rgba(232,178,74,.16); color: var(--attention); }

  .legend { display: flex; gap: 3px; margin-top: 7px; }
  .legend i { flex: 1; height: 5px; border-radius: 1px; }

  /* ─── stage ─────────────────────────────────────────────────────────────── */
  #stage { position: relative; overflow: hidden; background:
    radial-gradient(120% 90% at 50% 12%, #0e1a21 0%, #060a0d 72%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ─── shell A · two rails ───────────────────────────────────────────────── */
  body[data-shell="a"] #app { height: 100%; display: grid;
    grid-template-columns: 288px 1fr 348px; }
  #left, #right { background: #0a1014; display: flex; flex-direction: column; min-height: 0; }
  #left { border-right: 1px solid rgba(126,214,240,.14); }
  #right { border-left: 1px solid rgba(126,214,240,.14); }
  .sec { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    border-bottom: 1px solid rgba(126,214,240,.1); }
  .grow { flex: 1; overflow-y: auto; min-height: 0; }

  /* the breadcrumb is shell A's whole idea: one stack, always visible, never a mystery */
  #crumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 13px 16px; border-bottom: 1px solid rgba(126,214,240,.14);
    font: var(--t-footnote) var(--mono); }
  #crumb a { color: #7fe8ff; cursor: pointer; }
  #crumb a:hover { text-decoration: underline; }
  #crumb s { color: var(--text-off); text-decoration: none; }
  #crumb .here { color: var(--text-1); }

  /* ─── shell B · dock + fixed two-region panel ───────────────────────────── */
  body[data-shell="b"] #app { height: 100%; display: grid; grid-template-columns: 1fr 356px; }
  #dock { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 60;
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: rgba(9,20,26,.86); backdrop-filter: blur(18px);
    border: 1px solid rgba(126,214,240,.22); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.65), inset 0 1px 0 rgba(150,235,255,.1); }
  #dock .grp { display: flex; align-items: center; gap: 8px; }
  #dock .grp > span { font: var(--t-footnote) var(--mono); text-transform: uppercase;
    letter-spacing: .1em; color: #7fa7b4; }
  #dock select { font: var(--t-callout) var(--sans); color: var(--text-1);
    background: rgba(126,214,240,.08); border: 1px solid rgba(126,214,240,.2);
    border-radius: 6px; padding: 4px 7px; }
  #dock .div { width: 1px; align-self: stretch; background: rgba(126,214,240,.16); }
  #dock .seg { width: 210px; }
  #dock .seg button { white-space: nowrap; padding: 4px 10px; }
  /* index on top, inspector below — both permanent, so nothing ever replaces anything */
  #split { display: grid; grid-template-rows: 1fr 46%; min-height: 0;
    background: #0a1014; border-left: 1px solid rgba(126,214,240,.14); }
  #index, #inspect { display: flex; flex-direction: column; min-height: 0; }
  #inspect { border-top: 1px solid rgba(126,214,240,.22); background: #0c1519; }

  /* ─── shell C · command surface ─────────────────────────────────────────── */
  body[data-shell="c"] #app { height: 100%; position: relative; }
  body[data-shell="c"] #stage { position: absolute; inset: 0; }
  #cmd { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 70;
    width: 540px; background: rgba(9,20,26,.9); backdrop-filter: blur(20px);
    border: 1px solid rgba(126,214,240,.25); border-radius: 12px;
    box-shadow: 0 16px 50px rgba(0,0,0,.7); overflow: hidden; }
  #cmd .top { display: flex; align-items: center; gap: 10px; padding: 10px 13px; }
  #cmd .top .mag { color: #5c8b99; }
  #cmd input { flex: 1; background: none; border: 0; outline: none; color: var(--text-1);
    font: var(--t-body) var(--sans); }
  #cmd input::placeholder { color: var(--text-off); }
  #cmd .pal { max-height: 46vh; overflow-y: auto; border-top: 1px solid rgba(126,214,240,.16);
    padding: 6px; }
  #cmd .pal h5 { font: var(--t-footnote) var(--mono); text-transform: uppercase;
    letter-spacing: .12em; color: #5c8b99; font-weight: 400; padding: 8px 9px 4px; }
  #drawer { position: absolute; left: 0; top: 0; bottom: 0; z-index: 65; width: 268px;
    background: rgba(8,15,19,.93); backdrop-filter: blur(20px);
    border-right: 1px solid rgba(126,214,240,.18);
    display: flex; flex-direction: column; transition: transform 220ms var(--ease-out); }
  #drawer.shut { transform: translateX(-268px); }
  #tab { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 64;
    writing-mode: vertical-rl; padding: 18px 7px; cursor: pointer;
    font: var(--t-footnote) var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: #7fa7b4; background: rgba(9,20,26,.85); backdrop-filter: blur(14px);
    border: 1px solid rgba(126,214,240,.2); border-left: 0; border-radius: 0 8px 8px 0; }
  /* selection is a card at the box, not a rail — the map keeps the whole window */
  #card { position: absolute; z-index: 68; width: 318px; padding: 14px 15px 15px;
    background: rgba(9,20,26,.94); backdrop-filter: blur(20px);
    border: 1px solid rgba(127,232,255,.35); border-radius: 12px;
    box-shadow: 0 18px 46px rgba(0,0,0,.72); }
  #card .x { position: absolute; right: 9px; top: 7px; color: var(--text-3); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 3px 6px; }
  #card .x:hover { color: var(--text-1); }
  #gear { position: absolute; right: 18px; top: 18px; z-index: 70; }
  #gearp { position: absolute; right: 18px; top: 58px; z-index: 70; width: 252px;
    padding: 13px 14px; display: flex; flex-direction: column; gap: 10px;
    background: rgba(9,20,26,.92); backdrop-filter: blur(20px);
    border: 1px solid rgba(126,214,240,.22); border-radius: 12px;
    box-shadow: 0 14px 40px rgba(0,0,0,.65); }
  .ghost { font: var(--t-callout) var(--sans); color: var(--text-1);
    background: rgba(9,20,26,.85); backdrop-filter: blur(14px);
    border: 1px solid rgba(126,214,240,.22); border-radius: 8px; padding: 6px 11px; }
  .ghost:hover { background: rgba(126,214,240,.18); }

  .pad { padding: 14px 16px; }
  h3.name { font: 600 var(--t-title3)/1.25 var(--sans); overflow-wrap: anywhere; }
  .idle { font: var(--t-callout)/1.55 var(--sans); color: var(--text-3); }
  .idle kbd { font: var(--t-footnote) var(--mono); color: var(--text-1);
    background: rgba(126,214,240,.09); border: 1px solid rgba(126,214,240,.2);
    border-radius: 4px; padding: 1px 5px; }

  /* ─── the switcher ──────────────────────────────────────────────────────── */
  #switch { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 200;
    display: flex; align-items: center; gap: 4px; padding: 5px;
    background: rgba(4,8,11,.9); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    box-shadow: 0 10px 34px rgba(0,0,0,.7); }
  #switch button { padding: 6px 15px; border-radius: 999px; font: var(--t-callout) var(--sans);
    color: var(--text-3); }
  #switch button:hover { color: var(--text-1); }
  #switch button[aria-pressed="true"] { background: rgba(255,255,255,.11); color: var(--text-1); }
  #switch .tag { font: var(--t-footnote) var(--mono); color: var(--text-off);
    padding: 0 10px 0 9px; text-transform: uppercase; letter-spacing: .1em; }
</style>

<div id="app"></div>
<div id="switch"></div>

<script>
/* ══ mock model ══════════════════════════════════════════════════════════════
   Real domain names and real model-written notes, from atlas-notes.json. The file
   list under each is invented; the point is the shape of the information, not its truth. */
const DOMAINS = [
  ['Reading Surface','Renders and scrolls the transcript itself — the feed table, its prose, and the minimap that mirrors it.',['minimap','table','cockpit','prose'],118],
  ['Turn Feed','Renders the live transcript as rows — calls, pictures, cursor, and ask prompts — folding raw events into readable UI state.',['ask','feed','call','agents'],104],
  ['Session Roster','Reads live process, git worktree, and transcript state from disk to maintain the roster of running Sessions.',['roster','transcript','workspace','fixtures'],96],
  ['CLI Session Driving','Spawns and drives a Session against a live CLI, covering launch, rung selection, input delivery, and the approval protocol.',['codex','mode','agent','driver'],88],
  ['Design System Contract','Defines and tests the shared visual language — palette, typography, spacing, motion — plus the primitives that render it.',['palette','room','tickets','chrome'],81],
  ['Permission Gate','Runs the socket hook channel that pauses a spawned agent on a gated tool call and relays the allow or deny decision.',['permission','companion','prompt','standing'],72],
  ['Delivery Pipeline','Derives each branch Delivery from local git and the code host, and tracks it through commits, PR, CI, review, and merge.',['delivery','derivation','assertion','stage'],68],
  ['Evidence Rendering','Renders what a tool call produced — diffs, syntax-coloured code, and decoded media — as read-only evidence.',['evidence','media','syntax','diff'],64],
  ['The Composer','Renders and drives the message-entry vessel — draft state, attachments, and the slash and at menus.',['composer','attachment','menu','files'],57],
  ['Projects and Accounts','Registers repositories and provider accounts on this machine and connects them through scope-checked bindings.',['project','registry','git','account'],54],
  ['Diagram Rendering','Reads mermaid source text, lays out flowchart, class, sequence, and gantt diagrams, and draws them at prose scale.',['mermaid','gantt','layout','state'],49],
  ['Ticket Integration','Connects Argo to external issue trackers, reading and writing tickets and rendering them in the sidebar.',['ticket','linear','next','write'],44],
  ['Plan And Status','Reads live turn signals and plan events to derive one honest running, idle, asking or stopped state.',['plan','liveness','status','pill'],38],
  ['Deck Layout','Computes and tests how the deck zones — rail, feed, minimap, evidence panel — divide the window width.',['deck','zoning','sessions','canopy'],33],
  ['Session Header & Handoff','Renders the per-Session header line and the context-handoff offer inside it, plus the resume path.',['handoff','header','context','resume'],29],
  ['Accounts And Skills','Links GitHub and Linear accounts to ports and discovers installed skills, so the panel and the CLI agree.',['connect','skill','panel','command'],24],
  ['Connection Health','Reads provider connections and refused-grant faults into one chip that stays silent when healthy.',['connection','health','checkout','fault'],18],
];
const DIRS = ['ArgoUI/Feed','ArgoEngine/Session','ArgoUI/Deck','ArgoEngine/Hub','ArgoUI/Panels','ArgoEngine/Ports'];
const TAIL = ['View','Model','Store','Row','State','Reader','Writer','Kind','Layout','Tests'];
let rnd = 20260902;
const R = () => (rnd = (rnd * 1103515 + 12345) % 2147483647) / 2147483647;

const FILES = [];
DOMAINS.forEach((d, di) => {
  for (let i = 0; i < d[3]; i++) {
    const t = d[2][(i * 7) % d[2].length];
    const name = t[0].toUpperCase() + t.slice(1) + TAIL[(i * 3) % TAIL.length] + '.swift';
    FILES.push({
      dom: di, name, path: DIRS[(di + i) % DIRS.length] + '/' + name,
      loc: 20 + Math.round(R() * 620), cx: 1 + Math.round(R() * 44),
      commits: 1 + Math.round(R() * 60), authors: 1 + Math.round(R() * 4),
      note: R() < 0.08,
    });
  }
});
FILES.forEach((f, i) => f.i = i);
const HUE = i => (196 + i * 137.508) % 360;
const COL = i => `hsl(${HUE(i).toFixed(0)} 60% 58%)`;

/* ══ state ═══════════════════════════════════════════════════════════════════ */
const url = new URLSearchParams(location.search);
const S = {
  shell: (url.get('shell') || 'a').toLowerCase(),
  area: 'loc', height: 'cx', colour: 'domain',
  mode: 'tint', noTests: false,
  q: '', sel: null,            // {kind:'domain'|'file', i}
  drawer: true, gear: false,
};
if (!'abc'.includes(S.shell)) S.shell = 'a';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let HITS = null;
let HITSET = null;
function refind() {
  const q = S.q.trim().toLowerCase();
  if (!q) { HITS = HITSET = null; return; }
  const w = q.split(/\s+/);
  HITS = FILES.filter(f => {
    const hay = (f.path + ' ' + DOMAINS[f.dom][0] + ' ' + DOMAINS[f.dom][2].join(' ')).toLowerCase();
    return w.every(t => hay.includes(t));
  });
  HITSET = new Set(HITS);
}
const domFiles = di => FILES.filter(f => f.dom === di);
const selDom = () => S.sel ? (S.sel.kind === 'domain' ? S.sel.i : FILES[S.sel.i].dom) : null;

/* ══ content pieces — written once, arranged three ways ══════════════════════ */
function Provenance() {
  return `<div class="prov"><b>argo</b> · 1,037 files · 17 domains<br>
    e83b0a1b · built 2 min ago<br><span style="display:inline-block;margin-top:5px">
    <span class="tier d">MEASURED</span>size, churn
    <span class="tier w" style="margin-left:6px">WRITTEN</span>names, notes</span></div>`;
}
function Encoding(compact) {
  const sel = (k, opts) => `<select data-set="${k}">` + opts.map(o =>
    `<option value="${o[0]}"${S[k] === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('') + `</select>`;
  const A = [['loc', 'Lines of code'], ['commits', 'Commits'], ['cx', 'Complexity']];
  const H = [['cx', 'Complexity'], ['authors', 'Authors'], ['commits', 'Commits']];
  const C = [['domain', 'Domain'], ['cx', 'Complexity'], ['authors', 'Authors']];
  if (compact) return `
    <div class="grp"><span>Area</span>${sel('area', A)}</div>
    <div class="grp"><span>Height</span>${sel('height', H)}</div>
    <div class="grp"><span>Colour</span>${sel('colour', C)}</div>`;
  return `<label class="ctl">Area${sel('area', A)}</label>
    <label class="ctl">Height${sel('height', H)}</label>
    <label class="ctl">Colour${sel('colour', C)}</label>`;
}
function Grouping() {
  const b = (v, t) => `<button data-mode="${v}" aria-pressed="${S.mode === v}">${t}</button>`;
  return `<div class="seg">${b('off', 'Folders')}${b('tint', 'Tint')}${b('group', 'Regroup')}</div>`;
}
function Filters() {
  return `<label class="chk"><input type="checkbox" data-t="noTests"${S.noTests ? ' checked' : ''}>Hide test files</label>`;
}
function Legend() {
  if (S.colour !== 'domain')
    return `<div class="eyebrow">Colour · ${S.colour === 'cx' ? 'Complexity' : 'Authors'}</div>
      <div class="legend">${[0,1,2,3,4].map(i =>
        `<i style="background:hsl(${200 - i * 42} 62% ${32 + i * 9}%)"></i>`).join('')}</div>
      <div class="prov" style="margin-top:5px">low → high</div>`;
  return `<div class="eyebrow">Colour · Domain</div>
    <div class="prov" style="margin-top:5px">One hue per domain. A file too near two of them to
    call is drawn pale.</div>`;
}
function Search(id) {
  return `<div class="field"><span class="mag">⌕</span>
    <input id="${id}" type="search" placeholder="Find a file or a domain" value="${esc(S.q)}">
    <span class="n">${HITS ? HITS.length : ''}</span></div>`;
}
function DomainList() {
  const sd = selDom();
  return DOMAINS.map((d, i) => `<div class="drow" data-dom="${i}" aria-selected="${sd === i}">
    <i class="sw" style="background:${COL(i)}"></i>
    <span class="nm">${esc(d[0])}</span><span class="ct">${d[3]}</span></div>`).join('');
}
function FileList(list, withDomain, cap = 80) {
  if (!list.length) return `<div class="pad idle">Nothing matches all of those words.</div>`;
  return list.slice(0, cap).map(f => `<div class="frow" data-file="${f.i}"
      aria-selected="${!!(S.sel && S.sel.kind === 'file' && S.sel.i === f.i)}" title="${esc(f.path)}">
      <b>${esc(f.name)}</b>${withDomain ? `<i>${esc(DOMAINS[f.dom][0])}</i>`
                                        : `<em>${f.cx}</em>`}</div>`).join('')
    + (list.length > cap ? `<div class="pad prov">…and ${list.length - cap} more</div>` : '');
}
function DomainBody(di) {
  const d = DOMAINS[di];
  return `<div class="eyebrow">Domain</div>
    <h3 class="name" style="margin-top:5px">${esc(d[0])}</h3>
    <p class="note" style="margin-top:9px">${esc(d[1])}</p>
    <div class="toks">${d[2].map(t => `<span>${esc(t)}</span>`).join('')}</div>
    <div class="prov" style="margin-top:12px">${d[3]} files · named by a model that read five of them</div>`;
}
function FileBody(fi) {
  const f = FILES[fi], d = DOMAINS[f.dom];
  return `<div class="eyebrow">File</div>
    <h3 class="name" style="margin-top:5px">${esc(f.name)}</h3>
    <div class="prov" style="margin-top:6px">${esc(f.path)}</div>
    <div style="margin-top:11px"><span class="chip" data-dom="${f.dom}">
      <i style="background:${COL(f.dom)}"></i>${esc(d[0])}</span></div>
    <table class="m" style="margin-top:14px"><tr><th>Measure</th><th style="text-align:right">Value</th></tr>
      <tr><td>Lines of code</td><td class="v">${f.loc}</td></tr>
      <tr><td>Complexity</td><td class="v">${f.cx}</td></tr>
      <tr><td>Commits</td><td class="v">${f.commits}</td></tr>
      <tr><td>Authors</td><td class="v">${f.authors}</td></tr></table>
    ${f.note ? `<p class="note" style="margin-top:13px">A model read this file: it folds raw

}
function Empty(where) {
  return `<div class="pad idle">Nothing selected. Click a box on the map, or a domain

}

/* ══ the stand-in map ════════════════════════════════════════════════════════
   A strip treemap of domains, each holding a strip treemap of its files, drawn in one

function strip(items, x, y, w, h) {
  const out = [], total = items.reduce((s, i) => s + i.v, 0) || 1;
  const k = (w * h) / total;
  let cy = y, i = 0;
  while (i < items.length && cy < y + h - .5) {
    let j = i, sum = items[i].v, best = Infinity;
    for (let m = i; m < items.length; m++) {
      const s2 = m === i ? items[i].v : sum + items[m].v;

      let a = 0;
      for (let q = i; q <= m; q++) { const iw = items[q].v * k / rh; a += Math.max(iw / rh, rh / iw); }
      a /= (m - i + 1);
      if (a <= best) { best = a; j = m; sum = s2; } else break;
    }
    const rh = Math.min(sum * k / w, y + h - cy);
    let cx = x;
    for (let m = i; m <= j; m++) {
      const ww = items[m].v * k / rh;
      out.push({ it: items[m].it, x: cx, y: cy, w: ww, h: rh });
      cx += ww;

const val = (f, k) => k === 'loc' ? f.loc : k === 'cx' ? f.cx : f.commits;
let BOXES = [], PLATES = [];
function build() {
  const pool = S.noTests ? FILES.filter(f => !/Tests\.swift$/.test(f.name)) : FILES;
  BOXES = []; PLATES = [];
  const N = 100, GAP = 1.6;
  if (S.mode === 'group') {
    const groups = DOMAINS.map((d, i) => ({
      it: i, v: pool.filter(f => f.dom === i).reduce((s, f) => s + val(f, S.area), 0) || 1 }))
      .sort((a, b) => b.v - a.v);
    for (const g of strip(groups, 0, 0, N, N)) {
      PLATES.push({ dom: g.it, x: g.x, y: g.y, w: g.w, h: g.h });
      const fs = pool.filter(f => f.dom === g.it)
        .map(f => ({ it: f, v: val(f, S.area) || 1 })).sort((a, b) => b.v - a.v);
      push(strip(fs, g.x + GAP, g.y + GAP, Math.max(1, g.w - GAP * 2), Math.max(1, g.h - GAP * 2)));
    }
  } else {
    const dirs = [...new Set(pool.map(f => f.path.split('/').slice(0, 2).join('/')))];
    const groups = dirs.map(d => ({ it: d,
      v: pool.filter(f => f.path.startsWith(d + '/')).reduce((s, f) => s + val(f, S.area), 0) || 1 }))
      .sort((a, b) => b.v - a.v);
    for (const g of strip(groups, 0, 0, N, N)) {
      PLATES.push({ dir: g.it, x: g.x, y: g.y, w: g.w, h: g.h });
      const fs = pool.filter(f => f.path.startsWith(g.it + '/'))
        .map(f => ({ it: f, v: val(f, S.area) || 1 })).sort((a, b) => b.v - a.v);
      push(strip(fs, g.x + GAP, g.y + GAP, Math.max(1, g.w - GAP * 2), Math.max(1, g.h - GAP * 2)));
    }
  }
  function push(rs) {
    for (const r of rs) if (r.w > .35 && r.h > .35)
      BOXES.push({ f: r.it, x: r.x, y: r.y, w: r.w * .88, h: r.h * .88,
                   z: 1 + (S.height === 'cx' ? r.it.cx * .32
                        : S.height === 'authors' ? r.it.authors * 2.6 : r.it.commits * .16) });
  }
  BOXES.sort((a, b) => (a.x + a.y) - (b.x + b.y));
}
let cv, ctx, W = 0, H = 0, SC = 1, OX = 0, OY = 0;
const iso = (x, y, z) => [(x - y) * 0.866, (x + y) * 0.5 - z * 0.72];
const P = (x, y, z) => { const p = iso(x, y, z); return [p[0] * SC + OX, p[1] * SC + OY]; };
function fitCamera() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const c of [[0,0,0],[100,0,0],[0,100,0],[100,100,0],[0,0,26],[100,0,26],[0,100,26],[100,100,26]]) {
    const p = iso(c[0], c[1], c[2]);
    x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
  }

  OX = W / 2 - ((x0 + x1) / 2) * SC; OY = H / 2 - ((y0 + y1) / 2) * SC;
}
function tint(f) {
  if (HITSET && !HITSET.has(f)) return ['hsl(202 8% 26%)', 'hsl(202 8% 19%)', 'hsl(202 8% 15%)'];
  const sd = selDom();
  if (sd !== null && S.mode !== 'off' && f.dom !== sd)
    return ['hsl(202 8% 28%)', 'hsl(202 8% 21%)', 'hsl(202 8% 16%)'];
  let h, s, l;
  if (S.colour === 'domain' && S.mode !== 'off') { h = HUE(f.dom); s = 58; l = 56; }
  else if (S.colour === 'cx') { const u = Math.min(1, f.cx / 40); h = 200 - u * 168; s = 62; l = 34 + u * 22; }
  else if (S.colour === 'authors') { const u = Math.min(1, (f.authors - 1) / 4); h = 200 - u * 168; s = 62; l = 34 + u * 22; }
  else { const u = Math.min(1, f.cx / 40); h = 196; s = 24 + u * 30; l = 32 + u * 26; }
  return [`hsl(${h.toFixed(0)} ${s}% ${l}%)`,
          `hsl(${h.toFixed(0)} ${s}% ${(l * .68).toFixed(0)}%)`,
          `hsl(${h.toFixed(0)} ${s}% ${(l * .5).toFixed(0)}%)`];
}
function quad(a, b, c, d, fill) {
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
  ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}
function draw() {
  if (!cv) return;

  if (!r.width) return;
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  fitCamera();
  // ground
  quad(P(0,0,0), P(100,0,0), P(100,100,0), P(0,100,0), 'rgba(120,190,220,.045)');
  for (const p of PLATES) {
    quad(P(p.x,p.y,0), P(p.x+p.w,p.y,0), P(p.x+p.w,p.y+p.h,0), P(p.x,p.y+p.h,0),
      p.dom !== undefined ? `hsl(${HUE(p.dom).toFixed(0)} 40% 20% / .55)` : 'rgba(140,200,230,.06)');
  }
  for (const b of BOXES) {
    const c = tint(b.f), x2 = b.x + b.w, y2 = b.y + b.h;
    quad(P(x2,b.y,b.z), P(x2,y2,b.z), P(x2,y2,0), P(x2,b.y,0), c[1]);
    quad(P(b.x,y2,b.z), P(x2,y2,b.z), P(x2,y2,0), P(b.x,y2,0), c[2]);
    quad(P(b.x,b.y,b.z), P(x2,b.y,b.z), P(x2,y2,b.z), P(b.x,y2,b.z), c[0]);
  }
  // plate labels, only in regroup, only where the plate can hold the word
  if (S.mode === 'group') {
    ctx.font = '600 11px ' + getComputedStyle(document.body).fontFamily;
    for (const p of PLATES) {
      const w = ctx.measureText(DOMAINS[p.dom][0]).width;
      const a = P(p.x, p.y, 0), b2 = P(p.x + p.w, p.y, 0);
      if (b2[0] - a[0] < w + 14) continue;
      ctx.fillStyle = 'rgba(6,11,16,.72)';
      ctx.fillRect(a[0] + 3, a[1] - 15, w + 10, 15);
      ctx.fillStyle = '#cfeaf5'; ctx.fillText(DOMAINS[p.dom][0], a[0] + 8, a[1] - 4);
    }
  }
  // names on a small enough result set — the search is when a box may say its own name
  if (HITS && HITS.length && HITS.length <= 30) {
    ctx.font = '600 11px ' + getComputedStyle(document.body).fontFamily;
    const put = [];
    for (const b of BOXES) {
      if (!HITSET.has(b.f)) continue;
      const p = P(b.x + b.w / 2, b.y + b.h / 2, b.z);
      const t = b.f.name, w = ctx.measureText(t).width;
      const bx = [p[0] - w / 2 - 5, p[1] - 25, w + 10, 16];
      if (put.some(q => bx[0] < q[0] + q[2] && q[0] < bx[0] + bx[2] && bx[1] < q[1] + q[3] && q[1] < bx[1] + bx[3])) continue;
      put.push(bx);
      ctx.fillStyle = 'rgba(6,11,16,.85)'; ctx.fillRect(bx[0], bx[1], bx[2], bx[3]);
      ctx.strokeStyle = 'rgba(127,232,255,.3)'; ctx.strokeRect(bx[0] + .5, bx[1] + .5, bx[2] - 1, bx[3] - 1);
      ctx.fillStyle = '#dcf6ff'; ctx.fillText(t, p[0] - w / 2, bx[1] + 12);
    }
  }
  // the selected box gets a ring, in every shell
  if (S.sel && S.sel.kind === 'file') {
    const b = BOXES.find(b => b.f.i === S.sel.i);
    if (b) {
      const x2 = b.x + b.w, y2 = b.y + b.h;
      ctx.strokeStyle = '#7fe8ff'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      const pts = [P(b.x,b.y,b.z), P(x2,b.y,b.z), P(x2,y2,b.z), P(b.x,y2,b.z)];
      ctx.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));

  c.style.left = Math.max(16, Math.min(SEL_PT[0] + 18, innerWidth - c.offsetWidth - 16)) + 'px';
  c.style.top = Math.max(78, Math.min(SEL_PT[1] - 30, innerHeight - c.offsetHeight - 70)) + 'px';
}
function pick(mx, my) {
  for (let i = BOXES.length - 1; i >= 0; i--) {

    const q = [P(b.x,b.y,b.z), P(x2,b.y,b.z), P(x2,y2,b.z), P(b.x,y2,b.z)];
    if (inQuad(mx, my, q)) return b.f.i;

}
function inQuad(px, py, q) {

  for (let i = 0; i < 4; i++) {

<script>
/* ══ shell A · two rails ═════════════════════════════════════════════════════
   The system: the LEFT rail is the question you are asking of the map — how it is drawn,
   what is in it, what you searched for. The RIGHT rail is the answer you are pointing at,
   and it is a browser with one visible stack: Atlas › Domain › File. Left never reacts to
   a selection; right never holds a control. A domain's note lives on the domain step. A
   file cites its domain as a chip and never restates it. */
function shellA() {
  const sd = selDom();
  const crumb = [];
  crumb.push(S.sel || HITS ? `<a data-go="root">Atlas</a>` : `<span class="here">Atlas</span>`);
  if (HITS) {
    crumb.push(`<s>›</s>`, S.sel ? `<a data-go="hits">${HITS.length} matches</a>`
                                 : `<span class="here">${HITS.length} matches</span>`);
  } else if (sd !== null) {
    crumb.push(`<s>›</s>`, S.sel.kind === 'file'
      ? `<a data-dom="${sd}">${esc(DOMAINS[sd][0])}</a>`
      : `<span class="here">${esc(DOMAINS[sd][0])}</span>`);
  }
  if (S.sel && S.sel.kind === 'file')
    crumb.push(`<s>›</s>`, `<span class="here">${esc(FILES[S.sel.i].name)}</span>`);

  let body;
  if (S.sel && S.sel.kind === 'file') body = `<div class="pad">${FileBody(S.sel.i)}</div>`;
  else if (S.sel && S.sel.kind === 'domain') body =
    `<div class="pad">${DomainBody(S.sel.i)}</div>
     <div class="sec" style="border-top:1px solid rgba(126,214,240,.1);border-bottom:0">
       <div class="eyebrow">Files, most complex first</div></div>
     <div style="padding:0 8px 14px">${FileList(
        domFiles(S.sel.i).sort((a, b) => b.cx - a.cx), false)}</div>`;
  else if (HITS) body = `<div class="sec" style="border-bottom:0">
       <div class="eyebrow">${HITS.length} file${HITS.length === 1 ? '' : 's'} found</div></div>
     <div style="padding:0 8px 14px">${FileList(HITS, true)}</div>`;
  else body = `<div class="sec" style="border-bottom:0"><div class="eyebrow">17 domains</div></div>
     <div style="padding:0 8px 14px">${DomainList()}</div>`;

  return `<aside id="left">
      <div class="sec">${Provenance()}</div>
      <div class="sec">${Search('q')}${Filters()}</div>
      <div class="sec"><div class="eyebrow">Encoding</div>${Encoding(false)}${Grouping()}</div>
      <div class="grow"></div>
      <div class="sec" style="border-bottom:0;border-top:1px solid rgba(126,214,240,.1)">${Legend()}</div>
    </aside>
    <div id="stage"><canvas></canvas></div>
    <aside id="right">
      <div id="crumb">${crumb.join('')}</div>
      <div class="grow">${body}</div>
    </aside>`;
}

/* ══ shell B · dock over the map, one panel in two permanent halves ══════════
   The system: controls are not information, so they leave the rail entirely and live on a
   dock over the map, where the thing they change is. The rail is then all content, split
   once and never again: the INDEX on top always shows a list (domains, or the search's
   results, or a domain's files), the INSPECTOR below always shows the one thing selected.
   Nothing replaces anything, so there is no Back and nothing to navigate. */
function shellB() {
  const sd = selDom();
  let head, list;
  if (HITS) { head = `${HITS.length} found`; list = FileList(HITS, true); }
  else if (sd !== null) { head = esc(DOMAINS[sd][0]) + ' · files';
    list = FileList(domFiles(sd).sort((a, b) => b.cx - a.cx), false); }
  else { head = '17 domains'; list = DomainList(); }

  const insp = !S.sel ? Empty('above')
    : S.sel.kind === 'file' ? `<div class="pad">${FileBody(S.sel.i)}</div>`
    : `<div class="pad">${DomainBody(S.sel.i)}</div>`;

  return `<div id="stage"><canvas></canvas>
      <div id="dock">${Encoding(true)}<div class="div"></div>

            ? ` <a data-go="root" style="color:#7fe8ff;cursor:pointer;float:right">all domains</a>` : ''}</div>

}

/* ══ shell C · command surface ═══════════════════════════════════════════════
   The system: the map gets the whole window, and every piece of information is summoned

function shellC() {
  const sd = selDom();

    const ds = DOMAINS.map((d, i) => [d, i]).filter(([d]) =>

    return (ds.length ? `<h5>Domains</h5>` + ds.map(([d, i]) =>
        `<div class="drow" data-dom="${i}"><i class="sw" style="background:${COL(i)}"></i>

      + `<h5>${HITS.length} file${HITS.length === 1 ? '' : 's'}</h5>` + FileList(HITS, true, 40);
  })() : '';

      <div class="grow" style="padding:0 8px 12px">${DomainList()}</div>
      <div class="sec" style="border-bottom:0;border-top:1px solid rgba(126,214,240,.1)">
        ${Provenance()}</div>
    </aside>
    <div id="cmd"><div class="top"><span class="mag">⌕</span>

        <span class="prov">${HITS ? HITS.length + ' hits' : '⌘K'}</span></div>
      ${pal ? `<div class="pal">${pal}</div>` : ''}</div>
    <button id="gear" class="ghost">Encoding ▾</button>
    ${S.gear ? `<div id="gearp">${Encoding(false)}${Grouping()}${Filters()}
        <div style="border-top:1px solid rgba(126,214,240,.12);padding-top:9px">${Legend()}</div>
      </div>` : ''}

}

/* ══ render and wiring ═══════════════════════════════════════════════════════ */
const app = document.getElementById('app');
function render(keepFocus) {
  document.body.dataset.shell = S.shell;
  const act = document.activeElement, focused = act && act.id === 'q';
  const at = focused ? act.selectionStart : 0;

  app.innerHTML = S.shell === 'a' ? shellA() : S.shell === 'b' ? shellB() : shellC();
  cv = app.querySelector('canvas'); ctx = cv && cv.getContext('2d');
  requestAnimationFrame(() => { draw(); placeCard(); });
  if (focused || keepFocus) {
    const q = document.getElementById('q');
    if (q) { q.focus(); try { q.setSelectionRange(at, at); } catch {} }
  }
  const sw = document.getElementById('switch');
  sw.innerHTML = `<span class="tag">Layout</span>` + [['a', 'Two rails'], ['b', 'Dock + index'],
    ['c', 'Command']].map(([k, t]) =>
    `<button data-shell="${k}" aria-pressed="${S.shell === k}">${t}</button>`).join('');

document.addEventListener('input', e => {

});

  const set = e.target.dataset.set, t = e.target.dataset.t;

document.addEventListener('click', e => {
  const t = e.target.closest('[data-shell],[data-mode],[data-dom],[data-file],[data-go],#tab,#gear');

  else if (t.id === 'gear') { S.gear = !S.gear; render(); }
  else if (t.dataset.go === 'root') { S.sel = null; S.q = ''; refind(); render(); }
  else if (t.dataset.go === 'hits') { S.sel = null; render(); }
  else if (t.dataset.dom !== undefined) { S.sel = { kind: 'domain', i: +t.dataset.dom }; render(); }
  else if (t.dataset.file !== undefined) { S.sel = { kind: 'file', i: +t.dataset.file }; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { S.sel = null; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault(); const q = document.getElementById('q'); if (q) q.focus();
  }
});
app.addEventListener('click', e => {
  if (!e.target.matches('canvas')) return;
  const r = cv.getBoundingClientRect();
  const i = pick(e.clientX - r.left, e.clientY - r.top);
  S.sel = i === null ? null : { kind: 'file', i };

addEventListener('resize', () => requestAnimationFrame(draw));
