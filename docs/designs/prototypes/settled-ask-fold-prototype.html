<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The settled ask, folded (#1207)</title>
<!--
  THROWAWAY. One question: what shape does an ANSWERED AskUserQuestion take in the feed?

  Today it takes the same vertical a waiting one does — the question in full, then every option
  it offered, one line each, with a tick beside the one taken. This draws four shapes against
  that control, at the same width, and MEASURES all of them, because "materially less vertical"
  is a number and not an opinion.

  Not production code: no tests, no abstractions, one file.

  Every colour, radius, spacing step and type role is transcribed from
  apps/macOS/Packages/ArgoUI/Sources/ArgoUI/VisualContract/ and from ArgoFeedRow.swift.
  Nothing is invented.
-->
<style>
  :root {
    /* GraphitePalette.swift — ground */
    --sunken:  #191A1D;
    --base:    #1E2024;
    --raised:  #252729;
    --overlay: #2E3136;
    --hover:      rgba(255,255,255,.045);
    --control:    rgba(255,255,255,.06);
    --selected:   rgba(255,255,255,.058);
    --marked:     rgba(255,255,255,.07);

    /* text */
    --text-1: #F2F4F6;
    --text-2: #A8AEB5;
    --text-3: #868D94;
    --text-off: #4E545A;
    --on-accent: #05070A;

    /* edges */
    --hairline: rgba(255,255,255,.08);
    --subtle:   rgba(255,255,255,.13);
    --strong:   rgba(255,255,255,.22);

    /* accent + state */
    --accent: #3E9BFF;
    --accent-bright: #6FB6FF;
    --running: #46D3A8;
    --attention: #E8B24A;
    /* ArgoPalette.state — muted(role) = .16, rim(role) = .5, wash(role) = .10 */
    --attention-muted: rgba(232,178,74,.16);
    --attention-rim:   rgba(232,178,74,.5);
    --attention-wash:  rgba(232,178,74,.10);

    /* ArgoRadius.swift, ArgoSpacing.swift */
    --r-marker: 3px; --r-control: 6px; --r-popover: 12px;
    --s-hair: 2px; --s-tight: 4px; --s-snug: 6px; --s-base: 8px;
    --s-comfortable: 12px; --s-loose: 16px; --s-section: 24px; --s-region: 32px;

    /* ArgoFeedRow.swift — inset 24, feedGap 16, markerWidth 18, markerGap 6,
       stepBeforeProse 2 (hair), askOptionGap 4 (tight), blockStep 12 (comfortable),
       askCardInset 12 (comfortable), lineHeight 20 */
    --marker-w: 18px; --marker-gap: 6px; --feed-column: 720px;
    --feed-inset: 24px; --feed-gap: 16px; --line-h: 20px;

    /* ArgoComposerVessel.swift */
    --decision-h: 27px;

    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0d0e10;
    color: var(--text-1);
    font: 13px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: var(--r-marker); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- the window: deck column, lane, readout ---------- */
  .window {
    position: fixed; inset: var(--s-loose) var(--s-loose) 92px;
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--subtle);
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    background: var(--base);
    min-width: 1040px;
    display: grid; grid-template-columns: 1fr 76px 320px;
  }
  .deck { overflow-y: auto; min-width: 0; }
  .col {
    max-width: var(--feed-column); margin: 0 auto;
    padding: var(--s-section) var(--feed-inset) 64px;
    display: flex; flex-direction: column; gap: var(--feed-gap);
  }

  /* Section captions. Scenery, not the design — deliberately not on any feed rung. */
  .cap {
    font: 600 10px/1 var(--mono); letter-spacing: .8px; text-transform: uppercase;
    color: var(--text-off); padding-left: calc(var(--marker-w) + var(--marker-gap));
  }
  .cap b { color: var(--attention); font-weight: 600; }
  .rule { height: 1px; background: var(--hairline); }

  /* Feed scenery around the ask, so a fold is judged in a column and not in a vacuum. */
  .prose { color: var(--text-1); }
  .prose.q { color: var(--text-2); }
  .call { display: flex; gap: var(--marker-gap); align-items: flex-start; color: var(--text-2); }
  .call .sym { width: var(--marker-w); text-align: right; color: var(--text-3); flex: none; }
  .call .mono { font-family: var(--mono); font-size: 12px; color: var(--text-3); }

  /* ---------- the ask card — FeedAskLine's own inset, radius and step ---------- *
   * Carried by its GROUND alone while it waits; settled, the ground goes and nothing moves. */
  .ask {
    padding: var(--s-comfortable);
    border-radius: var(--r-control);
    display: flex; flex-direction: column; gap: var(--s-comfortable); /* blockStep */
  }
  .ask.waiting { background: var(--attention-muted); }

  .askq { display: flex; flex-direction: column; gap: var(--s-hair); } /* stepBeforeProse */
  .ask.waiting .askq { gap: var(--s-comfortable); }

  .head { display: flex; gap: var(--marker-gap); align-items: flex-start; }
  .glyph {
    width: var(--marker-w); flex: none; color: var(--text-3);
    display: flex; justify-content: flex-end;
    /* Seated on the cap height of the 13pt line beside it, not on its box. */
    margin-top: 2px; font-size: 12px;
  }
  .ask.waiting .glyph { color: var(--attention); }
  .qtext { color: var(--text-1); min-width: 0; }
  /* The fold's own truncation: ONE line at the column, never wrapped to three. */
  .qtext.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* The caption a row drawn off the companion plugin carries (#1205). */
  .caption { display: flex; gap: var(--marker-gap); align-items: flex-start;
             color: var(--text-3); font-size: 11px; }
  .caption .sym { width: var(--marker-w); text-align: right; flex: none; }

  /* ---------- WAITING: the pressable options, exactly as #712 shipped them ---------- */
  .opts { display: flex; flex-direction: column; gap: var(--s-snug);
          margin-left: calc(var(--marker-w) + var(--marker-gap)); }
  .opt {
    display: flex; gap: var(--marker-gap); align-items: flex-start; width: 100%;
    text-align: left; font: inherit; color: inherit; cursor: default;
    background: var(--control);
    border: 1px solid var(--hairline); border-radius: var(--r-control);
    padding: var(--s-base) var(--s-comfortable);
  }
  .opt .n { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-3);
            flex: none; width: var(--marker-w); text-align: right; }
  .opt .l { color: var(--text-1); }
  .opt .d { color: var(--text-3); font-size: 11px; margin-top: 1px; }
  .typed { display: flex; gap: var(--s-base); align-items: center;
           margin-left: calc(var(--marker-w) + var(--marker-gap)); }
  .field { flex: 1; height: var(--decision-h); border: 1px solid var(--hairline);
           border-radius: var(--r-control); padding: 0 var(--s-comfortable);
           display: flex; align-items: center; color: var(--text-3); }
  .send { height: var(--decision-h); min-width: 80px; border-radius: var(--r-control);
          background: var(--accent); color: var(--on-accent); font: 500 12px/1 var(--sans);
          display: grid; place-items: center; }

  /* ---------- SETTLED: the reading, per variant ---------- */
  /* The list as it ships today. Every offer is a line; isQuiet is the whole of the degrade. */
  .read { display: flex; flex-direction: column; gap: var(--s-tight); } /* askOptionGap */
  .rline { display: flex; gap: var(--marker-gap); align-items: flex-start; }
  .rline .n { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-3);
              flex: none; width: var(--marker-w); text-align: right; }
  .rline .l { color: var(--text-1); min-width: 0; }
  .rline.quiet .l { color: var(--text-2); }
  .rline .tick { color: var(--text-1); margin-left: var(--s-tight); flex: none; }

  /* A — the answer under the question, on the option indent it was offered on. */
  .answer { display: flex; gap: var(--marker-gap); align-items: flex-start; }
  .answer .mk { width: var(--marker-w); text-align: right; flex: none; color: var(--text-3);
                font-size: 12px; margin-top: 2px; }
  .answer .l { color: var(--text-1); min-width: 0;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Where the answer named no offered option it is the record's own prose, not a label. */
  .answer .l.prose-answer { color: var(--text-2); }

  /* B — one line: the question and the way it went, sharing the column. */
  .oneline { display: flex; gap: var(--marker-gap); align-items: baseline; min-width: 0; }
  .oneline .qtext { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oneline .sep { color: var(--text-off); flex: none; }
  .oneline .a { color: var(--text-2); flex: 1 1 40%; min-width: 4em;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* C — answer first: the way it went is the row, the question is meta under it. */
  .cmeta { display: flex; gap: var(--marker-gap); align-items: flex-start;
           color: var(--text-3); font-size: 11px; }
  .cmeta .mk { width: var(--marker-w); flex: none; }
  .cmeta .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* D — the fold, with the full offer still reachable. */
  .disc { margin-left: auto; flex: none; background: none; border: 0; cursor: pointer;
          color: var(--text-3); font: inherit; font-size: 11px; padding: 0 var(--s-tight);
          line-height: var(--line-h); }
  .disc:hover { color: var(--text-1); }

  /* ---------- the lane (MinimapAskCard), drawn from the same fold ---------- */
  .lane { background: var(--sunken); border-left: 1px solid var(--hairline);
          border-right: 1px solid var(--hairline); padding: var(--s-section) 10px; overflow: hidden; }
  .lane h4 { font: 600 9px/1 var(--mono); letter-spacing: .6px; text-transform: uppercase;
             color: var(--text-off); margin-bottom: var(--s-comfortable); }
  .card { position: relative; margin-bottom: var(--s-comfortable); }
  .card.ruled { outline: 1px solid var(--attention); border-radius: 2px; }
  .bar { position: absolute; height: 3px; border-radius: 1px; background: var(--text-off); }
  .bar.att { background: var(--attention); }

  /* ---------- the readout: the numbers the ticket asks to be stated ---------- */
  .side { background: var(--sunken); padding: var(--s-section) var(--s-loose); overflow-y: auto; }
  .side h3 { font: 600 10px/1 var(--mono); letter-spacing: .8px; text-transform: uppercase;
             color: var(--text-off); margin-bottom: var(--s-comfortable); }
  .side p { color: var(--text-2); font-size: 12px; margin-bottom: var(--s-comfortable); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: var(--s-loose); }
  th, td { text-align: left; padding: var(--s-tight) 0; border-bottom: 1px solid var(--hairline); }
  th { color: var(--text-off); font-weight: 500; font-size: 10px; text-transform: uppercase;
       letter-spacing: .6px; }
  td { color: var(--text-2); }
  td.num { text-align: right; font-family: var(--mono); color: var(--text-1);
           font-variant-numeric: tabular-nums; }
  td.num.win { color: var(--running); }
  .note { font-size: 11px; color: var(--text-3); line-height: 1.5; }
  .note b { color: var(--text-2); font-weight: 500; }

  /* ---------- the bar. Deliberately not part of the design being judged. ---------- */
  .bar-fixed {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: var(--s-base); z-index: 20;
    background: var(--overlay); border: 1px solid var(--strong); border-radius: 999px;
    padding: 6px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  .bar-fixed button {
    background: var(--control); border: 1px solid var(--hairline); border-radius: 999px;
    color: var(--text-1); font: 500 12px/1 var(--sans); padding: 6px 10px; cursor: pointer;
  }
  .bar-fixed button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .bar-fixed .grp { display: flex; gap: 4px; align-items: center; }
  .bar-fixed .lbl { font: 600 9px/1 var(--mono); letter-spacing: .6px; text-transform: uppercase;
                    color: var(--text-off); padding-right: 2px; }
  .bar-fixed .name { font-size: 12px; color: var(--text-2); padding: 0 var(--s-snug); min-width: 15ch; }
</style>
</head>
<body>

<div class="window">
  <div class="deck"><div class="col" id="col"></div></div>
  <div class="lane"><h4>lane</h4><div id="lane"></div></div>
  <div class="side" id="side"></div>
</div>

<div class="bar-fixed">
  <span class="lbl">fold</span>
  <div class="grp" id="variants"></div>
  <span class="name" id="vname"></span>
  <span class="lbl">case</span>
  <div class="grp" id="cases"></div>
</div>

<script>
/* ------------------------------------------------------------------ *
 * The cases. Six shapes a settled ask actually arrives in — including
 * the two the code today draws badly and nobody looking at `pick` sees.
 * ------------------------------------------------------------------ */
const CASES = {
  pick: {
    name: 'one-of, answered',
    questions: [{
      text: 'Which ink should a settled ask take in the feed?',
      options: [
        { label: 'The attention ink', detail: 'the same amber it wears while it waits' },
        { label: 'The ordinary ink', detail: 'the rung every other settled row takes' },
        { label: 'Neither — drop the ground and the mark together', detail: null },
      ],
    }],
    answer: 'The ordinary ink',
  },
  long: {
    name: 'one-of, long question and five offers',
    questions: [{
      text: 'The Session has been idle for eleven minutes with an uncommitted worktree on '
          + 'worktree-ticket-1207-settled-ask-fold. What should Argo do with the branch before '
          + 'it hands the deck back?',
      options: [
        { label: 'Commit it on the ticket branch and leave the worktree in place', detail: null },
        { label: 'Stash it and report the stash on the row', detail: 'recoverable, but off the branch' },
        { label: 'Leave it exactly as it is', detail: null },
        { label: 'Open a draft pull request from what is there', detail: 'no CI runs on a draft' },
        { label: 'Ask again in ten minutes', detail: null },
      ],
    }],
    answer: 'Commit it on the ticket branch and leave the worktree in place',
  },
  two: {
    name: 'two questions, one call',
    questions: [
      {
        text: 'Which route should #1207 take?',
        options: [
          { label: 'The design route', detail: 'prototype, then design, then code' },
          { label: 'Straight to code', detail: null },
        ],
      },
      {
        text: 'Should the full offer stay reachable?',
        options: [
          { label: 'Yes, behind a disclosure', detail: null },
          { label: 'No — a settled offer is history', detail: null },
        ],
      },
    ],
    answer: 'The design route; No — a settled offer is history',
  },
  free: {
    name: 'free-form, answered',
    questions: [{ text: 'What should the branch be called?', options: [] }],
    answer: 'worktree-ticket-1207-settled-ask-fold',
  },
  none: {
    name: 'answered, but no option was named',
    questions: [{
      text: 'Which ink should a settled ask take in the feed?',
      options: [
        { label: 'The attention ink', detail: null },
        { label: 'The ordinary ink', detail: null },
        { label: 'Neither — drop the ground and the mark together', detail: null },
      ],
    }],
    answer: 'Neither of those — quieten the ground and keep the mark where it is.',
  },
  reported: {
    name: 'asked over the companion plugin (#1205)',
    questions: [{
      text: 'Which ink should a settled ask take in the feed?',
      options: [
        { label: 'The attention ink', detail: null },
        { label: 'The ordinary ink', detail: null },
      ],
    }],
    answer: 'The ordinary ink',
    caption: 'asked over the companion plugin · answer in the composer',
  },
};

const VARIANTS = {
  now:  'now — every offer, one line each',
  A:    'A — the answer under the question',
  B:    'B — one line, question and answer',
  C:    'C — the answer is the row',
  D:    'D — A, with the offer still reachable',
};

/* `FeedAsk.chosen(in:)`, transcribed: DERIVED and deliberately weak — the answer is prose, so
   the reading is that it CONTAINS the label, and where two are named the longer wins. */
function chosen(question, answer) {
  if (!answer) return null;
  const named = question.options.map(o => o.label).filter(l => answer.includes(l));
  if (!named.length) return null;
  return named.reduce((a, b) => (b.length > a.length ? b : a));
}

/* `FeedAskOffer.numbered`, transcribed: only the FIRST match is ticked. */
function offers(question, answer) {
  const taken = chosen(question, answer);
  const at = taken == null ? -1 : question.options.findIndex(o => o.label === taken);
  return question.options.map((o, i) => ({
    ordinal: i + 1, marker: (i + 1) + '.', label: o.label, detail: o.detail, isChosen: i === at,
  }));
}

/* ------------------------------------------------------------------ *
 * Drawing
 * ------------------------------------------------------------------ */
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const GLYPH = '?';   /* ArgoSymbol.asked — questionmark.bubble; the browser has no SF Symbols. */
const TICK  = '✓';   /* ArgoSymbol.chosen */

function head(text, opts) {
  const clip = opts && opts.clip;
  const h = el('div', 'head');
  h.append(el('span', 'glyph', GLYPH));
  h.append(el('div', 'qtext' + (clip ? ' clip' : ''), text));
  return h;
}

function caption(text) {
  const c = el('div', 'caption');
  c.append(el('span', 'sym', '⌥'));   /* ArgoSymbol.mcpTool */
  c.append(el('div', null, text));
  return c;
}

/* WAITING — the control the fold is measured against. Untouched by this ticket. */
function drawWaiting(kase) {
  const card = el('div', 'ask waiting');
  for (const q of kase.questions) {
    const block = el('div', 'askq');
    block.append(head(q.text));
    if (q.options.length) {
      const list = el('div', 'opts');
      for (const o of offers(q, null)) {
        const row = el('div', 'opt');
        row.append(el('span', 'n', o.marker));
        const words = el('div');
        words.append(el('div', 'l', o.label));
        if (o.detail) words.append(el('div', 'd', o.detail));
        row.append(words);
        list.append(row);
      }
      block.append(list);
    } else {
      const typed = el('div', 'typed');
      typed.append(el('div', 'field', 'Type an answer…'));
      typed.append(el('div', 'send', 'Answer'));
      block.append(typed);
    }
    card.append(block);
  }
  if (kase.caption) card.append(caption(kase.caption));
  return card;
}

/* The full numbered offer, as `FeedAskOptions` ships it. Variant `now` is this; `D` reveals it. */
function fullOffer(q, answer) {
  const list = el('div', 'read');
  const drawn = offers(q, answer);
  const any = drawn.some(o => o.isChosen);
  for (const o of drawn) {
    const row = el('div', 'rline' + (any && !o.isChosen ? ' quiet' : ''));
    row.append(el('span', 'n', o.marker));
    row.append(el('div', 'l', o.label));
    if (o.isChosen) row.append(el('span', 'tick', TICK));
    list.append(row);
  }
  return list;
}

/* What the fold says the answer to ONE question was: the chosen option's words where an option
   was named, and the record's own prose where none was — which is every free-form ask, and
   every answer that agreed with nothing on the list. Today both draw nothing at all. */
function said(q, answer) {
  const taken = chosen(q, answer);
  return { text: taken != null ? taken : (answer || ''), isLabel: taken != null };
}

function answerLine(q, answer) {
  const s = said(q, answer);
  const row = el('div', 'answer');
  row.append(el('span', 'mk', s.isLabel ? TICK : '›'));
  row.append(el('div', 'l' + (s.isLabel ? '' : ' prose-answer'), s.text));
  return row;
}

const FOLDS = {
  now(q, answer) {
    const block = el('div', 'askq');
    block.append(head(q.text));
    if (q.options.length) block.append(fullOffer(q, answer));
    return block;
  },

  A(q, answer) {
    const block = el('div', 'askq');
    block.append(head(q.text, { clip: true }));
    block.append(answerLine(q, answer));
    return block;
  },

  B(q, answer) {
    const block = el('div', 'askq');
    const line = el('div', 'oneline');
    line.append(el('span', 'glyph', GLYPH));
    line.append(el('div', 'qtext', q.text));
    line.append(el('span', 'sep', '·'));
    line.append(el('div', 'a', said(q, answer).text));
    block.append(line);
    return block;
  },

  C(q, answer) {
    const block = el('div', 'askq');
    const s = said(q, answer);
    const top = el('div', 'head');
    top.append(el('span', 'glyph', s.isLabel ? TICK : GLYPH));
    top.append(el('div', 'qtext clip', s.text));
    block.append(top);
    const meta = el('div', 'cmeta');
    meta.append(el('span', 'mk', ''));
    meta.append(el('div', 'l', 'asked: ' + q.text));
    block.append(meta);
    return block;
  },

  D(q, answer) {
    const block = el('div', 'askq');
    const h = head(q.text, { clip: true });
    block.append(h);
    /* A free-form ask offered nothing, so there is nothing to disclose — and a chevron over an
       empty list is the affordance that lies. */
    if (!q.options.length) { block.append(answerLine(q, answer)); return block; }
    const open = el('button', 'disc', '⌄');
    open.setAttribute('aria-label', 'Show what was offered');
    h.append(open);
    /* The fold's answer line is REPLACED by the offer, not joined by it: the list already ticks
       the option that was taken, and drawing both puts the same words on screen twice. */
    const folded = answerLine(q, answer);
    block.append(folded);
    let shown = null;
    open.addEventListener('click', () => {
      if (shown) {
        shown.remove(); shown = null; open.textContent = '⌄';
        block.append(folded);
      } else {
        folded.remove();
        shown = fullOffer(q, answer);
        block.append(shown);
        open.textContent = '⌃';
      }
      measure();
    });
    return block;
  },
};

function drawSettled(kase, variant) {
  const card = el('div', 'ask');
  for (const q of kase.questions) card.append(FOLDS[variant](q, kase.answer));
  if (kase.caption) card.append(caption(kase.caption));
  return card;
}

/* ------------------------------------------------------------------ *
 * The lane. `MinimapRowShape.card` draws the SAME lines the row does,
 * on the same indents — so a fold the lane does not follow is a map
 * that stops matching the column. Derived from the rendered card, not
 * from a second copy of the fold.
 * ------------------------------------------------------------------ */
const SCALE = 0.14;

function drawLane(cardEl, isRuled) {
  const box = el('div', 'card' + (isRuled ? ' ruled' : ''));
  const origin = cardEl.getBoundingClientRect();
  box.style.height = Math.max(6, origin.height * SCALE) + 'px';
  const inset = 12 * SCALE;
  const lines = cardEl.querySelectorAll(
    '.qtext, .rline .l, .answer .l, .cmeta .l, .opt .l, .caption div, .oneline .a');
  for (const line of lines) {
    const r = line.getBoundingClientRect();
    if (!r.height) continue;
    const bar = el('div', 'bar' + (isRuled ? ' att' : ''));
    bar.style.top = ((r.top - origin.top) * SCALE + inset) + 'px';
    bar.style.left = ((r.left - origin.left) * SCALE + inset) + 'px';
    bar.style.width = Math.max(3, Math.min(r.width, 420) * SCALE) + 'px';
    box.append(bar);
  }
  return box;
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
let variant = VARIANTS[params.get('variant')] ? params.get('variant') : 'A';
let kaseKey = CASES[params.get('case')] ? params.get('case') : 'pick';

let refs = {};

function render() {
  const kase = CASES[kaseKey];
  const col = document.getElementById('col');
  col.replaceChildren();

  col.append(el('div', 'prose q',
    'Fold the settled ask so history stops costing what a live question does.'));
  const call = el('div', 'call');
  call.append(el('span', 'sym', '⌁'));
  call.append(el('span', 'mono', 'Read  FeedAskOptions.swift'));
  col.append(call);

  const waitingCap = el('div', 'cap');
  waitingCap.append(document.createTextNode('waiting — '));
  waitingCap.append(el('b', null, 'untouched by this ticket'));
  col.append(waitingCap);
  const waiting = drawWaiting(kase);
  col.append(waiting);

  col.append(el('div', 'rule'));
  col.append(el('div', 'cap', 'settled — as it ships today'));
  const today = drawSettled(kase, 'now');
  col.append(today);

  col.append(el('div', 'rule'));
  col.append(el('div', 'cap', 'settled — ' + VARIANTS[variant]));
  const folded = drawSettled(kase, variant);
  col.append(folded);

  col.append(el('div', 'prose q', 'And the column carries on underneath, which is the point.'));

  refs = { waiting, today, folded, kase };
  measure();
  paintBar();
}

function measure() {
  const waiting = refs.waiting, today = refs.today, folded = refs.folded, kase = refs.kase;
  const h = n => Math.round(n.getBoundingClientRect().height);
  const w = h(waiting), t = h(today), f = h(folded);

  const lane = document.getElementById('lane');
  lane.replaceChildren();
  lane.append(drawLane(waiting, true));
  lane.append(drawLane(today, false));
  lane.append(drawLane(folded, false));

  const side = document.getElementById('side');
  side.replaceChildren();
  side.append(el('h3', null, 'the numbers'));
  side.append(el('p', null, kase.name + ' · at the '
    + Math.round(today.getBoundingClientRect().width) + 'pt column the feed actually draws.'));

  const table = el('table');
  const thead = el('tr');
  ['', 'height', 'vs waiting'].forEach(x => thead.append(el('th', null, x)));
  table.append(thead);
  const row = (label, height, cls) => {
    const tr = el('tr');
    tr.append(el('td', null, label));
    tr.append(el('td', 'num' + (cls || ''), height + 'pt'));
    tr.append(el('td', 'num' + (cls || ''), Math.round((height / w) * 100) + '%'));
    table.append(tr);
  };
  row('waiting', w);
  row('settled, today', t);
  row('settled, ' + variant, f, f < t ? ' win' : '');
  side.append(table);

  const saved = t - f;
  const note = el('div', 'note');
  note.append(el('b', null, saved >= 0 ? saved + 'pt saved' : Math.abs(saved) + 'pt added'));
  note.append(document.createTextNode(' against what ships today, and the settled row is '));
  note.append(el('b', null, Math.round((f / w) * 100) + '%'));
  note.append(document.createTextNode(' of the waiting one.'));
  note.append(el('br')); note.append(el('br'));
  note.append(document.createTextNode(NOTES[variant]));
  note.append(el('br')); note.append(el('br'));
  note.append(el('b', null, 'Case notes. '));
  note.append(document.createTextNode(CASE_NOTES[kaseKey] || '—'));
  side.append(note);
}

const NOTES = {
  now: 'The control. The question wraps in full and every offer takes a line, so a settled '
     + 'question keeps the vertical of a live one — which is the whole of #1207.',
  A: 'Two lines whatever was offered. The question truncates at the column instead of wrapping, '
   + 'and the words that were chosen sit under it on the indent they were offered on. The '
   + 'unchosen offers stop being lines and are not reachable.',
  B: 'One line. The tightest fold there is, and the one that costs the most: the question and '
   + 'the answer compete for the same column, so a long answer eats the question that earned it.',
  C: 'Two lines, inverted — the way it went is the row, and the question drops to the meta rung '
   + 'under it. Reads well in a scan of a long feed and badly beside its neighbours, which are '
   + 'all set the other way round.',
  D: 'A, plus a disclosure that restores the full numbered offer exactly as it ships today. '
   + 'Collapsed it costs what A costs. It is the only fold where nothing offered is lost.',
};

const CASE_NOTES = {
  pick: 'The ordinary shape, and the one the ticket was reported against.',
  long: 'Where the cost is worst: five offers and a question that wraps to three lines.',
  two: 'One call is one ground. Whatever the fold is, it applies per question, and the step '
     + 'between the two stays blockStep 12.',
  free: 'A free-form ask offers nothing, so today the settled row draws the question and NOTHING '
      + 'ELSE — the answer is not on screen at all. Every fold here draws it. That is a bug the '
      + 'fold fixes, not a cost it pays.',
  none: 'chosen(in:) is weak: it reads the answer for a label it CONTAINS. Where none is named, '
      + 'today every offer stays full-length and unquieted, and the answer is again nowhere. The '
      + 'folds draw the record’s own prose instead.',
  reported: 'Argo answered this call the moment it arrived, so the row is settled by definition '
          + '— which makes the fold the state this row is ALWAYS in. The caption stays.',
};

/* ------------------------------------------------------------------ *
 * The bar
 * ------------------------------------------------------------------ */
function paintBar() {
  const vs = document.getElementById('variants');
  vs.replaceChildren();
  for (const key of Object.keys(VARIANTS)) {
    const b = el('button', key === variant ? 'on' : null, key);
    b.addEventListener('click', () => go({ variant: key }));
    vs.append(b);
  }
  document.getElementById('vname').textContent = VARIANTS[variant];
  const cs = document.getElementById('cases');
  cs.replaceChildren();
  for (const key of Object.keys(CASES)) {
    const b = el('button', key === kaseKey ? 'on' : null, key);
    b.addEventListener('click', () => go({ case: key }));
    cs.append(b);
  }
}

function go(next) {
  if (next.variant) variant = next.variant;
  if (next.case) kaseKey = next.case;
  history.replaceState(null, '', '?' + new URLSearchParams({ variant, case: kaseKey }));
  render();
}

/* ←/→ cycle the fold; ↑/↓ cycle the case. A state you cannot link to is a state nobody
   re-checks, so both are in the URL either way. */
addEventListener('keydown', e => {
  const keys = Object.keys(VARIANTS), cases = Object.keys(CASES);
  const step = (list, at, by) => list[(list.indexOf(at) + by + list.length) % list.length];
  if (e.key === 'ArrowLeft')  go({ variant: step(keys, variant, -1) });
  if (e.key === 'ArrowRight') go({ variant: step(keys, variant, +1) });
  if (e.key === 'ArrowUp')    go({ case: step(cases, kaseKey, -1) });
  if (e.key === 'ArrowDown')  go({ case: step(cases, kaseKey, +1) });
});

addEventListener('resize', () => measure());
render();
</script>
</body>
</html>
