<!doctype html>
<!-- PROTOTYPE — throwaway. Four non-treemap encodings of one map. ?v=1..4 -->
<meta charset="utf-8">
<title>Argo · other shapes</title>
<link rel="stylesheet" href="atlas-tokens.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  #app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 20px 34px 10px; }
  header h1 { font: 600 var(--t-title2)/1.2 var(--sans); }
  header em { font-style: normal; font-weight: 400; font-size: var(--t-body); color: var(--text-3); }
  #stage { position: relative; overflow: hidden; }
  footer { padding: 11px 34px 13px; min-height: 58px; border-top: 1px solid var(--hairline);
           padding-right: 470px; }
  footer .name { font-weight: 600; }
  footer .said { color: var(--text-2); }
  footer .idle { color: var(--text-3); }
  footer .where { font: var(--t-footnote) var(--mono); color: var(--text-3); margin-top: 2px; }

  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
         display: flex; align-items: center; gap: 3px; padding: 5px 5px 5px 14px; z-index: 60;
         background: rgba(38,41,46,.97); backdrop-filter: blur(16px);
         border: 1px solid var(--strong); border-radius: 999px;
         box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #bar .lab { font: var(--t-footnote) var(--mono); text-transform: uppercase;
              letter-spacing: .12em; color: var(--text-3); padding-right: 9px; }
  #bar button { padding: 8px 17px; border-radius: 999px; font-size: var(--t-body); color: var(--text-2); }
  #bar button:hover { color: var(--text-1); background: var(--hover); }
  #bar button[aria-pressed="true"] { background: var(--accent); color: #0b1622; font-weight: 600; }
  #bar kbd { font: var(--t-footnote) var(--mono); color: var(--text-off); padding: 0 4px 0 6px; }

  svg { display: block; }
  svg text { fill: var(--text-2); font-family: var(--sans); }
  .hit { cursor: default; }

  /* 1 · ICICLE */
  .ic rect { stroke: var(--desktop); stroke-width: 1.5; }
  .ic .l0 { fill: #33373d; } .ic .l1 { fill: #2a2d32; } .ic .l2 { fill: #23262a; }
  .ic .hit:hover rect { fill: var(--selection-ground); stroke: var(--accent); }
  .ic .t0 { fill: var(--text-1); font-weight: 600; font-size: 12px; }
  .ic .t1 { fill: var(--text-3); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
  .ic .t2 { fill: var(--text-2); font-size: 11px; }

  /* 2 · PACKING */
  .pk .g0 { fill: none; stroke: rgba(255,255,255,.14); }
  .pk .g1 { fill: rgba(255,255,255,.022); stroke: rgba(255,255,255,.09); }
  .pk .g2 { fill: #2b2e33; stroke: rgba(255,255,255,.08); }
  .pk .hit:hover circle { fill: var(--selection-ground); stroke: var(--accent); }
  .pk .lab { font-size: 10.5px; fill: var(--text-2); pointer-events: none; }
  .pk .cap { font-size: 10px; fill: var(--text-3); text-transform: uppercase; letter-spacing: .07em;
             pointer-events: none; }
  .pk .top { font-size: 12px; font-weight: 600; fill: var(--text-1); pointer-events: none; }

  /* 3 · CITY */
  .cy .top { fill: #3a3e45; } .cy .left { fill: #24272b; } .cy .right { fill: #2e3237; }
  .cy .plot { fill: rgba(255,255,255,.028); stroke: rgba(255,255,255,.07); }
  .cy .hit:hover .top { fill: #4b7ea8; } .cy .hit:hover .left { fill: #23425c; }
  .cy .hit:hover .right { fill: #2d5878; }
  .cy .dl { font-size: 10px; fill: var(--text-3); text-transform: uppercase; letter-spacing: .07em; }

  /* 4 · SWARM */
  .sw .lane { stroke: rgba(255,255,255,.06); }
  .sw .lname { font-size: 11px; fill: var(--text-2); }
  .sw .tick { font: 10px var(--mono); fill: var(--text-off); }
  .sw circle { fill: #3d434a; stroke: rgba(255,255,255,.10); }
  .sw .hit:hover circle { fill: var(--accent); stroke: var(--accent-bright); }
  .sw .big { fill: #4a5158; }
</style>

<div id="app">
  <header id="head"></header>
  <div id="stage"></div>
  <footer id="detail"></footer>
</div>
<div id="bar"></div>

<script src="atlas-content.js"></script>
<script>
const A = window.ATLAS, $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');
const ORDER = ['ui', 'engine', 'app', 'terminal', 'observe'];
const sum = ps => ps.reduce((s, p) => s + p.size, 0);

function model() {
  return ORDER.map(id => {
    const t = A[id], byG = {};
    for (const cid of (t.inside || [])) { const c = A[cid]; if (c) (byG[c.group] = byG[c.group] || []).push(c); }
    const groups = (t.groups || []).map(g => ({
      id: t.id + '/' + g.id, name: g.name, said: g.line, where: g.path,
      parts: (byG[g.id] || []).map(c => ({
        id: c.id, name: c.name, size: c.lines, said: c.line,
        where: c.anchors && c.anchors[0] ? c.anchors[0][0] : null,
      })).sort((a, b) => b.size - a.size),
    })).sort((a, b) => sum(b.parts) - sum(a.parts));
    const size = groups.length ? groups.reduce((s, g) => s + sum(g.parts), 0) : t.lines;
    return { id, name: t.name, size, said: t.line, where: t.path,
             groups: groups.length ? groups
               : [{ id: t.id + '/only', name: 'one piece', said: t.line, where: t.path,
                    parts: [{ id: t.id, name: t.name, size: t.lines, said: t.line, where: t.path }] }] };
  });
}

function detail(it) {
  const d = $('detail');
  if (!it) { d.innerHTML = `<div class="idle">Point at any part to read what it does.</div>`; return; }
  d.innerHTML = `<div class="name">${it.name}${it.size ? ` <span style="color:var(--text-off);font-weight:400;font-family:var(--mono);font-size:var(--t-footnote)">${fmt(it.size)} ln</span>` : ''}</div>`
    + `<div class="said">${it.said || ''}</div>`
    + (it.where ? `<div class="where">${it.where}</div>` : '');
}
const el = (n, a = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
function wire(g, it) { g.classList.add('hit');
  g.addEventListener('mouseenter', () => detail(it));
  g.addEventListener('mouseleave', () => detail(null)); }
function clip(s, px, per = 6.1) { const max = Math.floor(px / per); return s.length > max ? s.slice(0, Math.max(0, max - 1)) + '…' : s; }

/* ================= 1 · ICICLE ================= */
/* Depth runs left to right, so a cell's height is its size and its name reads
   horizontally. A floor of 12px keeps the 41-line parts clickable; the floor is
   stated in the caption, because it is the one place the drawing stops being to scale. */
function icicle(host, data) {
  const W = host.clientWidth - 68, H = host.clientHeight - 14;
  const svg = el('svg', { width: W, height: H, class: 'ic' });
  svg.style.margin = '0 34px';
  const COL = [0, W * .215, W * .215 + W * .265], CW = [W * .205, W * .255, W * .515];
  const FLOOR = 12;

  /* lay the leaves out first, with a floor, then let parents span their children */
  const leaves = [];
  for (const t of data) for (const g of t.groups) for (const p of g.parts) leaves.push({ t, g, p });
  const raw = leaves.map(l => l.p.size), tot = raw.reduce((a, b) => a + b, 0);
  const free = H - leaves.length * FLOOR;
  let y = 0;
  for (const l of leaves) { l.y = y; l.h = FLOOR + (l.p.size / tot) * free; y += l.h; }

  const span = (pick) => {
    const out = new Map();
    for (const l of leaves) {
      const k = pick(l), e = out.get(k.id);
      if (e) { e.h = l.y + l.h - e.y; } else out.set(k.id, { it: k, y: l.y, h: l.h });
    }
    return [...out.values()];
  };

  for (const s of span(l => l.t)) add(COL[0], s.y, CW[0], s.h, 'l0', 't0', s.it.name, s.it, 8.2);
  for (const s of span(l => l.g)) add(COL[1], s.y, CW[1], s.h, 'l1', 't1', s.it.name, s.it, 6.4);
  for (const l of leaves)        add(COL[2], l.y, CW[2], l.h, 'l2', 't2', l.p.name, l.p, 6.1);
  host.append(svg);

  function add(x, y, w, h, rc, tc, label, it, per) {
    const g = el('g');
    g.append(el('rect', { x, y: y + 1, width: w, height: Math.max(2, h - 2), rx: 3, class: rc }));
    if (h > 13) {
      const tx = el('text', { x: x + 10, y: y + h / 2 + 4, class: tc });
      tx.textContent = clip(label, w - 20, per); g.append(tx);
    }
    wire(g, it); svg.append(g);
  }
}

/* ================= 2 · CIRCLE PACKING ================= */
function packing(host, data) {
  const S = Math.min(host.clientWidth - 68, host.clientHeight - 14);
  const svg = el('svg', { width: host.clientWidth - 68, height: host.clientHeight - 14, class: 'pk' });
  svg.style.margin = '0 34px';
  const root = d3.hierarchy({ children: data.map(t => ({ ...t, children: t.groups.map(g => ({ ...g, children: g.parts })) })) })
    .sum(d => d.children ? 0 : d.size)
    .sort((a, b) => b.value - a.value);
  d3.pack().size([S - 6, S - 6]).padding(d => d.depth === 0 ? 12 : d.depth === 1 ? 7 : 3)(root);

  const ox = (host.clientWidth - 68 - S) / 2;
  for (const n of root.descendants()) {
    if (!n.depth) continue;
    const g = el('g');
    g.append(el('circle', { cx: n.x + ox, cy: n.y + 3, r: n.r, class: 'g' + (n.depth - 1) }));
    if (n.depth === 3 && n.r > 21) {
      const tx = el('text', { x: n.x + ox, y: n.y + 6, 'text-anchor': 'middle', class: 'lab' });
      tx.textContent = clip(n.data.name, n.r * 1.85, 5.6); g.append(tx);
    }
    if (n.depth === 2 && n.r > 30) {
      const tx = el('text', { x: n.x + ox, y: n.y + 3 - n.r + 14, 'text-anchor': 'middle', class: 'cap' });
      tx.textContent = clip(n.data.name, n.r * 1.7, 6.4); g.append(tx);
    }
    if (n.depth === 1) {
      const tx = el('text', { x: n.x + ox, y: n.y + 3 - n.r - 7, 'text-anchor': 'middle', class: 'top' });
      tx.textContent = n.data.name; g.append(tx);
    }
    if (n.depth === 3) wire(g, n.data);
    svg.append(g);
  }
  host.append(svg);
}

/* ================= 3 · CITY ================= */
function city(host, data) {
  const W = host.clientWidth - 68, H = host.clientHeight - 14;
  const svg = el('svg', { width: W, height: H, class: 'cy' });
  svg.style.margin = '0 34px';

  /* The footprint is a square of side S, sized so the whole projection fits:
     the diamond is 2·S·kx wide and 2·S·ky tall, plus the tallest building. */
  const kx = .86, ky = .43, lift = Math.min(300, H * .34);
  const S = Math.min((W - 40) / (2 * kx), (H - lift - 54) / (2 * ky));
  const OX = W / 2, OY = lift + 22;
  const P = (x, y, z = 0) => [(x - y) * kx + OX, (x + y) * ky + OY - z];

  /* Footprint counts parts; height is the line count. Two variables, so a tall
     narrow tower is one big file and a wide low block is many small ones. */
  const maxLn = Math.max(...data.flatMap(t => t.groups.flatMap(g => g.parts.map(p => p.size))));
  const solids = [], floors = [], labels = [];
  const count = t => t.groups.reduce((s, g) => s + g.parts.length, 0);

  for (const { it: t, x, y, w, h } of squarify(data.map(t => ({ ...t, size: count(t) })), 0, 0, S, S)) {
    floors.push([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);
    labels.push({ name: t.name, at: P(x + w / 2, y) });
    for (const g of squarify(t.groups.map(gr => ({ ...gr, size: gr.parts.length })),
                             x + 6, y + 6, w - 12, h - 12)) {
      /* `size` is the footprint weight here, so the line count travels as `ln` */
      for (const p of squarify(g.it.parts.map(pp => ({ ...pp, size: 1, ln: pp.size })),
                               g.x + 3, g.y + 3, g.w - 6, g.h - 6)) {
        solids.push({ ...p, z: 6 + (p.it.ln / maxLn) * lift, part: p.it });
      }
    }
  }

  for (const f of floors) svg.append(poly(f.map(c => P(c[0], c[1])), 'plot'));

  /* painter's order: draw the far blocks first so near ones overlap them */
  solids.sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const { x, y, w, h, z, part } of solids) {
    const g = el('g');
    g.append(poly([P(x, y + h), P(x + w, y + h), P(x + w, y + h, z), P(x, y + h, z)], 'left'));
    g.append(poly([P(x + w, y), P(x + w, y + h), P(x + w, y + h, z), P(x + w, y, z)], 'right'));
    g.append(poly([P(x, y, z), P(x + w, y, z), P(x + w, y + h, z), P(x, y + h, z)], 'top'));
    wire(g, part); svg.append(g);
  }
  for (const l of labels) {
    const tx = el('text', { x: l.at[0], y: l.at[1] - 10, 'text-anchor': 'middle', class: 'dl' });
    tx.textContent = l.name; svg.append(tx);
  }
  host.append(svg);

  function poly(pts, cls) {
    return el('polygon', { points: pts.map(p => p.join(',')).join(' '), class: cls });
  }
}

/* ================= 4 · SWARM ================= */
function swarm(host, data) {
  const W = host.clientWidth - 68, H = host.clientHeight - 14;
  const svg = el('svg', { width: W, height: H, class: 'sw' });
  svg.style.margin = '0 34px';
  const lanes = data.flatMap(t => t.groups.map(g => ({ ...g, target: t.name })));
  const parts = lanes.flatMap(l => l.parts);
  const min = Math.min(...parts.map(p => p.size)), max = Math.max(...parts.map(p => p.size));
  const L = 268, R = W - 20, top = 26, laneH = Math.min(38, (H - top - 26) / lanes.length);
  const sx = v => L + (Math.log(v) - Math.log(min)) / (Math.log(max) - Math.log(min)) * (R - L);
  const rr = v => 4 + Math.sqrt(v / max) * 15;

  for (const v of [100, 300, 1000, 3000, 9000]) {
    if (v < min || v > max) continue;
    svg.append(el('line', { x1: sx(v), y1: top - 8, x2: sx(v), y2: top + lanes.length * laneH,
                            class: 'lane' }));
    const t = el('text', { x: sx(v), y: top - 13, 'text-anchor': 'middle', class: 'tick' });
    t.textContent = fmt(v); svg.append(t);
  }

  lanes.forEach((l, i) => {
    const cy = top + i * laneH + laneH / 2;
    const nm = el('text', { x: L - 14, y: cy + 4, 'text-anchor': 'end', class: 'lname' });
    nm.textContent = clip(l.name, 250, 6.1); svg.append(nm);
    const placed = [];
    for (const p of l.parts) {
      const r = rr(p.size); let x = sx(p.size), dy = 0;
      while (placed.some(q => Math.hypot(q.x - x, q.dy - dy) < q.r + r + 1.5) && Math.abs(dy) < laneH)
        dy = dy >= 0 ? -(dy + 3) : -dy + 3;
      placed.push({ x, dy, r });
      const g = el('g');
      g.append(el('circle', { cx: x, cy: cy + dy, r, class: p.size > max * .4 ? 'big' : '' }));
      wire(g, p); svg.append(g);
    }
  });
  host.append(svg);
}

/* shared squarify (used by City) */
function squarify(items, x, y, w, h) {
  const out = []; let rest = items.slice().sort((a, b) => b.size - a.size);
  let area = { x, y, w, h }, remaining = rest.reduce((s, i) => s + i.size, 0) || 1;
  while (rest.length) {
    const horiz = area.w >= area.h, side = horiz ? area.h : area.w;
    let row = [], rowSum = 0, best = Infinity;
    for (const it of rest) {
      const trySum = rowSum + it.size;
      const thick = (trySum / remaining) * (horiz ? area.w : area.h);
      const worst = Math.max(...[...row, it].map(o => {
        const along = (o.size / trySum) * side; return Math.max(thick / along, along / thick);
      }));
      if (worst > best && row.length) break;
      row.push(it); rowSum = trySum; best = worst;
    }
    const thick = (rowSum / remaining) * (horiz ? area.w : area.h);
    let along = horiz ? area.y : area.x;
    for (const it of row) {
      const len = (it.size / rowSum) * side;
      out.push(horiz ? { it, x: area.x, y: along, w: thick, h: len }
                     : { it, x: along, y: area.y, w: len, h: thick });
      along += len;
    }
    if (horiz) { area.x += thick; area.w -= thick; } else { area.y += thick; area.h -= thick; }
    remaining -= rowSum; rest = rest.slice(row.length);
  }
  return out;
}

/* ---------- switcher ---------- */
const VARIANTS = [
  { n: 'Icicle',  f: icicle,  head: 'Three levels, three bands',
    sub: 'depth runs left to right, height is the line count; parts under 12px are floored so they stay clickable' },
  { n: 'Packing', f: packing, head: 'Nested circles',
    sub: 'area is the line count; containment you can see without reading' },
  { n: 'City',    f: city,    head: 'A city of parts',
    sub: 'footprint groups it, height is its line count' },
  { n: 'Swarm',   f: swarm,   head: 'How the sizes are spread',
    sub: 'one dot per part on a log scale, one lane per group' },
];
let cur = Math.min(3, Math.max(0, (+new URLSearchParams(location.search).get('v') || 1) - 1));

function draw() {
  const v = VARIANTS[cur];
  $('head').innerHTML = `<h1>${v.head} <em>${v.sub}</em></h1>`;
  const st = $('stage'); st.innerHTML = '';
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;inset:0';
  st.append(host);
  v.f(host, model());
  detail(null);
  [...$('bar').querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-pressed', i === cur));
  history.replaceState(null, '', `?v=${cur + 1}`);
}

const lab = document.createElement('span');
lab.className = 'lab'; lab.textContent = 'Shape'; $('bar').append(lab);
VARIANTS.forEach((v, i) => {
  const b = document.createElement('button');
  b.textContent = v.n; b.onclick = () => { cur = i; draw(); };
  $('bar').append(b);
});
const kb = document.createElement('kbd'); kb.textContent = '1–4'; $('bar').append(kb);
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '4') { cur = +e.key - 1; draw(); }
  if (e.key === 'ArrowRight') { cur = (cur + 1) % 4; draw(); }
  if (e.key === 'ArrowLeft') { cur = (cur + 3) % 4; draw(); }
});
addEventListener('resize', draw);
draw();
</script>
