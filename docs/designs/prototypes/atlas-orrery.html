<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Project Atlas</title>
<!--
  THROWAWAY PROTOTYPE for #650 (map #643). The Project Atlas as one chart.

  ONE VIEW HOLDS ONE PART. The centre is where you are. The inner ring is what is inside it.
  Clicking a ring node zooms into it, and that node becomes the new centre. Nothing expands in
  place, so the picture never gets denser than it is now.

  SHAPES CARRY THE KIND, AND THE WORD FOR THE KIND IS NEVER PRINTED.
    circle   a part of the program
    chevron  a path through it
    diamond  a word the code spells
  A legend states that once, at the foot of the canvas.

  POSITION IS DERIVED, NEVER DRAWN. A circle's size is its line count. A diamond sits at the
  average angle of the parts that spell it. A chevron sits at the average angle of the parts it
  passes through. A ghost outside the ring is a part this one reaches, held at its own angle.

  IT BREAKS ONE SETTLED REFUSAL, ON PURPOSE. #648 refused a boxes-and-lines diagram and refused
  meaningful position. This does both, because an atlas with no chart was rejected. #650 decides
  which of the two is right.

  Every other refusal holds: no provenance, no tier chip, no graded freshness, no progress, no
  tour mode, no global next, no jump list, no per-claim expand, no third prose length, no edit
  surface, no file viewer.

  Content is atlas-content.js, generated by the atlas-write skill and checked by atlas-review.
  Colours, radii, spacing, elevation and motion come from
  apps/macOS/Packages/ArgoUI/Sources/ArgoUI/VisualContract/. Type is San Francisco only.
  A value marked INVENTED is prototype-only material the contract does not name.
-->
<style>
  :root {
    /* GraphitePalette.swift — surface */
    --sunken:  #191A1D;
    --base:    #1E2024;
    --raised:  #252729;
    --overlay: #2E3136;
    --hover:      rgba(255,255,255,.045);
    --control:    rgba(255,255,255,.06);
    --selected:   rgba(255,255,255,.058);
    --marked:     rgba(255,255,255,.07);

    --text-1: #F2F4F6;
    --text-2: #A8AEB5;
    --text-3: #929AA1;
    --text-off: #4E545A;

    --hairline: rgba(255,255,255,.08);
    --subtle:   rgba(255,255,255,.13);
    --strong:   rgba(255,255,255,.22);

    --accent: #3E9BFF;
    --accent-bright: #6FB6FF;
    --selection-ground: #203146;
    --attention: #E8B24A;

    --r-marker: 3px; --r-control: 6px; --r-popover: 12px;
    --s-tight: 4px; --s-snug: 6px; --s-base: 8px;
    --s-comfortable: 12px; --s-loose: 16px; --s-section: 24px; --s-region: 32px;
    --e-popover: 0 8px 18px rgba(0,0,0,.34);
    --m-selection: 140ms; --m-state: 180ms; --m-reveal: 220ms; --m-resettle: 280ms;
    --ease-out: cubic-bezier(.2,.7,.3,1);
    --t-title2: 17px; --t-title3: 15px; --t-body: 13px; --t-callout: 12px;
    --t-subheadline: 11px; --t-footnote: 10px;

    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

    /* INVENTED — the contract names no canvas ground. */
    --desktop: #0d0e10;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--desktop); color: var(--text-1);
    font: var(--t-body)/1.45 var(--sans);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: var(--r-marker); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  #app {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 372px;
    grid-template-rows: 46px minmax(0, 1fr);
    background: var(--base);
  }
  body.render #app { grid-template-columns: minmax(0, 1fr) 372px; }

  .bar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: var(--s-comfortable);
    padding: 0 var(--s-loose);
    border-bottom: 1px solid var(--hairline);
  }
  .brand {
    font: 600 var(--t-footnote)/1 var(--mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--text-3);
    padding-right: var(--s-comfortable); border-right: 1px solid var(--hairline);
  }
  .crumb { display: flex; align-items: center; gap: var(--s-snug); min-width: 0; }
  .crumb button { color: var(--text-2); padding: 3px 7px; border-radius: var(--r-control); }
  .crumb button:hover { background: var(--hover); color: var(--text-1); }
  .crumb b { color: var(--text-1); font-weight: 600; padding: 3px 7px; }
  .crumb i { color: var(--text-off); font-style: normal; }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: var(--s-base); }
  .ghostbtn {
    color: var(--text-2); font-size: var(--t-callout);
    padding: 4px 10px; border: 1px solid var(--subtle); border-radius: var(--r-control);
  }
  .ghostbtn:hover { background: var(--hover); color: var(--text-1); }
  .ghostbtn[disabled] { color: var(--text-off); border-color: var(--hairline); cursor: default; }

  /* ================= canvas ================= */
  #canvas { position: relative; background: var(--desktop); overflow: hidden; }
  #canvas > svg { width: 100%; height: 100%; display: block; }
  #stage { transition: transform var(--m-resettle) var(--ease-out); transform-origin: 0 0; }
  #stage.settling { opacity: 0; transition: none; }

  .ringline { fill: none; stroke: var(--hairline); }
  .spoke { stroke: var(--hairline); fill: none; }

  .edge { fill: none; stroke: var(--subtle); stroke-width: 1; }
  .edge.dim { stroke: var(--hairline); }
  .edge.lit { stroke: var(--accent); stroke-width: 1.75; }

  .node { cursor: pointer; }
  .node .glyph { fill: var(--raised); stroke: var(--strong); stroke-width: 1; }
  .node:hover .glyph { fill: var(--overlay); stroke: var(--text-3); }
  .node.sel .glyph { fill: var(--selection-ground); stroke: var(--accent); }
  .node.lit .glyph { stroke: var(--accent); }
  .node.dim { opacity: .34; }
  .node .lbl { fill: var(--text-1); font: 500 var(--t-callout)/1 var(--sans); }
  .node .sub { fill: var(--text-3); font: var(--t-footnote)/1 var(--sans); }
  .node.dim .lbl { fill: var(--text-2); }
  .node .num {
    fill: var(--accent-bright); font: 600 var(--t-footnote)/1 var(--mono);
  }
  .ghost .glyph { fill: none; stroke: var(--subtle); stroke-dasharray: 2 4; }
  .ghost .lbl { fill: var(--text-3); font-weight: 400; }

  .hub .glyph { fill: var(--raised); stroke: var(--strong); }
  .hub .nm { fill: var(--text-1); font: 600 var(--t-title3)/1 var(--sans); }
  .hub .ct { fill: var(--text-3); font: var(--t-footnote)/1 var(--sans); }

  .stalemark { fill: var(--attention); }

  .legend {
    position: absolute; left: var(--s-section); bottom: var(--s-section);
    display: flex; gap: var(--s-loose); align-items: center;
    padding: var(--s-base) var(--s-comfortable);
    background: var(--raised); border: 1px solid var(--hairline);
    border-radius: var(--r-popover); box-shadow: var(--e-popover);
    font-size: var(--t-footnote); color: var(--text-2);
  }
  .legend span { display: flex; align-items: center; gap: var(--s-snug); }
  #canvas .legend svg { width: 13px; height: 13px; flex: none; }
  .legend .mk { fill: var(--raised); stroke: var(--strong); }

  .hintbar {
    position: absolute; right: var(--s-section); bottom: var(--s-section);
    font: var(--t-footnote)/1 var(--mono); color: var(--text-off);
    letter-spacing: .04em;
  }
  body.render .legend, body.render .hintbar { display: none; }

  /* ================= reading panel ================= */
  #panel {
    background: var(--base); border-left: 1px solid var(--hairline);
    overflow-y: auto; padding: var(--s-section) var(--s-section) var(--s-region);
  }
  #panel h1 { font: 600 var(--t-title2)/1.25 var(--sans); margin-bottom: var(--s-snug); }
  #panel .line { color: var(--text-2); font-size: var(--t-body); margin-bottom: var(--s-loose); }
  #panel p { color: var(--text-1); margin-bottom: var(--s-comfortable); }
  #panel .sec {
    margin-top: var(--s-section); padding-top: var(--s-comfortable);
    border-top: 1px solid var(--hairline);
  }
  #panel .sec h2 {
    font: 600 var(--t-footnote)/1 var(--mono); letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: var(--s-comfortable);
  }
  #panel ul { list-style: none; display: flex; flex-direction: column; gap: var(--s-base); }
  #panel li { color: var(--text-2); font-size: var(--t-callout); }
  #panel li b { color: var(--text-1); font-weight: 500; }
  #panel .rowbtn {
    display: grid; grid-template-columns: 13px minmax(0, 1fr); gap: 2px var(--s-base);
    width: 100%; text-align: left;
    padding: var(--s-snug) var(--s-base); margin: 0 calc(var(--s-base) * -1);
    border-radius: var(--r-control); color: var(--text-1); font-size: var(--t-callout);
  }
  #panel .rowbtn:hover { background: var(--hover); }
  #panel .rowbtn svg { width: 11px; height: 11px; margin-top: 3px; }
  #panel .rowbtn .mk { fill: none; stroke: var(--text-3); }
  #panel .rowbtn em {
    grid-column: 2; color: var(--text-3); font-style: normal;
    font-size: var(--t-footnote); line-height: 1.45;
  }
  .lenrow { display: flex; gap: var(--s-tight); margin-bottom: var(--s-loose); }
  .lenrow button {
    font-size: var(--t-footnote); color: var(--text-3);
    padding: 3px 9px; border-radius: var(--r-control); border: 1px solid transparent;
  }
  .lenrow button.on { color: var(--text-1); background: var(--selected); border-color: var(--subtle); }
  .exit {
    display: flex; gap: var(--s-base); align-items: baseline; width: 100%; text-align: left;
    padding: var(--s-snug) var(--s-base); margin: 0 calc(var(--s-base) * -1);
    border-radius: var(--r-control);
  }
  .exit:hover { background: var(--hover); }
  .exit code { font: var(--t-footnote)/1.4 var(--mono); color: var(--accent); }
  .exit span { color: var(--text-3); font-size: var(--t-footnote); }
  .step { display: flex; gap: var(--s-comfortable); }
  .step .n {
    flex: none; width: 20px; font: 600 var(--t-footnote)/1.5 var(--mono); color: var(--text-off);
  }
  .step b { display: block; color: var(--text-1); font-weight: 500; margin-bottom: 2px; }
  .step p { color: var(--text-2); font-size: var(--t-callout); margin: 0; }
  .stale {
    display: flex; gap: var(--s-base); padding: var(--s-base) var(--s-comfortable);
    background: var(--marked); border-radius: var(--r-control);
    font-size: var(--t-footnote); color: var(--text-2); margin-bottom: var(--s-comfortable);
  }
  .stale i { color: var(--attention); font-style: normal; }

  #toast {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(8px);
    background: var(--overlay); border: 1px solid var(--subtle); border-radius: var(--r-control);
    padding: var(--s-base) var(--s-loose); font-size: var(--t-callout); color: var(--text-1);
    box-shadow: var(--e-popover); opacity: 0; pointer-events: none;
    transition: opacity var(--m-state) var(--ease-out), transform var(--m-state) var(--ease-out);
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="brand">Atlas</span>
    <div class="crumb" id="crumb"></div>
    <div class="right">
      <button class="ghostbtn" id="back">Back</button>
    </div>
  </div>
  <div id="canvas">
    <svg id="svg" viewBox="0 0 1560 1180" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="legend"></div>
    <div class="hintbar">click a circle to zoom in · Esc to go back</div>
    <div id="toast"></div>
  </div>
  <div id="panel"></div>
</div>

<script src="atlas-content.js"></script>
<script>
/* ============================================================================
   THE CONTENT. One object per node, keyed by id. Generated, never hand-edited.
   ========================================================================== */
const A = window.ATLAS;
const ids = Object.keys(A);
const kindOf = id => (A[id] || {}).kind;
const partIds = ids.filter(id => kindOf(id) === 'part');
const flowIds = ids.filter(id => kindOf(id) === 'flow');
const conceptIds = ids.filter(id => kindOf(id) === 'concept');

/* Containment is the only tree. A flow and a concept hang off the project and never nest. */
function childPartsOf(id) { return partIds.filter(k => A[k].parent === id && k !== id); }
function descendants(id, out) {
  out = out || [];
  childPartsOf(id).forEach(k => { out.push(k); descendants(k, out); });
  return out;
}
/* A flow belongs on this view when it passes through something inside it. */
function flowsHere(at) {
  const scope = new Set([at, ...descendants(at)]);
  return flowIds.filter(f => (A[f].parts || []).some(p => scope.has(p)));
}
/* A concept belongs on this view when something inside it spells the concept. */
function conceptsHere(at) {
  const scope = [at, ...descendants(at)];
  const spelled = new Set();
  scope.forEach(p => (A[p].concepts || []).forEach(c => spelled.add(c)));
  return conceptIds.filter(c => spelled.has(c));
}
function spellersOf(c) { return partIds.filter(p => (A[p].concepts || []).includes(c)); }
/* A flow and a concept name the parts they touch at the depth those parts live at. This view
   only draws its own children, so each of those parts stands here as the child that holds it. */
function onView(id, at) {
  let cur = id;
  while (cur && A[cur] && A[cur].parent && A[cur].parent !== at) cur = A[cur].parent;
  return cur && A[cur] && A[cur].parent === at ? cur : null;
}
function onViewSeq(list, at) {
  const out = [];
  (list || []).forEach(p => {
    const v = onView(p, at);
    if (v && out[out.length - 1] !== v) out.push(v);
  });
  return out;
}

/* ============================================================================
   STATE. Every state has a link, because a state nobody can link to is a state
   nobody checks again.
   ========================================================================== */
const state = { at: 'argo', sel: null, len: 'short', trail: [], render: false };

function readURL() {
  const q = new URLSearchParams(location.search);
  const at = q.get('at');
  if (at && A[at] && kindOf(at) === 'part') state.at = at;
  const sel = q.get('sel');
  if (sel && A[sel]) state.sel = sel;
  if (q.get('len') === 'long') state.len = 'long';
  state.render = q.get('render') === '1';
  if (state.render) document.body.classList.add('render');
  /* A deep link still knows where it sits, so Back works on a fresh load. */
  state.trail = containment(state.at).slice(0, -1);
}
function writeURL() {
  const q = new URLSearchParams();
  if (state.at !== 'argo') q.set('at', state.at);
  if (state.sel) q.set('sel', state.sel);
  if (state.len === 'long') q.set('len', 'long');
  if (state.render) q.set('render', '1');
  history.replaceState(null, '', q.toString() ? '?' + q : location.pathname);
}
function containment(id) {
  const path = [];
  let cur = id;
  while (cur) { path.unshift(cur); cur = A[cur] && A[cur].parent; }
  return path;
}

/* ============================================================================
   GEOMETRY. The ring holds what is inside the centre. Everything else takes its
   angle from the ring, so no position is a decision.
   ========================================================================== */
const W = 1560, H = 1180, CX = W / 2, CY = H / 2;
/* A ring of five and a ring of twenty-one cannot share a radius, so the radius follows the
   count and the labels keep their room. */
function radii() {
  const n = childPartsOf(state.at).length;
  const ring = Math.max(250, Math.min(340, 168 + n * 10));
  return { ring, outer: ring + 150, ghost: ring + 212 };
}

function sizeOf(id) {
  const n = A[id].lines || 400;
  return Math.max(17, Math.min(52, Math.sqrt(n) * 0.72));
}
function polar(angle, r) {
  return { x: CX + Math.cos(angle - Math.PI / 2) * r, y: CY + Math.sin(angle - Math.PI / 2) * r };
}

/* The ring keeps the order the content gives, which is the order that teaches. */
function layout() {
  const at = state.at;
  const kids = childPartsOf(at);
  const R = radii();
  const pos = {};
  const angle = {};

  kids.forEach((id, i) => {
    const a = (i / Math.max(1, kids.length)) * Math.PI * 2;
    angle[id] = a;
    /* Neighbours on a crowded ring stagger their labels, so a long name never lands on the
       name beside it. */
    pos[id] = { ...polar(a, R.ring), a, base: R.ring, r: sizeOf(id), ring: true,
      step: kids.length > 12 && i % 2 ? 20 : 0 };
  });

  /* A flow or a concept has no place of its own, so it takes the mean angle of the
     parts it touches. Position is a result. */
  const meanAngle = list => {
    const on = list.map(p => angle[p]).filter(a => a !== undefined);
    if (!on.length) return null;
    let sx = 0, sy = 0;
    on.forEach(a => { sx += Math.cos(a); sy += Math.sin(a); });
    return Math.atan2(sy, sx);
  };

  const outer = [];
  flowsHere(at).forEach(f => {
    const a = meanAngle(onViewSeq(A[f].parts, at));
    if (a !== null) outer.push([f, a]);
  });
  conceptsHere(at).forEach(c => {
    const a = meanAngle(onViewSeq(spellersOf(c), at));
    if (a !== null) outer.push([c, a]);
  });
  /* Two marks at the same angle would sit on top of each other, so nudge them apart. */
  outer.sort((p, q) => p[1] - q[1]);
  const MIN = Math.min(0.30, (Math.PI * 2) / Math.max(6, outer.length + 2));
  for (let i = 1; i < outer.length; i++) {
    if (outer[i][1] - outer[i - 1][1] < MIN) outer[i][1] = outer[i - 1][1] + MIN;
  }
  outer.forEach(([id, a]) => {
    pos[id] = { ...polar(a, R.outer), a, base: R.outer, r: 13, outer: true };
  });

  /* What this view reaches on the outside, held at its own angle as a ghost. */
  const ghosts = [];
  if (at !== 'argo') {
    (A[at].leaving || []).forEach(([, to], i) => {
      if (!A[to] || pos[to]) return;
      if (ghosts.some(g => g[0] === to)) return;
      ghosts.push([to, i]);
    });
    ghosts.forEach(([id], i) => {
      const a = (i + 0.5) / ghosts.length * Math.PI * 0.62 + Math.PI * 0.69;
      pos[id] = { ...polar(a, R.ghost), a, base: R.ghost, r: 15, ghost: true };
    });
  }
  return pos;
}

/* ============================================================================
   WHAT IS LIT. Selecting a flow lights its ordered path. Selecting a concept
   lights the parts that spell it. Nothing else changes.
   ========================================================================== */
function litSets() {
  const sel = state.sel;
  if (!sel || !A[sel]) return { nodes: null, order: null, edges: new Set() };
  if (kindOf(sel) === 'flow') {
    const seq = onViewSeq(A[sel].parts, state.at);
    const order = new Map();
    seq.forEach(p => { if (!order.has(p)) order.set(p, order.size + 1); });
    const edges = new Set();
    for (let i = 1; i < seq.length; i++) edges.add(seq[i - 1] + '>' + seq[i]);
    return { nodes: new Set([...seq, sel]), order, edges };
  }
  if (kindOf(sel) === 'concept') {
    const on = onViewSeq(spellersOf(sel), state.at);
    return { nodes: new Set([...on, sel]), order: null, edges: new Set() };
  }
  return { nodes: new Set([sel]), order: null, edges: new Set() };
}

/* ============================================================================
   SHAPES. The kind is told by the shape and by a legend, never by a word on the
   node and never by a hue.
   ========================================================================== */
function shapePath(kind, x, y, r) {
  if (kind === 'flow') {
    /* a chevron: it goes somewhere */
    return `M${x - r} ${y - r} L${x + r * .35} ${y} L${x - r} ${y + r} L${x - r * .3} ${y} Z`;
  }
  if (kind === 'concept') {
    return `M${x} ${y - r} L${x + r} ${y} L${x} ${y + r} L${x - r} ${y} Z`;
  }
  return null; /* a part is a circle, drawn as one */
}
function glyph(kind, x, y, r, cls) {
  const p = shapePath(kind, x, y, r);
  return p ? `<path class="glyph ${cls || ''}" d="${p}"/>`
           : `<circle class="glyph ${cls || ''}" cx="${x}" cy="${y}" r="${r}"/>`;
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function wrap(text, max, cap) {
  const words = String(text).split(' ');
  const out = [];
  let line = '';
  words.forEach(w => {
    if ((line + ' ' + w).trim().length > max && line) { out.push(line); line = w; }
    else line = (line + ' ' + w).trim();
  });
  if (line) out.push(line);
  if (out.length > cap) { out.length = cap; out[cap - 1] = out[cap - 1].replace(/.{1}$/, '…'); }
  return out;
}

function nodeMark(id, p, lit) {
  const n = A[id];
  const on = lit.nodes && lit.nodes.has(id);
  const dim = lit.nodes && !on;
  const cls = [
    'node',
    p.ghost ? 'ghost' : '',
    state.sel === id ? 'sel' : '',
    on ? 'lit' : '',
    dim && !p.ghost ? 'dim' : '',
  ].join(' ');

  /* The label sits further out along the same radius, so labels fan out with the ring instead
     of stacking on the neighbour above. */
  const out = polar(p.a, p.base + p.r + 12 + (p.step || 0));
  const right = out.x >= CX - 0.5;
  const anchor = right ? 'start' : 'end';
  const lx = out.x, cy0 = out.y;
  const lines = wrap(n.name, p.ghost ? 24 : p.outer ? 22 : 26, p.ghost ? 1 : 2);
  const inside = childPartsOf(id).length;
  const rows = lines.length + (inside && !p.ghost ? 1 : 0);
  const ly = cy0 - (rows - 1) * 6.5 + 4;
  const label = lines.map((t, i) =>
    `<text class="lbl" x="${lx}" y="${ly + i * 13}" text-anchor="${anchor}">${esc(t)}</text>`).join('');
  const sub = inside && !p.ghost
    ? `<text class="sub" x="${lx}" y="${ly + lines.length * 13}" text-anchor="${anchor}">${inside} inside</text>`
    : '';
  const num = lit.order && lit.order.has(id)
    ? `<text class="num" x="${p.x}" y="${p.y + 3.5}" text-anchor="middle">${lit.order.get(id)}</text>` : '';
  const stale = n.stale
    ? `<circle class="stalemark" cx="${p.x + p.r - 2}" cy="${p.y - p.r + 2}" r="3"/>` : '';

  return `<g class="${cls}" onclick="pick('${id}')" ondblclick="enter('${id}')">
    ${glyph(kindOf(id), p.x, p.y, p.r)}${num}${stale}${label}${sub}
  </g>`;
}

function hub() {
  const n = A[state.at];
  const inside = childPartsOf(state.at).length;
  const r = 84;
  const lines = wrap(n.name, 15, 2);
  const y0 = CY - (lines.length - 1) * 10 + 2;
  return `<g class="node hub ${state.sel === state.at ? 'sel' : ''}" onclick="pick('${state.at}')">
    <circle class="glyph" cx="${CX}" cy="${CY}" r="${r}"/>
    ${lines.map((t, i) => `<text class="nm" x="${CX}" y="${y0 + i * 19}" text-anchor="middle">${esc(t)}</text>`).join('')}
    <text class="ct" x="${CX}" y="${y0 + lines.length * 19 + 6}" text-anchor="middle">${
      inside ? inside + ' inside' : 'the bottom'}</text>
  </g>`;
}

function render() {
  const pos = layout();
  const lit = litSets();

  const ring = `<circle class="ringline" cx="${CX}" cy="${CY}" r="${radii().ring}"/>`;
  const spokes = Object.keys(pos).filter(id => pos[id].ring).map(id =>
    `<line class="spoke" x1="${CX}" y1="${CY}" x2="${pos[id].x}" y2="${pos[id].y}"/>`).join('');

  /* Edges among the children, each one carrying the words for what crosses it. */
  const among = (A[state.at].among || []).map(([a, b, cargo]) => {
    const p = pos[a], q = pos[b];
    if (!p || !q) return '';
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, t = .42;
    const d = `M${p.x} ${p.y} Q${mx + (CX - mx) * t} ${my + (CY - my) * t} ${q.x} ${q.y}`;
    const on = lit.edges.has(a + '>' + b) || lit.edges.has(b + '>' + a);
    const dim = lit.nodes && !on;
    return `<path class="edge ${on ? 'lit' : ''} ${dim ? 'dim' : ''}" d="${d}"><title>${esc(cargo || '')}</title></path>`;
  }).join('');

  /* A selected flow draws its own path, whether or not those two parts have an edge of their
     own. The path is the claim, and the numbers on the nodes are its order. */
  const chord = (a, b) => {
    const p = pos[a], q = pos[b];
    if (!p || !q) return '';
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, t = .42;
    return `M${p.x} ${p.y} Q${mx + (CX - mx) * t} ${my + (CY - my) * t} ${q.x} ${q.y}`;
  };
  const flowPath = [...lit.edges].map(e => {
    const [a, b] = e.split('>');
    const d = chord(a, b);
    return d ? `<path class="edge lit" d="${d}"/>` : '';
  }).join('');

  const ghostLines = Object.keys(pos).filter(id => pos[id].ghost).map(id =>
    `<line class="edge dim" x1="${CX}" y1="${CY}" x2="${pos[id].x}" y2="${pos[id].y}"/>`).join('');

  const marks = Object.keys(pos).map(id => nodeMark(id, pos[id], lit)).join('');

  document.getElementById('svg').innerHTML =
    `<g id="stage">${ring}${spokes}${ghostLines}${among}${flowPath}${hub()}${marks}</g>`;

  renderCrumb();
  renderLegend();
  renderPanel();
  document.getElementById('back').disabled = state.trail.length === 0 && !state.sel;
  writeURL();
}

function renderCrumb() {
  const path = containment(state.at);
  document.getElementById('crumb').innerHTML = path.map((id, i) =>
    (i ? '<i>›</i>' : '') + (i === path.length - 1
      ? `<b>${esc(A[id].name)}</b>`
      : `<button onclick="enter('${id}')">${esc(A[id].name)}</button>`)).join('');
}

function renderLegend() {
  const mark = kind => `<svg viewBox="-8 -8 16 16">${
    kind === 'part' ? '<circle class="mk" r="6"/>'
      : `<path class="mk" d="${shapePath(kind, 0, 0, 6)}"/>`}</svg>`;
  document.getElementById('legend').innerHTML =
    `<span>${mark('part')}a part of the program</span>
     <span>${mark('flow')}a path through it</span>
     <span>${mark('concept')}a word the code spells</span>`;
}

/* ============================================================================
   THE READING. One page shape at every depth: what is inside it, the edges among
   those things, the edges that leave it, and a paragraph over all of that.
   ========================================================================== */
function renderPanel() {
  const id = state.sel || state.at;
  const n = A[id];
  const prose = (state.len === 'long' && n.long ? n.long : n.short) || [];
  const secs = [];

  if (n.stale) {
    secs.push(`<div class="stale"><i>●</i><span>${esc(n.stale.what)}${
      n.stale.reason ? ' ' + esc(n.stale.reason) : ''}</span></div>`);
  }

  const kids = childPartsOf(id);
  if (kids.length) {
    secs.push(section('What is inside', kids.map(k => row(k, A[k].line)).join('')));
  }
  if ((n.among || []).length) {
    secs.push(section('How those reach each other', `<ul>${(n.among || []).map(([a, b, c]) =>
      `<li><b>${esc(name(a))}</b> → <b>${esc(name(b))}</b> · ${esc(c)}</li>`).join('')}</ul>`));
  }
  if ((n.leaving || []).length) {
    secs.push(section('What leaves it', `<ul>${(n.leaving || []).map(([a, b, c]) =>
      `<li><b>${esc(name(a))}</b> → <b>${esc(name(b))}</b> · ${esc(c)}</li>`).join('')}</ul>`));
  }
  if ((n.steps || []).length) {
    secs.push(section('Every step', (n.steps || []).map(([t, p, anchor], i) =>
      `<div class="step"><span class="n">${i + 1}</span><div><b>${esc(t)}</b><p>${esc(p)}</p>${
        anchor ? exitRow(anchor[0], anchor[1], '') : ''}</div></div>`).join('')));
  }
  if ((n.concepts || []).length) {
    secs.push(section('Words it spells', (n.concepts || []).map(c => row(c, A[c] ? A[c].line : '')).join('')));
  }
  const ev = n.anchors || n.evidence;
  if ((ev || []).length) {
    secs.push(section(n.evidence ? 'Where the meaning holds' : 'Read it yourself',
      (ev || []).map(([p, l, w]) => exitRow(p, l, w)).join('')
      + `<li style="margin-top:10px">Argo opens the file in your editor. It never shows the file.</li>`));
  }
  if (n.noneFound) secs.push(section('Evidence', `<ul><li>${esc(n.noneFound)}</li></ul>`));

  document.getElementById('panel').innerHTML =
    `<h1>${esc(n.name)}</h1>
     <div class="line">${esc(n.line)}</div>
     ${n.long ? `<div class="lenrow">
        <button class="${state.len === 'short' ? 'on' : ''}" onclick="setLen('short')">Short</button>
        <button class="${state.len === 'long' ? 'on' : ''}" onclick="setLen('long')">Long</button>
      </div>` : ''}
     ${prose.map(p => `<p>${esc(p)}</p>`).join('')}
     ${secs.join('')}`;
}
function name(id) { return A[id] ? A[id].name : id; }
function section(title, body) { return `<div class="sec"><h2>${esc(title)}</h2>${body}</div>`; }
function row(id, line) {
  const k = kindOf(id);
  const mk = k === 'part'
    ? '<circle class="mk" r="5"/>'
    : `<path class="mk" d="${shapePath(k, 0, 0, 5)}"/>`;
  return `<button class="rowbtn" onclick="pick('${id}')" ondblclick="enter('${id}')">
    <svg viewBox="-7 -7 14 14">${mk}</svg><b>${esc(name(id))}</b><em>${esc(line || '')}</em></button>`;
}
function exitRow(path, line, what) {
  return `<button class="exit" onclick="exitTo('${esc(path)}', ${line})">
    <code>${esc(path.split('/').slice(-2).join('/'))}:${line}</code><span>${esc(what || '')}</span></button>`;
}

/* ============================================================================
   MOVEMENT. Selecting reads. Entering zooms. Nothing ever expands in place.
   ========================================================================== */
function pick(id) {
  if (!A[id]) return;
  /* Clicking the part you are already reading is the way in. */
  if (state.sel === id && childPartsOf(id).length && id !== state.at) return enter(id);
  state.sel = (state.sel === id) ? null : id;
  render();
}

function enter(id) {
  if (!A[id] || kindOf(id) !== 'part') return;
  if (id === state.at) return;
  if (!childPartsOf(id).length) { state.sel = id; return render(); }

  const going = containment(id).length > containment(state.at).length;
  const pos = layout()[id];
  state.trail = containment(id).slice(0, -1);
  state.at = id;
  state.sel = null;

  const stage = document.getElementById('stage');
  if (!stage || !pos) return render();
  /* The zoom is the move: the node you chose grows to fill the centre. */
  const k = going ? 2.6 : 0.42;
  stage.style.transform = `translate(${CX - pos.x * k}px, ${CY - pos.y * k}px) scale(${k})`;
  stage.style.opacity = '0';
  setTimeout(() => { render(); flashIn(); }, 250);
}

function flashIn() {
  const stage = document.getElementById('stage');
  if (!stage) return;
  stage.classList.add('settling');
  requestAnimationFrame(() => {
    stage.classList.remove('settling');
    stage.style.transition = 'opacity var(--m-reveal) var(--ease-out)';
    stage.style.opacity = '1';
  });
}

function back() {
  if (state.sel) { state.sel = null; return render(); }
  const parent = A[state.at] && A[state.at].parent;
  if (parent) enter(parent);
}
function setLen(v) { state.len = v; render(); }

let toastTimer = null;
function exitTo(path, line) {
  const t = document.getElementById('toast');
  t.textContent = `Argo opens ${path}:${line} in your editor. It never shows the file.`;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { back(); e.preventDefault(); }
});

readURL();
render();
</script>
</body>
</html>
