<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas · aspects and scales</title>
<link rel="stylesheet" href="atlas-tokens.css">
<style>
  /* ---- shell ------------------------------------------------------------ */
  body { overflow: hidden; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  header.bar {
    display: flex; align-items: stretch; gap: var(--s-section);
    padding: 0 var(--s-section); background: var(--base);
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; flex-direction: column; justify-content: center; padding: 10px 0; min-width: 150px; }
  .brand b { font-size: var(--t-title3); font-weight: 590; letter-spacing: -.01em; }
  .brand span { font-size: var(--t-footnote); color: var(--text-3); }

  nav.aspects { display: flex; align-items: stretch; }
  nav.aspects button {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 9px var(--s-comfortable); text-align: left; min-width: 128px;
    border-radius: var(--r-control); margin: var(--s-snug) 2px;
    transition: background var(--m-selection) var(--ease-out);
  }
  nav.aspects button:hover { background: var(--hover); }
  nav.aspects button[aria-current="true"] { background: var(--selected); }
  nav.aspects b { font-size: var(--t-callout); font-weight: 590; color: var(--text-2); }
  nav.aspects button[aria-current="true"] b { color: var(--text-1); }
  nav.aspects span { font-size: var(--t-footnote); color: var(--text-off); }
  nav.aspects button[aria-current="true"] span { color: var(--text-3); }

  .scale { display: flex; align-items: center; gap: var(--s-comfortable); margin-left: auto; }
  .scale-label { font-size: var(--t-footnote); color: var(--text-off); text-transform: uppercase; letter-spacing: .08em; }
  .rungs { display: flex; gap: 2px; padding: 3px; background: var(--sunken); border-radius: var(--r-control); }
  .rungs button {
    padding: 5px 11px; border-radius: var(--r-marker); font-size: var(--t-callout); color: var(--text-3);
    transition: background var(--m-selection) var(--ease-out), color var(--m-selection) var(--ease-out);
  }
  .rungs button:hover { color: var(--text-2); }
  .rungs button[aria-current="true"] { background: var(--marked); color: var(--text-1); }
  .rungs button b { font-weight: 590; }
  .rungs button i { font-style: normal; color: var(--text-off); margin-right: 6px; font-family: var(--mono); font-size: var(--t-footnote); }
  .rungs button[aria-current="true"] i { color: var(--text-3); }

  /* ---- body ------------------------------------------------------------- */
  main { display: grid; grid-template-columns: 1fr auto; min-height: 0; position: relative; }
  #fold { position: absolute; bottom: 10px; transform: translateX(-50%); pointer-events: none; z-index: 5;
          font-size: var(--t-footnote); color: var(--text-3); background: var(--overlay);
          border: 1px solid var(--hairline); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  #fold[hidden] { display: none; }
  #stage { overflow: auto; position: relative; }
  #stage .inner { padding: var(--s-section) var(--s-region) var(--s-region); display: inline-block; min-width: 100%; }
  .rung-title { margin-bottom: var(--s-loose); max-width: 780px; }
  .rung-title h1 { font-size: var(--t-title2); font-weight: 590; letter-spacing: -.015em; }
  .rung-title p { font-size: var(--t-body); color: var(--text-2); margin-top: 3px; }
  .rung-title p em { font-style: normal; color: var(--text-3); }

  aside#panel {
    width: 372px; border-left: 1px solid var(--hairline); background: var(--base);
    overflow: auto; padding: var(--s-section);
  }
  aside#panel[hidden] { display: none; }
  .p-kind { font-size: var(--t-footnote); font-family: var(--mono); color: var(--text-off); text-transform: uppercase; letter-spacing: .07em; }
  .p-name { font-size: var(--t-title3); font-weight: 590; margin: 4px 0 6px; letter-spacing: -.01em; }
  .p-line { font-size: var(--t-callout); color: var(--text-2); }
  .p-sec { margin-top: var(--s-section); }
  .p-sec h3 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em; color: var(--text-off); margin-bottom: var(--s-base); }
  .p-sec p { font-size: var(--t-callout); color: var(--text-2); margin-bottom: var(--s-base); }
  .p-sec p:last-child { margin-bottom: 0; }
  .anchor { font-family: var(--mono); font-size: var(--t-footnote); color: var(--text-3); word-break: break-all; margin-bottom: 2px; }
  .anchor b { color: var(--text-2); font-weight: 400; }
  .anchor + .what { font-size: var(--t-footnote); color: var(--text-off); margin-bottom: var(--s-base); }
  .edge-item { display: flex; gap: var(--s-base); font-size: var(--t-footnote); color: var(--text-3); margin-bottom: 5px; align-items: baseline; }
  .edge-item .to { color: var(--text-2); white-space: nowrap; }
  .p-close { position: sticky; top: 0; float: right; font-size: var(--t-callout); color: var(--text-3); padding: 2px 6px; border-radius: var(--r-marker); }
  .p-close:hover { background: var(--hover); color: var(--text-1); }
  a.xlink { color: var(--accent); text-decoration: none; cursor: pointer; }
  a.xlink:hover { color: var(--accent-bright); text-decoration: underline; }

  /* ---- legend ----------------------------------------------------------- */
  footer.legend {
    display: flex; gap: var(--s-section); align-items: flex-start; flex-wrap: wrap;
    padding: var(--s-comfortable) var(--s-region); background: var(--base);
    border-top: 1px solid var(--hairline); font-size: var(--t-footnote); color: var(--text-3);
  }
  .leg-group { display: flex; gap: var(--s-loose); align-items: flex-start; }
  .leg-group > h4 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em; color: var(--text-off); padding-top: 2px; min-width: 58px; }
  .leg-item { display: flex; gap: 7px; align-items: center; max-width: 260px; }
  .leg-item span { color: var(--text-3); }
  .leg-note { color: var(--text-off); max-width: 420px; line-height: 1.5; }

  /* ---- svg -------------------------------------------------------------- */
  svg.fig { display: block; }
  svg.fig text { fill: var(--text-1); }
  .t-name { font: 590 13px var(--sans); fill: var(--text-1); }
  .t-name-sm { font: 590 12px var(--sans); fill: var(--text-1); }
  .t-line { font: 400 11px var(--sans); fill: var(--text-2); }
  .t-edge { font: 400 11px var(--sans); fill: var(--text-2); }
  .t-meta { font: 400 10px var(--mono); fill: var(--text-off); }
  .t-cap  { font: 590 10px var(--sans); fill: var(--text-off); letter-spacing: .07em; }
  .t-prose{ font: 400 11px var(--sans); fill: var(--text-3); }
  .t-num  { font: 590 9px var(--mono); fill: var(--text-3); }

  .box  { fill: var(--raised); stroke: var(--subtle); stroke-width: 1; }
  .box.sys { fill: var(--overlay); stroke: var(--strong); }
  .box.ext { fill: none; stroke: var(--subtle); stroke-dasharray: 3 3; }
  .box.grp { fill: rgba(255,255,255,.022); stroke: var(--hairline); }
  .box.cmp { fill: var(--overlay); stroke: none; }
  .box.band{ fill: var(--sunken); stroke: var(--hairline); }
  .box.ghost { fill: none; stroke: var(--hairline); stroke-dasharray: 2 4; }
  .box.over { fill: none; stroke: var(--subtle); stroke-dasharray: 3 3; }
  .box.sel { fill: var(--selection-ground); stroke: var(--subtle); }
  .box.cmp.sel { fill: var(--selection-ground); }
  .hit { fill: transparent; cursor: pointer; }

  .edge { stroke: var(--strong); stroke-width: 1.25; fill: none; }
  .edge.call { stroke-dasharray: 6 4; }
  .edge.dim  { stroke: var(--subtle); }
  .edge.lit  { stroke: var(--accent); stroke-width: 1.75; }
  .edge.forbidden { stroke: var(--text-off); }
  .strike { stroke: var(--text-1); stroke-width: 1.5; }
  .strike.lit { stroke: var(--accent-bright); }
  .rule-hair { stroke: var(--hairline); stroke-width: 1; stroke-dasharray: 2 3; }
  .life { stroke: var(--subtle); stroke-width: 1; stroke-dasharray: 2 5; }
  .frame { fill: none; stroke: var(--subtle); stroke-width: 1; }
  .frame-tab { fill: var(--overlay); }
  .lbl-plate { fill: var(--base); }
  .lbl-mask { fill: var(--desktop); }

  /* ---- glossary / table ------------------------------------------------- */
  .glossary { display: grid; grid-template-columns: repeat(3, minmax(0, 470px)); gap: var(--s-loose); align-items: start; }
  .gl-card { background: var(--raised); border: 1px solid var(--hairline); border-radius: var(--r-popover); padding: var(--s-loose); cursor: pointer;
             transition: background var(--m-selection) var(--ease-out); }
  .gl-card:hover { background: var(--overlay); }
  .gl-card[data-sel="true"] { background: var(--selection-ground); border-color: var(--subtle); }
  .gl-term { font-size: var(--t-title3); font-weight: 590; letter-spacing: -.01em; }
  .gl-line { font-size: var(--t-callout); color: var(--text-2); margin-top: 5px; }
  .gl-body { margin-top: var(--s-comfortable); }
  .gl-body p { font-size: var(--t-callout); color: var(--text-3); margin-bottom: var(--s-base); }
  .gl-refs { margin-top: var(--s-comfortable); display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .chip { font-size: var(--t-footnote); font-family: var(--mono); color: var(--text-3);
          border: 1px solid var(--hairline); border-radius: var(--r-marker); padding: 2px 6px; }
  .chip.link { color: var(--accent); cursor: pointer; }
  .chip.link:hover { color: var(--accent-bright); border-color: var(--accent); }
  .gl-ev { margin-top: var(--s-comfortable); border-top: 1px solid var(--hairline); padding-top: var(--s-comfortable); }

  table.rules { border-collapse: collapse; width: 100%; max-width: 900px; }
  table.rules th { text-align: left; font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em;
                   color: var(--text-off); font-weight: 400; padding: 0 var(--s-comfortable) var(--s-base) 0; }
  table.rules td { padding: var(--s-comfortable) var(--s-comfortable) var(--s-comfortable) 0; vertical-align: top;
                   border-top: 1px solid var(--hairline); font-size: var(--t-callout); color: var(--text-2); }
  table.rules tr { cursor: pointer; transition: background var(--m-selection) var(--ease-out); }
  table.rules tbody tr:hover td { background: var(--hover); }
  table.rules tbody tr[data-sel="true"] td { background: var(--selection-ground); }
  table.rules td.id { font-family: var(--mono); font-size: var(--t-footnote); color: var(--text-3); white-space: nowrap; padding-left: var(--s-base); }
  table.rules td .stmt { color: var(--text-1); }
  table.rules td .breaks { color: var(--text-3); margin-top: 5px; }
  .rules-wrap { display: flex; gap: var(--s-region); align-items: flex-start; flex-wrap: wrap; }

  .ledger { margin-top: var(--s-section); position: sticky; bottom: 0; z-index: 2;
            background: var(--desktop); border-top: 1px solid var(--hairline);
            padding: var(--s-comfortable) 0 var(--s-base); }
  .ledger h3 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em; color: var(--text-off);
               margin-bottom: var(--s-base); display: flex; justify-content: space-between; gap: var(--s-loose);
               max-width: 1180px; }
  .ledger h3 .more { text-transform: none; letter-spacing: 0; color: var(--text-3); }
  .ledger .rows { overflow-y: auto; overscroll-behavior: contain; max-width: 1180px; }
  .ledger ol { list-style: none; display: grid; grid-auto-flow: column; column-gap: var(--s-region); align-content: start; }
  .ledger li { font-size: var(--t-footnote); color: var(--text-3); padding-bottom: 6px; display: flex; gap: 8px; align-items: baseline; }
  .ledger li b { font-family: var(--mono); color: var(--text-off); font-weight: 400; min-width: 16px; }
  .ledger li .pair { color: var(--text-2); font-family: var(--mono); }

  .picker { display: flex; gap: var(--s-base); margin-bottom: var(--s-loose); flex-wrap: wrap; }
  .picker button { padding: 8px var(--s-comfortable); border-radius: var(--r-control); background: var(--raised);
                   border: 1px solid var(--hairline); font-size: var(--t-callout); color: var(--text-2); text-align: left; max-width: 300px;
                   transition: background var(--m-selection) var(--ease-out); }
  .picker button:hover { background: var(--overlay); }
  .picker button[aria-current="true"] { background: var(--selection-ground); border-color: var(--subtle); color: var(--text-1); }
  .picker button i { display: block; font-style: normal; font-size: var(--t-footnote); color: var(--text-off); margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>Atlas</b><span>apps/macOS · one aspect at a time</span></div>
    <nav class="aspects" id="aspects"></nav>
    <div class="scale">
      <div class="scale-label">Scale</div>
      <div class="rungs" id="rungs"></div>
    </div>
  </header>
  <main>
    <section id="stage"><div class="inner" id="inner"></div></section>
    <aside id="panel" hidden></aside>
    <div id="fold" hidden></div>
  </main>
  <footer class="legend" id="legend"></footer>
</div>

<script src="atlas-content.js"></script>
<script>
"use strict";
const A = window.ATLAS;
const ALL = Object.values(A);
const parts = ALL.filter(n => n.kind === "part");
const flows = ALL.filter(n => n.kind === "flow");
const concepts = ALL.filter(n => n.kind === "concept");

/* ---------------------------------------------------------------- marks --
   One table styles the marks AND prints the legend, so the two cannot drift. */
const SENSE = {
  data: { label: "data handoff", cls: "data", head: "solid", note: "the value one part hands another" },
  call: { label: "call", cls: "call", head: "open", note: "one part reaching into another" }
};
const SHAPE = {
  sys:  { label: "the system", note: "Argo itself" },
  ext:  { label: "outside Argo", note: "a person, a process, a service" },
  band: { label: "a build target", note: "vertical position is layer, nothing else" },
  grp:  { label: "a group", note: "the folder-level grouping the target names" },
  cmp:  { label: "a component", note: "one folder of Swift" },
  over: { label: "z 1", note: "floats over its parent" },
  ghost:{ label: "another room", note: "the same slot, a different room" }
};

/* ------------------------------------------------------------- measuring -- */
const SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
const MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace';
const F = {
  name:  "590 13px " + SANS,
  nameSm:"590 12px " + SANS,
  line:  "400 11px " + SANS,
  edge:  "400 11px " + SANS,
  prose: "400 11px " + SANS,
  meta:  "400 10px " + MONO
};
const LH = { name: 16, nameSm: 15, line: 14, edge: 14, prose: 14, meta: 13 };
const _ctx = document.createElement("canvas").getContext("2d");
function tw(s, font) { _ctx.font = font; return _ctx.measureText(s).width; }
function wrap(text, width, font, maxLines) {
  const words = String(text || "").split(/\s+/).filter(Boolean);
  const out = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (tw(t, font) <= width || !cur) cur = t; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  if (maxLines && out.length > maxLines) {
    const kept = out.slice(0, maxLines);
    let last = kept[maxLines - 1];
    while (last.length > 1 && tw(last + "…", font) > width) last = last.slice(0, -1);
    kept[maxLines - 1] = last + "…";
    return kept;
  }
  return out;
}
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const clause = s => { const i = String(s).indexOf(","); return i > 18 ? String(s).slice(0, i) : String(s); };

/* --------------------------------------------------------------- svg bits -- */
function T(x, y, lines, cls, lh, anchor) {
  if (!lines.length) return "";
  const a = anchor ? ` text-anchor="${anchor}"` : "";
  return `<text x="${x}" y="${y}" class="${cls}"${a}>` +
    lines.map((l, i) => `<tspan x="${x}"${i ? ` dy="${lh}"` : ""}>${esc(l)}</tspan>`).join("") + "</text>";
}
function R(x, y, w, h, cls, r) {
  return `<rect x="${x}" y="${y}" width="${Math.max(1, w)}" height="${Math.max(1, h)}" rx="${r == null ? 6 : r}" class="${cls}"/>`;
}
function hit(x, y, w, h, id, extra) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="hit${extra ? " " + extra : ""}" data-sel="${esc(id)}"/>`;
}
function arrow(d, sense, lit) {
  const s = SENSE[sense] || SENSE.data;
  const m = (lit ? "lit-" : "") + s.head;
  return `<path d="${d}" class="edge ${s.cls}${lit ? " lit" : ""}" marker-end="url(#h-${m})"/>`;
}
const DEFS = `<defs>
  <marker id="h-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#A8AEB5"/></marker>
  <marker id="h-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#A8AEB5" stroke-width="1.3"/></marker>
  <marker id="h-lit-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#3E9BFF"/></marker>
  <marker id="h-lit-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#3E9BFF" stroke-width="1.3"/></marker>
</defs>`;
function fig(w, h, body) {
  return `<svg class="fig" width="${Math.ceil(w)}" height="${Math.ceil(h)}" viewBox="0 0 ${Math.ceil(w)} ${Math.ceil(h)}">${DEFS}${body}</svg>`;
}

/* ------------------------------------------------------------------ state -- */
const ASPECTS = [
  { id: "context",    name: "Context",    q: "What does it touch?",     rungs: ["Neighbours", "Cargo", "In full"] },
  { id: "structure",  name: "Structure",  q: "What is it made of?",     rungs: ["Targets", "Groups", "Components"] },
  { id: "runtime",    name: "Runtime",    q: "What happens, in order?", rungs: ["Crossings", "Steps", "Evidence"] },
  { id: "cockpit",    name: "Cockpit",    q: "Where is it on screen?",  rungs: ["Window", "Zones", "Rows"] },
  { id: "vocabulary", name: "Vocabulary", q: "What does this word mean?", rungs: ["Terms", "Meaning", "Evidence"] },
  { id: "rules",      name: "Rules",      q: "What may I not do?",      rungs: ["Six rules", "Enforcement", "Breakage"] }
];
const state = { aspect: "context", rung: 1, sel: null };

function readURL() {
  const q = new URLSearchParams(location.search);
  const a = q.get("aspect"); if (ASPECTS.some(x => x.id === a)) state.aspect = a;
  const r = parseInt(q.get("rung"), 10); if (r >= 1 && r <= 3) state.rung = r;
  const s = q.get("sel"); if (s) state.sel = s;
}
function writeURL() {
  const q = new URLSearchParams();
  q.set("aspect", state.aspect); q.set("rung", String(state.rung));
  if (state.sel) q.set("sel", state.sel);
  history.replaceState(null, "", location.pathname + "?" + q.toString());
}
function go(patch) { Object.assign(state, patch); writeURL(); render(); }

/* ------------------------------------------------------- group resolution -- */
const GROUPS = {};                       // group id -> { owner, def }
for (const p of parts) for (const g of (p.groups || [])) GROUPS[g.id] = { owner: p.id, def: g };
function membersOf(gid) {
  const g = GROUPS[gid]; if (!g) return [];
  return parts.filter(n => n.parent === g.owner && n.group === gid);
}
function openGroupFor(sel) {
  if (!sel) return null;
  if (GROUPS[sel]) return sel;
  const n = A[sel];
  return n && n.group ? n.group : null;
}

/* ================================================================ CONTEXT == */
function actorEdges(id) {
  const into = [], out = [];
  for (const f of flows) (f.steps || []).forEach(s => {
    if (s.from === id) into.push({ flow: f, step: s });
    if (s.to === id) out.push({ flow: f, step: s });
  });
  return { into, out };
}
function renderContext() {
  const rung = state.rung;
  const COLW = 268, LANE = 300, GAP = 22;
  const xL = 0, xArgo = COLW + LANE, xR = xArgo + COLW + LANE;
  const W = xR + COLW;

  const lefts = ["person", "agent-process"].map(id => {
    const n = A[id], e = actorEdges(id);
    const lines = [];
    if (e.into.length) lines.push({ dir: "in", sense: "data", label: e.into[0].step.title, all: e.into });
    if (e.out.length) lines.push({ dir: "out", sense: "data", label: e.out[0].step.title, all: e.out });
    return { id, name: n.name, what: "outside Argo", line: n.line, shape: "ext", edges: lines };
  });
  // A neighbour's only prose IS the cargo on its line, so repeating it inside the box says nothing.
  const rights = (A.argo.leaving || []).map(([, to, cargo, sense]) => ({
    id: null, name: to, what: SENSE[sense].label, line: null, shape: "ext",
    edges: [{ dir: "out", sense, label: cargo, all: [] }]
  }));

  function boxOf(o, x) {
    const nameL = wrap(o.name, COLW - 24, F.nameSm);
    const body = [];
    if (rung >= 2) body.push({ cls: "t-meta", lines: [o.what], lh: LH.meta });
    if (rung >= 3 && o.line) body.push({ cls: "t-line", lines: wrap(o.line, COLW - 24, F.line, 4), lh: LH.line });
    let h = 12 + nameL.length * LH.nameSm;
    body.forEach(b => { h += 6 + b.lines.length * b.lh; });
    h += 12;
    return { o, x, w: COLW, h: Math.max(h, 44), nameL, body };
  }
  function stack(list, x) {
    const boxes = list.map(o => boxOf(o, x));
    let y = 12;
    for (const b of boxes) {
      const labelH = rung === 1 ? 0 : b.o.edges.reduce((a, e) =>
        a + wrap(rung >= 3 ? e.label : clause(e.label), LANE - 30, F.edge, rung >= 3 ? 4 : 2).length * LH.edge + 10, 0);
      b.rowH = Math.max(b.h, labelH, 52, b.o.edges.length * 48);
      b.y = y + (b.rowH - b.h) / 2; b.rowY = y; y += b.rowH + GAP;
    }
    return { boxes, total: y - GAP };
  }
  const L = stack(lefts, xL), Rt = stack(rights, xR);
  const H = Math.max(L.total, Rt.total, 200);
  const dyL = (H - L.total) / 2, dyR = (H - Rt.total) / 2;
  L.boxes.forEach(b => { b.y += dyL; b.rowY += dyL; });
  Rt.boxes.forEach(b => { b.y += dyR; b.rowY += dyR; });

  let s = "";
  // Argo, the system under description
  const argoNameL = ["Argo"];
  const argoBody = [];
  argoBody.push({ cls: "t-meta", lines: ["the software system · Swift"], lh: LH.meta });
  if (rung >= 2) argoBody.push({ cls: "t-line", lines: wrap(A.argo.line, COLW - 28, F.line, 8), lh: LH.line });
  if (rung >= 3) {
    argoBody.push({ cls: "t-meta", lines: [A.argo.lines.toLocaleString() + " lines · 5 targets"], lh: LH.meta });
    (A.argo.short || []).forEach(p => argoBody.push({ cls: "t-line", lines: wrap(p, COLW - 28, F.line, 14), lh: LH.line }));
  }
  const selArgo = state.sel === "argo";
  s += R(xArgo, 0, COLW, H, "box sys" + (selArgo ? " sel" : ""), 10);
  const argoH = LH.name + argoBody.reduce((a, b) => a + b.lh * b.lines.length + 8, 0);
  let ay = Math.max(26, (H - argoH) / 2);
  s += T(xArgo + 14, ay, argoNameL, "t-name", LH.name); ay += 10;
  for (const b of argoBody) { ay += b.lh; s += T(xArgo + 14, ay, b.lines, b.cls, b.lh); ay += (b.lines.length - 1) * b.lh + 8; }
  s += hit(xArgo, 0, COLW, H, "argo");

  function drawSide(pack, side) {
    for (const b of pack.boxes) {
      const cls = "box " + b.o.shape + (state.sel && state.sel === b.o.id ? " sel" : "");
      s += R(b.x, b.y, b.w, b.h, cls, 8);
      let y = b.y + 20;
      s += T(b.x + 12, y, b.nameL, "t-name-sm", LH.nameSm);
      y += (b.nameL.length - 1) * LH.nameSm;
      for (const bb of b.body) { y += 6 + bb.lh; s += T(b.x + 12, y, bb.lines, bb.cls, bb.lh); y += (bb.lines.length - 1) * bb.lh; }
      if (b.o.id) s += hit(b.x, b.y, b.w, b.h, b.o.id);
      // edges
      const n = b.o.edges.length;
      b.o.edges.forEach((e, i) => {
        const ey = b.rowY + b.rowH * (i + 1) / (n + 1);
        const lit = !!(state.sel && (state.sel === b.o.id || state.sel === "argo"));
        const from = side === "left" ? b.x + b.w : xArgo + COLW;
        const to = side === "left" ? xArgo : b.x;
        const inward = e.dir === "in";
        const d = side === "left"
          ? (inward ? `M${from},${ey} L${to},${ey}` : `M${to},${ey} L${from},${ey}`)
          : (inward ? `M${to},${ey} L${from},${ey}` : `M${from},${ey} L${to},${ey}`);
        s += arrow(d, e.sense, lit);
        if (rung >= 2) {
          const lw = LANE - 30;
          const lines = wrap(rung >= 3 ? e.label : clause(e.label), lw, F.edge, rung >= 3 ? 4 : 2);
          const lx = side === "left" ? b.x + b.w + 15 : xArgo + COLW + 15;
          const ly = ey - 8 - (lines.length - 1) * LH.edge;
          s += `<rect x="${lx - 5}" y="${ly - 12}" width="${Math.min(lw, Math.max(...lines.map(l => tw(l, F.edge)))) + 10}" height="${lines.length * LH.edge + 6}" class="lbl-plate" rx="3"/>`;
          s += T(lx, ly, lines, "t-edge", LH.edge);
        }
      });
    }
  }
  drawSide(L, "left"); drawSide(Rt, "right");
  return { svg: fig(W, H + 4, s) };
}

/* ============================================================== STRUCTURE == */
const LAYERS = ["app", "ui", "engine"];          // top to bottom; position means layer
function bandContent(id, rung, openGroup) {
  const n = A[id], W = 740, PAD = 14;
  const gs = n.groups || [];
  if (rung === 1 || !gs.length) {
    const nameL = wrap(n.name, W - 2 * PAD, F.name, 1);
    const lineL = wrap(n.line, W - 2 * PAD - 120, F.line, 2);
    return { h: 24 + LH.name + lineL.length * LH.line + 14, draw: (x, y) => {
      let s = T(x + PAD, y + 26, nameL, "t-name", LH.name);
      s += T(x + PAD, y + 26 + LH.line + 6, lineL, "t-line", LH.line);
      s += T(x + W - PAD, y + 26, [n.lines.toLocaleString() + " lines"], "t-meta", LH.meta, "end");
      return s;
    } };
  }
  const cols = gs.length;
  const gw = (W - 2 * PAD - (cols - 1) * 12) / cols;
  const cells = gs.map(g => {
    const nameL = wrap(g.name, gw - 20, F.nameSm, 2);
    const mem = membersOf(g.id);
    let h = 12 + nameL.length * LH.nameSm + 6 + LH.meta + 10;
    let boxes = [];
    if (rung >= 3 && openGroup === g.id) {
      let my = h;
      for (const m of mem) {
        const ml = wrap(m.name, gw - 32, F.line, 2);
        const mh = 8 + ml.length * LH.line + LH.meta + 6;
        boxes.push({ m, y: my, h: mh, lines: ml });
        my += mh + 6;
      }
      h = my + 4;
    }
    return { g, mem, nameL, h, boxes };
  });
  const maxH = Math.max(...cells.map(c => c.h));
  const headH = 24 + LH.name + 12;
  return { h: headH + maxH + PAD, draw: (x, y) => {
    let s = T(x + PAD, y + 26, [n.name], "t-name", LH.name);
    s += T(x + W - PAD, y + 26, [n.lines.toLocaleString() + " lines · " + (n.inside || []).length + " components"], "t-meta", LH.meta, "end");
    cells.forEach((c, i) => {
      const cx = x + PAD + i * (gw + 12), cy = y + headH;
      const isSel = state.sel === c.g.id;
      s += R(cx, cy, gw, maxH, "box grp" + (isSel ? " sel" : ""), 8);
      s += T(cx + 10, cy + 20, c.nameL, "t-name-sm", LH.nameSm);
      const meta = rung >= 3 && openGroup === c.g.id
        ? c.mem.length + " shown"
        : c.mem.length + " components ▸";
      s += T(cx + 10, cy + 20 + (c.nameL.length - 1) * LH.nameSm + 16, [meta], "t-meta", LH.meta);
      s += hit(cx, cy, gw, maxH, c.g.id);
      for (const b of c.boxes) {
        const bsel = state.sel === b.m.id;
        s += R(cx + 8, cy + b.y, gw - 16, b.h, "box cmp" + (bsel ? " sel" : ""), 5);
        s += T(cx + 16, cy + b.y + 15, b.lines, "t-line", LH.line);
        s += T(cx + 16, cy + b.y + 15 + (b.lines.length - 1) * LH.line + 13,
          [b.m.lines.toLocaleString() + " ln · " + (b.m.leaving || []).length + " out"], "t-meta", LH.meta);
        s += hit(cx + 8, cy + b.y, gw - 16, b.h, b.m.id);
      }
    });
    return s;
  } };
}
function renderStructure() {
  const rung = state.rung;
  const openGroup = rung >= 3 ? (openGroupFor(state.sel) || "reading") : null;
  const BX = 340, BW = 740, GAPH = rung === 1 ? 150 : rung === 3 ? 122 : 168;
  const bands = {};
  let y = 0;
  for (const id of LAYERS) {
    const c = bandContent(id, rung, openGroup);
    bands[id] = { id, x: BX, y, w: BW, h: c.h, c };
    y += c.h + GAPH;
  }
  const bottom = y - GAPH;
  // offset targets: neither is in the main stack, because neither is a layer over it
  const side = (id, x, atY, w) => {
    const n = A[id];
    const nameL = wrap(n.name, w - 24, F.name, 1);
    const lineL = wrap(n.line, w - 24, F.line, 4);
    const h = 24 + LH.name + 6 + lineL.length * LH.line + 14;
    return { id, x, y: atY, w, h, nameL, lineL, n };
  };
  const terminal = side("terminal", BX + BW + 250, bands.engine.y, 230);
  const observe = side("observe", 40, bands.ui.y, 220);

  let s = "";
  const litFor = id => state.sel && (state.sel === id || (A[state.sel] && A[state.sel].parent === id) ||
    (GROUPS[state.sel] && GROUPS[state.sel].owner === id));
  for (const id of LAYERS) {
    const b = bands[id];
    s += R(b.x, b.y, b.w, b.h, "box band" + (state.sel === id ? " sel" : ""), 10);
    s += hit(b.x, b.y, b.w, 40, id);
    s += b.c.draw(b.x, b.y);
  }
  for (const o of [terminal, observe]) {
    s += R(o.x, o.y, o.w, o.h, "box" + (state.sel === o.id ? " sel" : ""), 10);
    s += T(o.x + 14, o.y + 26, o.nameL, "t-name", LH.name);
    s += T(o.x + 14, o.y + 26 + LH.line + 8, o.lineL, "t-line", LH.line);
    s += T(o.x + o.w - 14, o.y + 26, [o.n.lines + " ln"], "t-meta", LH.meta, "end");
    s += hit(o.x, o.y, o.w, o.h, o.id);
  }
  // the one axis: height is layer
  const axisMid = (bands.app.y + bottom) / 2;
  s += `<path d="M18,${bands.app.y + 10} L18,${bottom - 6}" class="edge dim" marker-end="url(#h-open)"/>`;
  s += `<text x="8" y="${axisMid}" class="t-cap" text-anchor="middle" transform="rotate(-90 8 ${axisMid})">DEPENDS ON WHAT IS BELOW</text>`;

  // ---- edges ------------------------------------------------------------
  const among = A.argo.among || [];
  const ledger = [];
  const inGap = { "app|ui": [], "engine|ui": [] };
  const routedLeft = [], termEdges = [], obsEdges = [], routedRight = [];
  among.forEach((e) => {
    const [f, t] = e;
    const key = [f, t].sort().join("|");
    if (inGap[key] && LAYERS.includes(f) && LAYERS.includes(t)) inGap[key].push(e);
    else if ((f === "app" && t === "engine") || (f === "engine" && t === "app")) routedLeft.push(e);
    else if (f === "observe" || t === "observe") obsEdges.push(e);
    else if ((f === "app" && t === "terminal")) routedRight.push(e);
    else termEdges.push(e);
  });
  let num = 0;
  const numOf = e => { ledger.push({ n: ++num, e }); return num; };
  function gapEdges(list, upper, lower) {
    const y0 = bands[upper].y + bands[upper].h, y1 = bands[lower].y;
    const n = list.length;
    list.sort((a, b) => (a[0] === upper ? -1 : 1) - (b[0] === upper ? -1 : 1));
    list.forEach((e, i) => {
      const slot = BW / n, x = BX + slot * (i + 0.5);
      const down = e[0] === upper;
      const k = numOf(e);
      const lit = state.sel && (state.sel === e[0] || state.sel === e[1]);
      s += arrow(down ? `M${x},${y0 + 6} L${x},${y1 - 6}` : `M${x},${y1 - 6} L${x},${y0 + 6}`, e[3], lit);
      if (rung >= 2) {
        const lines = wrap(clause(e[2]), slot - 24, F.edge, 3);
        const ly = (y0 + y1) / 2 - (lines.length * LH.edge) / 2;
        const wmax = Math.max(...lines.map(l => tw(l, F.edge)));
        s += `<rect x="${x - wmax / 2 - 8}" y="${ly - 14}" width="${wmax + 16}" height="${lines.length * LH.edge + 8}" class="lbl-plate" rx="3"/>`;
        s += `<text x="${x}" y="${ly}" class="t-edge" text-anchor="middle">` +
          lines.map((l, j) => `<tspan x="${x}"${j ? ` dy="${LH.edge}"` : ""}>${esc(l)}</tspan>`).join("") + "</text>";
        s += T(x, ly - 18, [String(k)], "t-num", 11, "middle");
      } else s += T(x, (y0 + y1) / 2, [String(k)], "t-num", 11, "middle");
    });
  }
  gapEdges(inGap["app|ui"], "app", "ui");
  gapEdges(inGap["engine|ui"], "ui", "engine");
  routedLeft.forEach((e, i) => {
    const x = BX - 44 - i * 16, k = numOf(e), down = e[0] === "app";
    const lit = state.sel && (state.sel === e[0] || state.sel === e[1]);
    const ya = bands.app.y + bands.app.h / 2, yb = bands.engine.y + bands.engine.h / 2;
    const d = down
      ? `M${BX},${ya} L${x},${ya} L${x},${yb} L${BX - 4},${yb}`
      : `M${BX},${yb} L${x},${yb} L${x},${ya} L${BX - 4},${ya}`;
    s += arrow(d, e[3], lit);
    s += T(x - 4, (ya + yb) / 2 + (i ? 16 : 0), [String(k)], "t-num", 11, "end");
  });
  let obsLbl = "";
  obsEdges.forEach((e, i) => {
    const k = numOf(e), lit = state.sel && (state.sel === e[0] || state.sel === e[1]);
    const x = observe.x + 60 + i * 100;
    const down = e[0] === "observe";
    const y0 = observe.y + observe.h, y1 = bands.engine.y + 24;
    const d = down ? `M${x},${y0 + 6} L${x},${y1 - 6} L${BX - 6},${y1 - 6}` : `M${BX - 6},${y1 - 6} L${x},${y1 - 6} L${x},${y0 + 6}`;
    s += arrow(d, e[3], lit);
    if (rung >= 2) {
      // the note hangs off the line it describes, not loose beside the box
      const lines = wrap(clause(e[2]), 132, F.edge, 3);
      const ly = y0 + 30 + i * 58;
      const wmax = Math.max(...lines.map(l => tw(l, F.edge)));
      obsLbl += `<rect x="${x + 3}" y="${ly - 13}" width="${wmax + 26}" height="${lines.length * LH.edge + 8}" class="lbl-plate" rx="3"/>`;
      obsLbl += T(x + 7, ly, [String(k)], "t-num", 11);
      obsLbl += T(x + 21, ly, lines, "t-edge", LH.edge);
    } else obsLbl += T(x + 6, y0 + 16, [String(k)], "t-num", 11);
  });
  s += obsLbl;
  // the terminal lane gets a gutter: one row per edge, the line under its own label
  const GX = BX + BW + 14, GW = 165, BEND = GX + GW + 24;
  const termRows = termEdges.map(e => {
    const lines = rung >= 2 ? wrap(clause(e[2]), GW, F.edge, 3) : [];
    return { e, lines, h: rung >= 2 ? lines.length * LH.edge + 22 : 46 };
  });
  let ry = terminal.y + terminal.h / 2 - termRows.reduce((a, r) => a + r.h, 0) / 2;
  termRows.forEach((r, i) => {
    const e = r.e, k = numOf(e), lit = state.sel && (state.sel === e[0] || state.sel === e[1]);
    const ty = terminal.y + terminal.h * (i + 1) / (termRows.length + 1);
    const ey = ry + r.h - 9;
    const out = e[0] === "engine";
    const d = out
      ? `M${BX + BW},${ey} L${BEND},${ey} L${BEND},${ty} L${terminal.x - 4},${ty}`
      : `M${terminal.x},${ty} L${BEND},${ty} L${BEND},${ey} L${BX + BW + 4},${ey}`;
    s += arrow(d, e[3], lit);
    if (rung >= 2) {
      s += T(GX, ry + LH.edge, [String(k)], "t-num", 11);
      s += T(GX + 16, ry + LH.edge, r.lines, "t-edge", LH.edge);
    } else s += T(GX, ey - 6, [String(k)], "t-num", 11);
    ry += r.h;
  });
  // the app reaches the terminal from above, so its label sits beside its own drop
  routedRight.forEach(e => {
    const k = numOf(e), lit = state.sel && (state.sel === e[0] || state.sel === e[1]);
    const x = terminal.x + terminal.w / 2;
    const ya = bands.app.y + bands.app.h / 2;
    s += arrow(`M${BX + BW},${ya} L${x},${ya} L${x},${terminal.y - 4}`, e[3], lit);
    if (rung >= 2) {
      const lines = wrap(clause(e[2]), 150, F.edge, 3);
      const ly = terminal.y - 24 - (lines.length - 1) * LH.edge;
      const wmax = Math.max(...lines.map(l => tw(l, F.edge)));
      s += `<rect x="${x - 14 - wmax - 16}" y="${ly - 13}" width="${wmax + 30}" height="${lines.length * LH.edge + 8}" class="lbl-plate" rx="3"/>`;
      s += T(x - 14, ly, lines, "t-edge", LH.edge, "end");
      s += T(x - 16 - wmax, ly, [String(k)], "t-num", 11, "end");
    } else s += T(x + 6, (ya + terminal.y) / 2, [String(k)], "t-num", 11);
  });

  const W = terminal.x + terminal.w + 40;
  let led = `<div class="ledger"><h3><span>Every line, and the cargo it carries</span><span class="more"></span></h3><div class="rows"><ol>` +
    ledger.map(({ n, e }) => `<li><b>${n}</b><span><span class="pair">${esc(A[e[0]].name)} → ${esc(A[e[1]].name)}</span> · ${esc(e[2])} <i>(${esc(SENSE[e[3]].label)})</i></span></li>`).join("") +
    `</ol></div></div>`;
  return { svg: fig(W, bottom + 20, s), extra: led };
}

/* ================================================================ RUNTIME == */
function renderRuntime() {
  const rung = state.rung;
  const flow = flows.find(f => f.id === state.sel) || flows.find(f => (f.parts || []).includes(state.sel)) || flows[0];
  const lifelines = flow.parts;
  const COL = 210, X0 = 30, HEADW = 186;
  const xOf = id => X0 + lifelines.indexOf(id) * COL + HEADW / 2;

  // heads
  const heads = lifelines.map(id => {
    const n = A[id];
    const nl = wrap(n.name, HEADW - 20, F.nameSm, 3);
    return { id, n, nl, h: 14 + nl.length * LH.nameSm + (rung >= 2 ? LH.meta + 6 : 0) + 10 };
  });
  const headH = Math.max(...heads.map(h => h.h));

  // steps
  const steps = (flow.steps || []).map((s, i) => ({ ...s, i }));
  const shown = [];
  let prevActor = null, hidden = 0;
  for (const st of steps) {
    const dst = st.to || st.actor;
    // A step that names only where it goes leaves from its own actor, never from whoever spoke last.
    const src = st.from || (st.kind === "self" || prevActor === dst ? st.actor : prevActor || st.actor);
    const crosses = src !== dst;
    if (rung === 1 && !crosses) { hidden++; }
    else { shown.push({ ...st, src, dst, hiddenBefore: hidden }); hidden = 0; }
    prevActor = st.to ? st.to : st.actor;
  }
  const rows = shown.map(st => {
    const span = Math.abs(xOf(st.dst) - xOf(st.src)) || COL;
    const lw = Math.max(span - 30, 250);
    const title = wrap(st.title, lw, F.nameSm, 2);
    const prose = rung >= 3 ? wrap(st.prose, Math.max(lw, 460), F.prose, 4) : [];
    const at = rung >= 3 ? [st.at[0].split("/").pop() + ":" + st.at[1]] : [];
    const h = 18 + title.length * LH.nameSm + (prose.length ? 6 + prose.length * LH.prose : 0) + (at.length ? 4 + LH.meta : 0) + 20;
    return { st, title, prose, at, lw, h };
  });

  let y = headH + 26;
  const framesOpen = [];
  const frames = [];
  rows.forEach((r, i) => {
    r.y = y;
    const isFrame = r.st.kind === "alt" || r.st.kind === "loop";
    const prev = rows[i - 1];
    if (isFrame) {
      const cont = prev && (prev.st.kind === r.st.kind) && frames.length && frames[frames.length - 1].kind === r.st.kind && frames[frames.length - 1].endIdx === i - 1;
      if (cont) { const f = frames[frames.length - 1]; f.endIdx = i; f.dividers.push(y - 6); }
      else { frames.push({ kind: r.st.kind, startIdx: i, endIdx: i, dividers: [] }); y += 16; r.y = y; }
    }
    y += r.h;
  });
  frames.forEach(f => {
    const a = rows[f.startIdx], b = rows[f.endIdx];
    f.top = a.y - 22; f.bot = b.y + b.h - 6;
  });
  const bodyBottom = y + 10;
  const W = X0 + lifelines.length * COL + 120;

  let s = "";
  // frames behind
  frames.forEach(f => {
    const x0 = X0 - 8, x1 = W - 80;
    s += R(x0, f.top, x1 - x0, f.bot - f.top, "frame", 4);
    const label = f.kind === "alt" ? "alt" : "loop";
    const lw2 = tw(label, F.meta) + 16;
    s += `<path d="M${x0},${f.top} h${lw2} l8,14 v0 h-${lw2 + 8} z" class="frame-tab"/>`;
    s += T(x0 + 8, f.top + 12, [label], "t-meta", LH.meta);
    f.dividers.forEach(dy => { s += `<path d="M${x0},${dy} L${x1},${dy}" class="rule-hair"/>`; });
  });
  // lifelines
  heads.forEach((h, i) => {
    const x = X0 + i * COL;
    const sel = state.sel === h.id;
    s += R(x, 0, HEADW, headH, "box" + (sel ? " sel" : (A[h.id].external ? " ext" : "")), 8);
    s += T(x + 10, 20, h.nl, "t-name-sm", LH.nameSm);
    if (rung >= 2) s += T(x + 10, 20 + (h.nl.length - 1) * LH.nameSm + 16, [A[h.id].parent === "argo" ? h.id : (A[h.id].parent || "")], "t-meta", LH.meta);
    s += hit(x, 0, HEADW, headH, h.id);
    s += `<path d="M${x + HEADW / 2},${headH} L${x + HEADW / 2},${bodyBottom}" class="life"/>`;
  });
  // messages
  rows.forEach(r => {
    const st = r.st;
    const lit = state.sel && (state.sel === st.actor || state.sel === st.src || state.sel === st.dst);
    const x1 = xOf(st.src), x2 = xOf(st.dst);
    const ly = r.y + 6 + r.title.length * LH.nameSm;
    let lx;
    if (st.kind === "self" || x1 === x2) {
      const x = xOf(st.actor);
      s += `<path d="M${x},${ly} h30 v18 h-24" class="edge ${SENSE.data.cls}${lit ? " lit" : ""}" marker-end="url(#h-${lit ? "lit-" : ""}solid)"/>`;
      lx = x + 48;
    } else {
      const sense = st.kind === "return" ? "call" : "data";
      s += arrow(`M${x1 + (x2 > x1 ? 4 : -4)},${ly + 4} L${x2 + (x2 > x1 ? -6 : 6)},${ly + 4}`, sense, lit);
      lx = Math.min(x1, x2) + 14;
    }
    const plateW = Math.max(
      ...r.title.map(l => tw(l, F.nameSm)),
      ...(r.prose.length ? r.prose.map(l => tw(l, F.prose)) : [0])) + 16;
    s += `<rect x="${lx - 8}" y="${r.y - 1}" width="${plateW}" height="${r.title.length * LH.nameSm + 5}" class="lbl-mask" rx="3"/>`;
    s += T(lx, r.y + 12, r.title, "t-name-sm", LH.nameSm);
    if (r.prose.length) {
      s += `<rect x="${lx - 8}" y="${ly + 14}" width="${plateW}" height="${r.prose.length * LH.prose + 6}" class="lbl-mask" rx="3"/>`;
      s += T(lx, ly + 26, r.prose, "t-prose", LH.prose);
    }
    if (r.at.length) s += T(lx, ly + 26 + r.prose.length * LH.prose + 12, r.at, "t-meta", LH.meta);
    if (st.hiddenBefore) s += T(X0 - 12, r.y + 12, ["+" + st.hiddenBefore], "t-num", 11, "end");
    if (st.answers && flow.steps[st.answers - 1]) {
      const t = "↩ answers step " + st.answers + " · " + flow.steps[st.answers - 1].title;
      s += T(lx, r.y - 6, wrap(t, 460, F.meta, 1), "t-meta", LH.meta);
    }
    s += hit(Math.min(x1, x2) - 10, r.y - 4, Math.abs(x2 - x1) + 300, r.h, st.actor, "step");
  });

  const pick = `<div class="picker">` + flows.map(f =>
    `<button data-flow="${f.id}" aria-current="${f.id === flow.id}">${esc(f.name)}<i>${(f.steps || []).length} steps · ${f.parts.length} lifelines</i></button>`).join("") + `</div>`;
  return { svg: fig(W, bodyBottom + 20, s), pre: pick,
    note: rung === 1 ? "Only the steps that cross a lifeline are drawn. A <b>+n</b> in the left margin counts the steps that stayed inside one part." : null };
}

/* ================================================================ COCKPIT == */
const WIRE = {
  "u-shell":    [0, 0, 1180, 800],
  "u-toolbar":  [0, 0, 1180, 54],
  "u-sidebar":  [0, 54, 272, 746],
  "u-tickets":  [288, 70, 892, 730],
  "u-deck":     [272, 54, 908, 746],
  "u-connect":  [40, 330, 372, 230],
  "u-header":   [284, 116, 884, 50],
  "u-agents":   [284, 182, 124, 600],
  "u-feed":     [420, 182, 486, 600],
  "u-minimap":  [918, 182, 46, 600],
  "u-evidence": [976, 182, 192, 600],
  "u-plan":     [432, 240, 462, 34],
  "u-prose":    [432, 286, 462, 96],
  "u-call":     [432, 390, 462, 96],
  "u-ask":      [432, 494, 462, 96],
  "u-media":    [432, 598, 462, 96],
  "u-composer": [432, 702, 462, 68]
};
const RUNG_SHOW = {
  1: ["u-shell", "u-toolbar", "u-sidebar", "u-tickets", "u-deck", "u-connect"],
  2: ["u-shell", "u-toolbar", "u-sidebar", "u-tickets", "u-deck", "u-header", "u-agents", "u-feed", "u-minimap", "u-evidence", "u-connect"],
  3: ["u-shell", "u-toolbar", "u-sidebar", "u-tickets", "u-deck", "u-header", "u-agents", "u-feed", "u-minimap", "u-evidence",
      "u-plan", "u-prose", "u-call", "u-ask", "u-media", "u-composer", "u-connect"]
};
function renderCockpit() {
  const rung = state.rung;
  const OX = 30, OY = 34, AX = OX + 1180 + 56;
  const ids = RUNG_SHOW[rung];
  const notes = [];
  let s = "";
  s += T(OX, 18, ["THE COCKPIT WINDOW · " + ids.length + " REGIONS AT THIS RUNG"], "t-cap", 12);
  const metaOf = n => {
    const bits = ["z " + n.region.z];
    if (n.region.room) bits.push("room: " + n.region.room);
    const out = [bits.join(" · ")];
    if (rung >= 3) out.push(n.lines.toLocaleString() + " ln · " + n.region.evidence[0].split("/").pop() + ":" + n.region.evidence[1]);
    return rung >= 2 ? out : [];
  };
  for (const id of ids) {
    const n = A[id], r = n.region, [x0, y0, w, h] = WIRE[id];
    const x = OX + x0, y = OY + y0;
    const sel = state.sel === id;
    const ghost = id === "u-tickets";
    const cls = "box " + (id === "u-shell" ? "band" : ghost ? "ghost" : r.z === 1 ? "over" : "") + (sel ? " sel" : "");
    s += R(x, y, w, h, cls.trim(), id === "u-shell" ? 10 : 6);
    const meta = metaOf(n);
    if (ghost) {
      notes.push({ y, x: x + w, name: n.name, lines: ["the other room in the same slot"].concat(meta) });
    } else if (w < 90) {
      const cx = x + w / 2, cy = y + h / 2;
      s += `<text x="${cx}" y="${cy}" class="t-name-sm" text-anchor="middle" transform="rotate(-90 ${cx} ${cy})">${esc(n.name)}</text>`;
      if (meta.length) s += `<text x="${cx + 15}" y="${cy}" class="t-meta" text-anchor="middle" transform="rotate(-90 ${cx + 15} ${cy})">${esc(meta[0])}</text>`;
    } else {
      const nl = wrap(n.name, w - 20, F.nameSm, 2);
      const need = 19 + (nl.length - 1) * LH.nameSm + meta.length * 15 + 8;
      const fits = meta.every(m => tw(m, F.meta) <= w - 20);
      const inside = need <= h && fits;
      if (r.z === 1) {                       // a floating region hides nothing, so it needs its own plate
        const pw = Math.max(...nl.map(l => tw(l, F.nameSm)), ...(inside ? meta.map(l => tw(l, F.meta)) : [0])) + 20;
        s += R(x + 1, y + 1, Math.min(pw, w - 2), Math.min(inside ? need - 4 : 26, h - 2), "lbl-plate", 5);
      }
      s += T(x + 10, y + 19, nl, "t-name-sm", LH.nameSm);
      if (inside) {
        let ty = y + 19 + (nl.length - 1) * LH.nameSm;
        meta.forEach(m => { ty += 15; s += T(x + 10, ty, [m], "t-meta", LH.meta); });
      } else if (meta.length) {
        notes.push({ y, x: x + w, name: n.name, lines: meta });
      }
    }
    s += hit(x, y, w, Math.min(h, ["u-shell", "u-deck", "u-feed"].includes(id) ? 30 : h), id);
  }
  // Anything that would not fit inside its own box is said in the margin instead.
  let last = 0;
  notes.sort((a, b) => a.y - b.y).forEach(nt => {
    const ny = Math.max(nt.y + 14, last + 22);
    last = ny + nt.lines.length * LH.meta;
    if (nt.x + 40 > OX + 1180) {  // a leader from deep inside the window crosses more than it explains
      s += `<path d="M${nt.x},${nt.y + 12} L${nt.x + 16},${nt.y + 12} L${AX - 12},${ny - 4} L${AX - 6},${ny - 4}" class="rule-hair"/>`;
    }
    s += T(AX, ny, [nt.name], "t-name-sm", LH.nameSm);
    s += T(AX, ny + 14, nt.lines, "t-meta", LH.meta);
    last = ny + 14 + nt.lines.length * LH.meta;
  });
  return { svg: fig(AX + 300, OY + 800 + 30, s) };
}

/* ================================================================== RULES == */
/* Where each rule lands on the layer figure. The rules carry no coordinates, so this
   mapping is read off each statement by hand and is the one authored thing here. */
const RULE_MARK = {
  "no-live-hub-in-views":     { kind: "edge", from: "ui", to: "engine", say: "live Hub — one file only" },
  "engine-links-no-ui":       { kind: "edge", from: "engine", to: "ui", say: "no SwiftUI, AppKit or ArgoUI" },
  "app-target-declares-no-view": { kind: "badge", on: "app", say: "declares no View" },
  "app-target-line-cap":      { kind: "badge", on: "app", say: "under 600 code lines" },
  "projection-is-total":      { kind: "badge", on: "ui", say: "every HubSession fact lands, or is named" },
  "initializer-parameter-cap":{ kind: "everywhere", say: "every initializer, in every target" }
};
function renderRules() {
  const rung = state.rung;
  const rules = A.argo.rules || [];
  const sel = rules.find(r => r.id === state.sel);
  // small layer figure
  const BX = 60, BW = 300, BH = 58, GAP = 88, FIGW = 700;
  const order = ["app", "ui", "engine"];
  let s = "", y = 34;
  const at = {};
  order.forEach(id => { at[id] = y; y += BH + GAP; });
  const figBottom = y - GAP;
  s += T(BX, 18, ["THE LAYER FIGURE, WITH WHAT IS FORBIDDEN"], "t-cap", 12);
  order.forEach(id => {
    const lit = sel && RULE_MARK[sel.id] && (RULE_MARK[sel.id].on === id || RULE_MARK[sel.id].from === id || RULE_MARK[sel.id].to === id || RULE_MARK[sel.id].kind === "everywhere");
    s += R(BX, at[id], BW, BH, "box band" + (lit ? " sel" : ""), 8);
    s += T(BX + 12, at[id] + 24, [A[id].name], "t-name", LH.name);
    s += T(BX + 12, at[id] + 42, [A[id].lines.toLocaleString() + " lines"], "t-meta", LH.meta);
    // badges
    const badges = rules.filter(r => RULE_MARK[r.id] && RULE_MARK[r.id].kind === "badge" && RULE_MARK[r.id].on === id);
    let by = at[id] + 20;
    badges.forEach(r => {
      const isSel = sel && sel.id === r.id;
      const lines = wrap((isSel ? "▸ " : "· ") + RULE_MARK[r.id].say, FIGW - BX - BW - 30, F.edge, 2);
      s += T(BX + BW + 14, by, lines, isSel ? "t-edge" : "t-meta", LH.meta);
      by += lines.length * LH.meta + 4;
    });
  });
  // forbidden edges between ui and engine
  const gy0 = at.ui + BH, gy1 = at.engine;
  [["ui", "engine", BX + 60], ["engine", "ui", BX + 240]].forEach(([f, t, x]) => {
    const rule = rules.find(r => RULE_MARK[r.id] && RULE_MARK[r.id].kind === "edge" && RULE_MARK[r.id].from === f && RULE_MARK[r.id].to === t);
    const isSel = sel && rule && sel.id === rule.id;
    const down = f === "ui";
    s += `<path d="${down ? `M${x},${gy0 + 6} L${x},${gy1 - 6}` : `M${x},${gy1 - 6} L${x},${gy0 + 6}`}" class="edge forbidden" marker-end="url(#h-open)"/>`;
    const mid = (gy0 + gy1) / 2;
    s += `<circle cx="${x}" cy="${mid}" r="11" class="lbl-plate"/>`;
    s += `<path d="M${x - 7},${mid + 7} L${x + 7},${mid - 7} M${x - 7},${mid - 7} L${x + 7},${mid + 7}" class="strike${isSel ? " lit" : ""}"/>`;
    const lines = wrap(RULE_MARK[rule.id].say, f === "ui" ? 140 : 110, F.edge, 3);
    s += T(x + 18, mid - (lines.length - 1) * 7, lines, isSel ? "t-edge" : "t-meta", LH.meta);
  });
  const ev = rules.find(r => RULE_MARK[r.id].kind === "everywhere");
  const evSel = sel && sel.id === ev.id;
  s += `<path d="M${BX - 16},${figBottom + 22} L${FIGW - 20},${figBottom + 22}" class="rule-hair"/>`;
  s += T(BX - 16, figBottom + 40, [(evSel ? "▸ " : "· ") + RULE_MARK[ev.id].say], evSel ? "t-edge" : "t-meta", LH.meta);

  const table = `<table class="rules"><thead><tr>
      <th style="width:44%">The rule</th>${rung >= 2 ? "<th>Enforced at</th>" : ""}<th class="id">id</th></tr></thead><tbody>` +
    rules.map(r => `<tr data-pick="${r.id}" data-sel="${state.sel === r.id}">
      <td><div class="stmt">${esc(r.statement)}</div>${rung >= 3 ? `<div class="breaks">${esc(r.what_breaks)}</div>` : ""}</td>
      ${rung >= 2 ? `<td><div class="anchor"><b>${esc(r.enforced_at[0])}</b>:${r.enforced_at[1]}</div>${r.adr ? `<div class="what">${esc(r.adr)}</div>` : `<div class="what">no ADR</div>`}</td>` : ""}
      <td class="id">${esc(r.id)}</td></tr>`).join("") + `</tbody></table>`;

  return { html: `<div class="rules-wrap"><div>${fig(FIGW, figBottom + 60, s)}</div><div style="flex:1;min-width:520px">${table}</div></div>` };
}

/* The ledger keeps whole rows: its box ends where a grid row ends, and the rest
   scrolls inside it rather than being sliced by the fold. */
function fitLedger() {
  const led = document.querySelector(".ledger");
  if (!led) return;
  const ol = led.querySelector("ol"), box = led.querySelector(".rows");
  const items = [...ol.children];
  if (!items.length) return;
  const cols = 2, rows = Math.ceil(items.length / cols);
  ol.style.gridTemplateRows = `repeat(${rows}, auto)`;
  box.style.maxHeight = "none";
  const top = ol.getBoundingClientRect().top;
  const rowBottom = [];
  items.forEach((li, i) => {
    const r = i % rows, b = li.getBoundingClientRect().bottom - top;
    rowBottom[r] = Math.max(rowBottom[r] || 0, b);
  });
  const stage = document.getElementById("stage");
  const budget = Math.max(rowBottom[0], Math.min(stage.clientHeight * .22, 150));
  let k = 1;
  while (k < rows && rowBottom[k] <= budget) k++;
  box.style.maxHeight = Math.ceil(rowBottom[k - 1]) + "px";
  const left = items.length - k * cols;
  led.querySelector(".more").textContent = left > 0 ? left + " more lines — scroll the list" : "";
}

/* What the fold hides, said out loud, so nobody mistakes the edge for the end. */
const FOLD_KINDS = [["rect.cmp", "components"], ["rect.step", "steps"],
                    ["rect.grp", "groups"], ["rect.band", "targets"], ["rect.box", "regions"]];
function updateFold() {
  const stage = document.getElementById("stage"), el = document.getElementById("fold");
  const led = stage.querySelector(".ledger");
  const fold = (led ? led.getBoundingClientRect().top : stage.getBoundingClientRect().bottom) - 6;
  const left = stage.scrollHeight - stage.clientHeight - stage.scrollTop;
  if (left <= 40) { el.hidden = true; return; }
  let n = 0, noun = "";
  for (const [sel, word] of FOLD_KINDS) {
    n = [...stage.querySelectorAll(sel)].filter(e => {
      const r = e.getBoundingClientRect();
      return (r.top + r.bottom) / 2 > fold;
    }).length;
    if (n) { noun = word; break; }
  }
  el.hidden = false;
  el.textContent = (n ? n + " more " + noun : "more") + " below ↓";
  el.style.left = (stage.offsetLeft + stage.clientWidth / 2) + "px";
  el.style.bottom = (led ? led.getBoundingClientRect().height + 16 : 12) + "px";
}

  inner.innerHTML = `<div class="rung-title"><h1>${heads[0]}</h1><p>${heads[1]}</p></div>` +
    (out.pre || "") + (out.svg || out.html || "") +
    (out.note ? `<p class="leg-note" style="margin-top:var(--s-loose);font-size:var(--t-footnote)">${out.note}</p>` : "") +
    (out.extra && state.rung >= 2 ? out.extra : "");

  const panel = document.getElementById("panel");
  const body = state.sel ? panelFor(state.sel) : null;
  if (body) { panel.hidden = false; panel.innerHTML = body; } else { panel.hidden = true; panel.innerHTML = ""; }
  document.getElementById("legend").innerHTML = legendFor(state.aspect);
  fitLedger();
  updateFold();
}
document.getElementById("stage").addEventListener("scroll", updateFold, { passive: true });
addEventListener("resize", () => { fitLedger(); updateFold(); });

/* ---------------------------------------------------------------- events -- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-aspect],[data-rung],[data-sel],[data-pick],[data-goto],[data-flow],[data-close]");
  if (!t) return;
  if (t.dataset.aspect) return go({ aspect: t.dataset.aspect, rung: 1, sel: null });
  if (t.dataset.rung) return go({ rung: +t.dataset.rung });
  if (t.dataset.close) return go({ sel: null });
  if (t.dataset.flow) return go({ sel: t.dataset.flow });
  if (t.dataset.goto) { const [a, id] = t.dataset.goto.split(":"); return go({ aspect: a, sel: id }); }
  const id = t.dataset.sel || t.dataset.pick;
  if (id) return go({ sel: state.sel === id ? null : id });
});
document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey) return;
  const i = "123456".indexOf(ev.key);
  if (i >= 0) return go({ aspect: ASPECTS[i].id, rung: 1, sel: null });
  if (ev.key === "[") return go({ rung: Math.max(1, state.rung - 1) });
  if (ev.key === "]") return go({ rung: Math.min(3, state.rung + 1) });
  if (ev.key === "Escape") return go({ sel: null });
});

readURL(); writeURL(); render();
</script>
</body>
