<!doctype html>
<!-- PROTOTYPE — throwaway. Same CodeCharta data as atlas-codecharta.html, drawn as a model
     standing over a lit floor: solid volumes under one warm key and one cool fill, with cast
     shadows, contact darkening and a graded ground. Every lighting term is a scalar on the
     band's own pigment — colour is the whole reading, and nothing may tint a roof.
     Data: ccsh unifiedparser + ccsh gitlogparser + ccsh merge  →  atlas-cc.json (1547 files). -->
<meta charset="utf-8">
<title>Argo · CodeCharta</title>
<link rel="stylesheet" href="atlas-tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #06090c; }
  /* Controls left, map middle, what is being read right. No page header: a title bar over
     a map is a caption on a thing that says its own name, and the count it carried is a
     provenance line, which belongs under the reading it qualifies. */
  #app { height: 100%; display: grid; min-height: 0;
    grid-template-columns: 258px 1fr 356px; grid-template-areas: 'side stage rail'; }
  body.nosb #app { grid-template-columns: 0 1fr 356px; }
  body.nosb #side { display: none; }

  #stage { grid-area: stage; position: relative; overflow: hidden; }
  /* the width/height attributes carry the backing store and are also CSS hints, so the
     element must be pinned to the stage or a retina canvas lays out at twice its size */
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  /* The interference texture is CSS, not canvas: a full-stage pattern fill at retina
     costs more per frame than every animated stroke put together. It is static and
     nearly invisible — a drifting band is something moving while the map is at rest,
     and a screen blend strong enough to see is a tax on every band's colour. */
  #scan { position: absolute; inset: 0; z-index: 40; pointer-events: none;
          mix-blend-mode: screen;
          background: repeating-linear-gradient(to bottom,
            rgba(150,225,255,.012) 0 1px, rgba(0,0,0,0) 1px 3px); }

  /* A list and a reading are different regions, both permanent: selecting inside the list
     can then never destroy the list, which is what a single panel that swapped its whole
     contents kept doing. */
  #rail { grid-area: rail; border-left: 1px solid rgba(126,214,240,.14); background: #0a1014;
          display: flex; flex-direction: column; min-height: 0; }
  #index { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #rail > .pad { padding: 14px 16px 0; flex: none; }
  #index .head { padding: 12px 16px 6px; }
  #rows { flex: 1; overflow-y: auto; min-height: 0; padding: 0 8px 12px; }
  /* One height, always. A panel that grew and shrank with what was picked moved the list
     above it on every click, which costs more than the space it saved. */
  #inspect { flex: 0 0 322px; display: flex; flex-direction: column;
             border-top: 1px solid rgba(126,214,240,.22); background: #0c1519; min-height: 0; }
  #read { flex: 1; overflow-y: auto; padding: 14px 16px 14px; }
  /* A click opens the file as a PAGE: the reading gets the whole rail and the list steps
     aside, because a file worth opening is worth more than 322px. The list is only hidden,
     never rebuilt, so coming back is the list you left rather than a fresh one. */
  body.page #index { display: none; }
  body.page #inspect { flex: 1; }
  #inspect .foot { flex: none; padding: 9px 16px 10px; border-top: 1px solid rgba(126,214,240,.1);
                   font: var(--t-footnote) var(--mono); color: var(--text-3); }
  /* The field sits outside #read, which is rebuilt on every pointer move: inside it, a search
     would lose focus and its own text between one keystroke and the next. */
  #find { position: relative; }
  #find input { width: 100%; box-sizing: border-box; padding: 8px 44px 8px 11px;
                border-radius: 8px; color: var(--text); font: var(--t-callout) var(--sans);
                background: rgba(140,170,190,.07);
                border: 1px solid rgba(150,180,200,.14); }
  #find input::placeholder { color: var(--text-off); }
  #find input:focus { outline: none; border-color: rgba(127,232,255,.45);
                      background: rgba(127,232,255,.07); }
  #find input::-webkit-search-cancel-button { filter: invert(1); opacity: .45; }
  #find #qn { position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
              font: var(--t-footnote) var(--mono); color: #7fe8ff; pointer-events: none; }

  #read .kind.pinned { display: flex; align-items: center; gap: 10px; }
  #read .kind .back { margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
                      cursor: pointer; padding: 3px 8px; border-radius: 6px; font: inherit;
                      text-transform: none; letter-spacing: 0; color: var(--text-1);
                      background: rgba(180,210,230,.09);
                      border: 1px solid rgba(160,195,215,.16); }
  #read .kind .back:hover { background: rgba(127,232,255,.16); color: var(--text); }
  #read .kind .back kbd { font-size: 9px; opacity: .6; }
  #read .kind { font: var(--t-footnote) var(--mono); text-transform: uppercase;
                letter-spacing: .12em; color: #5c8b99; }
  #read .name { font: 600 var(--t-title3)/1.25 var(--sans); margin-top: 5px;
                overflow-wrap: anywhere; }
  #read .where { font: var(--t-footnote)/1.45 var(--mono); color: var(--text-3);
                 margin-top: 6px; overflow-wrap: anywhere; }
  #read .pin { margin-top: 9px; font: var(--t-footnote) var(--mono); color: #7fe8ff; }

  #read table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  #read th { text-align: left; font: var(--t-footnote) var(--mono); text-transform: uppercase;
             letter-spacing: .1em; color: #5c8b99; font-weight: 400;
             padding-bottom: 6px; border-bottom: 1px solid rgba(126,214,240,.16); }
  #read td { padding: 5px 0; font-size: var(--t-callout); color: var(--text-2);
             border-bottom: 1px solid rgba(126,214,240,.07); }
  #read td.v { text-align: right; font: var(--t-callout) var(--mono); color: var(--text-1); }
  #read tr.zero td { color: var(--text-off); }
  #read tr.on td { color: var(--text-1); }
  #read tr.on td.k::before { content: '●'; color: #7fe8ff; font-size: 8px;
                             vertical-align: 2px; margin-right: 6px; }
  #read .idle { color: var(--text-3); font-size: var(--t-callout); line-height: 1.5; }
  #read .idle b { color: var(--text-2); font-weight: 600; }
  #read .idle kbd { font: var(--t-footnote) var(--mono); color: var(--text-1);
                    background: rgba(126,214,240,.09); border: 1px solid rgba(126,214,240,.2);
                    border-radius: 4px; padding: 1px 5px; }

  /* A sidebar, the way every other surface in this app has one: a column of the window,
     flush to its edge, with a hairline against what it borders. Not a card floating on the
     map — a floating card is a popover, and standing controls are not transient. */
  #side { grid-area: side; background: var(--sunken); min-height: 0;
    border-right: 1px solid var(--hairline); display: flex; flex-direction: column; }
  #side > header { display: flex; align-items: center; gap: 6px; height: 38px;
    padding: 0 8px 0 14px; border-bottom: 1px solid var(--hairline); flex: none; }
  #side > header h5 { font: 600 var(--t-callout) var(--sans); color: var(--text-1);
    margin-right: auto; }
  .sbtn { width: 26px; height: 24px; border-radius: var(--r-control); display: grid;
    place-items: center; color: var(--text-2); flex: none; }
  .sbtn:hover { background: var(--hover); color: var(--text-1); }
  .sbtn svg { width: 14px; height: 14px; }
  #side .body { flex: 1; overflow-y: auto; min-height: 0; padding: 4px 0 10px; }
  /* group header, group, group header, group — the shape a settings sidebar has */
  .sbsec { padding: 10px 14px 12px; }
  .sbsec + .sbsec { border-top: 1px solid var(--hairline); }
  .sbsec > h6 { font: var(--t-footnote) var(--mono); font-weight: 400;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text-off);
    margin-bottom: 9px; }
  /* Every field carries its name: a control with nothing beside it is a puzzle, whatever
     it is made of. */
  .srow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    min-height: 26px; font: var(--t-callout) var(--sans); color: var(--text-2); }
  .srow + .srow { margin-top: 7px; }
  .srow.off { opacity: .45; }
  .srow select { font: var(--t-callout) var(--sans); color: var(--text-1);
    background: var(--control); border: 1px solid var(--subtle);
    border-radius: var(--r-control); padding: 3px 6px; max-width: 152px; }
  .srow select:disabled { cursor: not-allowed; }

  .seg { display: flex; width: 138px; }
  .seg button { flex: 1; padding: 3px 0; font: var(--t-callout) var(--sans);
    color: var(--text-2); background: rgba(126,214,240,.07);
    border: 1px solid rgba(126,214,240,.2); border-left-width: 0; }
  .seg button:first-child { border-left-width: 1px; border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: rgba(126,214,240,.22);
    border-color: rgba(126,214,240,.45); color: var(--text-1); }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  /* Each view is a picture of itself, which two words in a menu are not. */
  .iseg { display: flex; width: 68px; }
  .iseg button { flex: 1; height: 24px; display: grid; place-items: center;
    color: var(--text-3); background: rgba(126,214,240,.07);
    border: 1px solid rgba(126,214,240,.2); border-left-width: 0; }
  .iseg button:first-child { border-left-width: 1px; border-radius: 7px 0 0 7px; }
  .iseg button:last-child { border-radius: 0 7px 7px 0; }
  .iseg button:hover { color: var(--text-1); background: rgba(126,214,240,.16); }
  .iseg button[aria-pressed="true"] { background: rgba(126,214,240,.22);
    border-color: rgba(126,214,240,.45); color: var(--text-1); }
  .iseg svg { width: 15px; height: 15px; }

  /* A boolean is a switch, and the switch is the button itself: a checkbox hidden under a
     label is a control that can look right and fire nothing. */
  .sws { width: 30px; height: 17px; border-radius: 999px; flex: none; position: relative;
    background: rgba(150,180,200,.16); border: 1px solid rgba(150,180,200,.2);
    transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out); }
  .sws::after { content: ''; position: absolute; left: 1px; top: 1px; width: 12px; height: 12px;
    border-radius: 50%; background: #9fb4bf; transition: transform 160ms var(--ease-out),
    background 160ms var(--ease-out); }
  .sws[aria-checked="true"] { background: rgba(127,232,255,.32);
    border-color: rgba(127,232,255,.55); }
  .sws[aria-checked="true"]::after { transform: translateX(13px); background: #cdf3ff; }

  /* when the sidebar is away, the control that brings it back sits where it was */
  #reveal { position: absolute; left: 12px; top: 12px; z-index: 60;
    background: rgba(9,20,26,.82); backdrop-filter: blur(14px);
    border: 1px solid rgba(126,214,240,.22); border-radius: 7px; }
  #reveal[hidden] { display: none; }

  #read .ties { margin-top: 18px; }
  #read .ties h4 { font: var(--t-footnote) var(--mono); text-transform: uppercase;
                   letter-spacing: .1em; color: #5c8b99; font-weight: 400;
                   padding-bottom: 6px; border-bottom: 1px solid rgba(126,214,240,.16); }
  #read .tie { display: flex; gap: 10px; padding: 5px 0; font-size: var(--t-callout);
               color: var(--text-2); border-bottom: 1px solid rgba(126,214,240,.07); }
  #read .tie span { overflow-wrap: anywhere; }
  #read .tie b { margin-left: auto; font: var(--t-callout) var(--mono); color: #7fe8ff; }
  /* A basename alone hides the only interesting part: a tie inside one folder is ordinary,
     and a tie across two packages is the finding. So the twin carries where it lives. */
  #read .tie { flex-wrap: wrap; cursor: pointer; border-radius: 5px;
               padding: 5px 6px; margin: 0 -6px; }
  #read .tie:hover { background: rgba(127,232,255,.09); }
  /* An index is scanned, not read: one line each, the folder trailing on the same line.
     The two-line row is for a tie, where the folder is the finding. */
  #read .tie.flat { flex-wrap: nowrap; align-items: baseline; gap: 6px; padding: 3px 0; }
  #read .tie.flat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #read .tie.flat em { flex-basis: auto; margin: 0 0 0 auto; padding-left: 8px;
                       white-space: nowrap; opacity: .62; }
  /* A radio list, because exactly one domain is ever being looked at. The mark is a real
     radio rather than a highlight: a highlighted row reads as "recently clicked", and the
     reader has to be able to see what is showing without remembering what they pressed. */
  #read .radios { margin-top: 2px; }
  #read .radio { display: flex; align-items: center; gap: 9px; cursor: pointer;
                 padding: 5px 8px 5px 6px; margin: 0 -8px; border-radius: 6px;
                 font-size: var(--t-callout); color: var(--text-dim); }
  #read .radio:hover { background: rgba(127,232,255,.07); }
  #read .radio:focus-visible { outline: 2px solid rgba(127,232,255,.55); outline-offset: -2px; }
  #read .radio u { flex: none; width: 12px; height: 12px; border-radius: 50%; text-decoration: none;
                   border: 1.5px solid rgba(160,190,210,.34); box-sizing: border-box; }
  #read .radio.on { color: var(--text); background: rgba(127,232,255,.10); }
  #read .radio.on u { border-color: #7fe8ff; box-shadow: inset 0 0 0 3px #7fe8ff; }
  #read .radio i { flex: none; width: 9px; height: 9px; border-radius: 2px; }
  #read .radio i.all { background: linear-gradient(135deg,#6f9a86,#b99a58,#9a6f86); }
  #read .radio span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #read .radio b { margin-left: auto; font: var(--t-callout) var(--mono); color: #7fe8ff; }
  #read .tie em { flex-basis: 100%; font-style: normal; font: var(--t-footnote) var(--mono);
                  color: var(--text-off); overflow-wrap: anywhere; }
  #read .tie i { flex-basis: 100%; font-style: normal; margin-top: 4px;
                 font: var(--t-footnote)/1.5 var(--sans); color: var(--text-3); }

  /* The legend is the sidebar's last section, because it describes what the sections
     above it just did. It is never hidden: a colour that means something only while you
     remember what you picked in a menu means nothing by the second minute. */
  #legend { font: var(--t-footnote) var(--mono); color: var(--text-3); }
  #legend .lead { text-transform: uppercase; letter-spacing: .1em; color: #5c8b99; }
  #legend #keyName { color: var(--text-2); }
  #legend .ramp { display: flex; align-items: center; gap: 0; margin: 7px 0 4px;
                  border-radius: 3px; overflow: hidden; }
  #legend .ramp i { flex: 1; height: 9px; }
  #legend .ends { display: flex; justify-content: space-between; color: var(--text-2); }
  #legend .foot { color: #5c8b99; margin-top: 1px; }
  #legend .reads { margin-top: 9px; padding-top: 9px; font: var(--t-footnote)/1.6 var(--sans);
                   color: var(--text-3); border-top: 1px solid rgba(126,214,240,.12); }
  #legend .reads b { color: var(--text-1); font-weight: 600; }
  .dim { opacity: .5; }

  /* the colour channel, drawn on the bands the volumes are lit with */
  #read .gauge { margin-top: 16px; }
  #read .gh { display: flex; align-items: baseline; font: var(--t-footnote) var(--mono);
              text-transform: uppercase; letter-spacing: .1em; color: #5c8b99; }
  #read .gh b { margin-left: auto; font: 600 var(--t-title3) var(--mono);
                color: var(--text-1); letter-spacing: 0; }
  /* The needle stands proud of the bands, so the bands are clipped and the needle is not —
     a file in the top percent sits at the very end, where a clip would eat it. */
  #read .track { position: relative; margin: 8px 0 5px; height: 10px; }
  #read .bars { display: flex; height: 100%; border-radius: 3px; overflow: hidden; }
  #read .bars i { height: 100%; }
  #read .track u { position: absolute; top: -3px; width: 2px; height: 16px;
                   margin-left: -1px; background: var(--text-1); border-radius: 1px;
                   box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  #read .ends { display: flex; justify-content: space-between;
                font: var(--t-footnote) var(--mono); color: #5c8b99; }
  #read .note { margin-top: 7px; font: var(--t-footnote)/1.5 var(--sans); color: var(--text-3); }
  /* Counts and dates are numbers a reader already understands, so they cost one line
     rather than a table. Only the ranked measure earns a gauge. */
  #read .facts { display: flex; flex-wrap: wrap; gap: 4px 13px; margin-top: 12px;
                 font: var(--t-callout) var(--sans); color: var(--text-3); }
  #read .facts b { font-family: var(--mono); color: var(--text-1); font-weight: 500; }
  #read tr[title] { cursor: help; }

  /* A question mark is a thing you can point at. A dotted underline is a thing you have to
     already know is there, which makes it no help to the reader who needs it most. */
  .ask { width: 15px; height: 15px; margin-left: 6px; padding: 0; flex: none;
         border: 1px solid rgba(126,214,240,.24); border-radius: 50%; background: none;
         color: var(--text-3); font: 10px/1 var(--mono); cursor: pointer; }
  .ask:hover, .ask[aria-expanded="true"] { border-color: #7fe8ff; color: #7fe8ff; }
  #pop { position: fixed; z-index: 90; width: 268px; padding: 12px 13px;
         border-radius: 10px; background: rgba(7,16,21,.96); backdrop-filter: blur(20px);
         border: 1px solid rgba(126,214,240,.26); box-shadow: 0 16px 44px rgba(0,0,0,.66);
         font: var(--t-footnote)/1.55 var(--sans); color: var(--text-2); }
  #pop h5 { margin: 0 0 6px; font: var(--t-footnote) var(--mono); text-transform: uppercase;
            letter-spacing: .1em; color: #5c8b99; }
  #pop p { margin: 0 0 8px; }
  #pop p:last-child { margin: 0; }
  #pop .src { color: #5c8b99; }
  #pop[hidden] { display: none; }

  /* A domain, once chosen, stays said: it is the standing context over its own file list,
     so opening a file ADDS a fact instead of replacing the one you came for. The hue is the
     left border — a bigger, quieter swatch than a square, and the hue the map is now lit in. */
  /* One way back, everywhere: the trail IS the control. A back button beside it would be a
     second thing doing the same job, and the reader would have to learn which one goes where. */
  #ctx { flex: none; padding: 11px 16px 12px; border-bottom: 1px solid rgba(126,214,240,.12);
    border-left: 3px solid transparent; }
  /* Lit only when a domain is chosen, in that domain's own hue — the one thing saying the
     rail and the map are showing the same selection. */
  #ctx.lit { border-left-color: var(--dh, #7fe8ff);
    background: linear-gradient(100deg,
      color-mix(in srgb, var(--dh, #7fe8ff) 13%, transparent), transparent 62%); }
  #ctx .crumbs { display: flex; flex-wrap: wrap; align-items: baseline;
    font: var(--t-footnote) var(--mono); color: var(--text-off); margin: 0 -6px; }
  /* Every crumb but the last is a control, so it is a target with a ground of its own —
     a line of text with a pointer cursor is not something anybody aims at. */
  #ctx .crumbs a { padding: 3px 6px; border-radius: 6px; color: var(--text-2); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  #ctx .crumbs a:hover { background: rgba(127,232,255,.13); color: var(--text); }
  #ctx .crumbs a:focus-visible { outline: 2px solid rgba(127,232,255,.55); outline-offset: -2px; }
  #ctx .crumbs i { font-style: normal; opacity: .45; padding: 0 1px; }
  /* Where you are, which is not a link: bigger, because it is the heading this bar used to
     carry as an <h4> and a location strip that ends in a whisper says nothing. */
  #ctx .crumbs b { padding: 3px 6px; font: 600 var(--t-callout) var(--sans);
    color: var(--text-1); overflow-wrap: anywhere; }
  #ctx p { font: var(--t-callout)/1.5 var(--sans); color: var(--text-2); margin: 6px 6px 0; }
  #ctx .row { margin: 9px 6px 0; font: var(--t-footnote)/1.6 var(--mono); color: var(--text-off); }
  #ctx .row b { color: var(--text-2); font-weight: 400; }

  .eyebrow { font: var(--t-footnote) var(--mono); text-transform: uppercase;
             letter-spacing: .12em; color: #5c8b99; }
  /* one line each, a swatch and a count: a domain is a thing with its own page */
  .drow { display: grid; grid-template-columns: 10px 1fr auto; gap: 9px; align-items: center;
    padding: 6px 9px; border-radius: 7px; cursor: pointer; }
  .drow:hover { background: rgba(126,214,240,.08); }
  .drow[aria-selected="true"] { background: rgba(127,232,255,.15);
    box-shadow: inset 0 0 0 1px rgba(127,232,255,.28); }
  .drow .sw { width: 10px; height: 10px; border-radius: 3px; }
  .drow .nm { font: var(--t-callout) var(--sans); color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .ct { font: var(--t-footnote) var(--mono); color: var(--text-3); }

  /* Two lines, not one: a basename is not an address — half a repo is called index.ts —
     and the name and the folder each need their own clip to survive. */
  .frow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start;
    padding: 6px 9px; border-radius: 6px; cursor: pointer; min-width: 0; }
  .frow em, .frow i { padding-top: 2px; }
  .frow:hover { background: rgba(126,214,240,.08); }
  .frow[aria-selected="true"] { background: rgba(127,232,255,.15); }
  .frow .p { min-width: 0; }
  .frow .p b { display: block; font: 400 var(--t-callout) var(--mono); color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the directory is clipped from its LEFT, because its last segment is the telling one */
  .frow .p s { display: block; direction: rtl; text-align: left; text-decoration: none;
    font: var(--t-footnote) var(--mono); color: var(--text-off); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .p s > span { direction: ltr; unicode-bidi: embed; }
  .frow em { font: var(--t-footnote) var(--mono); font-style: normal; color: var(--text-3); }
  .frow i { font: var(--t-footnote) var(--sans); font-style: normal; opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 118px;
    text-align: right; }
  /* A folder row is a way in, not a value: no swatch, because a colour that means nothing
     is noise, and a chevron because the click descends rather than opens. */
  .drow.dir { grid-template-columns: 1fr auto auto; }
  .drow.dir .nm { font-family: var(--mono); }
  .drow.dir .go { font: 13px var(--sans); color: var(--text-off); }
  .drow.dir:hover .go { color: var(--text-2); }
  #rows .idle { padding: 10px 9px; font-size: var(--t-callout); color: var(--text-3);
    line-height: 1.5; }

  /* The written layer is drawn differently from every measured one, on purpose: a reader
     must be able to tell at a glance which lines are counted and which are read. */
  #read .said { margin-top: 16px; padding: 11px 12px; border-radius: 8px;
                background: rgba(127,232,255,.06); border: 1px solid rgba(127,232,255,.18); }
  #read .said p { margin: 0; font: var(--t-callout)/1.55 var(--sans); color: var(--text-1); }

  /* A citation is one line at chip weight: a file with no domain must not shout louder

                     padding: 4px 10px 4px 8px; border-radius: 999px; font: inherit;

  #read .dom .chip:hover, #read .cite .chip:hover { background: rgba(127,232,255,.14); }

<script>
const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n * 10) / 10).toLocaleString('en-US');
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* the plan square, in its own units */
const PLAN = 1000;                  // the plan is laid out in a square this wide
const HMAX = 150;                   // the tallest building, in plan units
/* The floor is a real plane a fixed distance under the plates, which is what makes the
   model read as hovering rather than as a city standing on nothing. */
const FLOOR_Z = -22;
/* The tree is 86 folders deep in places, and a plate drawn at full strength at every
   level turns the ground into a flight of steps. Both fall away with depth: the outer
   two or three levels are the ones that carry the structure, and below that a folder
   only needs a gutter wide enough to separate its files from its neighbour's. */
/* The margin is the plate: it is the only part of a folder that is not under a building,
   so it is also the only part you can point at. Wide enough to hit at a glance, and the
   wall under it thick enough to be a target in its own right at the levels that carry
   the structure. */
const MARGIN = [0, 24, 19, 15, 12, 10, 9, 8];   // gap around a folder's contents, by rank
const PLATE = [10, 8, 6.5, 5, 4, 3.5, 3, 3];   // how thick a folder's plate is, by rank
/* A folder that holds no files of its own is never drawn, so the gutter it takes is a
   rim you can see and cannot click. It keeps just enough to separate its children. */
const GHOST_GAP = 3;

let DATA = null, DESC = {}, state = null;
/* path -> [[other path, temporal coupling], ...], strongest first. gitlogparser counts
   the commits that touched both files; the studio draws these as the lines between
   blocks. It is the one relation in the data — nothing here reads an import. */
const LINKS = new Map();
/* 999 pairs drawn at once is a ball of wool. The switch shows the strongest of them;
   pointing at a file always shows that file's own, however the switch is set. */
let TOP_TIES = [];
const TIE_CAP = 160;

/* ---------- squarified treemap (Bruls, Huizing & van Wijk 1999) ---------- */
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, i) => s + i.v, 0) || 1;
  let rest = items.slice().sort((a, b) => b.v - a.v);
  let area = { x, y, w, h }, remaining = total;

  while (rest.length) {
    const horizontal = area.w >= area.h;
    const side = horizontal ? area.h : area.w;
    let row = [], rowSum = 0, best = Infinity;
    for (const item of rest) {
      const trySum = rowSum + item.v;
      const thick = (trySum / remaining) * (horizontal ? area.w : area.h);
      const worst = Math.max(...[...row, item].map(it => {
        const along = (it.v / trySum) * side || 1e-6;
        return Math.max(thick / along, along / thick);
      }));
      if (worst > best && row.length) break;
      row.push(item); rowSum = trySum; best = worst;
    }
    const thick = (rowSum / remaining) * (horizontal ? area.w : area.h);
    let along = horizontal ? area.y : area.x;
    for (const it of row) {
      const len = (it.v / rowSum) * side;
      out.push(horizontal ? { it, x: area.x, y: along, w: thick, h: len }
                          : { it, x: along, y: area.y, w: len, h: thick });
      along += len;
    }
    if (horizontal) { area.x += thick; area.w -= thick; }
    else { area.y += thick; area.h -= thick; }
    remaining -= rowSum;
    rest = rest.slice(row.length);
  }
  return out;
}

/* ---------- metrics ---------- */
const at = (n, k) => (n.attributes && n.attributes[k]) || 0;

/* A folder's value on any metric is the sum of its files, which is what the
   studio does too — it keeps a parent's footprint equal to its contents. */
function roll(n, k) {
  if (n.type === 'File') return at(n, k);
  return (n.children || []).reduce((s, c) => s + roll(c, k), 0);
}
function leaves(n, out = []) {
  if (n.type === 'File') out.push(n); else (n.children || []).forEach(c => leaves(c, out));
  return out;
}
/* The domain tiling re-parents every file, so a box's path can no longer be read off the
   walk that built it. The real path is stamped on the node once, from the folder tree, and
   every lookup downstream — notes, ties, the pin — goes on working in either tiling. */
function stampPaths(n, pre = '') {
  const here = pre ? pre + '/' + n.name : n.name;
  if (n.type === 'File') { n.__path = here; return; }
  (n.children || []).forEach(c => stampPaths(c, here));
}

/* A test file is recognisable in every language that has tests without knowing which one
   this is: the word is in the filename, or it names a directory on the way down. Nothing
   here is a list of this repo's own folders. */
const TESTY = p => /(^|[^a-z])(tests?|specs?)([^a-z]|$)/i.test(p.split('/').pop())
  || p.split('/').slice(0, -1).some(d => /^(__)?(tests?|specs?)(__)?$/i.test(d));

/* Tests are half of many repositories and they answer a different question from the code
   they cover, so hiding them is a view of the same map rather than a different map. The tree
   is rebuilt without them, which is what makes the domains recluster too — with the tests in,
   a domain's largest folder is almost always somebody's test directory. */
function prune(n) {
  if (n.type === 'File') return TESTY(n.__path || n.name) ? null : n;
  const kids = (n.children || []).map(prune).filter(Boolean);
  return kids.length ? { ...n, children: kids } : null;
}
let PRUNED = null;
const live = () => state && state.noTests ? (PRUNED = PRUNED || prune(DATA) || DATA) : DATA;

/* Every term has to appear somewhere in the path, which is the one rule that behaves the same
   on a repo of Swift and a repo of Python: no ranking, no fuzziness, nothing to learn. A
   domain's name counts as part of a file's path, so "permission gate" finds a domain's files
   even though no filename says it. */
function hits() {
  const q = (state && state.q || '').trim().toLowerCase();
  if (!q) return null;
  const terms = q.split(/\s+/);
  const out = new Set();
  for (const f of leaves(live())) {
    const c = DOM && domOf(f.__path);
    const hay = (f.__path + ' ' + (c ? domName(c) + ' ' + c.tokens.join(' ') : '')).toLowerCase();
    if (terms.every(t => hay.includes(t))) out.add(f.__path);
  }
  return out;
}
let HITS = null;
const refind = () => { HITS = hits(); };

/* ---------- domains ---------- */
/* Every other number on this page is measured. These are inferred, from two signals every
   repository has — what files are called, and what changes together — and the recovery
   literature is blunt that inference here is unreliable. So they are a third kind of fact,
   said as such, and a file is allowed to belong to no domain at all. */
let LIB = null, CO = null, DOM = null, domKey = '';
const DOM_ALPHA = 0.6, DOM_DIRW = 0;

/* One hue per domain, walked by the golden angle so neighbours in the list are never
   neighbours in hue, at the one saturation and lightness the rest of the page is painted at.
   Confidence rides on saturation: a domain we are unsure of arrives washed out, and the
   quantisation keeps the swatch cache from growing a colour per file. */
function domTone(rank, conf) {
  const hue = (rank * 137.508) % 360;
  const sat = 0.14 + 0.24 * (Math.round(conf * 5) / 5);
  return hsl(hue, sat, 0.47);
}
const UNSURE = [86, 96, 104];   // belongs to nothing we can name
const HUSH = [46, 56, 63];      // a domain that is not the one being looked at
function hsl(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const t = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
          : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return t.map(v => Math.round((v + m) * 255));
}

function domainsReady() { return !!(LIB && CO && DATA); }

/* The clustering can only offer the word a domain's filenames share, which is true and no use
   — "backlog", "deck". The name a reader needs comes from reading the code, so it arrives in
   the written layer like every other sentence a model produced, and is marked the same way.
   Without it the token stands in, so the map still works on a repo nobody has annotated. */
/* A written name is matched to a cluster by the files it was written about, not by an exact
   identity: hiding the tests re-clusters the whole repo, and a name that fell off every domain
   the moment you changed the view would be a name nobody could rely on. Three of the five
   files it was written from, still together, is the same domain by any reading. The score is
   taken over the files that are still on the map, so hiding the tests cannot starve a name
   that was written mostly about tests. */
function written(c) {
  if (!NOTES.domains) return null;
  const exact = NOTES.domains[c.key];
  if (exact) return exact;
  const mine = new Set(c.members.map(i => DOM.paths[i]));
  const here = new Set(DOM.paths);
  let best = null, score = 0;
  for (const w of Object.values(NOTES.domains)) {
    const live = (w.core || []).filter(f => here.has(f));
    if (live.length < 3) continue;
    const s = live.filter(f => mine.has(f)).length / live.length;
    if (s > score) { score = s; best = w; }
  }
  return score >= 0.5 ? best : null;
}
const domName = c => (written(c) || {}).name || c.name;
const domNote = c => (written(c) || {}).note || '';
function domains() {
  const k = DOM_ALPHA + '|' + DOM_DIRW + '|' + (state && state.noTests ? 't' : '');
  if (!domainsReady()) return null;
  if (DOM && domKey === k) return DOM;
  const files = leaves(live());
  const paths = files.map(f => f.__path);
  const t0 = performance.now();
  /* The sidecar interns its paths, so the edges arrive as index pairs and are named here
     rather than shipped named forty times over. */
  const named = CO.edges.map(([a, b, j]) => [CO.files[a], CO.files[b], j]);
  const rloc = new Map(paths.map((pp, i) => [pp, at(files[i], 'rloc')]));
  const r = LIB.cluster(paths, named,
    { alpha: DOM_ALPHA, dirWeight: DOM_DIRW, house: [CO.built && CO.built.repo],
      size: i => rloc.get(paths[i]) || 0 });
  r.ms = Math.round(performance.now() - t0);
  r.paths = paths;
  r.rank = new Map(r.clusters.map((c, i) => [c.id, i]));
  r.byPath = new Map();
  paths.forEach((pp, i) => r.byPath.set(pp, { id: r.of[i], conf: r.conf[i] }));
  r.node = new Map(paths.map((pp, i) => [pp, files[i]]));
  DOM = r; domKey = k;
  return r;
}

/* A file's colour under a domain: its domain's hue at its own confidence, or the one grey
   that means the clustering declined to place it. */
function domBase(path) {
  const d = DOM && DOM.byPath.get(path);
  /* Whether this file is in scope at all is `inScope`'s question, asked before this one. */
  if (!d || d.id < 0) return UNSURE;
  return domTone(DOM.rank.get(d.id), d.conf);
}

function selectDomain(id) {
  beginFade();
  closePage();
  if (id !== null && state.domSel === null) state.domTop = $('rows').scrollTop;
  state.domSel = id;
  rebuild(); detail(state.pinned || null); railIndex(); key(view.lo, view.hi); stamp();
}

/* The second tiling. The same boxes, partitioned on cluster instead of path, laid out by the
   same squarify — so nothing about the drawing changes except which rectangle a file is in.
   Area is the same measure it always was, which is why the reshuffle conserves it. */
function domainRoot() {
  const d = domains();
  if (!d) return live();
  const kids = d.clusters.map(c => ({
    name: domName(c), type: 'Folder', __dom: c,
    children: c.members.map(i => d.node.get(d.paths[i])),
  }));
  const loose = d.paths.filter((pp, i) => d.of[i] < 0).map(pp => d.node.get(pp));
  if (loose.length) kids.push({ name: 'unassigned', type: 'Folder', __dom: null, children: loose });
  return { name: 'domains', type: 'Folder', children: kids };
}

/* ---------- layout ---------- */
function layout(root, mArea, mHeight, maxH) {
  /* `rank` counts the plates you can actually see above a box, which is not the same as
     its depth in the tree: Packages, Sources and ArgoEngine-inside-ArgoEngine are folders
     of the build, not places in the code, and none of them is drawn. Sizing the gutters by
     depth spent the room on those, and left the plate you wanted a rim two pixels wide. */
  function walk(n, x, y, w, h, depth, rank, path) {
    const here = path ? path + '/' + n.name : n.name;
    if (n.type === 'File') {
      const z = maxH ? (at(n, mHeight) / maxH) * HMAX : 0;
      return { n, x, y, w, h, depth: rank, path: here, z0: 0, z1: Math.max(2, z), file: true, kids: [] };
    }
    /* A folder holding nothing but other folders owns no ground of its own. It still
       divides the plan, but it is not drawn, not named and not pickable — the plate you
       point at is always one that holds files. */
    const ghost = !(n.children || []).some(c => c.type === 'File');
    const t = ghost ? 0 : PLATE[Math.min(rank, PLATE.length - 1)];
    const me = { n, x, y, w, h, depth: rank, path: here, z0: -t, z1: 0, file: false, ghost, kids: [] };
    const m = ghost ? GHOST_GAP : MARGIN[Math.min(rank + 1, MARGIN.length - 1)];
    const ix = x + m, iy = y + m, iw = w - m * 2, ih = h - m * 2;
    if (iw <= 2 || ih <= 2) return me;
    const kids = (n.children || [])
      .map(c => ({ c, v: roll(c, mArea) })).filter(k => k.v > 0);
    for (const b of squarify(kids.map(k => ({ v: k.v, c: k.c })), ix, iy, iw, ih))
      me.kids.push(walk(b.it.c, b.x, b.y, b.w, b.h, depth + 1, rank + (ghost ? 0 : 1), here));
    return me;
  }
  const t = walk(root, 0, 0, PLAN, PLAN, 0, 0, '');
  occlude(t);
  return t;
}

/* ---------- crowding, per box ---------- */
/* An ambient-occlusion stand-in that costs one pass over the tree: a file is in shade in
   proportion to how many siblings share its plate and how small its own footprint is
   against theirs, released again by its own height, because a tower's upper storeys are in
   the open however tight the ground is. It is computed in plan units, so it means the same
   thing at every zoom — a screen-pixel version changes strength as you move the camera. */
function occlude(box) {
  const files = box.kids.filter(k => k.file);
  if (files.length) {
    const areas = files.map(f => f.w * f.h).sort((a, b) => a - b);
    const mid = areas[areas.length >> 1] || 1;
    const many = Math.min(1, Math.max(0, (files.length - 3) / 42));
    for (const f of files) {
      const small = Math.min(1, Math.max(0, 1 - (f.w * f.h) / (mid * 1.6)));
      const open = 1 - Math.min(0.62, (f.z1 / HMAX) * 1.5);
      f.ao = 1 - (many * 0.55 + small * 0.45) * 0.30 * open;
    }
  }
  for (const k of box.kids) occlude(k);
}

/* The plan does not depend on the camera, and turning the model must not pay for a
   fresh treemap — so the tree is kept and only the paint order is redone. */
let TREE = null, treeKey = '';
function tree() {
  const grouped = state.dom === 'group' && domainsReady();
  const k = state.area + '|' + state.height + '|' + (grouped ? domKey + 'g' : 'f')
          + (state.noTests ? '|t' : '');
  if (k !== treeKey) {
    const files = leaves(live());
    const maxH = Math.max(...files.map(f => at(f, state.height)), 1);
    TREE = layout(grouped ? domainRoot() : live(), state.area, state.height, maxH);
    fixPaths(TREE);
    treeKey = k;
  }
  return TREE;
}
/* A file box always carries the file's own path; a plate in the domain tiling carries a name
   no file has, prefixed so a note or a tie can never match one by accident. */
function fixPaths(box) {
  if (box.file) { box.path = box.n.__path || box.path; return; }
  if (box.n.__dom !== undefined) box.path = '@domain/' + box.n.name;
  box.kids.forEach(fixPaths);
}

/* A plate always sits behind everything standing on it, whichever way the plan is
   turned — so the order is the tree, and only siblings are sorted by depth. With
   translucent volumes this order is also the blend order, so it cannot be skipped. */
function paintOrder(box, out = []) {
  out.push(box);
  const kids = box.kids.slice();
  for (const k of kids) k.d = depth(k.x + k.w / 2, k.y + k.h / 2);
  kids.sort((a, b) => a.d - b.d);
  for (const k of kids) paintOrder(k, out);
  return out;
}

/* ---------- colour ---------- */
/* The studio bands a metric at two percentiles of what is on screen and paints
   the three bands. Nothing is a hue for its own sake — the band is the fact. */
/* One pigment per band, and nothing else. Every lighting, shade and contact term below is
   a scalar multiply on these three numbers, so a roof can never drift out of its own
   legend swatch — the legend is painted from the same call the roofs are. */
const BAND = [[96, 152, 132], [188, 150, 88], [194, 100, 80]];
/* A plate is lit ground, not a backdrop: it takes the same lamp, dark enough that the
   files standing on it stay the subject. */
const SLAB = [[38, 49, 56], [30, 40, 46], [24, 33, 39]];
/* the floor's own light, which is what the contour grid is drawn in */
const FOG = [26, 52, 64];
const GROUND = '#06090c';

const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a < 0.002 ? 0 : a.toFixed(3)})`;

/* ---------- the lamp ---------- */
/* One warm key, one cool fill, both fixed in the *model's* own space rather than the
   screen's, so turning the plan turns which side is lit. Five surface orientations exist
   here — four walls and a roof — so the light is solved five times and every face after
   that costs one multiply. */
const norm3 = v => { const m = Math.hypot(v[0], v[1], v[2]); return v.map(c => c / m); };
/* The plan direction matters: at the opening yaw the two visible walls are the -x and -y
   ones, so a lamp aimed between them lights both equally and every box goes flat. This one
   rakes across — one visible wall in the key, one in the fill. */
const KEY = norm3([-0.66, 0.36, 0.66]);
const FILL = norm3([0.58, -0.36, 0.30]);
const KEY_RGB = [1.00, 0.93, 0.82], FILL_RGB = [0.58, 0.76, 1.00];
const AMB_RGB = [0.30, 0.34, 0.39];
const KEY_I = 1.14, FILL_I = 0.32;
const NORMALS = { r: [0, 0, 1], px: [1, 0, 0], nx: [-1, 0, 0], py: [0, 1, 0], ny: [0, -1, 0] };
const FACE_ID = { r: 0, px: 1, nx: 2, py: 3, ny: 4 };
const LIT = {};
for (const [k, n] of Object.entries(NORMALS)) {
  const kd = Math.max(0, n[0] * KEY[0] + n[1] * KEY[1] + n[2] * KEY[2]);
  const fd = Math.max(0, n[0] * FILL[0] + n[1] * FILL[1] + n[2] * FILL[2]);
  const sky = Math.max(0, n[2]) * 0.16;
  LIT[k] = AMB_RGB.map((a, i) =>
    a + KEY_I * kd * KEY_RGB[i] + FILL_I * fd * FILL_RGB[i] + sky * FILL_RGB[i]);
}
/* how much of a wall's own light survives at its foot: the rest is blocked by whatever
   stands around it, which is all a contact shadow ever is */
const FOOT = 0.44;
/* the plan direction the key comes from, which every shadow, seam and lit edge reads */
const KEY_XY = norm3([KEY[0], KEY[1], 0]);

/* rgb() strings are the one real cost of repainting 1547 boxes, so shade is quantised to
   24 steps and every (pigment, orientation, shade) triple is built once. */
const SWATCH = new Map();
function tone(base, face, shade) {
  const q = Math.max(0, Math.min(24, Math.round(shade * 24)));
  const id = ((base[0] << 16) | (base[1] << 8) | base[2]) + FACE_ID[face] * 2e7 + q * 2e9;
  let s = SWATCH.get(id);
  if (s === undefined) {
    const m = LIT[face], k = q / 24;
    s = 'rgb(' + base.map((c, i) => Math.min(255, Math.round(c * m[i] * k))).join(',') + ')';
    SWATCH.set(id, s);
  }
  return s;
}
/* the roof a reader is asked to hold the legend against: the same call, at the shade a
   typical file's roof lands on, so the swatch is a measurement rather than a guess */
const PLAN_SHADE = 0.85;
const roofSwatch = i => tone(BAND[i], 'r', PLAN_SHADE);

function bands(k) {
  const v = sorted(k);
  if (!v.length) return [0, 0];
  const q = p => v[Math.min(v.length - 1, Math.floor(p * v.length))];
  return [q(0.5), q(0.85)];
}

/* One measure over every file, in order, kept because a bare 12 says nothing: the reader
   needs to know whether 12 is the calm end of this repo or the wild one. */
const SORTS = new Map();
function sorted(k) {
  if (!SORTS.has(k)) SORTS.set(k, leaves(DATA).map(f => at(f, k)).sort((a, b) => a - b));
  return SORTS.get(k);
}

/* Two measures over the same files, as one number. It answers the question a colour ramp
   always raises: is the red telling me anything the size did not already say? Nothing here
   is asserted — the correlation is computed from the same values the map is drawn from. */
function corr(j, k) {
  const f = leaves(DATA);
  const a = f.map(n => at(n, j)), b = f.map(n => at(n, k));
  const ma = a.reduce((x, y) => x + y, 0) / a.length;
  const mb = b.reduce((x, y) => x + y, 0) / b.length;
  let ab = 0, aa = 0, bb = 0;
  for (let i = 0; i < a.length; i++) {
    const u = a[i] - ma, v = b[i] - mb;
    ab += u * v; aa += u * u; bb += v * v;
  }
  return aa && bb ? ab / Math.sqrt(aa * bb) : 0;
}

/* said only when it is worth saying: a channel does not correlate with itself, and a weak
   correlation is the absence of a finding rather than one */
const CORRS = new Map();
function twin(k) {
  const a = state.area;
  if (k === a) return '';
  const id = k + '|' + a;
  if (!CORRS.has(id)) CORRS.set(id, corr(k, a));
  const r = CORRS.get(id);
  if (r < 0.5) return '';
  return `\n\nMoves with ${DESC[a].title} across all `
    + `${leaves(DATA).length.toLocaleString('en-US')} files: r = ${r.toFixed(2)}. `
    + `Much of this colour is size.`;
}

/* the share of files that score lower than this one, which is the position on the gauge */
function rank(v, k) {
  const s = sorted(k);
  let i = 0;
  while (i < s.length && s[i] < v) i++;
  return s.length ? i / s.length : 0;
}

/* ---------- camera ---------- */
/* The opening view. Yaw 45° puts both plan axes across the screen, which is what makes
   a city read as a city rather than as a wall; pitch 35.3° is the true isometric angle,
   where a unit cube's three visible faces come out equal. */
const YAW = Math.PI / 4, PITCH = 0.6155;
const cam = { yaw: YAW, pitch: PITCH, scale: 1, ox: 0, oy: 0 };
const C = PLAN / 2;

/* The two views are one camera. ZK is how much of the third dimension is left: 1 is the
   city, 0 is the treemap. It scales the heights and lifts the eye to infinity together,
   because a flat picture drawn through a finite eye is a shear, not a plan. Every distance,
   shadow, wall and lit edge in the page reads it, so there is one number to tween. */
let ZK = 1;
const flat = () => ZK < 0.02;
/* the city's own angles, kept while the plan is showing so switching back is a return */
let cityYaw = YAW, cityPitch = PITCH;
function setFlat(f) {
  ZK = 1 - f;
  cam.yaw = cityYaw * (1 - f);
  cam.pitch = cityPitch + (Math.PI / 2 - cityPitch) * f;
}
/* four trig calls per projected point is the whole cost of a fit; the angles change once
   per frame at most, so they are solved when they change and read otherwise */
let _sy = 0, _cy = 0, _sp = 0, _cp = 0, _ky = NaN, _kp = NaN;
function trig() {
  if (cam.yaw !== _ky) { _ky = cam.yaw; _sy = Math.sin(_ky); _cy = Math.cos(_ky); }
  if (cam.pitch !== _kp) { _kp = cam.pitch; _sp = Math.sin(_kp); _cp = Math.cos(_kp); }
}

/* The eye sits a finite distance from the plan and everything divides by how far away it
   is, which is what makes a receding floor read as a floor. CodeCharta's own studio does
   the same — its bundle builds `new PerspectiveCamera(45, ...)` — and an orthographic view
   of a big plan at a low tilt reads as a shear instead, because nothing converges.
   EYE is the distance that frames this plan at that same 45° field of view. */
const EYE = PLAN * 1.7;

function raw(x, y, z) {
  trig();
  const dx = x - C, dy = y - C, zz = z * ZK;
  const across = dx * _cy - dy * _sy;
  const into = dx * _sy + dy * _cy;
  const away = EYE + (into * _cp - zz * _sp) * ZK;   // distance along the view axis
  return [across / away, -(into * _sp + zz * _cp) / away];
}

function project(x, y, z) {
  const [px, py] = raw(x, y, z);
  return [px * cam.scale + cam.ox, py * cam.scale + cam.oy];
}

/* A hand-turned view lands a degree or two off square, and a lopsided diamond reads as a
   broken projection rather than as a near miss. Angles within 2.5° of a multiple of the
   step fall onto it; anywhere else the drag is free. */
function snap(a, step) {
  const near = Math.round(a / step) * step;
  return Math.abs(a - near) < 0.044 ? near : a;
}

/* how near a plan point is to the eye — larger is nearer, which is what the paint order,
   the choice of visible walls and the whole depth falloff ask for */
const depth = (x, y) => { trig(); return -((x - C) * _sy + (y - C) * _cy); };

/* the zoom at which the whole city fits the stage, at whatever angle it is turned to */
function baseScale() { return extent().k; }

/* The picture's real extent, measured rather than assumed. The tallest tower is nowhere
   near a corner, so a formula that reserves the full height at the far corner leaves the
   map sitting high with a band of nothing under it. */
function extent() {
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight, pad = 34;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const b of boxesNow()) {
    for (const [x, y] of [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]]) {
      for (const z of [b.z0, b.z1]) {
        const [px, py] = raw(x, y, z);
        x0 = Math.min(x0, px); x1 = Math.max(x1, px);
        y0 = Math.min(y0, py); y1 = Math.max(y1, py);
      }
    }
  }
  const k = Math.min((W - pad * 2) / (x1 - x0), (H - pad * 2) / (y1 - y0));
  return { k, mx: (x0 + x1) / 2, my: (y0 + y1) / 2, w: (x1 - x0) * k };
}

/* the layout of the moment: the drawn one when there is one, else a fresh one, because
   the first fit runs before anything has been drawn */
function boxesNow() {
  return view ? view.boxes : paintOrder(tree());
}

function fit() {
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
  const e = extent();
  cam.scale = e.k;
  cam.ox = W / 2 - e.mx * e.k;
  cam.oy = H / 2 - e.my * e.k;
}

/* ---------- the two layers ---------- */
/* Fifteen hundred translucent volumes cost three paths each and cannot be redrawn sixty
   times a second. The model is painted once per state change into `model`, and every
   frame composites that one bitmap and draws only what moves: the cords and whatever the
   pointer holds. The rise is the exception — it repaints the model itself. */
const cv = $('cv'), ctx = cv.getContext('2d');
const model = document.createElement('canvas');
const mctx = model.getContext('2d');
/* Two half-resolution buckets of solid black, one per softness, so a thousand shadows are
   blurred for the price of two blits rather than a thousand. */
const shortCv = document.createElement('canvas'), sctx = shortCv.getContext('2d');
const tallCv = document.createElement('canvas'), tctx = tallCv.getContext('2d');
const SHADOW_SCALE = 0.5;
let view = null;   // { boxes, lo, hi, seat, dLo, dSpan, top, bottom }
let W = 0, H = 0, DPR = 1;

/* the animated clocks, all in one place so reduced motion can silence them together */
let ft = [];        // the last composites, in ms — read by the harness
let mt = [];        // the last static rebuilds, in ms

/* ---------- the rise ---------- */
/* Buildings grow out of their plates from the middle of the plan outwards, with a touch of
   overshoot at the top of the travel, and the whole assembly is over in a second. It runs on
   load and on a reset, never on a channel change — a model that reassembles every time you
   touch a menu is a loading screen. */
const RISE_SPAN = 620, RISE_DUR = 400;
let riseT0 = 0, rising = false;
function rise() { if (CALM || state.plan) return; riseT0 = performance.now(); rising = true; }

/* ---------- lying down ---------- */
/* The one moment the two views explain each other: the heights collapse and the eye swings
   overhead on the same clock, so the city is seen to be the treemap rather than replaced by
   it. Eased at both ends by the page's own glide, and it settles on an exact 0 or 1. */
const VIEW_MS = 980;
let vT0 = 0, vFrom = 0, vTo = 0, turning = false;
function setView(plan) {
  if (state.plan === plan) return;
  if (plan && ZK === 1) { cityYaw = cam.yaw; cityPitch = cam.pitch; }
  state.plan = plan;
  state.hover = null;
  hideDef(); segUI();
  if (CALM) { setFlat(plan ? 1 : 0); fit(); rebuild(); }
  else { vFrom = ZK; vTo = plan ? 0 : 1; vT0 = performance.now(); turning = true; }
  detail(null); stamp();
}
/* ---------- the reshuffle ---------- */
/* Both tilings hold the same boxes at the same areas, so the move conserves every footprint
   and only ever changes where it is. Files leave in the order their domains are listed, which
   is the whole point of watching it: a domain gathers itself out of five different plates.
   The camera holds still through it. Laying the city down for the journey showed more of the
   motion, and cost the reader the one thing that makes the move legible — that it is the same
   city they were already looking at. */
const DOM_MS = 780, DOM_STAGGER = 300;
let morph = null;

function domUI() {
  for (const [id, m] of [['dOff', 'off'], ['dGroup', 'group']])
    $(id).setAttribute('aria-pressed', String(state.dom === m));
  const ready = domainsReady();
  $('dGroup').disabled = !ready;
  $('lDom').classList.toggle('off', !ready);
  /* In Domains mode the map is lit by domain and the measured channel is not read at all,
     so the menu says so rather than naming a measure nothing is drawn from — the same
     treatment `segUI` gives Height in a treemap, for the same reason. */
  const byDom = state.dom === 'group';
  $('mColour').disabled = byDom;
  $('lColour').classList.toggle('off', byDom);
}

/* Anything that changes which boxes exist or where they sit goes through here, so hiding the
   tests travels the same way regrouping does. A reader who has seen one move understands the
   next one, and a map that sometimes cuts and sometimes travels teaches nothing. */
function reshuffle(apply) {
  const from = CALM || !view ? null
    : new Map(view.boxes.filter(b => b.file).map(b => [b.path, [b.x, b.y, b.w, b.h]]));
  apply();
  treeKey = '';
  if (from) {
    for (const b of paintOrder(tree())) if (b.file) { b.mx = b.x; b.my = b.y; b.mw = b.w; b.mh = b.h; }
    morph = { t0: performance.now(), from, plate: 1 };
  }
  fit(); rebuild(); detail(null); railIndex(); stamp();
}

function setDom(mode) {
  if (state.dom === mode || (mode !== 'off' && !domainsReady())) return;
  const regroup = (mode === 'group') !== (state.dom === 'group');
  beginFade();
  const apply = () => {
    state.dom = mode; state.hover = null; state.pinned = null; state.domSel = null;
    state.folder = null; state.folderName = null; state.trail = []; closePage();
    hideDef(); domUI();
  };
  if (regroup) reshuffle(apply);
  else { apply(); treeKey = ''; fit(); rebuild(); detail(null); stamp(); }
}

/* The stagger is by destination domain, not by distance: the reader is being shown that a
   domain is one thing, so it has to arrive as one thing. */
function morphStep(now) {
  const span = DOM_MS + DOM_STAGGER;
  const u = Math.min(1, (now - morph.t0) / span);
  const ranks = DOM ? DOM.clusters.length : 1;
  for (const b of paintOrder(TREE)) {
    if (!b.file || b.mx === undefined) continue;
    const src = morph.from.get(b.path) || [b.mx, b.my, b.mw, b.mh];
    const d = DOM && DOM.byPath.get(b.path);
    const r = d && d.id >= 0 ? (DOM.rank.get(d.id) || 0) / Math.max(1, ranks - 1) : 1;
    const t = Math.max(0, Math.min(1, (now - morph.t0 - r * DOM_STAGGER) / DOM_MS));
    const e = glide(t);
    b.x = src[0] + (b.mx - src[0]) * e; b.y = src[1] + (b.my - src[1]) * e;
    b.w = src[2] + (b.mw - src[2]) * e; b.h = src[3] + (b.mh - src[3]) * e;
  }
  /* Out over the first fifth, in over the last: the plates that are leaving and the plates
     that are arriving are different plates, so they must not be on screen together. */
  morph.plate = u < 0.2 ? 1 - u / 0.2 : u > 0.8 ? (u - 0.8) / 0.2 : 0;
  fit();
  if (u >= 1) {
    for (const b of paintOrder(TREE)) if (b.file && b.mx !== undefined) {
      b.x = b.mx; b.y = b.my; b.w = b.mw; b.h = b.mh;
    }
    morph = null;
    fit(); rebuild(); detail(null);
  } else rebuild(true);
}

function segUI() {
  $('vCity').setAttribute('aria-pressed', String(!state.plan));
  $('vPlan').setAttribute('aria-pressed', String(!!state.plan));
  $('mHeight').disabled = !!state.plan;
  $('lHeight').classList.toggle('off', !!state.plan);
}
function riseZ(b, on) {
  if (!on || !b.file) return b.z1;
  const t = (performance.now() - riseT0 - b.rd * RISE_SPAN) / RISE_DUR;
  if (t <= 0) return 0;
  if (t >= 1) return b.z1;
  const u = t - 1, s = 1.15;
  return b.z1 * (1 + (s + 1) * u * u * u + s * u * u);
}

/* One 96px tile of noise, built once. Large smooth gradients on a near-black ground band in
   8-bit; the grain is what keeps them smooth, and it is a pattern fill rather than per-box
   work. It lives in the static layer, so a still frame is still still. */
let GRAIN = null;
function grain() {
  if (GRAIN) return GRAIN;
  const t = document.createElement('canvas'); t.width = t.height = 96;
  const c = t.getContext('2d'), im = c.createImageData(96, 96);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 118 + (Math.random() * 74 | 0);
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
  }
  c.putImageData(im, 0, 0);
  GRAIN = mctx.createPattern(t, 'repeat');
  return GRAIN;
}

/* ---------- the static model ---------- */
function rebuild(fast) {
  const t0 = performance.now();
  const st = $('stage');
  W = st.clientWidth; H = st.clientHeight; DPR = devicePixelRatio || 1;
  if (model.width !== W * DPR || model.height !== H * DPR) {
    model.width = W * DPR; model.height = H * DPR;
    cv.width = W * DPR; cv.height = H * DPR;
    shortCv.width = tallCv.width = Math.max(1, Math.round(W * DPR * SHADOW_SCALE));
    shortCv.height = tallCv.height = Math.max(1, Math.round(H * DPR * SHADOW_SCALE));
  }
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ss = DPR * SHADOW_SCALE;
  sctx.setTransform(ss, 0, 0, ss, 0, 0);
  tctx.setTransform(ss, 0, 0, ss, 0, 0);

  /* One tree, one layout, one set of colour bands. Zooming is the only way in, so a
     volume's colour means the same thing wherever you are looking from. */
  const boxes = paintOrder(tree());
  const [lo, hi] = bands(state.colour);

  /* the falloff is measured against what is actually on screen, so it reads the same
     whether you are over the whole repo or inside one folder */
  let dLo = Infinity, dHi = -Infinity;
  for (const b of boxes) {
    const d = depth(b.x + b.w / 2, b.y + b.h / 2);
    if (d < dLo) dLo = d;
    if (d > dHi) dHi = d;
  }
  const seat = new Map();
  for (const b of boxes) if (b.file) seat.set(b.path, b);
  /* how far out from the middle of the plan a box sits, which is the only thing the rise
     staggers on — it is a plan measurement, so the wave is the same at any zoom */
  for (const b of boxes) if (b.file && b.rd === undefined)
    b.rd = Math.hypot(b.x + b.w / 2 - C, b.y + b.h / 2 - C) / (C * 1.42);
  view = { boxes, lo, hi, seat, dLo, dSpan: (dHi - dLo) || 1, top: H, bottom: 0 };

  mctx.clearRect(0, 0, W, H);
  drawFloor(boxes);
  /* Every plate, then the shadows they and their buildings cast, then every building. The
     split is safe because plate tops are all coplanar at z=0 and tile the plan, so a plate
     can only ever hide another plate's skirt — never anything standing up. It is also what
     lets the shadows be blurred once instead of per box. */
  const plates = boxes.filter(b => !b.file && !b.ghost), files = boxes.filter(b => b.file);
  for (const b of plates) drawBox(mctx, b, undefined, fast);
  /* A shadow is a statement about height. The treemap shows none, so it casts none —
     every lighting term here fades out on the same ZK the heights collapse on. */
  if (ZK > 0.01) {
    sctx.clearRect(0, 0, W, H); tctx.clearRect(0, 0, W, H);
    sctx.fillStyle = tctx.fillStyle = '#000';
    /* A plate's own skirt is short and always correct — its shadow can only ever fall on the
       plate outside it — so it keeps a fixed weight rather than being sized by its thickness. */
    for (const b of plates) castShadow(b, b.z1 - b.z0, sctx, 0.55 * ZK);
    for (const b of files) {
      const z = riseZ(b, rising);
      const wt = shadowWeight(z) * ZK;
      if (wt > 0.01) castShadow(b, z, z > 40 ? tctx : sctx, wt);
    }
    /* Both buckets go down before any building does, so a shadow can only ever land on the
       plate its caster stands on. There is no depth test in a flat buffer, so a pass that put
       these over the roofs would smear a tower across flat files a folder away. */
    blit(shortCv, 2.2, 0.50);
    blit(tallCv, 5.5, 0.46);
  }
  for (const b of files) drawBox(mctx, b, riseZ(b, rising), fast);
  if (!fast) {
    for (const b of boxes) noteMark(b);
    mctx.save();
    mctx.globalCompositeOperation = 'overlay';
    mctx.globalAlpha = 0.05; mctx.fillStyle = grain();
    mctx.fillRect(0, 0, W, H);
    mctx.restore();

    $('count').textContent = `${leaves(live()).length.toLocaleString('en-US')} files`
      + (state.noTests ? ` · tests hidden` : '')
      + (DOM ? ` · ${DOM.clusters.length} domains` : '')
      + ` · measured by CodeCharta`;
    key(lo, hi);
  }
  mt.push(performance.now() - t0);
  if (mt.length > 120) mt = mt.slice(-60);
}

/* how sharp a box is: 1 at the eye, 0 at the far edge of what is drawn */
const nearness = b => (depth(b.x + b.w / 2, b.y + b.h / 2) - view.dLo) / view.dSpan;

/* ---------- the floor ---------- */
/* Drawn, not implied. A contour grid on its own plane, brighter under every plate, so the
   volumes have something to hover over. */
const GRID_N = 32;
/* how far past the plan the floor runs. Just past the footprint: a floor that reaches the
   edge of the picture is the subject, and the model is what the reader came for. */
const FLOOR_PAD = 0.018;
function gridPath(g, n, from, to) {
  g.beginPath();
  for (let i = 0; i <= n; i++) {
    const u = from + (to - from) * (i / n);
    let p = project(from, u, FLOOR_Z), q = project(to, u, FLOOR_Z);
    g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
    p = project(u, from, FLOOR_Z); q = project(u, to, FLOOR_Z);
    g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
  }
}

function drawFloor(boxes) {
  const pad = PLAN * FLOOR_PAD;
  /* The ground is graded, not uniform: the lamp reaches the middle of the plan and falls
     away to the corners, so the picture has a centre of attention. */
  const c0 = project(C, C, FLOOR_Z);
  const gr = mctx.createRadialGradient(c0[0], c0[1], 0, c0[0], c0[1], Math.max(W, H) * 0.72);
  gr.addColorStop(0, '#0b1015'); gr.addColorStop(0.5, '#080c10'); gr.addColorStop(1, GROUND);
  mctx.fillStyle = gr; mctx.fillRect(0, 0, W, H);
  /* the plates' own light on the floor, and it stacks: a deeply nested corner of the repo
     sits over more plates than a shallow one, and comes out brighter for it */
  for (const b of boxes) {
    if (b.file || b.ghost) continue;
    const q = [project(b.x, b.y, FLOOR_Z), project(b.x + b.w, b.y, FLOOR_Z),
               project(b.x + b.w, b.y + b.h, FLOOR_Z), project(b.x, b.y + b.h, FLOOR_Z)];
    quad(mctx, q[0], q[1], q[2], q[3], rgba([70, 175, 205], 0.018 / (1 + b.depth * 0.45)));
  }
  mctx.lineWidth = 1;
  mctx.strokeStyle = rgba(FOG, 0.10);
  gridPath(mctx, GRID_N, -pad, PLAN + pad);
  mctx.stroke();
  mctx.strokeStyle = rgba([80, 178, 205], 0.055);
  gridPath(mctx, 8, -pad, PLAN + pad);
  mctx.stroke();

  vignette(mctx);
}

/* the far floor has to go out somewhere, and a hard edge reads as a table top. Anything
   that lights the floor later is bounded by the same falloff, or it lights nothing. */
function vignette(g) {
  const c = project(C, C, FLOOR_Z);
  const r = g.createRadialGradient(c[0], c[1], Math.min(W, H) * 0.30,
                                   c[0], c[1], Math.max(W, H) * 0.62);
  r.addColorStop(0, 'rgba(6,9,12,0)');
  r.addColorStop(1, GROUND);
  g.fillStyle = r; g.fillRect(0, 0, W, H);
}

/* ---------- one volume ---------- */
/* The two walls you can see depend on which way the plan is turned, so they are
   found each frame rather than fixed to the +x and +y sides. */
function nearWalls(x, y, w, h) {
  const c = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  let near = 0, best = -Infinity;
  c.forEach((p, i) => { const d = depth(p[0], p[1]); if (d > best) { best = d; near = i; } });
  return [[c[(near + 3) % 4], c[near]], [c[near], c[(near + 1) % 4]]];
}
/* the four plan corners with the nearest one's index, which is what decides both which
   edges are lit and which one is the silhouette's far seam */
function corners(x, y, w, h) {
  const c = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  let near = 0, best = -Infinity;
  c.forEach((p, i) => { const d = depth(p[0], p[1]); if (d > best) { best = d; near = i; } });
  return { c, near };
}

/* which world side of the box a wall sits on, which is the only thing its lighting reads */
function pickFace(x, y, a, e) {
  if (a[1] === e[1]) return a[1] === y ? 'ny' : 'py';
  return a[0] === x ? 'nx' : 'px';
}
/* Every reason a file's colour can change, in one place, so the crossfade below has a single
   before and a single after to interpolate between rather than a rule per feature.
   A search is a question about the whole map, so the map answers it: what does not match goes
   to the ground colour and what does keeps whatever it was already saying. */
/* ONE question, asked once, in TWO layers: what a click COMMITTED and what the pointer is
   PREVIEWING over the top of it. A search, a chosen domain, a folder the rail descended into
   and a row under the pointer are narrowings of the same kind, so they compose — a file is
   lit when it is inside ALL of them, and everything else drops to the ground colour.
   Dim is the only channel scope uses: nothing here moves a box, recolours one, or stops one
   being picked. An out-of-scope box is still drawn, still hit-tested and still readable. */
const under = (path, dir) => path === dir || path.startsWith(dir + '/');
const inDomain = (path, id) => { const d = DOM && DOM.byPath.get(path); return !!d && d.id === id; };

function inScope(path) {
  if (HITS && !HITS.has(path)) return false;
  if (state.domSel !== null && DOM && !inDomain(path, state.domSel)) return false;
  if (state.folder && !under(path, state.folder)) return false;
  const p = state.peek;
  if (!p) return true;
  if (p.dir !== undefined && !under(path, p.dir)) return false;
  if (p.dom !== undefined && !inDomain(path, p.dom)) return false;
  if (p.file !== undefined && path !== p.file) return false;
  return true;
}

/* The preview never commits and never survives the pointer leaving. Setting it to what it
   already is does nothing, which is what makes the restore idempotent however fast the
   pointer crosses the list. */
function setPeek(p) {
  const key = p ? JSON.stringify(p) : '';
  if (key === (state.peekKey || '')) return;
  beginFade(PEEK_MS);
  state.peek = p; state.peekKey = key;
  rebuild(true);
}
const rowScope = r => !r ? null
  : r.dataset.dir !== undefined ? { dir: r.dataset.dir }
  : r.dataset.dom !== undefined ? { dom: +r.dataset.dom }
  : r.dataset.go !== undefined ? { file: r.dataset.go } : null;

/* Where a box SITS and what colour it IS are two questions with two controls. The MODE
   answers the colour one — Domains mode lights by domain, Folders mode by the measured
   channel — and a selection only ever narrows the scope. A selection that also repainted
   the map would be a third arrangement nobody asked for. */
function fileBase(b) {
  if (!inScope(b.path)) return HUSH;
  return state.dom === 'group' ? domBase(b.path) : BAND[bandOf(b)];
}

/* Colour changes are dissolves, not cuts. Switching the channel, turning domains on, picking
   one of them out, typing in the search — each of those repaints most of the map at once, and
   at that size a cut reads as the map being replaced rather than answering. */
const FADE_MS = 420;
/* A preview is quicker in and quicker out than a commitment: a hover that animates at the
   weight of a click reads as though the click already happened. */
const PEEK_MS = 150;
let fading = null;
function beginFade(ms) {
  if (CALM || !view) return;
  const from = new Map();
  for (const b of view.boxes) if (b.file) from.set(b.path, fileBase(b));
  /* one object, replaced whole — a pointer running down a long list cannot stack fades */
  fading = { from, t0: performance.now(), ms: ms || FADE_MS };
}
function tinted(b) {
  const to = fileBase(b);
  if (!fading) return to;
  const u = Math.min(1, (performance.now() - fading.t0) / fading.ms);
  const fr = fading.from.get(b.path);
  if (!fr) return to;
  const e = glide(u);
  /* Quantised, because tone() caches one string per pigment and a continuous blend over
     fifteen hundred boxes would mint a new entry every frame. */
  return [0, 1, 2].map(i => Math.round((fr[i] + (to[i] - fr[i]) * e) / 4) * 4);
}

const bandOf = b => { const v = at(b.n, state.colour); return v > view.hi ? 2 : v > view.lo ? 1 : 0; };

/* The footprint, pushed across the plan away from the key by a share of the height. A true
   shadow from that elevation is longer than the plate it lands on and reads as somebody
   else's, so the slope is compressed — the same compression for every box, which is what
   keeps it readable. It is all in plan units, so it does not change with the zoom. */
const SUN_SLOPE = 0.40;
/* How much light a caster actually blocks, which is its height. A block two units tall
   blocks almost none, and stamping one anyway leaves a smudge on the plate with nothing
   standing over it — a field of flat files must come out with no shadows in it at all. */
const shadowWeight = h => Math.min(1, Math.max(0, (h - 4) / 34));
function castShadow(b, height, t, weight) {
  t.globalAlpha = weight;
  const c = height * SUN_SLOPE * ZK, ox = -KEY_XY[0] * c, oy = -KEY_XY[1] * c;
  const q = [project(b.x + ox, b.y + oy, 0), project(b.x + b.w + ox, b.y + oy, 0),
             project(b.x + b.w + ox, b.y + b.h + oy, 0), project(b.x + ox, b.y + b.h + oy, 0)];
  t.beginPath();
  t.moveTo(q[0][0], q[0][1]); t.lineTo(q[1][0], q[1][1]);
  t.lineTo(q[2][0], q[2][1]); t.lineTo(q[3][0], q[3][1]);
  t.closePath(); t.fill();
  t.globalAlpha = 1;
}

function blit(src, px, alpha) {
  mctx.save();
  mctx.globalAlpha = alpha; mctx.filter = `blur(${px}px)`;
  mctx.drawImage(src, 0, 0, W, H);
  mctx.restore();
}

/* Opaque, in paint order, so a box hides what stands behind it. The pigment is the band and
   nothing may tint it: every term here is a scalar on the same three numbers. */
function drawBox(g, b, zTop, fast) {
  if (b.ghost) return;
  /* Mid-reshuffle a file is between two plates and belongs to neither, so the plates go. They
     fade rather than vanish: a plate that blinks out under fifteen hundred moving boxes reads
     as the boxes jumping, which is what the eye blames for a cut it did not see. */
  /* The outermost plate is the ground the whole city stands on and belongs to neither
     partition, so it stays: without it the boxes travel over nothing and the move reads as
     the map being replaced rather than rearranged. */
  const inner = morph && !b.file && b.depth > 0;
  if (inner) {
    if (morph.plate <= 0.01) return;
    g.save(); g.globalAlpha = morph.plate;
  }
  const { x, y, w, h } = b;
  const z0 = b.z0, z1 = zTop === undefined ? b.z1 : zTop;
  const t = Math.max(0, Math.min(1, nearness(b)));
  const { c } = corners(x, y, w, h);
  const roof = c.map(p => project(p[0], p[1], z1));
  const rw = Math.max(...roof.map(p => p[0])) - Math.min(...roof.map(p => p[0]));
  /* the narrow way across the roof, which is what decides whether a hairline is a seam or
     simply eats the block: a one-pixel stroke on a three-pixel roof is the whole roof */
  const rs = Math.min(rw, Math.max(...roof.map(p => p[1])) - Math.min(...roof.map(p => p[1])));
  for (const p of roof) {
    if (p[1] < view.top) view.top = p[1];
    if (p[1] > view.bottom) view.bottom = p[1];
  }

  const base = b.file ? tinted(b) : SLAB[Math.min(2, b.depth)];
  /* Distance, as a scalar on the pigment rather than a wash toward the air's own colour:
     a far green roof has to stay a darker green, never a greyer one. */
  const dim = 0.88 + 0.12 * t;
  /* Crowding shade and distance are both depth cues, so both retire into PLAN_SHADE, which
     is the shade the legend swatch is painted at — flat on, a band *is* its swatch. */
  const lit = (b.file ? (b.ao === undefined ? 1 : b.ao) : 1) * dim;
  const ao = PLAN_SHADE + (lit - PLAN_SHADE) * ZK;

  const tall = z1 - z0 >= 2;
  if ((b.file || tall) && ZK > 0.02) {
    for (const [a, e] of nearWalls(x, y, w, h)) {
      const face = pickFace(x, y, a, e);
      const p0 = project(a[0], a[1], z0), p1 = project(e[0], e[1], z0);
      const p2 = project(e[0], e[1], z1), p3 = project(a[0], a[1], z1);
      /* Height matters: a wall takes its full share of the key near the roof and keeps only
         FOOT of it at the base, where everything around it blocks the light. Only a wall
         wide enough to show the falloff pays for a gradient — on a six-pixel wall it is one
         flat colour anyway, and a gradient per box on fifteen hundred is the frame budget. */
      let fill = tone(base, face, ao * (0.62 + 0.38 * FOOT));
      if (rw > 11) {
        const lg = g.createLinearGradient((p3[0] + p2[0]) / 2, (p3[1] + p2[1]) / 2,
                                          (p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2);
        lg.addColorStop(0, tone(base, face, ao));
        lg.addColorStop(1, tone(base, face, ao * FOOT));
        fill = lg;
      }
      quad(g, p0, p1, p2, p3, fill);
    }
  }

  /* the roof carries a very slight sheen across itself, brightest on the side the lamp is */
  let rf = tone(base, 'r', ao);
  if (rw > 16 && !fast && ZK > 0.02) {
    let hi = 0, lo = 0, hs = -Infinity, ls = Infinity;
    c.forEach((p, i) => {
      const s = p[0] * KEY_XY[0] + p[1] * KEY_XY[1];
      if (s > hs) { hs = s; hi = i; }
      if (s < ls) { ls = s; lo = i; }
    });
    const lg = g.createLinearGradient(roof[hi][0], roof[hi][1], roof[lo][0], roof[lo][1]);
    lg.addColorStop(0, tone(base, 'r', ao * 1.07));
    lg.addColorStop(1, tone(base, 'r', ao * 0.93));
    rf = lg;
  }
  quad(g, roof[0], roof[1], roof[2], roof[3], rf);
  if (inner) { g.restore(); return; }

  const ring = () => {
    g.beginPath();
    g.moveTo(roof[0][0], roof[0][1]);
    for (let i = 1; i < 4; i++) g.lineTo(roof[i][0], roof[i][1]);
    g.closePath();
  };
  g.lineWidth = 1;
  if (!b.file) {
    g.strokeStyle = `rgba(190,228,244,${(0.13 / (1 + b.depth * 0.7)).toFixed(3)})`;
    ring(); g.stroke();
    return;
  }
  /* The seam. Every block has a dark contact edge against whatever stands next to it —
     without it a run of same-band neighbours is one field of colour. */
  if (rs > 2.4) { g.strokeStyle = 'rgba(0,0,0,.46)'; ring(); g.stroke(); }
  /* The lit rim describes an edge between two faces. Flat on there is one face, so a
     highlight there would be the single loudest tell of lighting that is not being shown. */
  if (rs > 4.5 && ZK > 0.02) edges(g, x, y, w, h, z1, t);
}

/* The one-pixel highlight goes only where the lamp actually reaches, and the cool rim only
   where the fill does. A highlight on the unlit side is the single tell of fake lighting. */
function edges(g, x, y, w, h, z, t) {
  const sides = [['ny', [x, y], [x + w, y]], ['py', [x, y + h], [x + w, y + h]],
                 ['nx', [x, y], [x, y + h]], ['px', [x + w, y], [x + w, y + h]]];
  const run = (test, style) => {
    g.strokeStyle = style;
    g.beginPath();
    let any = false;
    for (const [f, a, e] of sides) {
      const n = NORMALS[f];
      if (!test(n[0] * KEY[0] + n[1] * KEY[1], n[0] * FILL[0] + n[1] * FILL[1])) continue;
      const p = project(a[0], a[1], z), q = project(e[0], e[1], z);
      g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); any = true;
    }
    if (any) g.stroke();
  };
  run(k => k > 0.06, `rgba(255,244,226,${(0.30 + 0.22 * t).toFixed(3)})`);
  run((k, f) => k <= 0.06 && f > 0.06, `rgba(158,214,242,${(0.14 + 0.10 * t).toFixed(3)})`);
}

/* Twenty-five noted files among fifteen hundred is a needle in a field, so the note has to
   be visible from the map rather than found by pointing at things until one appears. */
function noteMark(b) {
  if (!b.file || !NOTES.files || !NOTES.files[b.path]) return;
  const roof = [project(b.x, b.y, b.z1), project(b.x + b.w, b.y + b.h, b.z1)];
  const rw = Math.abs(roof[1][0] - roof[0][0]);
  if (rw < 7) return;
  const cx = (roof[0][0] + roof[1][0]) / 2, cy = (roof[0][1] + roof[1][1]) / 2;
  const rad = Math.max(1.8, Math.min(3.6, rw * 0.09));
  mctx.beginPath(); mctx.arc(cx, cy, rad * 2.1, 0, 7);
  mctx.fillStyle = 'rgba(140,240,255,.14)'; mctx.fill();
  mctx.beginPath(); mctx.arc(cx, cy, rad, 0, 7);
  mctx.fillStyle = '#dcf6ff'; mctx.fill();
}

function quad(g, a, b, c, d, fill) {
  g.fillStyle = fill;
  g.beginPath();
  g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]);
  g.closePath(); g.fill();
}

/* ---------- names ---------- */
/* ONE RULE, every view: a name belongs to a SURFACE, is clipped to it, is drawn only when
   that surface can hold it at a legible size, and when more surfaces qualify than the budget
   allows the biggest win. A folder's surface is its plate, a file's is its cell in the plan
   and its roof quad in the city. Nothing floats: a label that is not inside the thing it
   names reads as a sticker, and the reader cannot tell what it names.
   The one exception is a CALLOUT — the pill — spent only on the handful of boxes the reader
   asked about by name: the pointer, the pin, a search hit, and only when their own face has
   no room for the answer. Those are annotations about one thing; everything else is a label
   on a face. All of it is drawn in the animated layer, so a wheel notch costs no repaint. */
const labels = [];        // the screen rects taken this frame
const named = new Map();  // path -> the rect its name took, so nothing is named twice
const overlaid = [];      // [name, labeller, path] this frame — read by the harness
const marked = [];        // and what was pointed at rather than named again

const SIZE_ON = 11;       // the size a name must fit at to arrive
const SIZE_OFF = 9;       // and the size it may shrink to before it goes — hysteresis, so a
                          // hand shaking on the wheel cannot strobe a name on and off
const CELL_PAD = 3;       // how far inside its own edge a cell's name sits
const MIN_CHARS = 6;      // fewer than this before the ellipsis and the name identifies nothing
const CITY_CAP = 12;      // roofs the city may name at once — thirty names is a bad list
const NAME_MS = 220;
const FADES = new Map();
let nameT = 0;

function fits(box) {
  if (box[0] < 2 || box[1] < 2 || box[0] + box[2] > W - 2 || box[1] + box[3] > H - 2) return false;
  for (const q of labels)
    if (box[0] < q[0] + q[2] && q[0] < box[0] + box[2] &&
        box[1] < q[1] + q[3] && q[1] < box[1] + box[3]) return false;
  return true;
}
/* Taken, once: the rect joins the collision list, the box joins the named set, and the pair
   joins what the harness reads. Every labeller goes through here or it can name a thing
   twice. */
function take(b, box, by) {
  labels.push(box); named.set(b.path, box); overlaid.push([b.n.name, by, b.path]);
}
const font = (size, weight) => `${weight} ${size}px -apple-system, "SF Pro Text", sans-serif`;

/* Truncated, never to nothing: a name cut to two characters names no file, so a face that
   cannot carry MIN_CHARS and an ellipsis goes unnamed until the zoom gives it room. */
function clipText(name, maxW) {
  const full = ctx.measureText(name).width;
  if (full <= maxW) return name;
