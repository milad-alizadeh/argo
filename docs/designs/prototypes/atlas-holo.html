<!doctype html>
<!-- PROTOTYPE — throwaway. Same CodeCharta data as atlas-codecharta.html, drawn as a model
     standing over a lit floor: solid volumes under one warm key and one cool fill, with cast
     shadows, contact darkening and a graded ground. Every lighting term is a scalar on the
     band's own pigment — colour is the whole reading, and nothing may tint a roof.
     Data: ccsh unifiedparser + ccsh gitlogparser + ccsh merge  →  atlas-cc.json (1547 files). -->
<meta charset="utf-8">
<title>Argo · CodeCharta</title>
<link rel="stylesheet" href="atlas-tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #06090c; }
  /* Controls left, map middle, what is being read right. No page header: a title bar over
     a map is a caption on a thing that says its own name, and the count it carried is a
     provenance line, which belongs under the reading it qualifies. */
  #app { height: 100%; display: grid; min-height: 0;
    grid-template-columns: 258px 1fr 356px; grid-template-areas: 'side stage rail'; }
  body.nosb #app { grid-template-columns: 0 1fr 356px; }
  body.nosb #side { display: none; }

  #stage { grid-area: stage; position: relative; overflow: hidden; }
  /* the width/height attributes carry the backing store and are also CSS hints, so the
     element must be pinned to the stage or a retina canvas lays out at twice its size */
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  /* The interference texture is CSS, not canvas: a full-stage pattern fill at retina
     costs more per frame than every animated stroke put together. It is static and
     nearly invisible — a drifting band is something moving while the map is at rest,
     and a screen blend strong enough to see is a tax on every band's colour. */
  #scan { position: absolute; inset: 0; z-index: 40; pointer-events: none;
          mix-blend-mode: screen;
          background: repeating-linear-gradient(to bottom,
            rgba(150,225,255,.012) 0 1px, rgba(0,0,0,0) 1px 3px); }

  /* A list and a reading are different regions, both permanent: selecting inside the list
     can then never destroy the list, which is what a single panel that swapped its whole
     contents kept doing. */
  #rail { grid-area: rail; border-left: 1px solid rgba(126,214,240,.14); background: #0a1014;
          display: flex; flex-direction: column; min-height: 0; }
  #index { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #rail > .pad { padding: 14px 16px 0; flex: none; }
  #index .head { padding: 12px 16px 6px; }
  #rows { flex: 1; overflow-y: auto; min-height: 0; padding: 0 8px 12px; }
  /* One height, always. A panel that grew and shrank with what was picked moved the list
     above it on every click, which costs more than the space it saved. */
  #inspect { flex: 0 0 322px; display: flex; flex-direction: column;
             border-top: 1px solid rgba(126,214,240,.22); background: #0c1519; min-height: 0; }
  #read { flex: 1; overflow-y: auto; padding: 14px 16px 14px; }
  /* A click opens the file as a PAGE: the reading gets the whole rail and the list steps
     aside, because a file worth opening is worth more than 322px. The list is only hidden,
     never rebuilt, so coming back is the list you left rather than a fresh one. */
  body.page #index { display: none; }
  body.page #inspect { flex: 1; }
  #inspect .foot { flex: none; padding: 9px 16px 10px; border-top: 1px solid rgba(126,214,240,.1);
                   font: var(--t-footnote) var(--mono); color: var(--text-3); }
  /* The field sits outside #read, which is rebuilt on every pointer move: inside it, a search
     would lose focus and its own text between one keystroke and the next. */
  #find { position: relative; }
  #find input { width: 100%; box-sizing: border-box; padding: 8px 44px 8px 11px;
                border-radius: 8px; color: var(--text); font: var(--t-callout) var(--sans);
                background: rgba(140,170,190,.07);
                border: 1px solid rgba(150,180,200,.14); }
  #find input::placeholder { color: var(--text-off); }
  #find input:focus { outline: none; border-color: rgba(127,232,255,.45);
                      background: rgba(127,232,255,.07); }
  #find input::-webkit-search-cancel-button { filter: invert(1); opacity: .45; }
  #find #qn { position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
              font: var(--t-footnote) var(--mono); color: #7fe8ff; pointer-events: none; }

  #read .kind .back { margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
                      cursor: pointer; padding: 3px 8px; border-radius: 6px; font: inherit;
                      text-transform: none; letter-spacing: 0; color: var(--text-1);
                      background: rgba(180,210,230,.09);
                      border: 1px solid rgba(160,195,215,.16); }
  #read .kind .back:hover { background: rgba(127,232,255,.16); color: var(--text); }
  #read .kind .back kbd { font-size: 9px; opacity: .6; }
  #read .kind { font: var(--t-footnote) var(--mono); text-transform: uppercase;
                letter-spacing: .12em; color: #5c8b99; }
  #read .name { font: 600 var(--t-title3)/1.25 var(--sans); margin-top: 5px;
                overflow-wrap: anywhere; }
  #read .where { font: var(--t-footnote)/1.45 var(--mono); color: var(--text-3);
                 margin-top: 6px; overflow-wrap: anywhere; }
  #read .pin { margin-top: 9px; font: var(--t-footnote) var(--mono); color: #7fe8ff; }

  #read table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  #read th { text-align: left; font: var(--t-footnote) var(--mono); text-transform: uppercase;
             letter-spacing: .1em; color: #5c8b99; font-weight: 400;
             padding-bottom: 6px; border-bottom: 1px solid rgba(126,214,240,.16); }
  #read td { padding: 5px 0; font-size: var(--t-callout); color: var(--text-2);
             border-bottom: 1px solid rgba(126,214,240,.07); }
  #read td.v { text-align: right; font: var(--t-callout) var(--mono); color: var(--text-1); }
  #read tr.zero td { color: var(--text-off); }
  #read tr.on td { color: var(--text-1); }
  #read tr.on td.k::before { content: '●'; color: #7fe8ff; font-size: 8px;
                             vertical-align: 2px; margin-right: 6px; }
  #read .idle { color: var(--text-3); font-size: var(--t-callout); line-height: 1.5; }
  #read .idle b { color: var(--text-2); font-weight: 600; }
  #read .idle kbd { font: var(--t-footnote) var(--mono); color: var(--text-1);
                    background: rgba(126,214,240,.09); border: 1px solid rgba(126,214,240,.2);
                    border-radius: 4px; padding: 1px 5px; }

  /* A sidebar, the way every other surface in this app has one: a column of the window,
     flush to its edge, with a hairline against what it borders. Not a card floating on the
     map — a floating card is a popover, and standing controls are not transient. */
  #side { grid-area: side; background: var(--sunken); min-height: 0;
    border-right: 1px solid var(--hairline); display: flex; flex-direction: column; }
  #side > header { display: flex; align-items: center; gap: 6px; height: 38px;
    padding: 0 8px 0 14px; border-bottom: 1px solid var(--hairline); flex: none; }
  #side > header h5 { font: 600 var(--t-callout) var(--sans); color: var(--text-1);
    margin-right: auto; }
  .sbtn { width: 26px; height: 24px; border-radius: var(--r-control); display: grid;
    place-items: center; color: var(--text-2); flex: none; }
  .sbtn:hover { background: var(--hover); color: var(--text-1); }
  .sbtn svg { width: 14px; height: 14px; }
  #side .body { flex: 1; overflow-y: auto; min-height: 0; padding: 4px 0 10px; }
  /* group header, group, group header, group — the shape a settings sidebar has */
  .sbsec { padding: 10px 14px 12px; }
  .sbsec + .sbsec { border-top: 1px solid var(--hairline); }
  .sbsec > h6 { font: var(--t-footnote) var(--mono); font-weight: 400;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text-off);
    margin-bottom: 9px; }
  /* Every field carries its name: a control with nothing beside it is a puzzle, whatever
     it is made of. */
  .srow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    min-height: 26px; font: var(--t-callout) var(--sans); color: var(--text-2); }
  .srow + .srow { margin-top: 7px; }
  .srow.off { opacity: .45; }
  .srow select { font: var(--t-callout) var(--sans); color: var(--text-1);
    background: var(--control); border: 1px solid var(--subtle);
    border-radius: var(--r-control); padding: 3px 6px; max-width: 152px; }
  .srow select:disabled { cursor: not-allowed; }

  .seg { display: flex; width: 138px; }
  .seg button { flex: 1; padding: 3px 0; font: var(--t-callout) var(--sans);
    color: var(--text-2); background: rgba(126,214,240,.07);
    border: 1px solid rgba(126,214,240,.2); border-left-width: 0; }
  .seg button:first-child { border-left-width: 1px; border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: rgba(126,214,240,.22);
    border-color: rgba(126,214,240,.45); color: var(--text-1); }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  /* Each view is a picture of itself, which two words in a menu are not. */
  .iseg { display: flex; width: 68px; }
  .iseg button { flex: 1; height: 24px; display: grid; place-items: center;
    color: var(--text-3); background: rgba(126,214,240,.07);
    border: 1px solid rgba(126,214,240,.2); border-left-width: 0; }
  .iseg button:first-child { border-left-width: 1px; border-radius: 7px 0 0 7px; }
  .iseg button:last-child { border-radius: 0 7px 7px 0; }
  .iseg button:hover { color: var(--text-1); background: rgba(126,214,240,.16); }
  .iseg button[aria-pressed="true"] { background: rgba(126,214,240,.22);
    border-color: rgba(126,214,240,.45); color: var(--text-1); }
  .iseg svg { width: 15px; height: 15px; }

  /* A boolean is a switch, and the switch is the button itself: a checkbox hidden under a
     label is a control that can look right and fire nothing. */
  .sws { width: 30px; height: 17px; border-radius: 999px; flex: none; position: relative;
    background: rgba(150,180,200,.16); border: 1px solid rgba(150,180,200,.2);
    transition: background 160ms var(--ease-out), border-color 160ms var(--ease-out); }
  .sws::after { content: ''; position: absolute; left: 1px; top: 1px; width: 12px; height: 12px;
    border-radius: 50%; background: #9fb4bf; transition: transform 160ms var(--ease-out),
    background 160ms var(--ease-out); }
  .sws[aria-checked="true"] { background: rgba(127,232,255,.32);
    border-color: rgba(127,232,255,.55); }
  .sws[aria-checked="true"]::after { transform: translateX(13px); background: #cdf3ff; }

  /* when the sidebar is away, the control that brings it back sits where it was */
  #reveal { position: absolute; left: 12px; top: 12px; z-index: 60;
    background: rgba(9,20,26,.82); backdrop-filter: blur(14px);
    border: 1px solid rgba(126,214,240,.22); border-radius: 7px; }
  #reveal[hidden] { display: none; }

  /* The one thing allowed to float over the map, because it is the only control that is
     about the map rather than about the encoding: the camera belongs where the picture is.
     Small enough to sit inside the fit's own 34px pad at the default framing. */
  #orbit { position: absolute; right: 12px; top: 12px; z-index: 60; display: flex;
    align-items: center; gap: 5px; padding: 5px; border-radius: 10px;
    background: rgba(9,20,26,.72); backdrop-filter: blur(14px);
    border: 1px solid rgba(126,214,240,.16); }
  /* the stage's canvas rule pins a canvas to the whole stage, which this one is not */
  #orbc { position: static; inset: auto; width: 54px; height: 54px; border-radius: 50%;
    cursor: grab; }
  #orbit.turning #orbc { cursor: grabbing; }
  #orbc:focus-visible { outline: 2px solid rgba(127,232,255,.55); outline-offset: 2px; }
  /* A treemap seen from anywhere but straight down is neither view, so there is nothing
     here to turn — the ball goes on reporting the camera, it just stops taking the hand. */
  #orbit.flat #orbc { cursor: default; opacity: .45; }

  #read .ties { margin-top: 18px; }
  #read .ties h4 { font: var(--t-footnote) var(--mono); text-transform: uppercase;
                   letter-spacing: .1em; color: #5c8b99; font-weight: 400;
                   padding-bottom: 6px; border-bottom: 1px solid rgba(126,214,240,.16);
                   display: flex; gap: 10px; }
  /* What the heading is counting sits in the heading, because a cap the reader learns by
     counting arcs is not a cap they were told about. */
  #read .ties h4 b { margin-left: auto; font-weight: 400; text-transform: none;
                     letter-spacing: 0; color: var(--text-off); }
  #read .tie { display: flex; gap: 10px; padding: 5px 0; font-size: var(--t-callout);
               color: var(--text-2); border-bottom: 1px solid rgba(126,214,240,.07); }
  #read .tie span { overflow-wrap: anywhere; }
  #read .tie b { margin-left: auto; font: var(--t-callout) var(--mono); color: #7fe8ff; }
  /* A basename alone hides the only interesting part: a tie inside one folder is ordinary,
     and a tie across two packages is the finding. So the twin carries where it lives. */
  #read .tie { flex-wrap: wrap; cursor: pointer; border-radius: 5px;
               padding: 5px 6px; margin: 0 -6px; }
  #read .tie:hover { background: rgba(127,232,255,.09); }
  /* An index is scanned, not read: one line each, the folder trailing on the same line.
     The two-line row is for a tie, where the folder is the finding. */
  #read .tie.flat { flex-wrap: nowrap; align-items: baseline; gap: 6px; padding: 3px 0; }
  #read .tie.flat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #read .tie.flat em { flex-basis: auto; margin: 0 0 0 auto; padding-left: 8px;
                       white-space: nowrap; opacity: .62; }
  /* A radio list, because exactly one domain is ever being looked at. The mark is a real
     radio rather than a highlight: a highlighted row reads as "recently clicked", and the
     reader has to be able to see what is showing without remembering what they pressed. */
  #read .radios { margin-top: 2px; }
  #read .radio { display: flex; align-items: center; gap: 9px; cursor: pointer;
                 padding: 5px 8px 5px 6px; margin: 0 -8px; border-radius: 6px;
                 font-size: var(--t-callout); color: var(--text-dim); }
  #read .radio:hover { background: rgba(127,232,255,.07); }
  #read .radio:focus-visible { outline: 2px solid rgba(127,232,255,.55); outline-offset: -2px; }
  #read .radio u { flex: none; width: 12px; height: 12px; border-radius: 50%; text-decoration: none;
                   border: 1.5px solid rgba(160,190,210,.34); box-sizing: border-box; }
  #read .radio.on { color: var(--text); background: rgba(127,232,255,.10); }
  #read .radio.on u { border-color: #7fe8ff; box-shadow: inset 0 0 0 3px #7fe8ff; }
  #read .radio i { flex: none; width: 9px; height: 9px; border-radius: 2px; }
  #read .radio i.all { background: linear-gradient(135deg,#6f9a86,#b99a58,#9a6f86); }
  #read .radio span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #read .radio b { margin-left: auto; font: var(--t-callout) var(--mono); color: #7fe8ff; }
  #read .tie em { flex-basis: 100%; font-style: normal; font: var(--t-footnote) var(--mono);
                  color: var(--text-off); overflow-wrap: anywhere; }
  #read .tie i { flex-basis: 100%; font-style: normal; margin-top: 4px;
                 font: var(--t-footnote)/1.5 var(--sans); color: var(--text-3); }
  #read .ties p { margin-top: 7px; font: var(--t-footnote)/1.5 var(--sans);
                  color: var(--text-3); }
  /* Quiet, because it is a fact about the drawing and not about the code. */
  #read .tie u { text-decoration: none; align-self: center; padding: 1px 5px;
                 border-radius: 4px; font: var(--t-footnote) var(--mono);
                 color: var(--text-off); border: 1px solid rgba(126,214,240,.18); }

  /* The legend is the sidebar's last section, because it describes what the sections
     above it just did. It is never hidden: a colour that means something only while you
     remember what you picked in a menu means nothing by the second minute. */
  #legend { font: var(--t-footnote) var(--mono); color: var(--text-3); }
  #legend .lead { text-transform: uppercase; letter-spacing: .1em; color: #5c8b99; }
  #legend #keyName { color: var(--text-2); }
  #legend .ramp { display: flex; align-items: center; gap: 0; margin: 7px 0 4px;
                  border-radius: 3px; overflow: hidden; }
  #legend .ramp i { flex: 1; height: 9px; }
  #legend .ends { display: flex; justify-content: space-between; color: var(--text-2); }
  #legend .foot { color: #5c8b99; margin-top: 1px; }
  #legend .reads { margin-top: 9px; padding-top: 9px; font: var(--t-footnote)/1.6 var(--sans);
                   color: var(--text-3); border-top: 1px solid rgba(126,214,240,.12); }
  #legend .reads b { color: var(--text-1); font-weight: 600; }
  .dim { opacity: .5; }

  /* the colour channel, drawn on the bands the volumes are lit with */
  #read .gauge { margin-top: 16px; }
  #read .gh { display: flex; align-items: baseline; font: var(--t-footnote) var(--mono);
              text-transform: uppercase; letter-spacing: .1em; color: #5c8b99; }
  #read .gh b { margin-left: auto; font: 600 var(--t-title3) var(--mono);
                color: var(--text-1); letter-spacing: 0; }
  /* The needle stands proud of the bands, so the bands are clipped and the needle is not —
     a file in the top percent sits at the very end, where a clip would eat it. */
  #read .track { position: relative; margin: 8px 0 5px; height: 10px; }
  #read .bars { display: flex; height: 100%; border-radius: 3px; overflow: hidden; }
  #read .bars i { height: 100%; }
  #read .track u { position: absolute; top: -3px; width: 2px; height: 16px;
                   margin-left: -1px; background: var(--text-1); border-radius: 1px;
                   box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  #read .ends { display: flex; justify-content: space-between;
                font: var(--t-footnote) var(--mono); color: #5c8b99; }
  #read .note { margin-top: 7px; font: var(--t-footnote)/1.5 var(--sans); color: var(--text-3); }
  /* Counts and dates are numbers a reader already understands, so they cost one line
     rather than a table. Only the ranked measure earns a gauge. */
  #read .facts { display: flex; flex-wrap: wrap; gap: 4px 13px; margin-top: 12px;
                 font: var(--t-callout) var(--sans); color: var(--text-3); }
  #read .facts b { font-family: var(--mono); color: var(--text-1); font-weight: 500; }
  #read tr[title] { cursor: help; }

  /* A question mark is a thing you can point at. A dotted underline is a thing you have to
     already know is there, which makes it no help to the reader who needs it most. */
  .ask { width: 15px; height: 15px; margin-left: 6px; padding: 0; flex: none;
         border: 1px solid rgba(126,214,240,.24); border-radius: 50%; background: none;
         color: var(--text-3); font: 10px/1 var(--mono); cursor: pointer; }
  .ask:hover, .ask[aria-expanded="true"] { border-color: #7fe8ff; color: #7fe8ff; }
  #pop { position: fixed; z-index: 90; width: 268px; padding: 12px 13px;
         border-radius: 10px; background: rgba(7,16,21,.96); backdrop-filter: blur(20px);
         border: 1px solid rgba(126,214,240,.26); box-shadow: 0 16px 44px rgba(0,0,0,.66);
         font: var(--t-footnote)/1.55 var(--sans); color: var(--text-2); }
  #pop h5 { margin: 0 0 6px; font: var(--t-footnote) var(--mono); text-transform: uppercase;
            letter-spacing: .1em; color: #5c8b99; }
  #pop p { margin: 0 0 8px; }
  #pop p:last-child { margin: 0; }
  #pop .src { color: #5c8b99; }
  #pop[hidden] { display: none; }

  /* THE NAME BAR. A five-pixel cell cannot carry a name, and a chip laid over it says the
     name belongs to a layer above the map — so the name goes to a standing surface instead,
     which is what FoamTree does below `maxLabelSizeForTitleBar`. It is the stage's own strip
     rather than the reading panel, because the panel is what a CLICK is for and a pointer
     passing over the map must not rewrite what somebody is reading. It says something only
     when the map could not: a box that carries its own name is answered where it stands. */
  /* top centre, because the two top corners are already spoken for — the reveal button on
     the left and the orbit ball on the right */
  #hovname { position: absolute; z-index: 45; top: 10px; left: 50%; max-width: 52%;
             transform: translateX(-50%);
             padding: 5px 10px; border-radius: 7px; pointer-events: none;
             background: rgba(7,16,21,.9); backdrop-filter: blur(14px);
             border: 1px solid rgba(126,214,240,.22);
             font: var(--t-footnote) var(--sans); color: var(--text);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hovname b { font-weight: 600; }
  #hovname span { color: #5c8b99; }
  #hovname[hidden] { display: none; }

  /* A domain, once chosen, stays said: it is the standing context over its own file list,
     so opening a file ADDS a fact instead of replacing the one you came for. The hue is the
     left border — a bigger, quieter swatch than a square, and the hue the map is now lit in. */
  /* One way back, everywhere: the trail IS the control. A back button beside it would be a
     second thing doing the same job, and the reader would have to learn which one goes where. */
  #ctx { flex: none; padding: 11px 16px 12px; border-bottom: 1px solid rgba(126,214,240,.12);
    border-left: 3px solid transparent; }
  /* Lit only when a domain is chosen, in that domain's own hue — the one thing saying the
     rail and the map are showing the same selection. */
  #ctx.lit { border-left-color: var(--dh, #7fe8ff);
    background: linear-gradient(100deg,
      color-mix(in srgb, var(--dh, #7fe8ff) 13%, transparent), transparent 62%); }
  /* Back sits with the trail, because it IS the trail read one step at a time — a button
     somewhere else would be a second answer to the same question. */
  #ctx .back { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 8px;
    padding: 4px 9px 4px 7px; border: 1px solid rgba(126,214,240,.24); border-radius: 7px;
    background: rgba(126,214,240,.09); color: var(--text-1); cursor: pointer;
    font: 500 var(--t-callout) var(--sans);
    transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out); }
  #ctx .back:hover { background: rgba(127,232,255,.18); border-color: rgba(126,214,240,.42); }
  #ctx .back:focus-visible { outline: 2px solid rgba(127,232,255,.55); outline-offset: 1px; }
  #ctx .back kbd { font: var(--t-footnote) var(--mono); opacity: .55; }
  #ctx .crumbs { display: flex; flex-wrap: wrap; align-items: baseline;
    font: var(--t-footnote) var(--mono); color: var(--text-off); margin: 0 -6px; }
  /* Every crumb but the last is a control, so it is a target with a ground of its own —
     a line of text with a pointer cursor is not something anybody aims at. */
  #ctx .crumbs a { padding: 3px 6px; border-radius: 6px; color: var(--text-2); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  #ctx .crumbs a:hover { background: rgba(127,232,255,.13); color: var(--text); }
  #ctx .crumbs a:focus-visible { outline: 2px solid rgba(127,232,255,.55); outline-offset: -2px; }
  #ctx .crumbs i { font-style: normal; opacity: .45; padding: 0 1px; }
  /* Where you are, which is not a link: bigger, because it is the heading this bar used to
     carry as an <h4> and a location strip that ends in a whisper says nothing. */
  #ctx .crumbs b { padding: 3px 6px; font: 600 var(--t-callout) var(--sans);
    color: var(--text-1); overflow-wrap: anywhere; }
  #ctx p { font: var(--t-callout)/1.5 var(--sans); color: var(--text-2); margin: 6px 6px 0; }
  #ctx .row { margin: 9px 6px 0; font: var(--t-footnote)/1.6 var(--mono); color: var(--text-off); }
  #ctx .row b { color: var(--text-2); font-weight: 400; }

  .eyebrow { font: var(--t-footnote) var(--mono); text-transform: uppercase;
             letter-spacing: .12em; color: #5c8b99; }
  /* one line each, a swatch and a count: a domain is a thing with its own page */
  .drow { display: grid; grid-template-columns: 10px 1fr auto; gap: 9px; align-items: center;
    padding: 6px 9px; border-radius: 7px; cursor: pointer; }
  .drow:hover { background: rgba(126,214,240,.08); }
  .drow[aria-selected="true"] { background: rgba(127,232,255,.15);
    box-shadow: inset 0 0 0 1px rgba(127,232,255,.28); }
  .drow .sw { width: 10px; height: 10px; border-radius: 3px; }
  .drow .nm { font: var(--t-callout) var(--sans); color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .ct { font: var(--t-footnote) var(--mono); color: var(--text-3); }

  /* Two lines, not one: a basename is not an address — half a repo is called index.ts —
     and the name and the folder each need their own clip to survive. */
  .frow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start;
    padding: 6px 9px; border-radius: 6px; cursor: pointer; min-width: 0; }
  .frow em, .frow i { padding-top: 2px; }
  .frow:hover { background: rgba(126,214,240,.08); }
  .frow[aria-selected="true"] { background: rgba(127,232,255,.15); }
  .frow .p { min-width: 0; }
  .frow .p b { display: block; font: 400 var(--t-callout) var(--mono); color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the directory is clipped from its LEFT, because its last segment is the telling one */
  .frow .p s { display: block; direction: rtl; text-align: left; text-decoration: none;
    font: var(--t-footnote) var(--mono); color: var(--text-off); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .p s > span { direction: ltr; unicode-bidi: embed; }
  .frow em { font: var(--t-footnote) var(--mono); font-style: normal; color: var(--text-3); }
  .frow i { font: var(--t-footnote) var(--sans); font-style: normal; opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 118px;
    text-align: right; }
  /* A folder row is a way in, not a value: no swatch, because a colour that means nothing
     is noise, and a chevron because the click descends rather than opens. */
  .drow.dir { grid-template-columns: 1fr auto auto; }
  .drow.dir .nm { font-family: var(--mono); }
  .drow.dir .go { font: 13px var(--sans); color: var(--text-off); }
  .drow.dir:hover .go { color: var(--text-2); }
  #rows .idle { padding: 10px 9px; font-size: var(--t-callout); color: var(--text-3);
    line-height: 1.5; }

  /* The written layer is drawn differently from every measured one, on purpose: a reader
     must be able to tell at a glance which lines are counted and which are read. */
  #read .said { margin-top: 16px; padding: 11px 12px; border-radius: 8px;
                background: rgba(127,232,255,.06); border: 1px solid rgba(127,232,255,.18); }
  #read .said p { margin: 0; font: var(--t-callout)/1.55 var(--sans); color: var(--text-1); }
  /* The domain is a property of the file like any other, so it sits in the panel rather than
     in an index of its own — but it is the one property you can act on, so it carries a
     control instead of a value. */
  #read .dom { margin-top: 14px; padding: 12px 13px 13px; border-radius: 9px;
               background: rgba(140,170,190,.055); border: 1px solid rgba(150,180,200,.10); }
  #read .dom p { margin: 9px 0 0; font-size: var(--t-callout); color: var(--text-1); }
  #read .dom p.about { color: var(--text-dim); }
  #read .dom.none b { font-size: var(--t-callout); color: var(--text); }
  /* A citation is one line at chip weight: a file with no domain must not shout louder
     than a file with one, which a bordered card with a heading in it does. */
  #read .cite { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: baseline;
                gap: 4px 9px; }
  #read .cite .none { padding: 4px 10px; border-radius: 999px; font-size: var(--t-callout);
                      color: var(--text-2); background: rgba(140,170,190,.055);
                      border: 1px solid rgba(150,180,200,.10); }
  #read .cite .src { font: var(--t-footnote)/1.5 var(--mono); color: #6d8794; }
  #read .dom .chip, #read .cite .chip { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
                     padding: 4px 10px 4px 8px; border-radius: 999px; font: inherit;
                     font-size: var(--t-callout); color: var(--text);
                     background: rgba(180,210,230,.09); border: 1px solid rgba(160,195,215,.16); }
  #read .dom .chip:hover, #read .cite .chip:hover { background: rgba(127,232,255,.14); }
  #read .dom .chip.on, #read .cite .chip.on { background: rgba(127,232,255,.20);
                                              border-color: rgba(127,232,255,.45); }
  #read .dom .chip i, #read .cite .chip i { width: 9px; height: 9px; border-radius: 2px; }
  #read .dom .flag { display: block; margin-top: 10px; font: var(--t-footnote)/1.5 var(--mono);
                     color: #9fb6c4; }
  /* Said in the same quiet monospace the measured sources are, because this is a provenance
     line and not a finding — but it is the one line here that has to be read. */
  #read .dom .src { display: block; margin-top: 7px; font: var(--t-footnote)/1.5 var(--mono);
                    color: #6d8794; }
  #read .dom .ties { margin-top: 13px; }
  #read .said .flag { display: block; margin-top: 8px; font: var(--t-footnote)/1.5 var(--mono);
                      color: #7fe8ff; }
  /* the same mark as the one on the roofs, so the sentence and the map agree */
  .dot { color: #dcf6ff; font-size: 9px; vertical-align: 2px; }
