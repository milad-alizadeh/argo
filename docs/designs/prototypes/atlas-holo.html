<script>
const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n * 10) / 10).toLocaleString('en-US');
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* the plan square, in its own units */
const PLAN = 1000;                  // the plan is laid out in a square this wide
const HMAX = 150;                   // the tallest building, in plan units
/* The floor is a real plane a fixed distance under the plates, which is what makes the
   model read as hovering rather than as a city standing on nothing. */
const FLOOR_Z = -22;
/* The tree is 86 folders deep in places, and a plate drawn at full strength at every
   level turns the ground into a flight of steps. Both fall away with depth: the outer
   two or three levels are the ones that carry the structure, and below that a folder
   only needs a gutter wide enough to separate its files from its neighbour's. */
/* The margin is the plate: it is the only part of a folder that is not under a building,
   so it is also the only part you can point at. Wide enough to hit at a glance, and the
   wall under it thick enough to be a target in its own right at the levels that carry
   the structure. */
const MARGIN = [0, 24, 19, 15, 12, 10, 9, 8];   // gap around a folder's contents, by rank
const PLATE = [10, 8, 6.5, 5, 4, 3.5, 3, 3];   // how thick a folder's plate is, by rank
/* A folder that holds no files of its own is never drawn, so the gutter it takes is a
   rim you can see and cannot click. It keeps just enough to separate its children. */
const GHOST_GAP = 3;
/* THE MAP IS TILED ONCE AND NEVER AGAIN, so a gutter cannot be a fixed number of plan
   units: eight levels down the absolute margins eat the box and its whole subtree
   vanishes. Below the absolute gap a box keeps a fixed SHARE of itself instead, which
   makes the tiling self-similar — every folder has room for its children at every depth,
   and the camera is what decides whether they are big enough to look at. */
const GAP_FRAC = 0.055;
/* A folder's name lives in a strip of its own ground that its children may not enter, so a
   parent's caption and a nested child's occupy DISJOINT geometry and never compete for a
   place — which is the whole of what used to silence every nested plate. ECharts calls it
   `upperLabel`, d3 calls it `paddingTop`, CodeCharta caps it at 0.15 of the node.
   The cap is there because RESERVING room lies about area and the lie compounds with depth —
   Lu & Fogarty measure a 151-unit node drawn smaller than an 18-unit one for exactly this
   reason. So this strip reserves NOTHING: it is moved out of the gutter the plate already
   keeps — the two gutters across the plan's y grow by the strip and the two across x shrink
   by whatever keeps the children's rectangle the same AREA. The area channel is load-bearing
   on this map and it is not worth a caption. Measured: byte-identical drawn areas and 0
   files lost, where the version that added a strip cost 40 of 1483 files and 2.75 points of
   area fidelity.
   Both y gutters grow, not one, because the two views read opposite edges: the plan's y runs
   UP the screen, so a plan caption belongs on the plate's high-y edge to sit at the top of it
   the way every cell's name does, while the city must use whichever edge is NEAREST or its
   own towers stand in front of the words. */
const HDR_FRAC = 0.15;    // never more of the node than this, and never more
const HDR_GUT = 0.6;      // than this share of the gutter it is taken from

let DATA = null, DESC = {}, state = null;
/* path -> [[other path, temporal coupling], ...], strongest first. gitlogparser counts
   the commits that touched both files; the studio draws these as the lines between
   blocks. It is the one relation in the data — nothing here reads an import. */
const LINKS = new Map();
/* 999 pairs drawn at once is a ball of wool. The switch shows the strongest of them;
   pointing at a file always shows that file's own, however the switch is set. */
let TOP_TIES = [];
const TIE_CAP = 160;
/* The arcs and the panel are one fact stated twice, so they read it through one function:
   the same partners, the same order, the same cap. They used to disagree twice over — the
   panel cut to six while the map drew all sixty, and the map dropped a hidden test file
   silently (a pruned file has no block for an arc to end on) while the panel listed it. */
const TIE_SHOW = 6;
const tiesOf = path => (LINKS.get(path) || [])
  .filter(([o]) => !(state && state.noTests && TESTY(o)));

/* ---------- squarified treemap (Bruls, Huizing & van Wijk 1999) ---------- */
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, i) => s + i.v, 0) || 1;
  let rest = items.slice().sort((a, b) => b.v - a.v);
  let area = { x, y, w, h }, remaining = total;

  while (rest.length) {
    const horizontal = area.w >= area.h;
    const side = horizontal ? area.h : area.w;
    let row = [], rowSum = 0, best = Infinity;
    for (const item of rest) {
      const trySum = rowSum + item.v;
      const thick = (trySum / remaining) * (horizontal ? area.w : area.h);
      const worst = Math.max(...[...row, item].map(it => {
        const along = (it.v / trySum) * side || 1e-6;
        return Math.max(thick / along, along / thick);
      }));
      if (worst > best && row.length) break;
      row.push(item); rowSum = trySum; best = worst;
    }
    const thick = (rowSum / remaining) * (horizontal ? area.w : area.h);
    let along = horizontal ? area.y : area.x;
    for (const it of row) {
      const len = (it.v / rowSum) * side;
      out.push(horizontal ? { it, x: area.x, y: along, w: thick, h: len }
                          : { it, x: along, y: area.y, w: len, h: thick });
      along += len;
    }
    if (horizontal) { area.x += thick; area.w -= thick; }
    else { area.y += thick; area.h -= thick; }
    remaining -= rowSum;
    rest = rest.slice(row.length);
  }
  return out;
}

/* ---------- metrics ---------- */
const at = (n, k) => (n.attributes && n.attributes[k]) || 0;

/* A folder's value on any metric is the sum of its files, which is what the
   studio does too — it keeps a parent's footprint equal to its contents. */
function roll(n, k) {
  if (n.type === 'File') return at(n, k);
  return (n.children || []).reduce((s, c) => s + roll(c, k), 0);
}
function leaves(n, out = []) {
  if (n.type === 'File') out.push(n); else (n.children || []).forEach(c => leaves(c, out));
  return out;
}
/* The domain tiling re-parents every file, so a box's path can no longer be read off the
   walk that built it. The real path is stamped on the node once, from the folder tree, and
   every lookup downstream — notes, ties, the pin — goes on working in either tiling. */
function stampPaths(n, pre = '') {
  const here = pre ? pre + '/' + n.name : n.name;
  if (n.type === 'File') { n.__path = here; return; }
  (n.children || []).forEach(c => stampPaths(c, here));
}

/* A test file is recognisable in every language that has tests without knowing which one
   this is: the word is in the filename, or it names a directory on the way down. Nothing
   here is a list of this repo's own folders. */
const TESTY = p => /(^|[^a-z])(tests?|specs?)([^a-z]|$)/i.test(p.split('/').pop())
  || p.split('/').slice(0, -1).some(d => /^(__)?(tests?|specs?)(__)?$/i.test(d));

/* Tests are half of many repositories and they answer a different question from the code
   they cover, so hiding them is a view of the same map rather than a different map. The tree
   is rebuilt without them, which is what makes the domains recluster too — with the tests in,
   a domain's largest folder is almost always somebody's test directory. */
function prune(n) {
  if (n.type === 'File') return TESTY(n.__path || n.name) ? null : n;
  const kids = (n.children || []).map(prune).filter(Boolean);
  return kids.length ? { ...n, children: kids } : null;
}
let PRUNED = null;
const live = () => state && state.noTests ? (PRUNED = PRUNED || prune(DATA) || DATA) : DATA;

/* Every term has to appear somewhere in the path, which is the one rule that behaves the same
   on a repo of Swift and a repo of Python: no ranking, no fuzziness, nothing to learn. A
   domain's name counts as part of a file's path, so "permission gate" finds a domain's files
   even though no filename says it. */
function hits() {
  const q = (state && state.q || '').trim().toLowerCase();
  if (!q) return null;
  const terms = q.split(/\s+/);
  const out = new Set();
  for (const f of leaves(live())) {
    const c = DOM && domOf(f.__path);
    const hay = (f.__path + ' ' + (c ? domName(c) + ' ' + c.tokens.join(' ') : '')).toLowerCase();
    if (terms.every(t => hay.includes(t))) out.add(f.__path);
  }
  return out;
}
let HITS = null;
const refind = () => { HITS = hits(); };

/* ---------- domains ---------- */
/* Every other number on this page is measured. These are inferred, from two signals every
   repository has — what files are called, and what changes together — and the recovery
   literature is blunt that inference here is unreliable. So they are a third kind of fact,
   said as such, and a file is allowed to belong to no domain at all. */
let LIB = null, CO = null, DOM = null, domKey = '';
const DOM_ALPHA = 0.6, DOM_DIRW = 0;

/* One hue per domain, walked by the golden angle so neighbours in the list are never
   neighbours in hue, at the one saturation and lightness the rest of the page is painted at.
   Confidence rides on saturation: a domain we are unsure of arrives washed out, and the
   quantisation keeps the swatch cache from growing a colour per file. */
function domTone(rank, conf) {
  const hue = (rank * 137.508) % 360;
  const sat = 0.14 + 0.24 * (Math.round(conf * 5) / 5);
  return hsl(hue, sat, 0.47);
}
const UNSURE = [86, 96, 104];   // belongs to nothing we can name
const HUSH = [46, 56, 63];      // a domain that is not the one being looked at
function hsl(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const t = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
          : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return t.map(v => Math.round((v + m) * 255));
}

function domainsReady() { return !!(LIB && CO && DATA); }

/* The clustering can only offer the word a domain's filenames share, which is true and no use
   — "backlog", "deck". The name a reader needs comes from reading the code, so it arrives in
   the written layer like every other sentence a model produced, and is marked the same way.
   Without it the token stands in, so the map still works on a repo nobody has annotated. */
/* A written name is matched to a cluster by the files it was written about, not by an exact
   identity: hiding the tests re-clusters the whole repo, and a name that fell off every domain
   the moment you changed the view would be a name nobody could rely on. Three of the five
   files it was written from, still together, is the same domain by any reading. The score is
   taken over the files that are still on the map, so hiding the tests cannot starve a name
   that was written mostly about tests. */
function written(c) {
  if (!NOTES.domains) return null;
  const exact = NOTES.domains[c.key];
  if (exact) return exact;
  const mine = new Set(c.members.map(i => DOM.paths[i]));
  const here = new Set(DOM.paths);
  let best = null, score = 0;
  for (const w of Object.values(NOTES.domains)) {
    const live = (w.core || []).filter(f => here.has(f));
    if (live.length < 3) continue;
    const s = live.filter(f => mine.has(f)).length / live.length;
    if (s > score) { score = s; best = w; }
  }
  return score >= 0.5 ? best : null;
}
const domName = c => (written(c) || {}).name || c.name;
const domNote = c => (written(c) || {}).note || '';
function domains() {
  const k = DOM_ALPHA + '|' + DOM_DIRW + '|' + (state && state.noTests ? 't' : '');
  if (!domainsReady()) return null;
  if (DOM && domKey === k) return DOM;
  const files = leaves(live());
  const paths = files.map(f => f.__path);
  const t0 = performance.now();
  /* The sidecar interns its paths, so the edges arrive as index pairs and are named here
     rather than shipped named forty times over. */
  const named = CO.edges.map(([a, b, j]) => [CO.files[a], CO.files[b], j]);
  const rloc = new Map(paths.map((pp, i) => [pp, at(files[i], 'rloc')]));
  const r = LIB.cluster(paths, named,
    { alpha: DOM_ALPHA, dirWeight: DOM_DIRW, house: [CO.built && CO.built.repo],
      size: i => rloc.get(paths[i]) || 0 });
  r.ms = Math.round(performance.now() - t0);
  r.paths = paths;
  r.rank = new Map(r.clusters.map((c, i) => [c.id, i]));
  r.byPath = new Map();
  paths.forEach((pp, i) => r.byPath.set(pp, { id: r.of[i], conf: r.conf[i] }));
  r.node = new Map(paths.map((pp, i) => [pp, files[i]]));
  DOM = r; domKey = k;
  return r;
}

/* A file's colour under a domain: its domain's hue at its own confidence, or the one grey
   that means the clustering declined to place it. */
function domBase(path) {
  const d = DOM && DOM.byPath.get(path);
  /* Whether this file is in scope at all is `inScope`'s question, asked before this one. */
  if (!d || d.id < 0) return UNSURE;
  return domTone(DOM.rank.get(d.id), d.conf);
}

function selectDomain(id) {
  beginFade();
  closePage();
  if (id !== null && state.domSel === null) state.domTop = $('rows').scrollTop;
  state.domSel = id;
  rebuild(); detail(state.pinned || null); railIndex(); key(view.lo, view.hi); stamp();
}

/* The second tiling. The same boxes, partitioned on cluster instead of path, laid out by the
   same squarify — so nothing about the drawing changes except which rectangle a file is in.
   Area is the same measure it always was, which is why the reshuffle conserves it. */
function domainRoot() {
  const d = domains();
  if (!d) return live();
  const kids = d.clusters.map(c => ({
    name: domName(c), type: 'Folder', __dom: c,
    children: c.members.map(i => d.node.get(d.paths[i])),
  }));
  const loose = d.paths.filter((pp, i) => d.of[i] < 0).map(pp => d.node.get(pp));
  if (loose.length) kids.push({ name: 'unassigned', type: 'Folder', __dom: null, children: loose });
  return { name: 'domains', type: 'Folder', children: kids };
}

/* ---------- layout ---------- */
/* `prefix` is what the root's own path hangs off, so a tree laid out from one folder carries
   the SAME absolute paths as the whole-city one. Every index on this page is keyed by path —
   notes, ties, the rail, the scope, picking — and a re-tiling that renamed its boxes would
   quietly disconnect all of them. */
function layout(root, mArea, mHeight, maxH, prefix = '') {
  /* `rank` counts the plates you can actually see above a box, which is not the same as
     its depth in the tree: Packages, Sources and ArgoEngine-inside-ArgoEngine are folders
     of the build, not places in the code, and none of them is drawn. Sizing the gutters by
     depth spent the room on those, and left the plate you wanted a rim two pixels wide. */
  function walk(n, x, y, w, h, depth, rank, path) {
    const here = path ? path + '/' + n.name : n.name;
    if (n.type === 'File') {
      const z = maxH ? (at(n, mHeight) / maxH) * HMAX : 0;
      return { n, x, y, w, h, depth: rank, path: here, z0: 0, z1: Math.max(2, z), file: true, kids: [] };
    }
    /* A folder holding nothing but other folders owns no ground of its own. It still
       divides the plan, but it is not drawn, not named and not pickable — the plate you
       point at is always one that holds files. */
    const ghost = !(n.children || []).some(c => c.type === 'File');
    const t = ghost ? 0 : PLATE[Math.min(rank, PLATE.length - 1)];
    const me = { n, x, y, w, h, depth: rank, path: here, z0: -t, z1: 0, file: false, ghost, kids: [] };
    const cap = Math.min(w, h) * GAP_FRAC;
    const m = Math.min(cap, ghost ? GHOST_GAP : MARGIN[Math.min(rank + 1, MARGIN.length - 1)]);
    /* t of the height onto each y gutter, s of the width off each x gutter, and
       (1 + 2s)(1 - 2t) = 1 is the whole of "the children keep their area". */
    const kw = w - m * 2, kh = h - m * 2;
    const s0 = m * HDR_GUT / Math.max(1, kw);
    const hf = ghost ? 0 : Math.min(HDR_FRAC / 2, m * HDR_GUT / Math.max(1, kh),
                                    s0 / (1 + 2 * s0));
    const hdr = hf * kh, off = kw * hf / (1 - 2 * hf);
    const ix = x + m - off, iy = y + m + hdr, iw = kw + off * 2, ih = kh - hdr * 2;
    /* Only a rect with no room AT ALL stops the walk. The old `<= 2` was a screen-pixel
       judgement made in plan units, and it is what dropped 532 of 1483 files. */
    if (iw <= 0 || ih <= 0) return me;
    /* what the children got, so the caption bands are the difference between this and the
       plate — one fact, stated once, rather than the labeller re-deriving the margins */
    me.inner = [ix, iy, iw, ih];
    const kids = (n.children || [])
      .map(c => ({ c, v: roll(c, mArea) })).filter(k => k.v > 0);
    /* MEASURED AND REJECTED: d3's canonical frame — squarify the children in the PLAN square
       and remap them linearly into this rect — which atlas-snap-zoom.md §8.2 recommends as
       "eight lines and no loss of stability". It is eight lines, and it does deliver what it
       promises: standing inside a folder, the median file aspect goes 1.68 -> 1.10 and the
       p90 3.89 -> 1.42. But it is measured against a renderer that draws ONE LEVEL AT A TIME
       (d3 renders `root.children.concat(root)`), and this map draws every level at once. Both
       tilings built from the same tree in the same page:
         on the resting map   median aspect 1.16 -> 6.06, p90 1.64 -> 24.98,
                              files worse than 10:1  2 -> 239,
                              FILES DRAWN AT ALL  1483 -> 951.
       A parent's own aspect multiplies its children's, so a sliver's inner rect collapses
       past `iw <= 2` and takes its whole subtree with it. 532 files is thirteen times the
       loss that got the caption strip rewritten (40 of 1483), and the resting map is what
       the reader looks at. The snap does not need it: the camera frames the plate's rect
       whatever shape its children are. */
    for (const b of squarify(kids.map(k => ({ v: k.v, c: k.c })), ix, iy, iw, ih))
      me.kids.push(walk(b.it.c, b.x, b.y, b.w, b.h, depth + 1, rank + (ghost ? 0 : 1), here));
    return me;
  }
  const t = walk(root, 0, 0, PLAN, PLAN, 0, 0, prefix);
  (function link(b) { for (const k of b.kids) { k.up = b; link(k); } })(t);
  occlude(t);
  return t;
}

/* ---------- crowding, per box ---------- */
/* An ambient-occlusion stand-in that costs one pass over the tree: a file is in shade in
   proportion to how many siblings share its plate and how small its own footprint is
   against theirs, released again by its own height, because a tower's upper storeys are in
   the open however tight the ground is. It is computed in plan units, so it means the same
   thing at every zoom — a screen-pixel version changes strength as you move the camera. */
function occlude(box) {
  const files = box.kids.filter(k => k.file);
  if (files.length) {
    const areas = files.map(f => f.w * f.h).sort((a, b) => a - b);
    const mid = areas[areas.length >> 1] || 1;
    const many = Math.min(1, Math.max(0, (files.length - 3) / 42));
    for (const f of files) {
      const small = Math.min(1, Math.max(0, 1 - (f.w * f.h) / (mid * 1.6)));
      const open = 1 - Math.min(0.62, (f.z1 / HMAX) * 1.5);
      f.ao = 1 - (many * 0.55 + small * 0.45) * 0.30 * open;
    }
  }
  for (const k of box.kids) occlude(k);
}

/* The plan does not depend on the camera, and turning the model must not pay for a
   fresh treemap — so the tree is kept and only the paint order is redone. */
/* The data node one box path names, found the way walk() spells a path rather than by any
   second convention: a domain plate by the name fixPaths gave it, a folder by its segments. */
function nodeAt(n, path, prefix = '') {
  const here = prefix ? prefix + '/' + n.name : n.name;
  if (here === path) return n;
  if (!path.startsWith(here + '/')) return null;
  for (const c of n.children || []) {
    const hit = nodeAt(c, path, here);
    if (hit) return hit;
  }
  return null;
}
/* WHY NOTHING RE-TILES ANY MORE.
   This used to re-lay the entered folder into the whole frame, Bostock's zoomable
   treemap, because a filtered top-level tiling gives a sliver folder no room. That is
   true of a tiling with ABSOLUTE gutters; it is not true of a self-similar one (see
   GAP_FRAC), and the price of re-tiling was the whole of the navigation: crossing a
   level reflowed the picture, which is a cut however it is dressed, and the reseat that
   followed it wrote the scale straight back — nine levels of descent for no magnification
   at all. So there is ONE tiling, laid out from the repo root and never rebuilt, and
   descending is nothing but the camera. `scopeRoot` is kept as the single place that
   says so. */
function scopeRoot() { return null; }
let TREE = null, treeKey = '';
function tree() {
  const grouped = state.dom === 'group' && domainsReady();
  const scope = scopeRoot();
  const k = state.area + '|' + state.height + '|' + (grouped ? domKey + 'g' : 'f')
          + (state.noTests ? '|t' : '') + (scope ? '|@' + state.folder : '');
  if (k !== treeKey) {
    const files = leaves(live());
    const maxH = Math.max(...files.map(f => at(f, state.height)), 1);
    /* maxH stays the whole repo's, so a tower means the same number of commits at every
       altitude — a per-scope maximum would make the tallest thing in view always full height. */
    TREE = layout(scope || (grouped ? domainRoot() : live()), state.area, state.height, maxH,
                  scope && !state.folder.startsWith('@domain/')
                    ? state.folder.split('/').slice(0, -1).join('/') : '');
    fixPaths(TREE);
    treeKey = k;
  }
  return TREE;
}
/* A file box always carries the file's own path; a plate in the domain tiling carries a name
   no file has, prefixed so a note or a tie can never match one by accident. */
function fixPaths(box) {
  if (box.file) { box.path = box.n.__path || box.path; return; }
  if (box.n.__dom !== undefined) box.path = '@domain/' + box.n.name;
  box.kids.forEach(fixPaths);
}

/* A plate always sits behind everything standing on it, whichever way the plan is
   turned — so the order is the tree, and only siblings are sorted by depth. With
   translucent volumes this order is also the blend order, so it cannot be skipped. */
function paintOrder(box, out = []) {
  out.push(box);
  const kids = box.kids.slice();
  for (const k of kids) k.d = depth(k.x + k.w / 2, k.y + k.h / 2);
  kids.sort((a, b) => a.d - b.d);
  for (const k of kids) paintOrder(k, out);
  return out;
}

/* ---------- colour ---------- */
/* The studio bands a metric at two percentiles of what is on screen and paints
   the three bands. Nothing is a hue for its own sake — the band is the fact. */
/* One pigment per band, and nothing else. Every lighting, shade and contact term below is
   a scalar multiply on these three numbers, so a roof can never drift out of its own
   legend swatch — the legend is painted from the same call the roofs are. */
const BAND = [[96, 152, 132], [188, 150, 88], [194, 100, 80]];
/* A plate is lit ground, not a backdrop: it takes the same lamp, dark enough that the
   files standing on it stay the subject. */
const SLAB = [[38, 49, 56], [30, 40, 46], [24, 33, 39]];
/* the floor's own light, which is what the contour grid is drawn in */
const FOG = [26, 52, 64];
const GROUND = '#06090c';

const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a < 0.002 ? 0 : a.toFixed(3)})`;

/* ---------- the lamp ---------- */
/* One warm key, one cool fill, both fixed in the *model's* own space rather than the
   screen's, so turning the plan turns which side is lit. Five surface orientations exist
   here — four walls and a roof — so the light is solved five times and every face after
   that costs one multiply. */
const norm3 = v => { const m = Math.hypot(v[0], v[1], v[2]); return v.map(c => c / m); };
/* The plan direction matters: at the opening yaw the two visible walls are the -x and -y
   ones, so a lamp aimed between them lights both equally and every box goes flat. This one
   rakes across — one visible wall in the key, one in the fill. */
const KEY = norm3([-0.66, 0.36, 0.66]);
const FILL = norm3([0.58, -0.36, 0.30]);
const KEY_RGB = [1.00, 0.93, 0.82], FILL_RGB = [0.58, 0.76, 1.00];
const AMB_RGB = [0.30, 0.34, 0.39];
const KEY_I = 1.14, FILL_I = 0.32;
const NORMALS = { r: [0, 0, 1], px: [1, 0, 0], nx: [-1, 0, 0], py: [0, 1, 0], ny: [0, -1, 0] };
const FACE_ID = { r: 0, px: 1, nx: 2, py: 3, ny: 4 };
const LIT = {};
for (const [k, n] of Object.entries(NORMALS)) {
  const kd = Math.max(0, n[0] * KEY[0] + n[1] * KEY[1] + n[2] * KEY[2]);
  const fd = Math.max(0, n[0] * FILL[0] + n[1] * FILL[1] + n[2] * FILL[2]);
  const sky = Math.max(0, n[2]) * 0.16;
  LIT[k] = AMB_RGB.map((a, i) =>
    a + KEY_I * kd * KEY_RGB[i] + FILL_I * fd * FILL_RGB[i] + sky * FILL_RGB[i]);
}
/* how much of a wall's own light survives at its foot: the rest is blocked by whatever
   stands around it, which is all a contact shadow ever is */
const FOOT = 0.44;
/* the plan direction the key comes from, which every shadow, seam and lit edge reads */
const KEY_XY = norm3([KEY[0], KEY[1], 0]);

/* rgb() strings are the one real cost of repainting 1547 boxes, so shade is quantised to
   24 steps and every (pigment, orientation, shade) triple is built once. */
const SWATCH = new Map();
function tone(base, face, shade) {
  const q = Math.max(0, Math.min(24, Math.round(shade * 24)));
  const id = ((base[0] << 16) | (base[1] << 8) | base[2]) + FACE_ID[face] * 2e7 + q * 2e9;
  let s = SWATCH.get(id);
  if (s === undefined) {
    const m = LIT[face], k = q / 24;
    s = 'rgb(' + base.map((c, i) => Math.min(255, Math.round(c * m[i] * k))).join(',') + ')';
    SWATCH.set(id, s);
  }
  return s;
}
/* the roof a reader is asked to hold the legend against: the same call, at the shade a
   typical file's roof lands on, so the swatch is a measurement rather than a guess */
const PLAN_SHADE = 0.85;
const roofSwatch = i => tone(BAND[i], 'r', PLAN_SHADE);

function bands(k) {
  const v = sorted(k);
  if (!v.length) return [0, 0];
  const q = p => v[Math.min(v.length - 1, Math.floor(p * v.length))];
  return [q(0.5), q(0.85)];
}

/* One measure over every file, in order, kept because a bare 12 says nothing: the reader
   needs to know whether 12 is the calm end of this repo or the wild one. */
const SORTS = new Map();
function sorted(k) {
  if (!SORTS.has(k)) SORTS.set(k, leaves(DATA).map(f => at(f, k)).sort((a, b) => a - b));
  return SORTS.get(k);
}

/* Two measures over the same files, as one number. It answers the question a colour ramp
   always raises: is the red telling me anything the size did not already say? Nothing here
   is asserted — the correlation is computed from the same values the map is drawn from. */
function corr(j, k) {
  const f = leaves(DATA);
  const a = f.map(n => at(n, j)), b = f.map(n => at(n, k));
  const ma = a.reduce((x, y) => x + y, 0) / a.length;
  const mb = b.reduce((x, y) => x + y, 0) / b.length;
  let ab = 0, aa = 0, bb = 0;
  for (let i = 0; i < a.length; i++) {
    const u = a[i] - ma, v = b[i] - mb;
    ab += u * v; aa += u * u; bb += v * v;
  }
  return aa && bb ? ab / Math.sqrt(aa * bb) : 0;
}

/* said only when it is worth saying: a channel does not correlate with itself, and a weak
   correlation is the absence of a finding rather than one */
const CORRS = new Map();
function twin(k) {
  const a = state.area;
  if (k === a) return '';
  const id = k + '|' + a;
  if (!CORRS.has(id)) CORRS.set(id, corr(k, a));
  const r = CORRS.get(id);
  if (r < 0.5) return '';
  return `\n\nMoves with ${DESC[a].title} across all `
    + `${leaves(DATA).length.toLocaleString('en-US')} files: r = ${r.toFixed(2)}. `
    + `Much of this colour is size.`;
}

/* the share of files that score lower than this one, which is the position on the gauge */
function rank(v, k) {
  const s = sorted(k);
  let i = 0;
  while (i < s.length && s[i] < v) i++;
  return s.length ? i / s.length : 0;
}

/* ---------- camera ---------- */
/* The opening view. Yaw 45° puts both plan axes across the screen, which is what makes
   a city read as a city rather than as a wall; pitch 35.3° is the true isometric angle,
   where a unit cube's three visible faces come out equal. */
const YAW = Math.PI / 4, PITCH = 0.6155;
const cam = { yaw: YAW, pitch: PITCH, scale: 1, ox: 0, oy: 0 };
const C = PLAN / 2;

/* The two views are one camera. ZK is how much of the third dimension is left: 1 is the
   city, 0 is the treemap. It scales the heights and lifts the eye to infinity together,
   because a flat picture drawn through a finite eye is a shear, not a plan. Every distance,
   shadow, wall and lit edge in the page reads it, so there is one number to tween. */
let ZK = 1;
const flat = () => ZK < 0.02;
/* the city's own angles, kept while the plan is showing so switching back is a return */
let cityYaw = YAW, cityPitch = PITCH;
function setFlat(f) {
  ZK = 1 - f;
  cam.yaw = cityYaw * (1 - f);
  cam.pitch = cityPitch + (Math.PI / 2 - cityPitch) * f;
}
/* four trig calls per projected point is the whole cost of a fit; the angles change once
   per frame at most, so they are solved when they change and read otherwise */
let _sy = 0, _cy = 0, _sp = 0, _cp = 0, _ky = NaN, _kp = NaN;
function trig() {
  if (cam.yaw !== _ky) { _ky = cam.yaw; _sy = Math.sin(_ky); _cy = Math.cos(_ky); }
  if (cam.pitch !== _kp) { _kp = cam.pitch; _sp = Math.sin(_kp); _cp = Math.cos(_kp); }
}

/* The eye sits a finite distance from the plan and everything divides by how far away it
   is, which is what makes a receding floor read as a floor. CodeCharta's own studio does
   the same — its bundle builds `new PerspectiveCamera(45, ...)` — and an orthographic view
   of a big plan at a low tilt reads as a shear instead, because nothing converges.
   EYE is the distance that frames this plan at that same 45° field of view. */
const EYE = PLAN * 1.7;

function raw(x, y, z) {
  trig();
  const dx = x - C, dy = y - C, zz = z * ZK;
  const across = dx * _cy - dy * _sy;
  const into = dx * _sy + dy * _cy;
  const away = EYE + (into * _cp - zz * _sp) * ZK;   // distance along the view axis
  return [across / away, -(into * _sp + zz * _cp) / away];
}

function project(x, y, z) {
  const [px, py] = raw(x, y, z);
  return [px * cam.scale + cam.ox, py * cam.scale + cam.oy];
}

/* A hand-turned view lands a degree or two off square, and a lopsided diamond reads as a
   broken projection rather than as a near miss. Angles within 2.5° of a multiple of the
   step fall onto it; anywhere else the drag is free. */
function snap(a, step) {
  const near = Math.round(a / step) * step;
  return Math.abs(a - near) < 0.044 ? near : a;
}

/* Every gesture that turns the model comes through here — the option-drag on the map and
   the orbit widget both — so the two cannot disagree about which angles are legal. The
   pitch clamp is the reading: flat on is unreadable, straight down loses every height. */
function turnTo(yaw, pitch) {
  cityYaw = snap(yaw, Math.PI / 4);
  cityPitch = snap(Math.min(1.45, Math.max(0.10, pitch)), PITCH);
  setFlat(0);
}

/* how near a plan point is to the eye — larger is nearer, which is what the paint order,
   the choice of visible walls and the whole depth falloff ask for */
const depth = (x, y) => { trig(); return -((x - C) * _sy + (y - C) * _cy); };

/* the zoom at which the whole city fits the stage, at whatever angle it is turned to */
function baseScale() { return extent().k; }

/* The picture's real extent, measured rather than assumed. The tallest tower is nowhere
   near a corner, so a formula that reserves the full height at the far corner leaves the
   map sitting high with a band of nothing under it. */
/* A box list may be passed to measure ONE plate and what stands on it, which is what a snap
   frames. Same measurement either way, so a snapped camera and a fitted one are the same
   kind of thing rather than two arrangements that happen to agree. */
function extent(boxes, inset) {
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
  const pad = inset === undefined ? 34 : inset;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const b of (boxes || boxesNow())) {
    for (const [x, y] of [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]]) {
      for (const z of [b.z0, b.z1]) {
        const [px, py] = raw(x, y, z);
        x0 = Math.min(x0, px); x1 = Math.max(x1, px);
        y0 = Math.min(y0, py); y1 = Math.max(y1, py);
      }
    }
  }
  const k = Math.min((W - pad * 2) / (x1 - x0), (H - pad * 2) / (y1 - y0));
  return { k, mx: (x0 + x1) / 2, my: (y0 + y1) / 2, w: (x1 - x0) * k };
}

/* the layout of the moment: the drawn one when there is one, else a fresh one, because
   the first fit runs before anything has been drawn */
function boxesNow() {
  return view ? view.boxes : paintOrder(tree());
}

function fit() {
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
  const e = extent();
  cam.scale = e.k;
  cam.ox = W / 2 - e.mx * e.k;
  cam.oy = H / 2 - e.my * e.k;
}

/* ---------- the snap ---------- */
/* 500ms and ease-out, taken from the evidence rather than from taste: the field clusters at
   500–750ms, and the low end is where the two systems whose hops are short and repeated sit —
   Highcharts' animObject (500ms, easeInOutSine) and MapLibre's easeTo (500ms, CSS ease).
   ECharts' cubicOut is the easing this page already spells `ease`. §5 and §8.5. */
const SNAP_MS = 500;

/* The camera that frames a set of boxes with a margin round them. fit() is this over the
   whole city; a snap is this over one plate and everything standing on it. */
function camFor(boxes, fill) {
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
  const e = extent(boxes, boxes ? 0 : undefined);
  /* Bounded off the fitted scale rather than off itself, so however deep the descent goes the
     camera cannot arrive somewhere it could not be flown to. Unreachable on this repo — the
     deepest plate lands at 2.1x fit against a 90x ceiling — but a bound that holds only for
     the data you happened to measure is a bound that will be wrong silently. */
  const base = baseScale();
  const k = Math.min(base * 90, Math.max(base * 0.5, e.k * (fill || 1)));
  return { scale: k, ox: W / 2 - e.mx * k, oy: H / 2 - e.my * k };
}

/* WHAT IS INTERPOLATED, and why it is not the obvious thing.
   Bostock's zoomable treemap sets the x/y scale DOMAINS at the two endpoints and lets d3
   interpolate the resulting rect attributes. atlas-snap-zoom.md §5 works out what that
   actually computes: because the domain change is a SIMILARITY shared by every rect,
   per-rect linear interpolation of the corners is pointwise identical to linearly
   interpolating the single affine transform. Our camera IS that transform — screen =
   raw(x,y,z) * scale + (ox,oy) — so interpolating `scale`, `ox` and `oy` linearly is d3's
   animation exactly, for the price of three numbers instead of fifteen hundred rectangles.
   Interpolating the visible raw-space window (the literal domain lerp, i.e. linear in 1/scale)
   would NOT be d3's treemap; it is what the zoomable SUNBURST does, and it would bend every
   rect's pixel path.
   The tween writes cam itself rather than holding a private copy, which is Bostock's
   documented reason for storing interpolated state back on the datum: a second plate clicked
   mid-flight retargets from where the camera actually is, and cannot snap. */
let fly = null;         // { t0, from, to, at } — `at` is the last camera this tween wrote
let calmStamp = false;
function flyTo(to) {
  if (!CALM) {
    const from = { scale: cam.scale, ox: cam.ox, oy: cam.oy };
    fly = { t0: performance.now(), to, from, at: { ...from } };
    return;
  }
  fly = null; Object.assign(cam, to); rebuild();
  /* A snap several plates deep enters one level at a time, so under reduced motion the cut
     happens once per level inside a single turn. Deferring the write to the microtask
     checkpoint makes a completed gesture stamp exactly ONCE however many levels it crossed —
     which is what the tween gets for free, because only the surviving flight lands. */
  if (calmStamp) return;
  calmStamp = true;
  queueMicrotask(() => { calmStamp = false; stamp(); });
}

/* Anyone else who writes the camera wins. The tween remembers its own last write, so a wheel
   notch, a drag, a turn, a resize or a view change during a flight ends it instead of fighting
   it a frame at a time — and it ends without touching the scope, because a wheel is a size and
   never a selection. */
function flyStep(now) {
  const c = fly.at;
  if (c && (cam.scale !== c.scale || cam.ox !== c.ox || cam.oy !== c.oy)) { fly = null; return; }
  const u = Math.min(1, (now - fly.t0) / SNAP_MS), e = ease(u), f = fly.from, t = fly.to;
  cam.scale = f.scale + (t.scale - f.scale) * e;
  cam.ox = f.ox + (t.ox - f.ox) * e;
  cam.oy = f.oy + (t.oy - f.oy) * e;
  if (u < 1) { fly.at = { scale: cam.scale, ox: cam.ox, oy: cam.oy }; rebuild(true); return; }
  /* Landed on the exact target, never on frame 30 of an easing curve, so the camera a snap
     reaches is byte-identical to the same camera reached any other way. */
  Object.assign(cam, t);
  fly = null;
  rebuild();
  /* Once, on arrival. replaceState called repeatedly outside an input event stalls the Chrome
     renderer for seconds, so a tween may never stamp per frame. */
  stamp();
}

/* ---------- the two layers ---------- */
/* Fifteen hundred translucent volumes cost three paths each and cannot be redrawn sixty
   times a second. The model is painted once per state change into `model`, and every
   frame composites that one bitmap and draws only what moves: the cords and whatever the
   pointer holds. The rise is the exception — it repaints the model itself. */
const cv = $('cv'), ctx = cv.getContext('2d');
const model = document.createElement('canvas');
const mctx = model.getContext('2d');
/* Two half-resolution buckets of solid black, one per softness, so a thousand shadows are
   blurred for the price of two blits rather than a thousand. */
const shortCv = document.createElement('canvas'), sctx = shortCv.getContext('2d');
const tallCv = document.createElement('canvas'), tctx = tallCv.getContext('2d');
const SHADOW_SCALE = 0.5;
let view = null;   // { boxes, lo, hi, seat, dLo, dSpan, top, bottom }
let W = 0, H = 0, DPR = 1;

/* the animated clocks, all in one place so reduced motion can silence them together */
let ft = [];        // the last composites, in ms — read by the harness
let mt = [];        // the last static rebuilds, in ms
let nt = [];        // and the last label passes, which are a budget of their own

/* ---------- the rise ---------- */
/* Buildings grow out of their plates from the middle of the plan outwards, with a touch of
   overshoot at the top of the travel, and the whole assembly is over in a second. It runs on
   load and on a reset, never on a channel change — a model that reassembles every time you
   touch a menu is a loading screen. */
const RISE_SPAN = 620, RISE_DUR = 400;
let riseT0 = 0, rising = false;
function rise() { if (CALM || state.plan) return; riseT0 = performance.now(); rising = true; }

/* ---------- lying down ---------- */
/* The one moment the two views explain each other: the heights collapse and the eye swings
   overhead on the same clock, so the city is seen to be the treemap rather than replaced by
   it. Eased at both ends by the page's own glide, and it settles on an exact 0 or 1. */
const VIEW_MS = 980;
let vT0 = 0, vFrom = 0, vTo = 0, turning = false;
function setView(plan) {
  if (state.plan === plan) return;
  if (plan && ZK === 1) { cityYaw = cam.yaw; cityPitch = cam.pitch; }
  state.plan = plan;
  state.hover = null;
  hideDef(); segUI();
  if (CALM) { setFlat(plan ? 1 : 0); fit(); rebuild(); }
  else { vFrom = ZK; vTo = plan ? 0 : 1; vT0 = performance.now(); turning = true; }
  /* The turn refits every frame, so the camera it lands on is the whole map either way. The
     treemap then seats the level you were in, because that is the only framing it has; the
     city is left fitted, because the camera there is the reader's and free zoom is all of it.
     Both happen where the turn ENDS — a flight started here is written over by the next
     refit and reads as the framing having been ignored. */
  detail(null); stamp();
}
/* ---------- the reshuffle ---------- */
/* Both tilings hold the same boxes at the same areas, so the move conserves every footprint
   and only ever changes where it is. Files leave in the order their domains are listed, which
   is the whole point of watching it: a domain gathers itself out of five different plates.
   The camera holds still through it. Laying the city down for the journey showed more of the
   motion, and cost the reader the one thing that makes the move legible — that it is the same
   city they were already looking at. */
const DOM_MS = 780, DOM_STAGGER = 300;
let morph = null;

function domUI() {
  for (const [id, m] of [['dOff', 'off'], ['dGroup', 'group']])
    $(id).setAttribute('aria-pressed', String(state.dom === m));
  const ready = domainsReady();
  $('dGroup').disabled = !ready;
  $('lDom').classList.toggle('off', !ready);
  /* In Domains mode the map is lit by domain and the measured channel is not read at all,
     so the menu says so rather than naming a measure nothing is drawn from — the same
     treatment `segUI` gives Height in a treemap, for the same reason. */
  const byDom = state.dom === 'group';
  $('mColour').disabled = byDom;
  $('lColour').classList.toggle('off', byDom);
}

/* Anything that changes which boxes exist or where they sit goes through here, so hiding the
   tests travels the same way regrouping does. A reader who has seen one move understands the
   next one, and a map that sometimes cuts and sometimes travels teaches nothing. */
function reshuffle(apply) {
  const from = CALM || !view ? null
    : new Map(view.boxes.filter(b => b.file).map(b => [b.path, [b.x, b.y, b.w, b.h]]));
  apply();
  treeKey = '';
  if (from) {
    for (const b of paintOrder(tree())) if (b.file) { b.mx = b.x; b.my = b.y; b.mw = b.w; b.mh = b.h; }
    morph = { t0: performance.now(), from, plate: 1 };
  }
  fit(); rebuild(); detail(null); railIndex(); stamp();
}

function setDom(mode) {
  if (state.dom === mode || (mode !== 'off' && !domainsReady())) return;
  const regroup = (mode === 'group') !== (state.dom === 'group');
  beginFade();
  const apply = () => {
    state.dom = mode; state.hover = null; state.pinned = null; state.domSel = null;
    state.folder = null; state.folderName = null; state.trail = []; closePage();
    hideDef(); domUI();
  };
  if (regroup) reshuffle(apply);
  else { apply(); treeKey = ''; fit(); rebuild(); detail(null); stamp(); }
}

/* ---------- LEVELS ARE PLACES ON ONE FIXED MAP ----------
   There is one tiling and it never moves. Every folder's children are already sitting
   inside it, at every depth, so going into a folder is not a different picture — it is the
   same picture, larger. Nothing reflows, nothing dissolves, nothing is redrawn: the only
   thing that changes is the camera, which is why it can be continuous at all.

   The wheel does not scrub that scale by hand. A notch is read for its direction only and
   fires the same flight a click does — in, the child under the pointer; out, the parent —
   because the two gestures mean the same thing and a reader who learns one has learned both.

   The flight always lands CENTRED, at the scale where the box's width or its height meets
   the window edge: the whole of it on screen and nothing of its siblings. */
const SEAT = 1.0;        // seated: the box's longer axis meets the window edge

/* Layout coordinates to canvas pixels, through the camera that is drawing right now. Exact
   in plan view, where the projection is flat and `raw` is affine. */
const screenRect = r => {
  const a = raw(r[0], r[1], 0), b = raw(r[0] + r[2], r[1] + r[3], 0);
  return [a[0] * cam.scale + cam.ox, a[1] * cam.scale + cam.oy,
          (b[0] - a[0]) * cam.scale, (b[1] - a[1]) * cam.scale];
};
const rectOf = b => screenRect([b.x, b.y, b.w, b.h]);
/* How much of the window a box covers, on whichever axis covers more of it. 1 is the edge. */
function ratioOf(b) {
  const st = $('stage'), r = rectOf(b);
  return Math.max(Math.abs(r[2]) / st.clientWidth, Math.abs(r[3]) / st.clientHeight);
}
/* The camera that puts one box on the stage at exactly `fill` of it, centred. */
function seatCam(b, fill) {
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
  const p = raw(b.x, b.y, 0), q = raw(b.x + b.w, b.y + b.h, 0);
  const k = fill * Math.min(W / Math.abs(q[0] - p[0]), H / Math.abs(q[1] - p[1]));
  return { scale: k, ox: W / 2 - (p[0] + q[0]) / 2 * k, oy: H / 2 - (p[1] + q[1]) / 2 * k };
}

/* WHERE THE CAMERA IS COMING IN ON. Null is the root, which is the whole map and the one
   place the ride bottoms out — there is nothing outside it to pull back to. */
let aim = null;
const aimBox = () => aim || tree();
/* A folder holding no files of its own is not drawn and not named, so it is not a level
   either: the ride passes straight through the build-only chains rather than spending a
   notch on each of them. */
function upOf(b) { let p = b.up; while (p && p.ghost) p = p.up; return p || null; }
/* The scope is READ OFF the camera rather than kept beside it, so the crumb, the rail and
   the reading can never name a folder the map is not standing in. */
function scopeTo(b) {
  const root = tree();
  const chain = [];
  for (let x = b; x && x !== root; x = x.up) if (!x.ghost) chain.unshift(x);
  state.trail = chain.map((x, n) => ({ path: n ? chain[n - 1].path : null,
                                       name: n ? chain[n - 1].n.name : null, top: 0 }));
  state.folder = chain.length ? chain[chain.length - 1].path : null;
  state.folderName = chain.length ? chain[chain.length - 1].n.name : null;
  closePage();
  railIndex(); key(view.lo, view.hi); detail(null); railMark();
}
function setAim(b) {
  const root = tree();
  aim = b && b !== root ? b : null;
  scopeTo(aimBox());
}

/* GOING BACK IS A CONTROL, NOT A GESTURE. The wheel used to carry the navigation and it
   never earned it: a notch has no distance worth honouring, in and out do not mean the same
   kind of thing, and every rule that made one of them behave made the other worse. So the
   map has two ways through it and they are both things you press — a click to go in, and
   Back to come out one level. Nothing is hidden in the scroll.

   The plan therefore does not zoom by hand at all. Where you can be is exactly the set of
   folders, each seen whole, and that is a smaller promise than free zoom but it is one the
   map can keep. */
function back() {
  const root = tree();
  if (aimBox() === root) return false;
  goTo(upOf(aimBox()) || root);
  return true;
}

/* A CLICK IS THE SAME ARRIVAL, flown. It is one flight and not one per level, because with
   the picture standing still there is nothing for the intervening levels to show. */
function goTo(b) {
  if (!b) return false;
  setAim(b);
  /* The root is framed the way the opening view frames it, not seated hard against the
     edge, so Back's last step and the reset button agree on where "all of it" is. */
  /* THE CITY DOES NOT FLY. A click there chooses a scope and nothing else — the camera is
     the reader's, moved by the hand on the wheel and the drag, and a click that also flew it
     took the view away from whoever was looking through it. The treemap is the opposite case
     for the opposite reason: it has no wheel, so the flight IS the navigation. */
  if (!state.plan) return true;
  /* The root is framed the way the opening view frames it, not seated hard against the
     edge, so Back's last step and the reset button agree on where "all of it" is. */
  flyTo(aimBox() === tree() ? camFor(null, 1) : seatCam(aimBox(), SEAT));
  return true;
}

/* The stagger is by destination domain, not by distance: the reader is being shown that a
   domain is one thing, so it has to arrive as one thing. */
function morphStep(now) {
  const span = DOM_MS + DOM_STAGGER;
  const u = Math.min(1, (now - morph.t0) / span);
  const ranks = DOM ? DOM.clusters.length : 1;
  for (const b of paintOrder(TREE)) {
    if (!b.file || b.mx === undefined) continue;
    const src = morph.from.get(b.path) || [b.mx, b.my, b.mw, b.mh];
    const d = DOM && DOM.byPath.get(b.path);
    const r = d && d.id >= 0 ? (DOM.rank.get(d.id) || 0) / Math.max(1, ranks - 1) : 1;
    const t = Math.max(0, Math.min(1, (now - morph.t0 - r * DOM_STAGGER) / DOM_MS));
    const e = glide(t);
    b.x = src[0] + (b.mx - src[0]) * e; b.y = src[1] + (b.my - src[1]) * e;
    b.w = src[2] + (b.mw - src[2]) * e; b.h = src[3] + (b.mh - src[3]) * e;
  }
  /* Out over the first fifth, in over the last: the plates that are leaving and the plates
     that are arriving are different plates, so they must not be on screen together. */
  morph.plate = u < 0.2 ? 1 - u / 0.2 : u > 0.8 ? (u - 0.8) / 0.2 : 0;
  fit();
  if (u >= 1) {
    for (const b of paintOrder(TREE)) if (b.file && b.mx !== undefined) {
      b.x = b.mx; b.y = b.my; b.w = b.mw; b.h = b.mh;
    }
    morph = null;
    fit(); rebuild(); detail(null);
  } else rebuild(true);
}

function segUI() {
  $('vCity').setAttribute('aria-pressed', String(!state.plan));
  $('vPlan').setAttribute('aria-pressed', String(!!state.plan));
  $('mHeight').disabled = !!state.plan;
  $('lHeight').classList.toggle('off', !!state.plan);
  $('orbit').classList.toggle('flat', !!state.plan);
}
function riseZ(b, on) {
  if (!on || !b.file) return b.z1;
  const t = (performance.now() - riseT0 - b.rd * RISE_SPAN) / RISE_DUR;
  if (t <= 0) return 0;
  if (t >= 1) return b.z1;
  const u = t - 1, s = 1.15;
  return b.z1 * (1 + (s + 1) * u * u * u + s * u * u);
}

/* One 96px tile of noise, built once. Large smooth gradients on a near-black ground band in
   8-bit; the grain is what keeps them smooth, and it is a pattern fill rather than per-box
   work. It lives in the static layer, so a still frame is still still. */
let GRAIN = null;
function grain() {
  if (GRAIN) return GRAIN;
  const t = document.createElement('canvas'); t.width = t.height = 96;
  const c = t.getContext('2d'), im = c.createImageData(96, 96);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 118 + (Math.random() * 74 | 0);
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
  }
  c.putImageData(im, 0, 0);
  GRAIN = mctx.createPattern(t, 'repeat');
  return GRAIN;
}

/* ---------- the static model ---------- */
function rebuild(fast) {
  const t0 = performance.now();
  const st = $('stage');
  W = st.clientWidth; H = st.clientHeight; DPR = devicePixelRatio || 1;
  if (model.width !== W * DPR || model.height !== H * DPR) {
    model.width = W * DPR; model.height = H * DPR;
    cv.width = W * DPR; cv.height = H * DPR;
    shortCv.width = tallCv.width = Math.max(1, Math.round(W * DPR * SHADOW_SCALE));
    shortCv.height = tallCv.height = Math.max(1, Math.round(H * DPR * SHADOW_SCALE));
  }
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ss = DPR * SHADOW_SCALE;
  sctx.setTransform(ss, 0, 0, ss, 0, 0);
  tctx.setTransform(ss, 0, 0, ss, 0, 0);

  /* One tree, one layout, one set of colour bands. Zooming is the only way in, so a
     volume's colour means the same thing wherever you are looking from. */
  const boxes = paintOrder(tree());
  const [lo, hi] = bands(state.colour);

  /* the falloff is measured against what is actually on screen, so it reads the same
     whether you are over the whole repo or inside one folder */
  let dLo = Infinity, dHi = -Infinity;
  for (const b of boxes) {
    const d = depth(b.x + b.w / 2, b.y + b.h / 2);
    if (d < dLo) dLo = d;
    if (d > dHi) dHi = d;
  }
  const seat = new Map();
  for (const b of boxes) if (b.file) seat.set(b.path, b);
  /* how far out from the middle of the plan a box sits, which is the only thing the rise
     staggers on — it is a plan measurement, so the wave is the same at any zoom */
  for (const b of boxes) if (b.file && b.rd === undefined)
    b.rd = Math.hypot(b.x + b.w / 2 - C, b.y + b.h / 2 - C) / (C * 1.42);
  view = { boxes, lo, hi, seat, dLo, dSpan: (dHi - dLo) || 1, top: H, bottom: 0 };

  mctx.clearRect(0, 0, W, H);
  drawFloor(boxes);
  /* Every plate, then the shadows they and their buildings cast, then every building. The
     split is safe because plate tops are all coplanar at z=0 and tile the plan, so a plate
     can only ever hide another plate's skirt — never anything standing up. It is also what
     lets the shadows be blurred once instead of per box. */
  const plates = boxes.filter(b => !b.file && !b.ghost), files = boxes.filter(b => b.file);
  for (const b of plates) drawBox(mctx, b, undefined, fast);
  /* A shadow is a statement about height. The treemap shows none, so it casts none —
     every lighting term here fades out on the same ZK the heights collapse on. */
  if (ZK > 0.01) {
    sctx.clearRect(0, 0, W, H); tctx.clearRect(0, 0, W, H);
    sctx.fillStyle = tctx.fillStyle = '#000';
    /* A plate's own skirt is short and always correct — its shadow can only ever fall on the
       plate outside it — so it keeps a fixed weight rather than being sized by its thickness. */
    for (const b of plates) castShadow(b, b.z1 - b.z0, sctx, 0.55 * ZK);
    for (const b of files) {
      const z = riseZ(b, rising);
      const wt = shadowWeight(z) * ZK;
      if (wt > 0.01) castShadow(b, z, z > 40 ? tctx : sctx, wt);
    }
    /* Both buckets go down before any building does, so a shadow can only ever land on the
       plate its caster stands on. There is no depth test in a flat buffer, so a pass that put
       these over the roofs would smear a tower across flat files a folder away. */
    blit(shortCv, 2.2, 0.50);
    blit(tallCv, 5.5, 0.46);
  }
  for (const b of files) drawBox(mctx, b, riseZ(b, rising), fast);
  if (!fast) {
    for (const b of boxes) noteMark(b);
    mctx.save();
    mctx.globalCompositeOperation = 'overlay';
    mctx.globalAlpha = 0.05; mctx.fillStyle = grain();
    mctx.fillRect(0, 0, W, H);
    mctx.restore();

    $('count').textContent = `${leaves(live()).length.toLocaleString('en-US')} files`
      + (state.noTests ? ` · tests hidden` : '')
      + (DOM ? ` · ${DOM.clusters.length} domains` : '')
      + ` · measured by CodeCharta`;
    key(lo, hi);
  }
  mt.push(performance.now() - t0);
  if (mt.length > 120) mt = mt.slice(-60);
}

/* how sharp a box is: 1 at the eye, 0 at the far edge of what is drawn */
const nearness = b => (depth(b.x + b.w / 2, b.y + b.h / 2) - view.dLo) / view.dSpan;

/* ---------- the floor ---------- */
/* Drawn, not implied. A contour grid on its own plane, brighter under every plate, so the
   volumes have something to hover over. */
const GRID_N = 32;
/* how far past the plan the floor runs. Just past the footprint: a floor that reaches the
   edge of the picture is the subject, and the model is what the reader came for. */
const FLOOR_PAD = 0.018;
function gridPath(g, n, from, to) {
  g.beginPath();
  for (let i = 0; i <= n; i++) {
    const u = from + (to - from) * (i / n);
    let p = project(from, u, FLOOR_Z), q = project(to, u, FLOOR_Z);
    g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
    p = project(u, from, FLOOR_Z); q = project(u, to, FLOOR_Z);
    g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
  }
}

function drawFloor(boxes) {
  const pad = PLAN * FLOOR_PAD;
  /* The ground is graded, not uniform: the lamp reaches the middle of the plan and falls
     away to the corners, so the picture has a centre of attention. */
  const c0 = project(C, C, FLOOR_Z);
  const gr = mctx.createRadialGradient(c0[0], c0[1], 0, c0[0], c0[1], Math.max(W, H) * 0.72);
  gr.addColorStop(0, '#0b1015'); gr.addColorStop(0.5, '#080c10'); gr.addColorStop(1, GROUND);
  mctx.fillStyle = gr; mctx.fillRect(0, 0, W, H);
  /* the plates' own light on the floor, and it stacks: a deeply nested corner of the repo
     sits over more plates than a shallow one, and comes out brighter for it */
  for (const b of boxes) {
    if (b.file || b.ghost) continue;
    const q = [project(b.x, b.y, FLOOR_Z), project(b.x + b.w, b.y, FLOOR_Z),
               project(b.x + b.w, b.y + b.h, FLOOR_Z), project(b.x, b.y + b.h, FLOOR_Z)];
    quad(mctx, q[0], q[1], q[2], q[3], rgba([70, 175, 205], 0.018 / (1 + b.depth * 0.45)));
  }
  mctx.lineWidth = 1;
  mctx.strokeStyle = rgba(FOG, 0.10);
  gridPath(mctx, GRID_N, -pad, PLAN + pad);
  mctx.stroke();
  mctx.strokeStyle = rgba([80, 178, 205], 0.055);
  gridPath(mctx, 8, -pad, PLAN + pad);
  mctx.stroke();

  vignette(mctx);
}

/* the far floor has to go out somewhere, and a hard edge reads as a table top. Anything
   that lights the floor later is bounded by the same falloff, or it lights nothing. */
function vignette(g) {
  const c = project(C, C, FLOOR_Z);
  const r = g.createRadialGradient(c[0], c[1], Math.min(W, H) * 0.30,
                                   c[0], c[1], Math.max(W, H) * 0.62);
  r.addColorStop(0, 'rgba(6,9,12,0)');
  r.addColorStop(1, GROUND);
  g.fillStyle = r; g.fillRect(0, 0, W, H);
}

/* ---------- one volume ---------- */
/* The two walls you can see depend on which way the plan is turned, so they are
   found each frame rather than fixed to the +x and +y sides. */
function nearWalls(x, y, w, h) {
  const c = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  let near = 0, best = -Infinity;
  c.forEach((p, i) => { const d = depth(p[0], p[1]); if (d > best) { best = d; near = i; } });
  return [[c[(near + 3) % 4], c[near]], [c[near], c[(near + 1) % 4]]];
}
/* the four plan corners with the nearest one's index, which is what decides both which
   edges are lit and which one is the silhouette's far seam */
function corners(x, y, w, h) {
  const c = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  let near = 0, best = -Infinity;
  c.forEach((p, i) => { const d = depth(p[0], p[1]); if (d > best) { best = d; near = i; } });
  return { c, near };
}

/* which world side of the box a wall sits on, which is the only thing its lighting reads */
function pickFace(x, y, a, e) {
  if (a[1] === e[1]) return a[1] === y ? 'ny' : 'py';
  return a[0] === x ? 'nx' : 'px';
}
/* Every reason a file's colour can change, in one place, so the crossfade below has a single
   before and a single after to interpolate between rather than a rule per feature.
   A search is a question about the whole map, so the map answers it: what does not match goes
   to the ground colour and what does keeps whatever it was already saying. */
/* WHERE YOU ARE IS NOT A QUESTION THE MAP ANSWERS BY DIMMING, in either view. Going into a
   folder, and hovering a row that names one, both used to grey everything else; both read as
   the map breaking rather than answering, because neither was a question anybody asked. A
   SEARCH and a CHOSEN DOMAIN are questions, and the whole map is the answer — those two are

const inDomain = (path, id) => { const d = DOM && DOM.byPath.get(path); return !!d && d.id === id; };

function inScope(path) {
  if (HITS && !HITS.has(path)) return false;
  if (state.domSel !== null && DOM && !inDomain(path, state.domSel)) return false;

}

/* Where a box SITS and what colour it IS are two questions with two controls. The MODE

}

/* Colour changes are dissolves, not cuts. Switching the channel, turning domains on, picking

const bandOf = b => { const v = at(b.n, state.colour); return v > view.hi ? 2 : v > view.lo ? 1 : 0; };

/* Opaque, in paint order, so a box hides what stands behind it. The pigment is the band and

function drawBox(g, b, zTop, fast) {

   where the fill does. A highlight on the unlit side is the single tell of fake lighting. */
function edges(g, x, y, w, h, z, t) {

/* Twenty-five noted files among fifteen hundred is a needle in a field, so the note has to

function noteMark(b) {
  if (!b.file || !NOTES.files || !NOTES.files[b.path]) return;

   and its roof quad in the city. Nothing floats: a label that is not inside the thing it

   measured against the pigment and the higher ratio wins. A threshold is a guess about the

const quadOf = b => [project(b.x, b.y, b.z1), project(b.x + b.w, b.y, b.z1),

/* THE PLAN. Every rectangle is data and there is no sky to write into, so the name goes
   INSIDE its own cell, top-left, one padding for all of them — aligned names read as a grid,
   centred ones read as a scatter. Clipped to the cell, so two names on two disjoint cells
   cannot collide and no name can run off the map. */
function cellPlan(b, size, q0) {

  ctx.font = font(size, 500);

/* THE CITY. A volume's flat face is its roof, a parallelogram in screen space rather than a

/* A roof's four-corner test is exact but purely geometric, and there is no id buffer here —

function footprints() {

  view.boxes.forEach((b, i) => {
    volIx.set(b.path, i);

const inkGrid = c => {

  if (i < 0) return false;
  const pts = inkGrid(corners), bb = bboxOf(corners);
  const [lx0, ly0, lx1, ly1] = [bb[0], bb[1], bb[0] + bb[2], bb[1] + bb[3]];
  for (let j = view.boxes.length - 1; j > i; j--) {
    const x0 = volBB[j * 4], y0 = volBB[j * 4 + 1];
    const x1 = volBB[j * 4 + 2], y1 = volBB[j * 4 + 3];
    if (x1 === 0 || lx0 > x1 || x0 > lx1 || ly0 > y1 || y0 > ly1) continue;
    /* a point at a time: the exact test walks three quads and eight projections apiece, so
       the point has to be inside this volume's own footprint before it is worth asking */
    for (const pt of pts)
      if (pt[0] >= x0 && pt[0] <= x1 && pt[1] >= y0 && pt[1] <= y1
          && inBox(view.boxes[j], pt[0], pt[1])) return true;
  }
  return false;
}

/* A lower bound on the room the shortest legible form of a name could possibly want, from the
   character floor and the rung alone. Fifteen hundred roofs are offered to the labeller every
   frame and all but a handful are far too small, so the cheap no comes before any measuring:
   0.3em a character is narrower than any string this font actually sets. */
const roomFor = (name, size) => Math.min(name.length, MIN_CHARS) * size * 0.3;

function roofPlan(b, size, q0) {
  const q = q0 || quadOf(b);
  const bb = bboxOf(q);
  if (bb[2] < roomFor(b.n.name, size) || bb[3] < size + 2) return null;
  const cx = (q[0][0] + q[2][0]) / 2, cy = (q[0][1] + q[2][1]) / 2;
  ctx.font = font(size, 600);
  const hi = size + 2;
  /* LEVEL, about the roof's own centre — and level is not a default here, it is a measured
     answer. The plate captions had to be turned to their band because a band is a long thin
     strip whose edge is its only long direction. A roof is the opposite shape: it projects to
     a near-diamond, and the roomiest line through a diamond is its own horizontal diagonal,
     1.41 times the edge in BOTH directions for a square roof at forty-five degrees. Offering
     the roof's two axes as well was tried and thrown away: over 816 roof names at ninety
     cameras — six pitches, five yaws, three zooms — not one of them ever won, and asking cost
     2.8 ms of a 4.9 ms frame at close range. The bbox across a rotated quad is far wider than
     the usable run through its middle, so it RETRIES shorter rather than giving up, which is
     what the one measurement against the bbox used to do. */
  let last = null;
  for (let room = bb[2]; room > 18; room *= 0.72) {
    const t = clipText(b.n.name, room);
    if (t === null) break;
    if (t === last) continue;
    last = t;
    const tw = mw(t) + 4;
    const box = [cx - tw / 2, cy - hi / 2, tw, hi];
    const pts = cornersOf(box);
    if (!pts.every(pt => inQuad(pt[0], pt[1], q)) || !fits(box, pts)) continue;
    return buried(b, pts) ? null
      : { kind: 'roof', q, box, pts, at: [box[0], cy], text: t, size, cut: t !== b.n.name };
  }
  return null;
}

const RUNGS = [SIZE_ON, SIZE_OFF];
/* the surface's quad is passed in wherever the caller already has it: fifteen hundred
   candidates a frame times two rungs is three thousand projections nobody needs twice */
function facePlan(b, q) {
  for (const size of RUNGS) {
    const p = flat() ? cellPlan(b, size, q) : roofPlan(b, size, q);
    if (p) return p;
  }
  return null;
}

/* Planned first, drawn second, because the alpha a name arrives at is only known once the
   fade has been advanced — and a fade cannot be advanced by something already on the canvas. */
function drawFace(b, p, alpha, by) {
  take(b, p.box, by, p.text, p);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = font(p.size, p.kind === 'cell' ? 500 : 600);
  if (p.kind === 'cell') {
    ctx.beginPath(); ctx.rect(p.clip[0], p.clip[1], p.clip[2], p.clip[3]); ctx.clip();
    ctx.textBaseline = 'top';
    ctx.fillStyle = ink(b);
    ctx.fillText(p.text, p.box[0], p.box[1]);
  } else {
    /* clipped to its own roof as well as tested against it: the four-corner test already
       promises the ink is inside, and the clip is what makes that true rather than trusted */
    ctx.beginPath();
    ctx.moveTo(p.q[0][0], p.q[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(p.q[i][0], p.q[i][1]);
    ctx.closePath(); ctx.clip();
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(2,8,12,.85)'; ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.at[0] + 2, p.at[1]);
    ctx.fillStyle = 'rgba(238,250,255,.96)';
    ctx.fillText(p.text, p.at[0] + 2, p.at[1]);
  }
  ctx.restore();
}

/* THE PLATE. A folder's name belongs INSIDE its own ground, and its ground is the band its
   children may not enter: the margin ring, thickened on one edge by the reserved caption
   strip. Four bands, all of them disjoint from every child's, and the name goes in whichever
   is nearest the eye — a band on the FAR edge is the one this plate's own towers stand in
   front of, which is where every plate name used to land. Clipped to the band and accepted
   only when all four corners of the text's box are inside it: the same exact test the roofs
   use, and the only thing that can promise a name is on the thing it names. */
function bandsOf(b) {
  const i = b.inner;
  if (!i) return [];
  return [[b.x, b.y, b.w, i[1] - b.y],
          [b.x, i[1] + i[3], b.w, b.y + b.h - i[1] - i[3]],
          [b.x, i[1], i[0] - b.x, i[3]],
          [i[0] + i[2], i[1], b.x + b.w - i[0] - i[2], i[3]]]
    .filter(r => r[2] > 1 && r[3] > 1);
}
const bandQuad = r => [project(r[0], r[1], 0), project(r[0] + r[2], r[1], 0),
                       project(r[0] + r[2], r[1] + r[3], 0), project(r[0], r[1] + r[3], 0)];

/* How much of a quad is actually ON the stage, in px². The honest measure of how big a thing
   is in the frame, and so the gate a plate's name is spent on. */
function stageArea(q) {
  let poly = q;
  for (const [a, b, c] of [[1, 0, -2], [-1, 0, W - 2], [0, 1, -2], [0, -1, H - 2]]) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], n = poly[(i + 1) % poly.length];
      const dp = a * p[0] + b * p[1] + c, dn = a * n[0] + b * n[1] + c;
      if (dp >= 0) out.push(p);
      if ((dp >= 0) !== (dn >= 0)) {
        const u = dp / (dp - dn);
        out.push([p[0] + (n[0] - p[0]) * u, p[1] + (n[1] - p[1]) * u]);
      }
    }
    poly = out;
    if (!poly.length) return 0;
  }
  let sum = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], n = poly[(i + 1) % poly.length];
    sum += p[0] * n[1] - n[0] * p[1];
  }
  return Math.abs(sum) / 2;
}

const PLATE_AREA = 1800;   // px² of visible ground before a folder is worth a name at all

/* The part of a segment that is ON the stage. A band a thousand pixels long can have both
   its ends off the picture and its middle in plain sight, and pinning the name to an end
   that is off the picture is exactly how the largest object in the frame went unnamed.
   (Liang & Barsky 1984.) */
function onStageSeg(a, e, pad) {
  const dx = e[0] - a[0], dy = e[1] - a[1];
  let t0 = 0, t1 = 1;
  for (const [p, q] of [[-dx, a[0] - 2], [dx, W - 2 - a[0]],
                        [-dy, a[1] - pad], [dy, H - pad - a[1]]]) {
    if (p === 0) { if (q < 0) return null; continue; }
    const u = q / p;
    if (p < 0) { if (u > t1) return null; if (u > t0) t0 = u; }
    else { if (u < t0) return null; if (u < t1) t1 = u; }
  }
  return [[a[0] + dx * t0, a[1] + dy * t0], [a[0] + dx * t1, a[1] + dy * t1]];
}

/* Set ALONG the band's own centreline, at the band's own screen angle. A caption band in the
   city is an oblique strip a dozen pixels thick, and a horizontal line of text needs the
   strip's vertical gap to exceed its height PLUS its length times the slope — which is why
   every big plate went unnamed the moment the words were kept level. Turned to the band, the
   only thing that has to fit is the text. In the plan every band is square to the screen, so
   a band the words would have to climb is refused there rather than set on a slant. */
const LEAN = () => flat() ? 0.35 : 1.0;
function bandPlan(b, r, size) {
  const q = bandQuad(r);
  const ends = r[2] >= r[3]
    ? [project(r[0], r[1] + r[3] / 2, 0), project(r[0] + r[2], r[1] + r[3] / 2, 0)]
    : [project(r[0] + r[2] / 2, r[1], 0), project(r[0] + r[2] / 2, r[1] + r[3], 0)];
  /* as tight as a middle-baselined line needs, because four spare pixels are the difference
     between a name and none */
  const hi = size + 2;
  const seen = onStageSeg(...(ends[0][0] <= ends[1][0] ? ends : [ends[1], ends[0]]), 2 + hi / 2);
  if (!seen) return null;
  const [a, e] = seen;
  const th = Math.atan2(e[1] - a[1], e[0] - a[0]);
  if (Math.abs(th) > LEAN()) return null;
  const ux = Math.cos(th), uy = Math.sin(th);
  /* The strip's own thickness ACROSS, which no line of text set along it can exceed however
     short the words are cut. Asked first, because a plate tries four bands at four sizes and
     a band a reader could never fit a name into should cost no measurement at all. */
  const cross = r[2] >= r[3] ? [q[3][0] - q[0][0], q[3][1] - q[0][1]]
                             : [q[1][0] - q[0][0], q[1][1] - q[0][1]];
  if (Math.abs(cross[0] * uy - cross[1] * ux) < hi) return null;
  const at = [a[0] + ux * 4, a[1] + uy * 4];
  let last = null;
  for (let room = Math.hypot(e[0] - a[0], e[1] - a[1]) - 8; room > 24; room *= 0.7) {
    const t = clipText(b.n.name, room);
    if (t === null) break;
    if (t === last) continue;
    last = t;
    const tw = mw(t) + 4;
    const pts = [[0, -hi / 2], [tw, -hi / 2], [tw, hi / 2], [0, hi / 2]]
      .map(([u, v]) => [at[0] + ux * u - uy * v, at[1] + uy * u + ux * v]);
    const box = bboxOf(pts);
    if (pts.every(pt => inQuad(pt[0], pt[1], q)) && fits(box, pts))
      return { q, box, pts, at, th, text: t, size, cut: t !== b.n.name };
  }
  return null;
}

function plateName(b) {
  const bands = bandsOf(b);
  if (!bands.length) return false;
  const ground = quadOf(b);
  if (stageArea(ground) < PLATE_AREA) return false;
  const bb = bboxOf(ground);
  const wide = Math.min(bb[0] + bb[2], W) - Math.max(bb[0], 0);
  const top = wide > 420 ? 13 : wide > 200 ? 11 : 10;
  ctx.textBaseline = 'middle';
  /* In the plan, the band at the top of the plate on screen — the same corner, the same
     reading order, as every cell's name, so the captions and the cells are one grid. In the
     city, the band nearest the eye, because a band on the far edge is the one this plate's
     own towers are standing in front of. */
  bands.sort(flat()
    ? (p, q) => project(p[0] + p[2] / 2, p[1] + p[3] / 2, 0)[1]
              - project(q[0] + q[2] / 2, q[1] + q[3] / 2, 0)[1]
    : (p, q) => depth(q[0] + q[2] / 2, q[1] + q[3] / 2)
              - depth(p[0] + p[2] / 2, p[1] + p[3] / 2));
  /* size outside, band inside: the biggest legible name wins, and nearness only decides
     between two bands that would carry the same one */
  for (const size of [13, 11, 10, 9].filter(v => v <= top)) {
    ctx.font = font(size, wide > 420 ? 600 : 400);
    for (const r of bands) {
      const p = bandPlan(b, r, size);
      /* One WORD per frame, not one path per frame: a single-child chain repeats its parent's
         name, and plates are taken biggest first, so the outermost keeps it and the inner one
         inherits it — which is what the rail's `parent/child/child` already says. */
      /* and not with a nearer tower standing over the words. The band is its own ground and
         no child of its own is on it, but a SIBLING nearer the eye can rise across it. */
      if (!p || painted.has(p.text) || (!flat() && buried(b, p.pts))) continue;
      take(b, p.box, 'plate', p.text, p);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p.q[0][0], p.q[0][1]);
      for (let i = 1; i < 4; i++) ctx.lineTo(p.q[i][0], p.q[i][1]);
      /* clipped to its own band, which is the whole promise: whatever the projection does to
         the strip, no part of the word can land on anything but this folder's ground */
      ctx.closePath(); ctx.clip();
      /* One weight for every folder name. The ramp that faded a narrow plate's caption was
         sized for a map you looked at from one altitude; now that a level is something you
         stand in, two folders side by side are two folders, and a name half as bright as
         its neighbour reads as a different KIND of thing rather than a smaller one. Size
         and position already say which is which. */
      ctx.globalAlpha = .94;
      ctx.translate(p.at[0], p.at[1]); ctx.rotate(p.th);
      ctx.strokeStyle = 'rgba(2,8,12,.8)'; ctx.lineWidth = 3;
      ctx.strokeText(p.text, 2, 0);
      ctx.fillStyle = 'rgb(226,248,255)';
      ctx.fillText(p.text, 2, 0);
      ctx.restore();
      return true;
    }
  }
  return false;
}

/* The callout, and the ONLY thing in the whole design that may float — and only in the city,
   where a volume seen in three-quarter projection genuinely has no flat face to hang a name
   the reader asked for. In the plan every rectangle IS a face, so a chip laid over one says
   the name belongs to a layer above the map, which is the thing that made the labels read as
   scattered debris. */
function pill(b, by) {
  if (flat()) return false;
  ctx.font = font(11, 600);
  ctx.textBaseline = 'alphabetic';
  const p = project(b.x + b.w / 2, b.y + b.h / 2, b.z1);
  const w = mw(b.n.name);
  const box = [p[0] - w / 2 - 5, p[1] - 26, w + 10, 17];
  if (!onStage(box)) return false;
  take(b, box, by + '\u00b7pill', b.n.name);
  ctx.fillStyle = 'rgba(6,11,16,.86)';
  ctx.beginPath(); ctx.roundRect(box[0], box[1], box[2], box[3], 4); ctx.fill();
  /* no outline: the ground is what makes it readable and a border adds nothing but chrome */
  ctx.fillStyle = '#dcf6ff';
  ctx.fillText(b.n.name, p[0] - w / 2, box[1] + 12);
  return true;
}

/* Asked for by name: marked if it already carries one, on its own face if that face can hold
   it, and only then as a callout. */
function callout(b, by) {
  const it = b && (view.seat.get(b.path) || b);
  if (!it || it.w === undefined || it.ghost) return;
  const had = named.get(it.path);
  /* ONE NAME PER THING PER FRAME. A box already named is MARKED where it stands — a second
     copy of the same word in a second place is what put two names on one plate. */
  if (had) {
    /* Recorded and NOTHING DRAWN. Ringing the word was the right instinct about duplication
       and the wrong answer about emphasis: `hoverRim` and `pinMark` already rim the SURFACE,
       so an outline round the name was a second indicator of one state, and the weaker of the
       two — it outlined the name rather than the thing. A hovered or pinned box is carried by
       its own rim and its own ground, and its name stays plain text, identical to every other
       name on the map. The record stays because a hover must never add a SECOND name for
       something already named, and that invariant has to remain literally checkable. */
    marked.push([it.n.name, by, it.path]);
    return;
  }
  const p = facePlan(it);
  /* A plan cell too small for its own name gets none: the rim marks which box it is and the
     rail says what it is called, which is where the reader is already reading. */
  if (p) drawFace(it, p, 1, by); else pill(it, by);
}

/* The fade is what stops a name popping, and CALM makes the fade a cut. It is the only thing
   in the labelling that carries anything over from the frame before, and it is deliberately
   the one thing nothing else reads. */
function held(path, k, on) {
  const had = FADES.get(path);
  const a = Math.max(0, Math.min(1, (had === undefined ? 0 : had) + (on ? k : -k)));
  if (a <= 0.01) { FADES.delete(path); return 0; }
  FADES.set(path, a);
  return a;
}

function names(now) {
  const k = CALM ? 1 : Math.min(1, Math.max(1, now - (nameT || now)) / NAME_MS);
  nameT = now;
  labels.length = 0; named.clear(); overlaid.length = 0; marked.length = 0;
  painted.clear(); inked.clear(); volBB = volIx = null;
  if (!flat()) {
    const r = [BADGE[0], H - 26, BADGE[1], 18];
    labels.push([r, cornersOf(r)]);
  }

  /* Plates first, biggest first: at the zoom where a folder's name is the useful one it must
     not lose its place to a file standing on it. */
  for (const b of view.boxes.filter(x => !x.file && !x.ghost).sort((a, c) => c.w * c.h - a.w * a.h))
    plateName(b);

  /* Then the files, largest face first — the order the eye already read the map in, so the
     budget is spent on what it was drawn to. */
  const cand = [];
  for (const b of view.boxes) if (b.file && !b.ghost) {
    const q = quadOf(b), r = bboxOf(q);
    /* the cheap no, from the character floor and the smallest rung: a face this small cannot
       carry a legible name at any size, and asking properly costs a text measurement */
    if (r[2] < roomFor(b.n.name, SIZE_OFF) || r[3] < SIZE_OFF + 2) {
      FADES.delete(b.path); continue;
    }
    cand.push([r[2] * r[3], b, q]);
  }
  cand.sort((a, c) => c[0] - a[0]);
  const cap = flat() ? 400 : CITY_CAP;
  let spent = 0, more = 0, looked = 0;
  for (const [, b, q] of cand) {
    /* Past the budget it fades out rather than vanishing, and it may not hold its place by
       having been there first — the cap is on what is drawn, or it is not a cap. But it is
       COUNTED: CodeCharta says `+N more` rather than dropping names in silence, and an
       absence nobody explains is the same defect as an absence nobody can predict. */
    if (spent >= cap) {
      if (looked < BADGE_LOOK) { looked++; if (facePlan(b, q)) more++; }
      held(b.path, k, false);
      continue;
    }
    const p = facePlan(b, q);
    /* and not a word the frame already carries: three cells reading `Evid…ts.swift` look
       like one file drawn three times. The reader keeps the biggest and the rest stay
       anonymous, which is honest — a string that cannot tell two files apart names neither. */
    const ok = !!p && !painted.has(p.text);
    const a = held(b.path, k, ok);
    if (a > 0.01 && ok) { drawFace(b, p, a, 'zoom'); spent++; }
  }
  withheld = more + (looked >= BADGE_LOOK ? 0.5 : 0);

  if (state.pinned) callout(state.pinned, 'pin');
  if (state.hover && state.hover !== state.pinned) callout(state.hover, 'hover');
  if (HITS && HITS.size && HITS.size <= 40)
    for (const path of HITS) { const b = view.seat.get(path);
      if (b && !named.has(path)) callout(b, 'hit'); }
  moreBadge();
  nameBar(state.hover);
}

/* Said, not silent: how many names the budget is holding back. Its corner is CLAIMED before
