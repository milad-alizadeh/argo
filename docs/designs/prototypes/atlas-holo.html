  let n = Math.min(name.length - 1, Math.max(0, Math.floor(name.length * maxW / full)));
  for (; n >= MIN_CHARS; n--)
    if (ctx.measureText(name.slice(0, n) + '…').width <= maxW) return name.slice(0, n) + '…';
  return null;
}

/* A cell's name is drawn in whatever its own pigment is not — light on a dark cell, dark on
   a light one — so the contrast comes from the fact underneath rather than from a backdrop
   laid over it. */
function ink(b) {
  const p = tinted(b), m = LIT.r;
  const l = (0.2126 * p[0] * m[0] + 0.7152 * p[1] * m[1] + 0.0722 * p[2] * m[2]) / 255;
  return l > 0.58 ? 'rgba(4,10,14,.92)' : 'rgba(240,251,255,.96)';
}

const quadOf = b => [project(b.x, b.y, b.z1), project(b.x + b.w, b.y, b.z1),
                     project(b.x + b.w, b.y + b.h, b.z1), project(b.x, b.y + b.h, b.z1)];
const bboxOf = q => { const xs = q.map(p => p[0]), ys = q.map(p => p[1]);
  const x = Math.min(...xs), y = Math.min(...ys);
  return [x, y, Math.max(...xs) - x, Math.max(...ys) - y]; };
const inQuad = (x, y, q) => inTri(x, y, q[0], q[1], q[2]) || inTri(x, y, q[0], q[2], q[3]);

/* THE PLAN. Every rectangle is data and there is no sky to write into, so the name goes
   INSIDE its own cell, top-left, one padding for all of them — aligned names read as a grid,
   centred ones read as a scatter. Clipped to the cell, so two names on two disjoint cells
   cannot collide and no name can run off the map. */
function cellPlan(b, size) {
  const r = bboxOf(quadOf(b));
  const iw = r[2] - CELL_PAD * 2;
  if (r[3] - CELL_PAD * 2 < size || iw < 10) return null;
  ctx.font = font(size, 500);
  const t = clipText(b.n.name, iw);
  if (t === null) return null;
  const box = [r[0] + CELL_PAD, r[1] + CELL_PAD, ctx.measureText(t).width, size + 2];
  return fits(box) ? { kind: 'cell', clip: r, box, text: t, size } : null;
}

/* THE CITY. A volume's flat face is its roof, a parallelogram in screen space rather than a
   rectangle — so the name is set horizontally about the roof's own centre and accepted only
   when all four corners of the text's box fall inside the quad. That test is exact, which is
   why a name can never extend past the roof it belongs to. */
function roofPlan(b, size) {
  const q = quadOf(b);
  const cx = (q[0][0] + q[2][0]) / 2, cy = (q[0][1] + q[2][1]) / 2;
  ctx.font = font(size, 600);
  const t = clipText(b.n.name, Math.max(...q.map(p => p[0])) - Math.min(...q.map(p => p[0])));
  if (t === null) return null;
  const tw = ctx.measureText(t).width;
  const box = [cx - tw / 2 - 2, cy - size / 2 - 1, tw + 4, size + 2];
  for (const [dx, dy] of [[0, 0], [1, 0], [1, 1], [0, 1]])
    if (!inQuad(box[0] + box[2] * dx, box[1] + box[3] * dy, q)) return null;
  return fits(box) ? { kind: 'roof', box, text: t, size, cx, cy } : null;
}

const facePlan = (b, size) => flat() ? cellPlan(b, size) : roofPlan(b, size);

/* Planned first, drawn second, because the alpha a name arrives at is only known once the
   fade has been advanced — and a fade cannot be advanced by something already on the canvas. */
function drawFace(b, p, alpha, by) {
  take(b, p.box, by);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = font(p.size, p.kind === 'cell' ? 500 : 600);
  if (p.kind === 'cell') {
    ctx.beginPath(); ctx.rect(p.clip[0], p.clip[1], p.clip[2], p.clip[3]); ctx.clip();
    ctx.textBaseline = 'top';
    ctx.fillStyle = ink(b);
    ctx.fillText(p.text, p.box[0], p.box[1]);
  } else {
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(2,8,12,.85)'; ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.cx - (p.box[2] - 4) / 2, p.cy);
    ctx.fillStyle = 'rgba(238,250,255,.96)';
    ctx.fillText(p.text, p.cx - (p.box[2] - 4) / 2, p.cy);
  }
  ctx.restore();
}

/* A plate writes at its own far corner, which is the top of it on screen and never behind a
   building. Unchanged in every respect but the canvas it lands on. */
function plateName(b) {
  const c = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
  const px = c.map(p => project(p[0], p[1], 0)[0]);
  const wide = Math.max(...px) - Math.min(...px);
  if (wide < (flat() ? 46 : 90)) return false;

  let far = c[0], best = Infinity;
  for (const p of c) { const d = depth(p[0], p[1]); if (d < best) { best = d; far = p; } }
  const inward = [far[0] < b.x + b.w / 2 ? 5 : -5, far[1] < b.y + b.h / 2 ? 5 : -5];
  let p = project(far[0] + inward[0], far[1] + inward[1], 0);

  const size = wide > 420 ? 13 : wide > 200 ? 11 : 10;
  const alpha = wide > 420 ? .94 : wide > 200 ? .74 : .52;
  ctx.font = font(size, wide > 420 ? 600 : 400);
  ctx.textBaseline = 'alphabetic';
  /* A plan has no apex to hang a name off, so the name sits inside the region's own top-left
     and the region must be deep enough to hold a line of it. */
  if (flat()) {
    const py = c.map(q => project(q[0], q[1], 0)[1]);
    const tall = Math.max(...py) - Math.min(...py);
    if (tall < size + 9) return false;
    p = [Math.min(...px) + 1, Math.min(...py) + size + 4];
  }
  const box = [p[0] + 4, p[1] - size - 3, ctx.measureText(b.n.name).width + 8, size + 7];
  if (!fits(box)) return false;
  take(b, box, 'plate');
  ctx.save();
  ctx.fillStyle = `rgba(226,248,255,${alpha})`;
  ctx.strokeStyle = 'rgba(2,8,12,.8)'; ctx.lineWidth = 3;
  ctx.strokeText(b.n.name, p[0] + 4, p[1] - 3);
  ctx.fillText(b.n.name, p[0] + 4, p[1] - 3);
  ctx.restore();
  return true;
}

/* The callout, and the ONLY thing in the whole design that may float — and only in the city,
   where a volume seen in three-quarter projection genuinely has no flat face to hang a name
   the reader asked for. In the plan every rectangle IS a face, so a chip laid over one says
   the name belongs to a layer above the map, which is the thing that made the labels read as
   scattered debris. */
function pill(b, by) {
  if (flat()) return false;
  ctx.font = font(11, 600);
  ctx.textBaseline = 'alphabetic';
  const p = project(b.x + b.w / 2, b.y + b.h / 2, b.z1);
  const w = ctx.measureText(b.n.name).width;
  const box = [p[0] - w / 2 - 5, p[1] - 26, w + 10, 17];
  if (box[0] < 2 || box[1] < 2 || box[0] + box[2] > W - 2 || box[1] + box[3] > H - 2) return false;
  take(b, box, by + '\u00b7pill');
  ctx.fillStyle = 'rgba(6,11,16,.86)';
  ctx.beginPath(); ctx.roundRect(box[0], box[1], box[2], box[3], 4); ctx.fill();
  ctx.strokeStyle = 'rgba(127,232,255,.34)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#dcf6ff';
  ctx.fillText(b.n.name, p[0] - w / 2, box[1] + 12);
  return true;
}

/* Asked for by name: marked if it already carries one, on its own face if that face can hold
   it, and only then as a callout. */
function callout(b, by) {
  const it = b && (view.seat.get(b.path) || b);
  if (!it || it.w === undefined || it.ghost) return;
  const had = named.get(it.path);
  /* ONE NAME PER THING PER FRAME. A box already named is MARKED where it stands — a second
     copy of the same word in a second place is what put two names on one plate. */
  if (had) {
    /* recorded apart from the names: a mark is not a second name, and the invariant that no
       path is ever named twice has to stay literally checkable */
    marked.push([it.n.name, by, it.path]);
    ctx.save();
    ctx.strokeStyle = 'rgba(127,232,255,.85)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.roundRect(had[0] - 3, had[1] - 3, had[2] + 6, had[3] + 6, 6);
    ctx.stroke(); ctx.restore();
    return;
  }
  const p = facePlan(it, SIZE_ON);
  /* A plan cell too small for its own name gets none: the rim marks which box it is and the
     rail says what it is called, which is where the reader is already reading. */
  if (p) drawFace(it, p, 1, by); else pill(it, by);
}

/* Once a name is up it may shrink to SIZE_OFF before it goes, which is the hysteresis; the
   fade is what stops it popping, and CALM makes the fade a cut. */
function held(path, k, up) {
  const had = FADES.get(path);
  const a = Math.max(0, Math.min(1, (had === undefined ? 0 : had) + (up ? k : -k)));
  if (a <= 0.01) { FADES.delete(path); return 0; }
  FADES.set(path, a);
  return a;
}

function names(now) {
  const k = CALM ? 1 : Math.min(1, Math.max(1, now - (nameT || now)) / NAME_MS);
  nameT = now;
  labels.length = 0; named.clear(); overlaid.length = 0; marked.length = 0;

  /* Plates first, biggest first: at the zoom where a folder's name is the useful one it must
     not lose its place to a file standing on it. */
  for (const b of view.boxes.filter(x => !x.file && !x.ghost).sort((a, c) => c.w * c.h - a.w * a.h))
    plateName(b);

  /* Then the files, largest face first — the order the eye already read the map in, so the
     budget is spent on what it was drawn to. */
  const cand = [];
  for (const b of view.boxes) if (b.file && !b.ghost) {
    const r = bboxOf(quadOf(b));
    if (r[2] < 10 || r[3] < 8) { FADES.delete(b.path); continue; }
    cand.push([r[2] * r[3], b]);
  }
  cand.sort((a, c) => c[0] - a[0]);
  const cap = flat() ? 400 : CITY_CAP;
  let spent = 0;
  for (const [, b] of cand) {
    const up = FADES.has(b.path);
    /* Past the budget it fades out rather than vanishing, and it may not hold its place by
       having been there first — the cap is on what is drawn, or it is not a cap. */
    if (spent >= cap) { held(b.path, k, false); continue; }
    const p = facePlan(b, up ? SIZE_OFF : SIZE_ON);
    const a = held(b.path, k, !!p);
    if (a > 0.01 && p) { drawFace(b, p, a, 'zoom'); spent++; }
  }

  if (state.pinned) callout(state.pinned, 'pin');
  if (state.hover && state.hover !== state.pinned) callout(state.hover, 'hover');
  if (HITS && HITS.size && HITS.size <= 40)
    for (const path of HITS) { const b = view.seat.get(path);
      if (b && !named.has(path)) callout(b, 'hit'); }
}

/* ---------- the animated layer ---------- */
function frame(now) {
  requestAnimationFrame(frame);
  if (!view) return;
  /* the rise is the one thing that has to repaint the model itself, and it pays for that
     by going without the names, the note marks and the grain until it settles */
  /* The framing is refitted every frame of the turn rather than interpolated between two
     fits: the two views have different extents, and a lerped scale leaves the model
     overhanging the stage somewhere in the middle of the travel. */
  if (turning) {
    const u = Math.min(1, (now - vT0) / VIEW_MS);
    setFlat(1 - (vFrom + (vTo - vFrom) * glide(u)));
    fit();
    if (u >= 1) { turning = false; setFlat(1 - vTo); fit(); rebuild(); detail(null); }
    else rebuild(true);
  }
  if (fading) {
    if (now - fading.t0 >= fading.ms) { fading = null; rebuild(); }
    else rebuild(true);
  }
  if (morph) morphStep(now);
  if (rising) {
    if (now - riseT0 > RISE_SPAN + RISE_DUR + 40) { rising = false; rebuild(); }
    else rebuild(true);
  }
  const t0 = performance.now();
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(model, 0, 0, W, H);

  /* Ties are drawn over the model, because a filament that disappears behind a tower is
     worse than one that floats. The near end is whatever the pointer holds. */
  const focus = state.hover && state.hover.file ? state.hover
              : state.pinned && state.pinned.file ? state.pinned : null;
  if (state.ties) filaments(TOP_TIES, .30, 1, now);
  if (focus) filaments((LINKS.get(focus.path) || []).map(([o, v]) => [focus.path, o, v]),
                       .95, 1.9, now);

  /* the pinned one stays marked after the pointer has gone, so the panel and the map agree */
  /* the pin restarts its draw when what it points at changes, and stops existing the moment
     it does not — the overlay is cleared every frame, so nothing is left behind */
  if (state.pinned && state.pinned.path !== pinPath) { pinPath = state.pinned.path; pinT0 = now; }
  if (!state.pinned) pinPath = null;
  /* Labelling fifteen hundred boxes is unreadable, which is why the map has almost no names on
     it. A search is the moment that stops being true: a handful of boxes matter, and those get
     their names, over the model rather than baked into it so a keystroke costs no rebuild. */
  if (state.pinned && state.pinned.w !== undefined) pinMark(state.pinned, now);
  if (state.hover && state.hover !== state.pinned) hoverRim(state.hover);
  /* Every name goes on after the rims, so a stroke never crosses a letter. */
  names(now);

  ft.push(performance.now() - t0);
  if (ft.length > 240) ft = ft.slice(-120);
}

const ease = u => 1 - Math.pow(1 - u, 3);
/* eased at both ends, so a traveller arrives and leaves rather than marching */
const glide = u => u * u * u * (u * (u * 6 - 15) + 10);

/* One tie: an arc between two roofs, bowed away from the ground by a share of the distance
   it spans. Strength is the cord's own brightness and thickness. A single long, soft length
   of light passes through it every few seconds — one traveller at a time, drawn as one
   gradient stroke rather than a run of segments, because there are a hundred and sixty. */
const TRAVEL_MS = 5200, TRAVEL_SPAN = 0.30;
const PLAN_BOW = 0.15;   // how far a flat cord leans off its own chord, as a share of it
function filaments(list, alpha, width, now) {
  ctx.lineCap = 'round';
  const seat = view.seat;
  let i = 0;
  for (const [from, to, v] of list) {
    i++;
    const a = seat.get(from), b = seat.get(to);
    if (!a || !b) continue;
    const p = project(a.x + a.w / 2, a.y + a.h / 2, a.z1);
    const q = project(b.x + b.w / 2, b.y + b.h / 2, b.z1);
    const run = Math.hypot(q[0] - p[0], q[1] - p[1]);
    if (run < 3) continue;
    /* In the city the cord is bowed up, off the ground it would otherwise run along. Flat on
       there is no up: every cord would bow the same way on screen and a bundle of them would
       be one shape. So the bow rotates into the plane, always to the same side of its own
       chord, which fans a bundle out instead. The two are lerped, so the turn is continuous. */
    const c = [(p[0] + q[0]) / 2 - (q[1] - p[1]) * PLAN_BOW * (1 - ZK),
               (p[1] + q[1]) / 2 - run * 0.34 * ZK + (q[0] - p[0]) * PLAN_BOW * (1 - ZK)];

    ctx.strokeStyle = `rgba(126,226,255,${(alpha * (0.30 + v * 0.62)).toFixed(3)})`;
    ctx.lineWidth = width * (0.55 + v);
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.quadraticCurveTo(c[0], c[1], q[0], q[1]);
    ctx.stroke();
    if (CALM || run < 24) continue;      // the still frame is the cords alone

    /* The head leads and the tail follows, so the cord reads as something passing through
       it rather than as a blob sliding along. Two strokes: a long soft tail that carries the
       motion, and a short bright core that is the thing you actually see. */
    const u = glide((now / (TRAVEL_MS + (i % 5) * 900) + i * 0.137) % 1);
    const head = u * (1 + TRAVEL_SPAN) - TRAVEL_SPAN * 0.2;
    const bright = 0.34 + v * 0.5;
    beam(p, c, q, head - TRAVEL_SPAN, head, `rgba(196,238,255,${(alpha * bright * 0.42).toFixed(3)})`,
         width * (0.55 + v) * 2.6);
    beam(p, c, q, head - 0.075, head, `rgba(238,252,255,${(alpha * bright).toFixed(3)})`,
         width * (0.55 + v) * 1.15);
  }
}
/* one length of the arc, faded in from its own tail so nothing starts or stops abruptly */
function beam(p, c, q, t0, t1, colour, w) {
  const s0 = Math.max(0, t0), s1 = Math.min(1, t1);
  if (s1 - s0 < 0.015) return;
  const a = quadAt(p, c, q, s0), b = quadAt(p, c, q, s1);
  const lg = ctx.createLinearGradient(a[0], a[1], b[0], b[1]);
  lg.addColorStop(0, colour.replace(/[\d.]+\)$/, '0)'));
  lg.addColorStop(0.72, colour);
  lg.addColorStop(1, colour.replace(/[\d.]+\)$/, '0)'));
  ctx.strokeStyle = lg;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]);
  for (let k = 1; k <= 10; k++) ctx.lineTo(...quadAt(p, c, q, s0 + (s1 - s0) * (k / 10)));
  ctx.stroke();
}

const quadAt = (p, c, q, u) => {
  const m = 1 - u;
  return [m * m * p[0] + 2 * m * u * c[0] + u * u * q[0],
          m * m * p[1] + 2 * m * u * c[1] + u * u * q[1]];
};

/* Every visible edge of the volume, as sub-paths in the order the line travels them: the
   roof first, then down the standing corners, then along the two visible base edges. */
function wireframe(box, z1) {
  const { x, y, w, h, z0 } = box;
  const { c, near } = corners(x, y, w, h);
  const P = (i, z) => project(c[i % 4][0], c[i % 4][1], z);
  const roof = [P(near + 2, z1), P(near + 3, z1), P(near, z1), P(near + 1, z1), P(near + 2, z1)];
  /* Flat on, a block's every edge is its footprint. Tracing the standing corners as well
     would draw the same rectangle four times over and read as a stutter, not a shape. */
  if (z1 - z0 < 2 || flat()) return [roof];
  return [roof,
          [P(near + 3, z1), P(near + 3, z0)],
          [P(near, z1), P(near, z0)],
          [P(near + 1, z1), P(near + 1, z0)],
          [P(near + 3, z0), P(near, z0), P(near + 1, z0)]];
}

/* the first `frac` of a set of sub-paths, measured as one run, so the line draws itself
   along them in order rather than every edge appearing at once */
function traceLines(paths, frac) {
  let total = 0;
  const lens = paths.map(p => {
    const l = [];
    for (let i = 1; i < p.length; i++) {
      const d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      l.push(d); total += d;
    }
    return l;
  });
  let want = total * frac;
  ctx.beginPath();
  for (let k = 0; k < paths.length && want > 0; k++) {
    const p = paths[k], l = lens[k];
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 0; i < l.length && want > 0; i++) {
      const t = Math.min(1, want / (l[i] || 1));
      ctx.lineTo(p[i][0] + (p[i + 1][0] - p[i][0]) * t,
                 p[i][1] + (p[i + 1][1] - p[i][1]) * t);
      want -= l[i];
    }
  }
  ctx.stroke();
}

/* Hover is provisional: the roof face alone, appearing at once. It follows a pointer that
   moves constantly, and anything that draws itself on every move reads as lag — so the one
   thing that animates on focus is the pin. Nothing here touches the band's own colour. */
function hoverRim(b) {
  const box = view.boxes.find(x => x.path === b.path);
  if (!box || box.ghost) return;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(198,238,255,.78)'; ctx.lineWidth = 1.4;
  traceLines([wireframe(box, box.z1)[0]], 1);
}

/* Pinned is committed: the whole volume drawn edge by edge and then held, plus a caret
   standing clear of the roof so the pin is findable from the far side of the map where the
   wireframe itself is four pixels across. Neither mark may touch the band's own colour. */
const PIN_MS = 420;
let pinPath = null, pinT0 = 0;
function pinMark(b, now) {
  const box = view.boxes.find(x => x.path === b.path);
  if (!box || box.ghost) return;
  const p = CALM ? 1 : glide(Math.min(1, (now - pinT0) / PIN_MS));
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(232,252,255,.95)'; ctx.lineWidth = 2;
  traceLines(wireframe(box, box.z1), p);

  const a = Math.max(0, (p - 0.6) / 0.4);
  if (a <= 0) return;
  const head = project(box.x + box.w / 2, box.y + box.h / 2, box.z1);
  const ty = head[1] - 15;
  ctx.fillStyle = `rgba(232,252,255,${a.toFixed(3)})`;
  ctx.beginPath();
  ctx.moveTo(head[0], ty + 7); ctx.lineTo(head[0] - 4.5, ty); ctx.lineTo(head[0] + 4.5, ty);
  ctx.closePath(); ctx.fill();
}

/* everything the old draw path called `render` still means "the model changed" */
const render = rebuild;

/* ---------- hit test ---------- */
/* Front to back over the same order the painter used, so the topmost wins. */
function pick(mx, my) {
  const v = view; if (!v) return null;
  for (let i = v.boxes.length - 1; i >= 0; i--) {
    const b = v.boxes[i];
    if (!b.file) continue;
    if (inBox(b, mx, my)) return b;
  }
  for (let i = v.boxes.length - 1; i >= 0; i--) {
    const b = v.boxes[i];
    if (b.file || b.ghost) continue;
    if (inBox(b, mx, my)) return b;
  }
  return null;
}
function inBox(b, mx, my) {
  const { x, y, w, h, z0, z1 } = b;
  const faces = [[project(x, y, z1), project(x + w, y, z1),
                  project(x + w, y + h, z1), project(x, y + h, z1)]];
  for (const [a, e] of nearWalls(x, y, w, h))
    faces.push([project(a[0], a[1], z0), project(e[0], e[1], z0),
                project(e[0], e[1], z1), project(a[0], a[1], z1)]);
  return faces.some(f => inTri(mx, my, f[0], f[1], f[2]) || inTri(mx, my, f[0], f[2], f[3]));
}
function inTri(px, py, a, b, c) {
  const s = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]);
  if (!s) return false;
  const u = ((b[1] - c[1]) * (px - c[0]) + (c[0] - b[0]) * (py - c[1])) / s;
  const w = ((c[1] - a[1]) * (px - c[0]) + (a[0] - c[0]) * (py - c[1])) / s;
  return u >= 0 && w >= 0 && u + w <= 1;
}

/* ---------- the written layer ---------- */
/* Optional by construction. A repo with no notes beside it draws the same map with the same
   numbers and simply says nothing extra — the page never waits for it and never blames it. */
let NOTES = { files: {}, pairs: [] };
const PAIR_NOTES = new Map();
const pairKey = (a, b) => [a, b].sort().join(String.fromCharCode(0));

function loadNotes() {
  return fetch('atlas-notes.json').then(r => r.ok ? r.json() : null).then(j => {
    if (!j) return;
    NOTES = j;
    for (const n of j.pairs || []) PAIR_NOTES.set(pairKey(n.pair[0], n.pair[1]), n.note);
  }).catch(() => {});
}

/* Said, not counted. The flag is the question the measurements asked, kept beside the answer
   so a note can never read as an unprompted opinion about somebody's code. */
function said(path, folder) {
  const n = (folder ? NOTES.folders : NOTES.files || {})[path];
  if (!n) return '';
  const why = (n.why || []).join('\u0000');
  return `<div class="said"><p>${esc(n.note)}</p>`
    + (why ? `<span class="flag">${esc(why)}</span>` : '')
    + `</div>`;
}

/* Every noted file, in one place, because a mark on a roof tells you where to look and this
   tells you what there is to look at. Both are needed: one is a map, the other is an index. */

/* ══ the rail's index ═══════════════════════════════════════════════════════════
   The rail is split once and never again: this half is always a list — every domain, or
   one domain's files, or what the search found — and the half below it is always the one
   thing being read. Nothing here replaces anything, which is what a single panel that
   swapped its whole contents kept doing to the list you were choosing from. */
const NODE = new Map();
const PAGE = 60;
let LIST = [], LIST_DOM = false, shown = 0;

/* short enough to sit inline beside the counts, in whatever unit is legible at that size */
const AGE = w => { const d = w * 7;
  return d < 14 ? Math.round(d) + 'd' : d < 60 ? Math.round(d / 7) + 'w'
       : d < 730 ? Math.round(d / 30.4) + 'mo' : (d / 365).toFixed(1) + 'y'; };

/* A basename alone is not an address — half a repo is called index.ts. So the folder is the
   row's second line, clipped from its LEFT, because its last segment is the telling one. */
function fileRow(path, withDomain) {
  const n = NODE.get(path);
  const c = withDomain && DOM ? domOf(path) : null;
  const on = !!(state.pinned && state.pinned.path === path);
  return `<div class="frow" data-go="${esc(path)}" aria-selected="${on}" title="${esc(path)}">`
    + `<span class="p"><b>${esc(path.split('/').pop())}</b>`
    + `<s><span>${esc(path.split('/').slice(0, -1).join('/'))}</span></s></span>`
    + (c ? `<i style="color:rgb(${domTone(DOM.rank.get(c.id), c.confidence).join(',')})">`
           + `${esc(domName(c))}</i>`
         : `<em>${n ? fmt(at(n, state.colour)) : ''}</em>`)
    + `</div>`;
}

/* One line each, and each one a way in: the list is how a reader gets from a name they are
   curious about to the place it lives, which pointing at the map cannot do. */
function domainRows() {
  const d = domains();
  if (!d) return `<div class="idle">No domains: this checkout has no change history to `
    + `group by, or the clustering did not load. Everything else still works.</div>`;
  return d.clusters.map((c, i) =>
    `<div class="drow" data-dom="${c.id}" aria-selected="${state.domSel === c.id}" `
    + `title="${esc(domNote(c) || c.about)}"><i class="sw" `
    + `style="background:rgb(${domTone(i, c.confidence).join(',')})"></i>`
    + `<span class="nm">${esc(domName(c))}</span>`
    + `<span class="ct">${c.members.length}</span></div>`).join('');
}

function domFiles(id) {
  const d = domains();
  if (!d) return [];
  const c = d.clusters[d.rank.get(id)];
  return c.members.map(i => d.paths[i]).filter(pp => !HITS || HITS.has(pp))
    .sort((x, y) => at(NODE.get(y) || {}, state.colour) - at(NODE.get(x) || {}, state.colour));
}

/* the list has no end and no button: it grows as it is scrolled, in place, so the scroll
   position it grew from is never lost */
function more() {
  const el = $('rows');
  /* the domain index is not a page of a longer list, so there is nothing here to grow */
  if (!LIST || shown >= LIST.length) return;
  const next = LIST.slice(shown, shown + PAGE);
  shown += next.length;
  el.insertAdjacentHTML('beforeend', next.map(x => fileRow(x, LIST_DOM)).join(''));
  wireRail();
}

/* ---------- where you are ---------- */
/* One trail, both modes, and it is the ONLY way back: a back button beside it would be a
   second control doing the same job, and the reader would have to learn which of the two
   goes where. Every crumb but the last is a control; the last is where you are. */
function crumbList() {
  const out = [], d = domains();
  if (state.dom === 'group') {
    out.push({ k: 'dom', label: 'Domains' });
    if (state.domSel !== null && d)
      out.push({ k: 'list', label: domName(d.clusters[d.rank.get(state.domSel)]) });
    else if (HITS) out.push({ k: 'list', label: matchLabel() });
  } else if (HITS) out.push({ k: 'list', label: matchLabel() });
  else {
    state.trail.forEach((t, i) => out.push({ k: 'dir', i, label: t.path ? t.name : 'Folders' }));
    out.push({ k: 'list', label: state.folder ? state.folderName : 'Folders' });
  }
  /* the page is the last crumb, in either mode */
  if (state.page && state.pinned) out.push({ k: 'here', label: state.pinned.n.name });
  return out;
}
const matchLabel = () => state.q ? 'Matches for \u201c' + state.q + '\u201d' : 'Matches';

/* The trail and the domain's standing context share one band, because they are one fact:
   where the reader is. The domain's name is the crumb rather than a heading of its own —
   said twice it is a second thing to read — and its note, tokens and hue stay below it. */
function ctxBar() {
  const el = $('ctx'), d = domains();
  const c = state.dom === 'group' && state.domSel !== null && d
    ? d.clusters[d.rank.get(state.domSel)] : null;
  if (c) el.style.setProperty('--dh', `rgb(${domTone(d.rank.get(c.id), c.confidence).join(',')})`);
  else el.removeAttribute('style');
  el.classList.toggle('lit', !!c);
  const list = crumbList();
  el.innerHTML = `<div class="crumbs">` + list.map((x, i) => i === list.length - 1
      ? `<b aria-current="page">${esc(x.label)}</b>`
      : `<a role="button" tabindex="0" data-k="${x.k}" data-i="${x.i === undefined ? '' : x.i}" `
        + `title="Back to ${esc(x.label)}">${esc(x.label)}</a><i>\u203a</i>`).join('')
    + `</div>`
    + (c ? `<p>${esc(domNote(c) || c.about)}</p><div class="row"><b>${c.members.length} files</b>`
         + ` &nbsp;\u00b7&nbsp; ${esc(c.tokens.join(' \u00b7 '))}</div>` : '')
    + (!c && state.folder ? `<div class="row"><b>${leaves(folderAt(state.folder).n).length} files`
         + `</b> &nbsp;\u00b7&nbsp; ${esc(state.folder)}</div>` : '');
  for (const a of el.querySelectorAll('[data-k]')) {
    const go = () => goCrumb(a.dataset.k, a.dataset.i);
    a.onclick = go;
    a.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go(); } };
  }
}

/* A crumb restores a level's list AND where that list was scrolled to, which is the whole
   point of it being the way back: the reader picks up where they stopped reading. */
function goCrumb(k, i) {
  closePage();
  if (k === 'dom') { selectDomain(null); restoreTop(state.domTop); }
  else if (k === 'dir') goFolder(+i);
}
/* A list that grows as it is scrolled cannot be scrolled to a place it has not grown to yet,
   so it is grown until the offset exists rather than clamped silently to the bottom. */
function restoreTop(top) {
  const el = $('rows');
  for (let n = 0; top && n < 60 && el.scrollHeight < top + el.clientHeight
                   && LIST && shown < LIST.length; n++) more();
  el.scrollTop = top || 0;
}

/* ---------- the reading, as a page ---------- */
/* A file is worth more than the 322px a standing panel can spare, so a click opens it as a
   page over the whole rail. The panel below the list keeps its job — it is what the POINTER
   writes into, and hover must never navigate. */
function openPage(it) {
  if (!it) return;
  /* captured on the way in, because `display: none` drops a scroller's position */
  if (!state.page) state.rowsTop = $('rows').scrollTop;
  state.page = true;
  state.pinned = it;
  document.body.classList.add('page');
  ctxBar(); detail(null); railMark();
}

/* Leaving the page leaves the pin standing: which row is open is the list's own selection,
   and a reader who came back to pick the next file has not stopped looking at this one. */
function closePage() {
  if (!state.page) return;
  state.page = false;
  document.body.classList.remove('page');
  ctxBar();
  $('rows').scrollTop = state.rowsTop || 0;
  detail(null);
}

/* ---------- the folder index ---------- */
/* Group by Folders lays the MAP out by folder, so the rail lists folders too — a rail
   indexing domains beside a map tiled by path is answering a question nobody asked. The
   levels are the layout's own: nothing here invents a folder the map does not draw. */
function chainDown(box) {
  const names = [box.n.name];
  let b = box;
  /* A folder whose only content is one folder is not a level anybody can act on, so the
     whole chain is one row and one click, with its files under the far end. */
  while (!b.kids.some(k => k.file)) {
    const dirs = b.kids.filter(k => !k.file);
    if (dirs.length !== 1) break;
    b = dirs[0]; names.push(b.n.name);
  }
  return { box: b, name: names.join('/') };
}

/* The tree is rebuilt whenever area or height changes, so where you are is held as a path
   and looked up again — a kept box reference would be a box nothing draws. */
function folderAt(path) {
  const root = tree();
  let hit = null;
  (function walk(b) {
    if (hit || b.file) return;
    if (b.path === path) hit = b; else b.kids.forEach(walk);
  })(root);
  return hit || root;
}

/* Descending is a FILTER, not a regroup: the boxes stay exactly where they are and only
   what is out of scope loses its colour, so it dissolves rather than cuts. */
function enterFolder(path, name) {
  beginFade();
  state.trail.push({ path: state.folder, name: state.folderName, top: $('rows').scrollTop });
  state.folder = path; state.folderName = name;
  railIndex(); rebuild(); key(view.lo, view.hi);
}
/* The trail, not the path: a collapsed chain has levels the reader never stood on, and
   stepping up into one of those is a place they cannot have come from. */
function goFolder(i) {
  const t = state.trail[i] || { path: null, name: null, top: 0 };
  beginFade();
  state.trail = state.trail.slice(0, i);
  state.folder = t.path; state.folderName = t.name;
  railIndex(); restoreTop(t.top); rebuild(); key(view.lo, view.hi);
}

function folderIndex() {
  const here = folderAt(state.folder);
  const dirs = here.kids.filter(k => !k.file).map(chainDown)
    .sort((a, b) => leaves(b.box.n).length - leaves(a.box.n).length);
  ctxBar();

  LIST_DOM = false;
  LIST = here.kids.filter(k => k.file).map(k => k.path)
    .sort((x, y) => at(NODE.get(y) || {}, state.colour) - at(NODE.get(x) || {}, state.colour));
  $('ihead').textContent = `${dirs.length} folder${dirs.length === 1 ? '' : 's'} \u00b7 `
    + `${LIST.length} file${LIST.length === 1 ? '' : 's'} here`;

  shown = Math.min(PAGE, LIST.length);
  const rows = dirs.map(d =>
    `<div class="drow dir" data-dir="${esc(d.box.path)}" data-name="${esc(d.name)}" `
    + `title="${esc(d.box.path)}"><span class="nm">${esc(d.name)}</span>`
    + `<span class="ct">${leaves(d.box.n).length}</span><span class="go">\u203a</span></div>`
  ).join('') + LIST.slice(0, shown).map(x => fileRow(x, false)).join('');
  $('rows').innerHTML = rows
    || `<div class="idle">This folder holds nothing the map is drawing.</div>`;
  $('rows').scrollTop = 0;
  wireRail();
}

function railIndex() {
  state.peek = null; state.peekKey = '';
  if (state.dom === 'off' && !HITS) return folderIndex();
  const d = domains();
  const c = state.domSel !== null && d ? d.clusters[d.rank.get(state.domSel)] : null;
  ctxBar();

  LIST_DOM = false;
  if (c) LIST = domFiles(c.id);
  else if (HITS) { LIST = [...HITS]; LIST_DOM = true; }
  else LIST = null;

  $('ihead').textContent = c
    ? (HITS ? 'Matches here, highest ' : 'Files, highest ') + DESC[state.colour].title + ' first'
    : HITS ? HITS.size + ' file' + (HITS.size === 1 ? '' : 's') + ' found'
    : (d ? d.clusters.length + ' domains · ' + d.unassigned + ' files in none' : 'Domains');

  const el = $('rows');
  if (LIST === null) el.innerHTML = domainRows();
  else if (!LIST.length) el.innerHTML =
    `<div class="idle">Nothing here matches all of those words.</div>`;
  else { shown = Math.min(PAGE, LIST.length);
         el.innerHTML = LIST.slice(0, shown).map(x => fileRow(x, LIST_DOM)).join(''); }
  el.scrollTop = 0;
  wireRail();
}

function wireRail() {
  for (const r of $('rows').querySelectorAll('.drow[data-dom]'))
    r.onclick = () => selectDomain(+r.dataset.dom === state.domSel ? null : +r.dataset.dom);
  /* Sixty-odd files are too small to be given a box at the opening zoom, so a row can name
     something the map is not drawing. It still opens — it just has no mark to put on the
     map, which is the honest state rather than a click that does nothing. */
  for (const r of document.querySelectorAll('#rows .frow[data-go]'))
    r.onclick = () => {
      const path = r.dataset.go;
      const box = boxesNow().find(x => x.path === path);
      const n = NODE.get(path);
      if (!box && !n) return;
      openPage(box || { n, path, file: true });
    };
  for (const r of $('rows').querySelectorAll('.drow[data-dir]'))
    r.onclick = () => enterFolder(r.dataset.dir, r.dataset.name);
}

/* Which row is open is a property of the row, not of the list, so it is stamped rather
   than re-rendered: rebuilding the list to move a highlight loses the scroll. */
function railMark() {
  const path = state.pinned && state.pinned.path;
  for (const r of document.querySelectorAll('#rows .frow'))
    r.setAttribute('aria-selected', String(r.dataset.go === path));
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- chrome ---------- */
/* Twelve measures come out of ccsh and five of them say nothing here. Three are zero on
   most files, because the parser fills them only for languages it knows deeply. Comment
   lines and plain lines of code both count comments, so a file with a long licence header
   reads as a big file; rloc counts the code and nothing else, which is the size we want. */
const METRICS = ['rloc', 'complexity', 'number_of_functions', 'max_parameters_per_function',
  'number_of_commits', 'number_of_authors', 'age_in_weeks'];

/* The panel reads whatever the pointer is over, and holds the last pinned thing
   when it is over nothing — so a reading survives the trip to the controls. */
function detail(b) {
  const d = $('read');
  const it = b || state.pinned;

  if (!it) {
    d.innerHTML = `<div class="idle">
      <p><b>Click</b> a box on the map, or a row in the list, to open it here.
      <kbd>Esc</kbd> closes it again.</p>
      <p style="margin-top:10px">Every number here is measured from the code and its history.
      Plates carry a written caption, and the files marked <b class="dot">●</b> carry a
      note. Both are read, never counted.</p></div>`;
    return;
  }

  const n = it.n, live = state.area, h = state.height, c = state.colour;
  /* Counts and dates are numbers a reader already understands, so they cost one line
     instead of four table rows. Ranking them said nothing the number did not. */
  const facts = !it.file ? '' : `<div class="facts">`
    + [['rloc', v => `<b>${fmt(v)}</b> lines`],
       ['number_of_authors', v => `<b>${fmt(v)}</b> author${v === 1 ? '' : 's'}`],
       ['number_of_commits', v => `<b>${fmt(v)}</b> commits`],
       ['age_in_weeks', v => `<b>${AGE(v)}</b> old`]]
      .map(([k, f]) => `<span>${f(at(n, k))}</span>`).join('') + `</div>`;
  const FACTS = it.file ? ['rloc', 'number_of_authors', 'number_of_commits', 'age_in_weeks'] : [];
  const rows = it.file
    ? METRICS.filter(k => k !== c && !FACTS.includes(k)).map(k => {
        const v = at(n, k), on = k === live || k === h;
        return `<tr class="${on ? 'on' : v ? '' : 'zero'}" title="${DESC[k].description}">`
             + `<td class="k">${DESC[k].title}</td><td class="v">${fmt(v)}</td></tr>`;
      })
    : [['Files', leaves(n).length], [DESC[live].title, roll(n, live)],
       [DESC[h].title, roll(n, h)], [DESC[c].title, roll(n, c)]]
        .map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${fmt(v)}</td></tr>`);

  /* A percentage next to a basename is a fact nobody can use. The row carries the folder,
     because a tie across two packages is the finding and a tie inside one is not; it carries
     the shared idea when one was written; and it takes you there when you click it. */
  const ties = (it.file && LINKS.get(it.path) || []).slice(0, 6);
  const tieHTML = ties.length ? `<div class="ties"><h4>Changes with</h4>`
    + ties.map(([o, v]) => {
        const note = PAIR_NOTES.get(pairKey(it.path, o));
        return `<div class="tie" data-go="${esc(o)}" title="Go to this file">`
          + `<span>${esc(o.split('/').pop())}</span><b>${Math.round(v * 100)}%</b>`
          + `<em>${esc(o.split('/').slice(0, -1).slice(-2).join('/'))}</em>`
          + (note ? `<i>${esc(note)}</i>` : '') + `</div>`;
      }).join('')
    + `</div>` : '';

  /* The colour channel is the one measure a number cannot carry: 12 is meaningless until
     you know it beats two files in three. So it is drawn on the same three bands the
     volumes are lit with, and the needle sits where this file falls among them. */
  const cval = it.file ? at(n, c) : roll(n, c);
  const r = it.file ? rank(cval, c) : null;
  /* Asked, not hovered: a definition is what the reader wants once, on purpose, and a
     tooltip is only found by the reader who already suspected it was there. */
  const gauge = !it.file ? '' : `<div class="gauge">
      <div class="gh"><span>${DESC[c].title}</span>`
    + `<button class="ask" data-def="${c}" aria-expanded="false" `
    + `aria-label="What does ${DESC[c].title} mean?">?</button>`
    + `<b>${fmt(cval)}</b></div>
      <div class="track"><div class="bars"><i style="background:${roofSwatch(0)};flex:50"></i>`
    + `<i style="background:${roofSwatch(1)};flex:35"></i>`
    + `<i style="background:${roofSwatch(2)};flex:15"></i></div>`
    + `<u style="left:${(r * 100).toFixed(1)}%"></u></div>
      <div class="ends"><span>lowest here</span><span>highest</span></div>
      <div class="note">${r > 0.995 ? 'At the very top of this repo — nothing scores higher.'
        : 'Higher than ' + Math.round(r * 100) + '% of the files in this repo.'}</div>
    </div>`;

  /* A pin is the only state this panel cannot leave by moving the mouse, and until now the
     only way out was a key nothing mentioned. The way back is a control, next to the word
     that says why you are stuck. */
  d.innerHTML = (b || state.page ? `<div class="kind">${it.file ? 'File' : 'Folder'}</div>`
      : `<div class="kind pinned"><span>${it.file ? 'File' : 'Folder'} \u00b7 pinned</span>`
        + `<button class="back" title="Stop holding this file (Esc)">`
        + `Unpin<kbd>esc</kbd></button></div>`)
    + `<div class="name">${n.name}</div>`
    + `<div class="where">${it.path}</div>`
    + (it.file ? '' : `<div class="pin">${leaves(n).length} files inside · zoom in to see them</div>`)
    + facts
    + said(it.path, !it.file)
    + domHTML(it)
    + gauge
    + `<table><tr><th>Measure</th><th class="v" style="text-align:right">Value</th></tr>`
    + rows.join('') + `</table>` + tieHTML;
  wireRead();
}

/* A domain is the one thing on this panel nobody measured, so it says which two signals put
   the file there, how sure that was, and — for the domain itself — the folders it is spread
   across, which is the finding the folder tree cannot show. */
function domHTML(it) {
  if (state.dom === 'off' || !DOM) return '';
  const c = it.file ? domOf(it.path) : it.n.__dom;
  if (!it.file && !c) return '';
  /* A domain is a thing with its own page, and a FILE cites it: the name, the swatch, and a
     way to go there. Its note, its tokens, the folders it is spread across and where it came
     from are all said in the standing context above the list — said here as well they are a
     second copy that can only ever agree. A plate in Domains mode IS the domain, so there
     the whole card stays: the subject is not a citation. */
  if (it.file) return c ? `<div class="cite">${chipHTML(c)}</div>`
    : `<div class="cite"><span class="none">No domain</span>`
      + `<span class="src">Nothing it is called or changes with put it with a group</span></div>`;

  const rows = c.where.slice(0, 5).map(([d, n]) =>
    `<div class="tie flat"><span>${esc(d.split('/').slice(-2).join('/'))}</span><b>${n}</b></div>`);
  return `<div class="dom">` + chipHTML(c)
    + (domNote(c) ? `<p>${esc(domNote(c))}</p>` : '')
    + `<p class="about">${esc(c.about)}</p>`
    + `<span class="flag">${esc(c.tokens.join(' \u00b7 '))}</span>`
    + `<span class="src">Grouped from names and change history`
    + (domNote(c) ? `, named by ${esc(NOTES.model || 'a model')} that read it` : '')
    + ` \u00b7 nobody confirmed it</span>`
    + (it.file ? '' : `<div class="ties"><h4>Where it lives</h4>${rows.join('')}</div>`)
    + `</div>`;
}
/* One chip, both places, so the swatch a file cites and the swatch its domain wears are
   painted from the same call. */
function chipHTML(c) {
  const on = state.domSel === c.id;
  return `<button class="chip${on ? ' on' : ''}" data-dom="${c.id}" `
    + `title="${on ? 'Show every domain again' : 'Show only this domain'}">`
    + `<i style="background:rgb(${domTone(DOM.rank.get(c.id), c.confidence).join(',')})"></i>`
    + `${esc(domName(c))}</button>`;
}

const domOf = path => {
  const d = DOM && DOM.byPath.get(path);
  return d && d.id >= 0 ? DOM.clusters[DOM.rank.get(d.id)] : null;
};

/* ---------- popover ---------- */
/* One popover element, moved and refilled, because two of them on screen at once is a bug
   the user has to close twice. */
function showDef(btn, k) {
  const pop = $('pop'), r = btn.getBoundingClientRect();
  /* Anchored to the panel's edge, not the button's: a popover that covers the number it is
     explaining makes the reader close it to check what they were looking at. */
  const edge = $('rail').getBoundingClientRect().left;
  const extra = twin(k);
  pop.innerHTML = `<h5>${esc(DESC[k].title)}</h5><p>${esc(DESC[k].description)}</p>`
    + (extra ? `<p>${esc(extra.trim())}</p>` : '')
    + `<p class="src">Measured for every file by the analyzer. Not an opinion.</p>`;
  pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(edge, r.left) - w - 12) + 'px';
  pop.style.top = Math.max(8, Math.min(r.top - 6, innerHeight - h - 8)) + 'px';
  btn.setAttribute('aria-expanded', 'true');
}

function hideDef() {
  $('pop').hidden = true;
  for (const b of document.querySelectorAll('.ask[aria-expanded="true"]'))
    b.setAttribute('aria-expanded', 'false');
}

/* The panel is rebuilt on every pointer move, so its controls are wired where they are
   built rather than once at boot. */
function wireRead() {
  const back = $('read').querySelector('.back');
  if (back) back.onclick = () => { state.pinned = null; hideDef(); detail(null); };
  for (const b of $('read').querySelectorAll('[data-dom]')) {
    const pick = () => selectDomain(b.dataset.dom === '' ? null
      : b.classList.contains('chip') && state.domSel === +b.dataset.dom ? null : +b.dataset.dom);
    b.onclick = pick;
    b.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pick(); } };
  }
  for (const b of $('read').querySelectorAll('.ask'))
    b.onclick = e => { e.stopPropagation();
      b.getAttribute('aria-expanded') === 'true' ? hideDef() : showDef(b, b.dataset.def); };
  for (const t of $('read').querySelectorAll('.tie[data-go]'))
    t.onclick = () => {
      const box = view.boxes.find(x => x.path === t.dataset.go);
      if (box) openPage(box);
    };
}

/* The legend is never hidden. A colour that means something only while you remember
   what you picked in a menu is a colour that means nothing by the second minute. */
function key(lo, hi) {
  /* The three menus name measures, not shapes. This says which shape each one drives, so
     the map can be read without first working out what "area" turned into on screen. */
  const note = Object.keys(NOTES.files || {}).length
    ? ` Files marked <b class="dot">●</b> carry a written note.` : '';
  if (state.dom === 'group') {
    const d = domains();
    $('reads').innerHTML = `Each ${state.plan ? 'rectangle' : 'volume'} is a file and its `
      + `<b>colour</b> is its <b>domain</b> — ${d ? d.clusters.length : 0} of them, `
      + `${state.dom === 'group' ? 'each tiled as one region' : 'left where the folders put them'}. `
      + `Washed-out means unsure; grey belongs to none. `
      + `<b>Domains are inferred from names and change history. Nobody confirmed them.</b>`;
    for (const [id, k] of [['mArea', 'area'], ['mHeight', 'height'], ['mColour', 'colour']])
      $(id).title = DESC[state[k]].description;
    const ramp = $('legend').querySelectorAll('.ramp i');
    ramp.forEach((el, i) => el.style.background = i === ramp.length - 1
      ? `rgb(${UNSURE.join(',')})`
      : d && d.clusters[i] ? `rgb(${domTone(i, d.clusters[i].confidence).join(',')})` : '#5a646c');
    $('keyName').textContent = 'Domain · inferred';
    $('keyLo').textContent = d ? d.clusters.length + ' named' : '';
    $('keyHi').textContent = d ? d.unassigned + ' unassigned' : '';
    $('keyFootLo').textContent = 'the three largest';
    $('keyFootHi').textContent = 'no domain';
    return;
  }
  $('reads').innerHTML = state.plan
    ? `Each rectangle is a file. Its <b>area</b> is ${DESC[state.area].title}, its `
      + `<b>colour</b> is ${DESC[state.colour].title}. A region is a folder. The treemap `
      + `shows footprint and colour only — <b>height is not drawn</b>.` + note
    : `Each volume is a file. Its <b>ground</b> is ${DESC[state.area].title}, `
      + `its <b>height</b> is ${DESC[state.height].title}, its <b>light</b> is `
      + `${DESC[state.colour].title}. A plate is a folder.` + note;
  for (const [id, k] of [['mArea', 'area'], ['mHeight', 'height'], ['mColour', 'colour']])
    $(id).title = DESC[state[k]].description;
  /* Painted from the same call the roofs are, so the swatch and the block are one value
     and a reader holding one against the other is comparing like with like. */
  const ramp = $('legend').querySelectorAll('.ramp i');
  ramp.forEach((el, i) => el.style.background = roofSwatch(i));
  $('keyName').textContent = DESC[state.colour].title;
  $('keyLo').textContent = '≤ ' + fmt(lo);
  $('keyHi').textContent = '> ' + fmt(hi);
  $('keyFootLo').textContent = 'half the files';
  $('keyFootHi').textContent = 'top 15%';
}

function reset() {
  cityYaw = YAW; cityPitch = PITCH;
  setFlat(state.plan ? 1 : 0);
  fit(); rebuild(); rise(); stamp();
}

/* the three channels and the camera live in the URL, so a view can be sent to somebody */
function stamp() {
  history.replaceState(null, '',
    `?area=${state.area}&height=${state.height}&colour=${state.colour}`
    + `&yaw=${cityYaw.toFixed(3)}&pitch=${cityPitch.toFixed(3)}${state.ties ? '&ties=1' : ''}`
    + (state.plan ? '&view=plan' : '') + (state.dom !== 'off' ? '&dom=' + state.dom : '')
    + (state.noTests ? '&tests=no' : '')
    + (state.q ? '&find=' + encodeURIComponent(state.q) : ''));
}


/* ---------- boot ---------- */
/* The clustering and its sidecar are both allowed to be absent: a repo with no git history,
   or a checkout without the co-change pass run, still gets the whole map — it just gets no
   Domains control, which is the honest degradation rather than an empty or invented one. */
const soft = pr => pr.catch(() => null);
Promise.all([
  fetch('atlas-cc.json').then(r => r.json()),
  loadNotes(),
  soft(import('./atlas-domains.mjs')),
  soft(fetch('atlas-cochange.json').then(r => r.ok ? r.json() : null)),
]).then(([j, , lib, co]) => {
  LIB = lib; CO = co && co.edges ? co : null;
  DATA = j.nodes[0];
  stampPaths(DATA);
  DESC = j.attributeDescriptors;
  for (const [a, b, v] of j.edges || []) {
    if (!LINKS.has(a)) LINKS.set(a, []);
    if (!LINKS.has(b)) LINKS.set(b, []);
    LINKS.get(a).push([b, v]); LINKS.get(b).push([a, v]);
  }
  for (const list of LINKS.values()) list.sort((x, y) => y[1] - x[1]);
  TOP_TIES = (j.edges || []).slice(0, TIE_CAP);
  /* Three channels that say three different things. Colour is whole-file complexity,
     not max-per-function: half the files score 0 on that one, so it bands them all green. */
  const q = new URLSearchParams(location.search);
  const metricParam = (k, d) => METRICS.includes(q.get(k)) ? q.get(k) : d;
  state = { area: metricParam('area', 'rloc'),
            height: metricParam('height', 'number_of_commits'),
            colour: metricParam('colour', 'complexity'),
            hover: null, pinned: null, ties: q.get('ties') === '1',
            dom: q.get('dom') === 'group' ? 'group' : 'off', domSel: null,
            noTests: q.get('tests') === 'no', q: q.get('find') || '',
            peek: null, peekKey: '',
            page: false, rowsTop: 0, domTop: 0,
            folder: null, folderName: null, trail: [],
            plan: q.get('view') === 'plan' };
  if (state.dom !== 'off' && !domainsReady()) state.dom = 'off';

  for (const [id, k] of [['mArea', 'area'], ['mHeight', 'height'], ['mColour', 'colour']]) {
    const sel = $(id);
    for (const m of METRICS) {
      const o = document.createElement('option');
      o.value = m; o.textContent = DESC[m].title; sel.append(o);
    }
    sel.value = state[k];
    /* No re-rise on a channel change: the model is the same model with a different
       measurement on it, and a thing that reassembles every time you touch a menu is a
       loading screen. */
    /* Area and height change the shape of the map, so those travel; colour only repaints it,
       so that dissolves. Both are the same gesture to the reader and neither is a cut. */
    sel.onchange = () => {
      if (k === 'colour') { beginFade(); state.colour = sel.value; state.hover = null;
                            rebuild(); detail(null); railIndex(); stamp(); return; }
      reshuffle(() => { state[k] = sel.value; state.hover = null; });
    };
  }

  for (const n of leaves(DATA)) NODE.set(n.__path, n);
  domUI();
  for (const [id, m] of [['dOff', 'off'], ['dGroup', 'group']])
    $(id).onclick = () => setDom(m);
  /* Retyping is free — the match is a substring test over fifteen hundred paths — so there is
     no debounce and no submit: the map narrows on the keystroke. */
  $('q').value = state.q;
  $('q').oninput = () => {
    beginFade();
    state.q = $('q').value;
    refind();
    $('qn').textContent = HITS ? String(HITS.size) : '';
    state.hover = null; state.pinned = null; closePage();
    rebuild(); detail(null); railIndex(); stamp();
  };
  refind();
  $('qn').textContent = HITS ? String(HITS.size) : '';

  /* A checkbox hidden under a label is a control that can look right and fire nothing. */
  const swSet = (id, on) => $(id).setAttribute('aria-checked', String(!!on));
  swSet('noTests', state.noTests);
  $('noTests').onclick = () => {
    beginFade();
    swSet('noTests', !state.noTests);
    reshuffle(() => {
      state.noTests = !state.noTests;
      state.hover = state.pinned = null; state.domSel = null;
      state.folder = null; state.folderName = null; state.trail = []; closePage();
      DOM = null; domKey = ''; PRUNED = null; refind();
      if (state.dom !== 'off') domains();
    });
  };
  /* The clustering is a second of work and the button has to feel instant, so it is done
     once the first frame is on screen rather than on the click. */
  if (domainsReady()) requestAnimationFrame(() => setTimeout(() => {
    domains(); domUI(); railIndex();
    if (state.dom !== 'off') { treeKey = ''; fit(); rebuild(); }
  }, 0));

  /* ---------- the camera, on the mouse ---------- */
  let drag = null, moved = 0;

  /* Panning and turning are different intentions, so they get different gestures. A plain
     drag moves the map, which is what a drag means everywhere else; turning is the rarer
     and more disorienting act, so it asks for option first. The choice is read once, at
     the press, so letting go of option mid-drag cannot swap the gesture under the hand. */
  cv.onmousedown = e => {
    /* Nothing to turn in a plan: a treemap seen from anywhere but straight down is neither
       view, so the gesture that would break it is simply not offered. */
    drag = { x: e.clientX, y: e.clientY, turn: (e.altKey || e.button === 2) && !state.plan,
             ox: cam.ox, oy: cam.oy, yaw: cityYaw, pitch: cityPitch,
             scale: cam.scale };
    moved = 0;
    cv.style.cursor = drag.turn ? 'move' : 'grabbing';
    e.preventDefault();
  };

  addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (!drag.turn) { cam.ox = drag.ox + dx; cam.oy = drag.oy + dy; }
    else {
      /* A turn moves the model and nothing else. The city's middle is the plan's own
         centre, and project() sends that to exactly (ox, oy) — so pinning it means
         leaving the pan and the zoom alone, not correcting them afterwards. Every one
         of them is restored from the press, so a long drag cannot accumulate drift. */
      cityYaw = snap(drag.yaw + dx * 0.006, Math.PI / 4);
      /* pitch, clamped: flat on is unreadable, straight down loses every height */
      cityPitch = snap(Math.min(1.45, Math.max(0.10, drag.pitch + dy * 0.0028)), PITCH);
      setFlat(0);
      cam.ox = drag.ox; cam.oy = drag.oy; cam.scale = drag.scale;
    }
    state.hover = null; rebuild();
  });

  addEventListener('mouseup', () => {
    if (!drag) return;
    drag = null; cv.style.cursor = 'default'; stamp();
  });

  cv.oncontextmenu = e => e.preventDefault();

  /* zoom about the pointer, so the thing under the cursor stays under it */
  cv.onwheel = e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    /* bounded against the fitted scale, not against itself — a per-event clamp is no
       clamp at all, and zoom is now the only way into a folder */
    const base = baseScale();
    const want = cam.scale * Math.exp(-e.deltaY * 0.0014);
    const next = Math.min(base * 90, Math.max(base * 0.5, want)) / cam.scale;
    cam.ox = mx - (mx - cam.ox) * next;
    cam.oy = my - (my - cam.oy) * next;
    cam.scale *= next;
    state.hover = null; rebuild();
  };

  /* Hover is an overlay, not a model change: the pointer must never pay for fifteen
     hundred volumes being repainted. */
  cv.onmousemove = e => {
    if (drag) return;
    const r = cv.getBoundingClientRect();
    const hit = pick(e.clientX - r.left, e.clientY - r.top);
    if (hit === state.hover) return;
    /* Hover answers on the MAP — the name, the rim, the file's own couplings — and nowhere
       else. A reading is what the reader chose, so nothing under a moving pointer may
       rewrite it: a panel that churns is a panel nobody can finish a sentence in. */
    state.hover = hit;
  };
  cv.onmouseleave = () => { if (drag) return; state.hover = null; };
  cv.onclick = e => {
    if (moved > 4) return;              // a drag that ended on a plate is not a click
    const r = cv.getBoundingClientRect();
    const hit = pick(e.clientX - r.left, e.clientY - r.top);
    if (!hit) return;
    /* pin it so the numbers stay while the pointer goes to the controls */
    /* Clicking what is already open closes it, which is the same gesture as Esc. */
    if (state.page && state.pinned && state.pinned.path === hit.path) {
      closePage(); state.pinned = null; detail(null); railMark(); return;
    }
    openPage(hit);
  };
  addEventListener('keydown', e => {
    if (e.key === "Escape") {
      if (state.page) closePage(); else { state.pinned = null; detail(null); }
    }
    if (e.key === "r" || e.key === "R") reset();
    if (e.key === 'Escape') hideDef();
    if (e.key === "t" || e.key === "T") $('ties').onclick();
    if (e.key === "v" || e.key === "V") setView(!state.plan);
    if (e.key === "d" || e.key === "D") setDom(state.dom === 'off' ? 'group' : 'off');
  });
  $('reset').onclick = reset;
  $('vCity').onclick = () => setView(false);
  $('vPlan').onclick = () => setView(true);
  segUI();
  /* A popover that only closes on its own button is a popover you close by reloading. */
  addEventListener('mousedown', e => { if (!e.target.closest('#pop, .ask')) hideDef(); });
  addEventListener('resize', hideDef);
  swSet('ties', state.ties);
  $('ties').onclick = () => { state.ties = !state.ties; swSet('ties', state.ties); stamp(); };
  /* The sidebar is a column of the window, so hiding it resizes the stage — which no
     resize event reports, because the window did not change. */
  const sidebar = show => {
    document.body.classList.toggle('nosb', !show);
    $('reveal').hidden = show;
    requestAnimationFrame(() => { fit(); rebuild(); });
  };
  $('hide').onclick = () => sidebar(false);
  $('reveal').onclick = () => sidebar(true);
  /* Delegated, because the list is rebuilt on every navigation and a per-row handler would
     have to be re-attached each time. mouseover bubbles, so moving between rows re-fires. */
  $('rows').onmouseover = e => setPeek(rowScope(e.target.closest('.drow,.frow')));
  $('rows').onmouseleave = () => setPeek(null);
  /* the list has no end and no button: it grows where it is, so its scroll is never lost */
  $('rows').onscroll = () => {
    const el = $('rows');
    if (el.scrollTop + el.clientHeight > el.scrollHeight - 260) more();
  };
  addEventListener('resize', () => { fit(); rebuild(); });

  const num = (k, d, lo, hi) => {
    const n = parseFloat(q.get(k));
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d;
  };
  cityYaw = num("yaw", YAW, -Math.PI * 2, Math.PI * 2);
  cityPitch = num("pitch", PITCH, 0.10, 1.45);
  setFlat(state.plan ? 1 : 0);
  fit();
  rebuild(); detail(null); railIndex();
  requestAnimationFrame(frame);
  rise();
});
</script>
<!-- Optional, like the notes: on a plain static server the endpoint is absent and this adds nothing. -->
<script src="atlas-regen.js"></script>
