<!doctype html>
<meta charset="utf-8">
<title>Argo · the map</title>
<link rel="stylesheet" href="atlas-tokens.css">
<style>
  /* BUDGET: at rest, 4 text rows of chrome. Every other word is on the boxes or on demand. */
  html, body { height: 100%; overflow: hidden; }
  #app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

  header { padding: var(--s-loose) var(--s-region) var(--s-comfortable); }
  .crumbs { display: flex; align-items: baseline; gap: var(--s-snug);
            font-size: var(--t-callout); color: var(--text-3); min-height: 18px; }
  .crumbs button { color: var(--text-3); border-radius: var(--r-marker); }
  .crumbs button:hover { color: var(--text-1); }
  .crumbs .sep { opacity: .5; }
  h1 { font-size: var(--t-title2); font-weight: 600; margin-top: 2px; }
  h1 em { font-style: normal; color: var(--text-3); font-weight: 400; font-size: var(--t-body); }

  #canvas { position: relative; margin: 0 var(--s-region); }
  .cell { position: absolute; border-radius: var(--r-control);
          border: 1px solid var(--hairline); background: var(--raised);
          overflow: hidden; cursor: default;
          transition: background var(--m-state) var(--ease-out),
                      border-color var(--m-state) var(--ease-out),
                      left var(--m-resettle) var(--ease-out), top var(--m-resettle) var(--ease-out),
                      width var(--m-resettle) var(--ease-out), height var(--m-resettle) var(--ease-out),
                      opacity var(--m-reveal) var(--ease-out); }
  .cell.deep { background: var(--overlay); }
  .cell.open { cursor: pointer; }
  .cell.open:hover, .cell.lit { background: var(--overlay); border-color: var(--subtle); }
  .cell.lit { background: var(--selection-ground); border-color: var(--accent); }
  .cell.enter { opacity: 0; transform: scale(.98); }

  .cell b { position: absolute; left: 10px; top: 8px; right: 10px;
            font-size: var(--t-body); font-weight: 600; line-height: 1.25;
            color: var(--text-1); pointer-events: none; }
  .cell.sm b { font-size: var(--t-subheadline); font-weight: 400; color: var(--text-2); }
  .cell i { position: absolute; left: 10px; bottom: 7px;
            font: var(--t-footnote) var(--mono); color: var(--text-3);
            font-style: normal; pointer-events: none; }
  .cell u { position: absolute; right: 9px; bottom: 7px; text-decoration: none;
            font-size: var(--t-footnote); color: var(--accent); pointer-events: none; }

  /* the level below, shown as shape only */
  .nest { position: absolute; left: 6px; right: 6px; top: 32px; bottom: 26px;
          pointer-events: none; }
  .cell.d1 > .nest { left: 4px; right: 4px; top: 22px; bottom: 6px; }

  /* depth 1 — a group, drawn as a frame with a quiet label */
  .cell.d1 { background: transparent; border-color: rgba(255,255,255,.10); border-radius: 4px; }
  .cell.d1 > b { left: 7px; top: 5px; right: 7px; font-size: var(--t-footnote);
                 font-weight: 400; letter-spacing: .04em; text-transform: uppercase;
                 color: var(--text-3); }

  /* depth 2 — a real part, the thing you came to see */
  .cell.d2 { background: var(--raised); border-color: rgba(255,255,255,.07); border-radius: 3px; }
  .cell.d2 > b { left: 8px; top: 6px; right: 8px; font-size: var(--t-subheadline);
                 font-weight: 400; color: var(--text-2); }
  .cell.open:hover .cell.d2, .cell.lit .cell.d2 { background: var(--overlay); }
  .cell.open:hover .cell.d2 > b, .cell.lit .cell.d2 > b { color: var(--text-1); }

  footer { padding: var(--s-comfortable) var(--s-region) var(--s-loose);
           min-height: 62px; border-top: 1px solid var(--hairline); }
  footer .name { font-size: var(--t-body); font-weight: 600; }
  footer .said { color: var(--text-2); margin-top: 1px; }
  footer .idle { color: var(--text-3); }
  footer .where { font: var(--t-footnote) var(--mono); color: var(--text-3); margin-top: 3px; }
</style>

<div id="app">
  <header>
    <div class="crumbs" id="crumbs"></div>
    <h1 id="title"></h1>
  </header>
  <div id="canvas"></div>
  <footer id="detail"></footer>
</div>

<script src="atlas-content.js"></script>
<script>
const A = window.ATLAS;
const $ = id => document.getElementById(id);

/* ---- the three levels, each built from the content ---- */

const STACK = ['app', 'ui', 'engine'];
const ASIDE = ['terminal', 'observe'];
const LAYER = { app: 'the top layer', ui: 'the middle layer', engine: 'the bottom layer' };

function targets() {
  return [...STACK, ...ASIDE].map(id => {
    const n = A[id];
    return {
      id, name: n.name, size: n.lines, said: n.line, where: n.path,
      note: LAYER[id] || 'beside the stack, not in it',
      kids: (n.groups || []).length ? () => groupsOf(id) : null,
    };
  });
}

function groupsOf(tid) {
  const t = A[tid], byGroup = {};
  for (const cid of t.inside) {
    const c = A[cid];
    if (c) (byGroup[c.group] = byGroup[c.group] || []).push(c);
  }
  return t.groups.map(g => {
    const kids = byGroup[g.id] || [];
    return {
      id: `${tid}/${g.id}`, name: g.name, said: g.line, where: g.path,
      size: kids.reduce((s, c) => s + c.lines, 0),
      note: `${kids.length} parts`,
      kids: kids.length ? () => kids.map(c => ({
        id: c.id, name: c.name, size: c.lines, said: c.line,
        where: (c.anchors && c.anchors[0]) ? c.anchors[0][0] : null,
        note: null, kids: null,
      })) : null,
    };
  });
}

/* ---- squarified treemap ---- */

function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, i) => s + i.size, 0) || 1;
  let rest = items.slice().sort((a, b) => b.size - a.size);
  let area = { x, y, w, h }, remaining = total;

  while (rest.length) {
    const horizontal = area.w >= area.h;
    const side = horizontal ? area.h : area.w;
    let row = [], rowSum = 0, best = Infinity;

    for (const item of rest) {
      const trySum = rowSum + item.size;
      const thick = (trySum / remaining) * (horizontal ? area.w : area.h);
      const worst = Math.max(...[...row, item].map(it => {
        const along = (it.size / trySum) * side;
        return Math.max(thick / along, along / thick);
      }));
      if (worst > best && row.length) break;
      row.push(item); rowSum = trySum; best = worst;
    }

    const thick = (rowSum / remaining) * (horizontal ? area.w : area.h);
    let along = horizontal ? area.y : area.x;
    for (const it of row) {
      const len = (it.size / rowSum) * side;
      out.push(horizontal
        ? { it, x: area.x, y: along, w: thick, h: len }
        : { it, x: along, y: area.y, w: len, h: thick });
      along += len;
    }

    if (horizontal) { area.x += thick; area.w -= thick; }
    else { area.y += thick; area.h -= thick; }
    remaining -= rowSum;
    rest = rest.slice(row.length);
  }
  return out;
}

/* ---- state ---- */

const state = { path: [{ id: null, name: 'What Argo is made of', items: targets }], lit: null };
const level = () => state.path[state.path.length - 1];

function fmt(n) { return n.toLocaleString('en-US'); }

function render(animate) {
  const lv = level(), items = lv.items();
  const canvas = $('canvas');
  const w = canvas.clientWidth, h = canvas.clientHeight;

  $('title').innerHTML = lv.name +
    (state.path.length > 1 ? ` <em>${fmt(items.reduce((s, i) => s + i.size, 0))} lines in ${items.length} parts</em>`
                           : ' <em>every box is sized by its line count</em>');

  const crumbs = $('crumbs');
  crumbs.innerHTML = '';
  state.path.forEach((p, i) => {
    if (i === state.path.length - 1) return;
    const b = document.createElement('button');
    b.textContent = (i === 0 ? '← ' : '') + p.name;
    b.onclick = () => { state.path = state.path.slice(0, i + 1); state.lit = null; render(true); };
    crumbs.append(b);
    const s = document.createElement('span');
    s.className = 'sep'; s.textContent = '/';
    crumbs.append(s);
  });

  canvas.innerHTML = '';
  place(items, canvas, 0, 0, w, h, 0);
  detail(state.lit ? items.find(i => i.id === state.lit) : null);
}

/* Draws a level, and one level below it dimmed, so the shape of what is inside
   is visible before you open it. Two levels is the limit — three is the clutter. */
function place(items, host, ox, oy, w, h, depth) {
  for (const { it, x, y, w: bw, h: bh } of squarify(items, 0, 0, w, h)) {
    const pad = depth === 0 ? 2 : 1;
    const el = document.createElement('div');
    el.className = 'cell'
      + (depth === 0 && it.kids ? ' open' : '')
      + (depth > 0 ? ' d' + depth : (state.path.length > 1 ? ' deep' : ''))
      + (depth === 0 && (bw < 150 || bh < 58) ? ' sm' : '')
      + (depth === 0 && state.lit === it.id ? ' lit' : '');
    el.style.left = ox + x + pad + 'px'; el.style.top = oy + y + pad + 'px';
    el.style.width = Math.max(0, bw - pad * 2) + 'px';
    el.style.height = Math.max(0, bh - pad * 2) + 'px';

    const room = bw > 84 && bh > 26;
    if (room) el.innerHTML = `<b>${it.name}</b>`;
    if (depth === 0) {
      if (bw > 112 && bh > 54) el.innerHTML += `<i>${fmt(it.size)} ln</i>`;
      if (it.kids && bw > 210 && bh > 54) el.innerHTML += `<u>open →</u>`;
      el.onmouseenter = () => detail(it);
      el.onmouseleave = () => detail(state.lit ? level().items().find(i => i.id === state.lit) : null);
      el.onclick = () => {
        if (it.kids) {
          state.path.push({ id: it.id, name: it.name, items: it.kids });
          state.lit = null; render(true);
        } else {
          state.lit = state.lit === it.id ? null : it.id;
          render(false); detail(it);
        }
      };
    }
    host.append(el);

    /* Draw inwards while the room lasts, down to the leaves. A container is only
       a frame around real parts, so stopping at one gives an empty rectangle. */
    if (it.kids && bw > 150 && bh > 96) {
      const inset = document.createElement('div');
      inset.className = 'nest';
      el.append(inset);
      const top = depth === 0 ? 32 : 22, bot = depth === 0 ? 26 : 6;
      place(it.kids(), inset, 0, 0, bw - pad * 2 - (depth === 0 ? 12 : 8),
            bh - pad * 2 - top - bot, depth + 1);
    }
  }
}

function detail(it) {
  const d = $('detail');
  if (!it) {
    d.innerHTML = `<div class="idle">Point at a box to read what it does. Click one that says
      <span style="color:var(--accent)">open</span> to go inside it.</div>`;
    return;
  }
  d.innerHTML = `<div class="name">${it.name}</div>`
    + `<div class="said">${it.said || ''}</div>`
    + (it.where || it.note
        ? `<div class="where">${[it.where, it.note].filter(Boolean).join('  ·  ')}</div>` : '');
}

addEventListener('resize', () => render(false));
render(false);
</script>
