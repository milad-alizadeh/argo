<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas Workbench — one part at a time</title>
<link rel="stylesheet" href="atlas-tokens.css">
<style>
  /* ---- shell ------------------------------------------------------- */
  body { display: flex; flex-direction: column; }

  .bar {
    display: flex; align-items: center; gap: var(--s-comfortable);
    height: 40px; flex: 0 0 40px; padding: 0 var(--s-comfortable);
    background: var(--base); border-bottom: 1px solid var(--hairline);
  }
  .bar .brand {
    font: 600 var(--t-subheadline)/1 var(--sans);
    letter-spacing: .09em; text-transform: uppercase; color: var(--text-3);
    padding-right: var(--s-base); border-right: 1px solid var(--hairline);
  }
  .navbtns { display: flex; gap: 2px; }
  .navbtns button {
    width: 24px; height: 24px; border-radius: var(--r-marker);
    color: var(--text-2); font: var(--t-body)/1 var(--sans);
  }
  .navbtns button:hover:not(:disabled) { background: var(--hover); }
  .navbtns button:disabled { color: var(--text-off); cursor: default; }

  .trail { display: flex; align-items: center; gap: 2px; overflow: hidden; flex: 1 1 auto; min-width: 0; }
  .trail .earlier {
    font: var(--t-footnote)/1 var(--mono); color: var(--text-off);
    padding-right: var(--s-tight); white-space: nowrap;
  }
  .trail button {
    font: var(--t-callout)/1 var(--sans); color: var(--text-3);
    padding: 4px 6px; border-radius: var(--r-marker); white-space: nowrap;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis;
  }
  .trail button:hover { background: var(--hover); color: var(--text-2); }
  .trail button.now { background: var(--selected); color: var(--text-1); }
  .trail .sep { color: var(--text-off); font-size: var(--t-footnote); }

  .aspects { display: flex; gap: 2px; background: var(--sunken); padding: 2px; border-radius: var(--r-control); }
  .aspects button {
    font: var(--t-callout)/1 var(--sans); color: var(--text-3);
    padding: 5px 9px; border-radius: var(--r-marker); white-space: nowrap;
  }
  .aspects button:hover { color: var(--text-1); }
  .aspects button[aria-pressed="true"] { background: var(--selection-ground); color: var(--text-1); }

  main { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ---- index pane -------------------------------------------------- */
  .index {
    flex: 0 0 260px; width: 260px; display: flex; flex-direction: column;
    background: var(--base); border-right: 1px solid var(--hairline); min-height: 0;
  }
  .searchwrap { padding: var(--s-base); border-bottom: 1px solid var(--hairline); }
  .searchwrap input {
    width: 100%; background: var(--sunken); border: 1px solid var(--subtle);
    border-radius: var(--r-control); color: var(--text-1);
    font: var(--t-body)/1 var(--sans); padding: 6px 8px;
  }
  .searchwrap input::placeholder { color: var(--text-off); }
  .searchwrap input:focus { outline: none; border-color: var(--accent); }
  .searchnote { font: var(--t-footnote)/1.4 var(--sans); color: var(--text-off); padding-top: var(--s-tight); }

  .tree { overflow-y: auto; flex: 1 1 auto; padding-bottom: var(--s-section); }
  .heading {
    font: 600 var(--t-footnote)/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-off); padding: var(--s-comfortable) var(--s-base) var(--s-tight);
  }
  .grouphead {
    font: var(--t-footnote)/1.3 var(--sans); color: var(--text-off);
    padding: var(--s-base) var(--s-base) 2px calc(var(--s-base) + 12px);
  }
  .row {
    display: flex; align-items: baseline; gap: var(--s-snug);
    width: 100%; text-align: left; padding: 4px var(--s-base);
    color: var(--text-2); font: var(--t-callout)/1.35 var(--sans);
  }
  .row .rname { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row:hover { background: var(--hover); color: var(--text-1); }
  .row[aria-current="true"] { background: var(--selected); color: var(--text-1); font-weight: 600; }
  .row.d1 { padding-left: calc(var(--s-base) + 10px); }
  .row.d2 { padding-left: calc(var(--s-base) + 22px); }
  .badges { display: flex; gap: var(--s-tight); flex: 0 0 auto; }
  .badge {
    font: var(--t-footnote)/1 var(--mono); color: var(--text-off);
    border: 1px solid var(--hairline); border-radius: var(--r-marker); padding: 1px 3px;
  }
  .row[aria-current="true"] .badge { color: var(--text-3); border-color: var(--subtle); }

  /* ---- graph pane -------------------------------------------------- */
  .graphpane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; background: var(--desktop); }
  .graphhead { padding: var(--s-base) var(--s-comfortable) var(--s-snug); border-bottom: 1px solid var(--hairline); }
  .graphhead .why { font: var(--t-footnote)/1.5 var(--sans); color: var(--text-3); max-width: 900px; }
  .graphhead .why b { color: var(--text-2); font-weight: 600; }
  .headline { display: flex; align-items: center; gap: var(--s-base); margin-bottom: var(--s-tight); flex-wrap: wrap; }
  .headline h1 { font: 600 var(--t-title3)/1.2 var(--sans); }
  .kindtag {
    font: var(--t-footnote)/1 var(--mono); color: var(--text-3);
    border: 1px solid var(--subtle); border-radius: var(--r-marker); padding: 2px 5px;
  }
  .order { margin-left: auto; display: flex; align-items: center; gap: var(--s-snug); }
  .order label { font: var(--t-footnote)/1 var(--sans); color: var(--text-off); }
  .order select {
    background: var(--control); color: var(--text-1); border: 1px solid var(--subtle);
    border-radius: var(--r-marker); font: var(--t-footnote)/1 var(--sans); padding: 3px 5px;
  }
  .canvas { flex: 1 1 auto; overflow: auto; }
  .canvas svg { display: block; }

  .legend {
    flex: 0 0 auto; border-top: 1px solid var(--hairline); background: var(--base);
    padding: var(--s-snug) var(--s-comfortable); display: flex; gap: var(--s-loose);
    flex-wrap: wrap; align-items: center;
  }
  .lgitem { display: flex; align-items: center; gap: var(--s-snug); }
  .lgitem span { font: var(--t-footnote)/1.3 var(--sans); color: var(--text-3); }
  .lgitem svg { display: block; }

  /* ---- graph marks ------------------------------------------------- */
  .node { cursor: pointer; }
  .node .plate { transition: fill var(--m-selection) var(--ease-out); }
  .node:hover .plate { fill: var(--overlay); }
  .node.active { cursor: default; }
  .nlabel { font: 600 12px/1 var(--sans); fill: var(--text-1); }
  .nsub   { font: 10px/1 var(--sans); fill: var(--text-3); }
  .nmeta  { font: 9px/1 var(--mono); fill: var(--text-off); }
  .elabel { font: 10px/1 var(--sans); fill: var(--text-3); }
  .colhead { font: 600 10px/1 var(--sans); fill: var(--text-2); letter-spacing: .07em; }
  .colnote { font: 10px/1 var(--sans); fill: var(--text-off); }
  .edge { fill: none; stroke: var(--strong); stroke-width: 1; }
  .edge.call { stroke-dasharray: 5 3; }
  .bundle .plate { fill: none; stroke: var(--subtle); stroke-dasharray: 3 3; }
  .bundle:hover .plate { fill: var(--hover); }

  /* ---- reading pane ------------------------------------------------ */
  .reading {
    flex: 0 0 380px; width: 380px; display: flex; flex-direction: column;
    background: var(--base); border-left: 1px solid var(--hairline); min-height: 0;
  }
  .read { overflow-y: auto; flex: 1 1 auto; padding: var(--s-comfortable); }
  .crumbs { font: var(--t-footnote)/1.4 var(--sans); color: var(--text-off); margin-bottom: var(--s-snug); }
  .crumbs button { color: var(--accent); font: inherit; }
  .crumbs button:hover { color: var(--accent-bright); text-decoration: underline; }
  .read h2 { font: 600 var(--t-title3)/1.25 var(--sans); margin-bottom: var(--s-snug); }
  .read .lede { font: var(--t-body)/1.5 var(--sans); color: var(--text-1); margin-bottom: var(--s-comfortable); }
  .read p { font: var(--t-callout)/1.6 var(--sans); color: var(--text-2); margin-bottom: var(--s-base); }
  .sect { margin-top: var(--s-loose); }
  .sect h3 {
    font: 600 var(--t-footnote)/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-off); margin-bottom: var(--s-snug);
  }
  .anchor {
    display: block; width: 100%; text-align: left; padding: var(--s-snug);
    border-radius: var(--r-marker); border: 1px solid transparent;
  }
  .anchor:hover { background: var(--hover); }
  .anchor .p { font: 10px/1.4 var(--mono); color: var(--text-3); word-break: break-all; }
  .anchor .w { font: var(--t-callout)/1.45 var(--sans); color: var(--text-2); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s-tight); }
  .chip {
    font: var(--t-footnote)/1.3 var(--sans); color: var(--text-2);
    background: var(--control); border-radius: var(--r-marker); padding: 3px 6px;
  }
  .chip:hover { background: var(--marked); color: var(--text-1); }
  .stat { font: var(--t-footnote)/1.5 var(--mono); color: var(--text-off); }
  .stepitem { padding: var(--s-snug) 0; border-bottom: 1px solid var(--hairline); }
  .stepitem .t { font: 600 var(--t-callout)/1.4 var(--sans); color: var(--text-1); }
  .stepitem .n { font: 9px/1 var(--mono); color: var(--text-off); }
  .stepitem p { margin: var(--s-tight) 0 var(--s-tight); }
  .ruleitem { padding: var(--s-snug) 0; border-bottom: 1px solid var(--hairline); }
  .ruleitem .s { font: var(--t-callout)/1.5 var(--sans); color: var(--text-1); }
  .more { font: var(--t-footnote)/1 var(--sans); color: var(--accent); padding: var(--s-tight) 0; }

  /* ---- docked answer panel ----------------------------------------- */
  .dock { flex: 0 0 auto; border-top: 1px solid var(--subtle); background: var(--raised); display: flex; flex-direction: column; min-height: 0; }
  .dock.open { flex: 0 1 46%; }
  .qbar { display: flex; flex-wrap: wrap; gap: var(--s-tight); padding: var(--s-base); }
  .qbar button {
    font: var(--t-footnote)/1 var(--sans); color: var(--text-2);
    background: var(--control); border-radius: var(--r-control); padding: 5px 8px;
  }
  .qbar button:hover { background: var(--marked); color: var(--text-1); }
  .qbar button[aria-pressed="true"] { background: var(--selection-ground); color: var(--text-1); }
  .dockbody { overflow-y: auto; padding: 0 var(--s-base) var(--s-base); }
  .dockbody .cap { font: var(--t-footnote)/1.5 var(--sans); color: var(--text-off); padding-bottom: var(--s-snug); }
  .ans { display: block; width: 100%; text-align: left; padding: var(--s-snug); border-radius: var(--r-marker); border-top: 1px solid var(--hairline); }
  .ans:hover { background: var(--hover); }
  .ans .who { font: 600 var(--t-callout)/1.35 var(--sans); color: var(--text-1); }
  .ans .cargo { font: var(--t-footnote)/1.5 var(--sans); color: var(--text-2); }
  .ans .sense { font: 9px/1 var(--mono); color: var(--text-off); }
  .empty { font: var(--t-footnote)/1.5 var(--sans); color: var(--text-off); padding: var(--s-base) var(--s-snug); }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Atlas</div>
  <div class="navbtns">
    <button id="back" title="Back (Alt+Left)">&#9664;</button>
    <button id="fwd" title="Forward (Alt+Right)">&#9654;</button>
  </div>
  <nav class="trail" id="trail" aria-label="Trail"></nav>
  <div class="aspects" id="aspects" role="group" aria-label="Aspect"></div>
</header>

<main>
  <aside class="index" aria-label="Index">
    <div class="searchwrap">
      <input id="q" type="search" placeholder="Search parts, flows, concepts  ( / )" autocomplete="off">
      <div class="searchnote" id="qnote"></div>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <section class="graphpane" aria-label="Neighbourhood">
    <div class="graphhead">
      <div class="headline">
        <h1 id="ghName"></h1>
        <span class="kindtag" id="ghKind"></span>
        <div class="order">
          <label for="ord">order by</label>
          <select id="ord">
            <option value="degree">edges it touches</option>
            <option value="lines">source lines</option>
            <option value="name">name, A–Z</option>
          </select>
        </div>
      </div>
      <div class="why" id="ghWhy"></div>
    </div>
    <div class="canvas" id="canvas"></div>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="reading" aria-label="Reading">
    <div class="read" id="read"></div>
    <div class="dock" id="dock">
      <div class="qbar" id="qbar"></div>
      <div class="dockbody" id="dockbody" hidden></div>
    </div>
  </aside>
</main>

<script src="atlas-content.js"></script>
<script>
(function () {
"use strict";
const A = window.ATLAS;
const ids = Object.keys(A);

/* ================= derived indexes ================================== */
const incoming = {};                     // id -> [edge]
const outgoing = {};                     // id -> [edge]
for (const id of ids) {
  for (const e of (A[id].leaving || [])) {
    (outgoing[e[0]] = outgoing[e[0]] || []).push(e);
    (incoming[e[1]] = incoming[e[1]] || []).push(e);
  }
}
const conceptParts = {};                 // concept id -> [part id]
for (const id of ids) for (const c of (A[id].concepts || [])) (conceptParts[c] = conceptParts[c] || []).push(id);

const flowsTouching = {};                // node id -> [{flow, steps:[i]}]
const FLOWS = ids.filter(i => A[i].kind === "flow");
for (const fid of FLOWS) {
  const f = A[fid];
  f.steps.forEach((s, i) => {
    for (const p of [s.actor, s.from, s.to]) {
      if (!p) continue;
      const bag = flowsTouching[p] = flowsTouching[p] || {};
      (bag[fid] = bag[fid] || []).push(i);
    }
  });
  for (const c of (f.concepts || [])) {
    const bag = flowsTouching[c] = flowsTouching[c] || {};
    bag[fid] = bag[fid] || [];
  }
}
const RULES = A.argo.rules || [];
function rulesFor(id) {
  const n = A[id]; if (!n) return [];
  const needle = n.name.toLowerCase();
  return RULES.filter(r => r.statement.toLowerCase().includes(needle));
}
function degree(id) {
  const n = A[id]; if (!n) return 0;
  return (outgoing[id] || []).length + (incoming[id] || []).length + (n.inside || []).length;
}

/* ================= the mark table — legend is generated from it ====== */
const MARKS = [
  { key: "container", what: "Container — parts live inside it",   shape: "rect",   ground: "var(--overlay)", stroke: "var(--strong)",   dash: null,    w: 600 },
  { key: "part",      what: "Part — a folder of source",          shape: "rect",   ground: "var(--raised)",  stroke: "var(--subtle)",   dash: null,    w: 500 },
  { key: "flow",      what: "Flow — an ordered path through parts",shape: "pill",  ground: "var(--raised)",  stroke: "var(--subtle)",   dash: null,    w: 500 },
  { key: "concept",   what: "Concept — a word the code spells",    shape: "cut",   ground: "var(--raised)",  stroke: "var(--subtle)",   dash: null,    w: 500 },
  { key: "external",  what: "Outside Argo — not ours to read",     shape: "rect",   ground: "none",           stroke: "var(--subtle)",   dash: "2 3",   w: 500 },
  { key: "world",     what: "Off the machine — no node behind it", shape: "rect",   ground: "none",           stroke: "var(--hairline)", dash: "2 3",   w: 400 },
  { key: "rule",      what: "Boundary rule — a build failure",     shape: "cut",    ground: "none",           stroke: "var(--subtle)",   dash: "2 3",   w: 500 },
  { key: "bundle",    what: "Collapsed group — always counted",    shape: "rect",   ground: "none",           stroke: "var(--subtle)",   dash: "3 3",   w: 500 }
];
const MARK = Object.fromEntries(MARKS.map(m => [m.key, m]));
const SENSES = [
  { key: "data", what: "data — a value handed over", dash: null },
  { key: "call", what: "call — one part asks another", dash: "5 3" }
];
const BADGES = [
  { key: "inside",  glyph: "▣", what: "has parts inside" },
  { key: "anchors", glyph: "§", what: "has source anchors" },
  { key: "flow",    glyph: "⇝", what: "stands on a flow" },
  { key: "outside", glyph: "↱", what: "is outside Argo" }
];

function markOf(id) {
  const n = A[id];
  if (!n) return "world";
  if (n.kind === "flow") return "flow";
  if (n.kind === "concept") return "concept";
  if (n.external) return "external";
  if ((n.inside || []).length) return "container";
  return "part";
}
function nameOf(id) { return A[id] ? A[id].name : id; }

/* ================= text measuring =================================== */
const mctx = document.createElement("canvas").getContext("2d");
const F_LABEL = '600 12px -apple-system, "SF Pro Text", system-ui, sans-serif';
const F_SUB   = '10px -apple-system, "SF Pro Text", system-ui, sans-serif';
function wrap(text, maxW, font) {
  mctx.font = font;
  const out = []; let cur = "";
  for (const w of String(text).split(/\s+/)) {
    const t = cur ? cur + " " + w : w;
    if (!cur || mctx.measureText(t).width <= maxW) cur = t; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  return out;
}
function clamp(lines, max) {
  if (lines.length <= max) return { lines: lines, cut: 0 };
  const kept = lines.slice(0, max);
  kept[max - 1] = kept[max - 1].replace(/\s+\S*$/, "") + " …";
  return { lines: kept, cut: lines.length - max };
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* ================= state ============================================ */
const ASPECTS = [
  { key: "structure", label: "Structure",  basis: "Edges are the part's own <b>leaving</b> list, the reverse index of every other part's leaving list, its <b>inside</b> list and its parent." },
  { key: "flow",      label: "Flow",       basis: "Edges are the steps of every flow this node stands on, drawn between the parts two consecutive steps happen in." },
  { key: "concept",   label: "Concepts",   basis: "Edges join a part to each concept its reading spells out, taken from the part's <b>concepts</b> list." },
  { key: "rule",      label: "Rules",      basis: "Edges are the six boundary rules whose statement names this node, matched on the node's own name." }
];
const SHOW = 6;          // per column, before a bundle
const SHOW_KIDS = 10;    // children band, before a bundle
let at = "argo";
let aspect = "structure";
let ordering = "degree";
let expand = { in: false, out: false, kids: false };
let question = null;
let hist = [], hix = -1;

/* ================= neighbourhood ==================================== */
// Every entry: {id, cargo, sense, dir}
function structureEdges(id) {
  const ins = (incoming[id] || []).map(e => ({ id: e[0], cargo: e[2], sense: e[3], dir: "in" }));
  const outs = (outgoing[id] || []).map(e => ({ id: e[1], cargo: e[2], sense: e[3], dir: "out" }));
  const n = A[id];
  if (n.kind === "concept") {
    (conceptParts[id] || []).forEach(p => ins.push({
      id: p, sense: "data", dir: "in",
      cargo: A[p].kind === "flow" ? "the flow's reading leans on this concept"
                                  : "the reading of " + A[p].name + " spells the concept out"
    }));
  }
  if (n.kind === "flow") {
    (n.parts || []).forEach(p => {
      const hits = n.steps.map((s, i) => i).filter(i => n.steps[i].actor === p);
      if (hits.length) {
        outs.push({ id: p, sense: n.steps[hits[0]].kind === "call" ? "call" : "data", dir: "out",
          cargo: "step " + hits.map(i => i + 1).join(", ") + " of " + n.steps.length + " — " + n.steps[hits[0]].title });
        return;
      }
      const ends = n.steps.map((s, i) => i).filter(i => n.steps[i].from === p || n.steps[i].to === p);
      if (ends.length) outs.push({ id: p, sense: "data", dir: "out",
        cargo: "no step happens here — it is only the end of step " + ends.map(i => i + 1).join(", ") });
    });
  }
  return { ins: ins, outs: outs };
}
function flowEdges(id) {
  const ins = [], outs = [];
  const bag = flowsTouching[id] || {};
  for (const fid of Object.keys(bag)) {
    const f = A[fid], hits = bag[fid];
    outs.push({ id: fid, sense: "data", dir: "out",
      cargo: hits.length ? "step " + hits.map(i => i + 1).join(", ") + " of " + f.steps.length + " happens here"
                         : "the flow's reading names this concept" });
    for (const i of hits) {
      const s = f.steps[i];
      const prev = i > 0 ? f.steps[i - 1] : null;
      const next = i + 1 < f.steps.length ? f.steps[i + 1] : null;
      const sense = s.kind === "call" ? "call" : "data";
      if (s.from && s.from !== id) ins.push({ id: s.from, sense: sense, dir: "in", cargo: f.name + " · " + s.title });
      if (s.to && s.to !== id) outs.push({ id: s.to, sense: sense, dir: "out", cargo: f.name + " · " + s.title });
      if (prev && prev.actor && prev.actor !== id) ins.push({ id: prev.actor, sense: prev.kind === "call" ? "call" : "data", dir: "in", cargo: f.name + " · before: " + prev.title });
      if (next && next.actor && next.actor !== id) outs.push({ id: next.actor, sense: next.kind === "call" ? "call" : "data", dir: "out", cargo: f.name + " · next: " + next.title });
    }
  }
  return { ins: dedupe(ins), outs: dedupe(outs) };
}
function dedupe(list) {
  const seen = new Set(), out = [];
  for (const e of list) { const k = e.id + "|" + e.cargo; if (!seen.has(k)) { seen.add(k); out.push(e); } }
  return out;
}
function conceptEdges(id) {
  const n = A[id], ins = [], outs = [];
  if (n.kind === "concept") {
    (conceptParts[id] || []).forEach(p => ins.push({ id: p, sense: "data", dir: "in",
      cargo: A[p].kind === "flow" ? "the flow's reading leans on this concept" : "the reading of " + A[p].name + " spells the concept out" }));
    for (const fid of FLOWS) if ((A[fid].concepts || []).includes(id))

  const badges = badgeStrip(id);

function buildGraph(width) {

  const ins = insAll.slice(0, showIn), outs = outsAll.slice(0, showOut);
  const hidIn = insAll.length - showIn, hidOut = outsAll.length - showOut;

    : A[at].kind === "flow" ? A[at].steps.length + " steps through " + (A[at].parts || []).length + " parts"

      h += '<div class="stepitem"><div class="n">STEP ' + (i + 1) + " · " + esc(s.kind) + "</div>" +
        '<div class="t">' + esc(s.title) + "</div><p>" + esc(s.prose) + "</p>" +
        '<div class="chips"><button class="chip" data-id="' + esc(s.actor) + '">in ' + esc(nameOf(s.actor)) + "</button>" +
        (s.from ? '<button class="chip" data-id="' + esc(s.from) + '">from ' + esc(nameOf(s.from)) + "</button>" : "") +
        (s.to ? '<button class="chip" data-id="' + esc(s.to) + '">to ' + esc(nameOf(s.to)) + "</button>" : "") +
        "</div>" +
        (s.at ? '<div class="anchor"><span class="p">' + esc(s.at[0]) + ":" + s.at[1] + "</span></div>" : "") +
        "</div>";
    });
    h += "</div>";
  }
  const ev = n.anchors || n.evidence;
  if ((ev || []).length) {
    h += '<div class="sect"><h3>' + (n.anchors ? "Source anchors" : "Evidence") + " (" + ev.length + ")</h3>";
    for (const a of ev) h += '<div class="anchor"><div class="w">' + esc(a[2]) + '</div><div class="p">' + esc(a[0]) + ":" + a[1] + "</div></div>";
    h += "</div>";
  }
  if ((n.concepts || []).length) {
    h += '<div class="sect"><h3>Concepts it spells</h3><div class="chips">' +
      n.concepts.map(c => '<button class="chip" data-id="' + esc(c) + '">' + esc(nameOf(c)) + "</button>").join("") + "</div></div>";
  }
  if (n.kind === "concept" && (conceptParts[at] || []).length) {
    h += '<div class="sect"><h3>Parts that spell it</h3><div class="chips">' +
      conceptParts[at].map(c => '<button class="chip" data-id="' + esc(c) + '">' + esc(nameOf(c)) + "</button>").join("") + "</div></div>";
  }
  if ((RULES.length && at === "argo") || rulesFor(at).length) {
    const rs = at === "argo" ? RULES : rulesFor(at);
    h += '<div class="sect"><h3>Boundary rules' + (at === "argo" ? "" : " that name it") + " (" + rs.length + ")</h3>";
    for (const r of rs) h += '<div class="ruleitem"><div class="s">' + esc(r.statement) + '</div><div class="stat">' +
      esc(r.enforced_at[0] + ":" + r.enforced_at[1] + (r.adr ? "  ·  " + r.adr : "")) + "</div></div>";
    h += "</div>";
  }
  document.getElementById("read").innerHTML = h;
  document.getElementById("read").scrollTop = 0;
}

/* ================= docked answers =================================== */
const QUESTIONS = [
  { key: "in",  label: "Who reaches this?",     cap: "Every part whose own leaving list names this one. Nothing here changes the active node until you click a row." },
  { key: "out", label: "What does it reach?",   cap: "This part's whole leaving list, in the source order, with the cargo it hands over." },
  { key: "flow",label: "Which flows touch it?", cap: "Every flow with a step whose actor, from or to is this node." },
  { key: "anch",label: "Where is it in source?",cap: "Every anchor recorded for this node, path and line, unshortened." }
];
function renderDock() {
  const bar = document.getElementById("qbar");
  bar.innerHTML = QUESTIONS.map(q => '<button data-q="' + q.key + '" aria-pressed="' + (question === q.key) + '">' +
    esc(q.label) + "</button>").join("") + (question ? '<button data-q="close">Close</button>' : "");
  const body = document.getElementById("dockbody"), dock = document.getElementById("dock");
  if (!question) { body.hidden = true; dock.classList.remove("open"); return; }
  body.hidden = false; dock.classList.add("open");
  const q = QUESTIONS.find(x => x.key === question);
  let h = '<div class="cap">' + esc(q.cap) + "</div>";
  if (question === "in" || question === "out") {
    const list = question === "in" ? (incoming[at] || []) : (outgoing[at] || []);
    if (!list.length) h += '<div class="empty">Nothing. No edge in the atlas runs that way.</div>';
    for (const e of list) {
      const other = question === "in" ? e[0] : e[1];
      h += '<button class="ans" data-id="' + esc(other) + '">' +
        '<span class="who">' + esc(nameOf(other)) + (A[other] ? "" : "  (off the machine)") + "</span>" +
        '<div class="cargo">' + esc(e[2]) + "</div>" +
        '<div class="sense">' + esc(e[3]) + "</div></button>";
    }
  } else if (question === "flow") {
    const bag = flowsTouching[at] || {};
    if (!Object.keys(bag).length) h += '<div class="empty">No flow step happens here.</div>';
    for (const fid of Object.keys(bag)) {
      const f = A[fid], hits = bag[fid];
      h += '<button class="ans" data-id="' + esc(fid) + '"><span class="who">' + esc(f.name) + "</span>" +
        '<div class="cargo">' + (hits.length ? hits.map(i => "step " + (i + 1) + " · " + f.steps[i].title).join("<br>") : "named in the flow's reading") + "</div>" +
        '<div class="sense">' + f.steps.length + " steps</div></button>";
    }
  } else {
    const ev = A[at].anchors || A[at].evidence || [];
    if (!ev.length) h += '<div class="empty">This node records no anchor.</div>';
    for (const a of ev) h += '<div class="ans"><span class="who">' + esc(a[2]) + '</span><div class="cargo" style="font-family:var(--mono);font-size:10px">' + esc(a[0]) + ":" + a[1] + "</div></div>";
  }
  body.innerHTML = h;
  body.scrollTop = 0;
}

/* ================= trail ============================================ */
function renderTrail() {
  const el = document.getElementById("trail");
  const start = Math.max(0, hist.length - 7);
  let h = start > 0 ? '<span class="earlier">' + start + " earlier</span>" : "";
  for (let i = start; i < hist.length; i++) {
    if (i > start) h += '<span class="sep">›</span>';
    h += '<button data-hix="' + i + '"' + (i === hix ? ' class="now"' : "") + ">" + esc(nameOf(hist[i])) + "</button>";
  }
  el.innerHTML = h;
  document.getElementById("back").disabled = hix <= 0;
  document.getElementById("fwd").disabled = hix >= hist.length - 1;
}

/* ================= render =========================================== */
function renderHead(counts) {
  const n = A[at];
  document.getElementById("ghName").textContent = n.name;
  document.getElementById("ghKind").textContent = markOf(at);
  const asp = ASPECTS.find(a => a.key === aspect);
  const st = structureEdges(at);
  const structureTotal = st.ins.length + st.outs.length + (n.inside || []).length;
  const shownTotal = counts.insAll + counts.outsAll;
  let dropped = "";
  if (aspect !== "structure") {
    dropped = " This filter drops the <b>" + structureTotal + "</b> structure edges and draws <b>" + shownTotal + "</b> of its own.";
  }
  const hid = [];
  if (counts.hidIn) hid.push(counts.hidIn + " reaching in");
  if (counts.hidOut) hid.push(counts.hidOut + " reaching out");
  if (counts.hidKids) hid.push(counts.hidKids + " inside");
  const hidText = hid.length
    ? " <b>" + hid.join(", ") + "</b> " + (hid.length > 1 ? "are" : "is") + " collapsed into the dashed “more” marks — click one to draw them."
    : " Nothing is collapsed: everything in this neighbourhood is drawn.";
  document.getElementById("ghWhy").innerHTML =
    "<b>" + esc(asp.label) + ".</b> " + asp.basis + dropped +
    " One hop only — no neighbour's own neighbours are drawn, and the parent above is drawn under every filter." +
    " Neighbours are ordered by <b>" + ORDER_WORDS[ordering] + "</b>." + hidText +
    (counts.cutLabels ? " <b>" + counts.cutLabels + "</b> edge label" + (counts.cutLabels > 1 ? "s are" : " is") +
      " cut at the ellipsis; the whole text is in the reading, and in the answer panel below it." : "");
}
function render() {
  const canvas = document.getElementById("canvas");
  const g = buildGraph(canvas.clientWidth - 4);
  canvas.innerHTML = g.svg;
  renderHead(g.counts);
  renderLegend();
  renderReading();
  renderDock();
  renderTrail();
  document.querySelectorAll("#tree .row").forEach(r =>
    r.setAttribute("aria-current", r.getAttribute("data-id") === at ? "true" : "false"));
  document.querySelectorAll("#aspects button").forEach(b =>
    b.setAttribute("aria-pressed", b.getAttribute("data-aspect") === aspect ? "true" : "false"));
}
function go(id, opts) {
  if (!A[id] || id === at) return;
  at = id; expand = { in: false, out: false, kids: false };
  if (!opts || !opts.replaceHistory) {
    hist = hist.slice(0, hix + 1); hist.push(id); hix = hist.length - 1;
    history.pushState({ at: id }, "", "?at=" + encodeURIComponent(id));
  }
  render();
}
function jump(i) {
  if (i < 0 || i >= hist.length) return;
  hix = i; at = hist[i]; expand = { in: false, out: false, kids: false };
  history.pushState({ at: at }, "", "?at=" + encodeURIComponent(at));
  render();
}

/* ================= wiring =========================================== */
document.getElementById("aspects").innerHTML = ASPECTS.map(a =>
  '<button data-aspect="' + a.key + '">' + esc(a.label) + "</button>").join("");
document.getElementById("aspects").addEventListener("click", e => {
  const b = e.target.closest("button[data-aspect]"); if (!b) return;
  aspect = b.getAttribute("data-aspect"); expand = { in: false, out: false, kids: false }; render();
});
document.getElementById("ord").addEventListener("change", e => { ordering = e.target.value; render(); });
document.getElementById("canvas").addEventListener("click", e => {
  const bun = e.target.closest("[data-bundle]");
  if (bun) { expand[bun.getAttribute("data-bundle")] = true; render(); return; }
  const g = e.target.closest("g.node"); if (!g) return;
  const id = g.getAttribute("data-id"); if (id && A[id]) go(id);
});
document.getElementById("canvas").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = document.activeElement; if (!t || !t.closest) return;
  e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true }));
});
document.body.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b && !e.target.closest("#canvas")) { const id = b.getAttribute("data-id"); if (A[id]) { go(id); return; } }
  const t = e.target.closest("[data-hix]"); if (t) { jump(+t.getAttribute("data-hix")); return; }
  const q = e.target.closest("[data-q]");
  if (q) { const k = q.getAttribute("data-q"); question = (k === "close" || question === k) ? null : k; renderDock(); }
});
document.getElementById("back").addEventListener("click", () => jump(hix - 1));
document.getElementById("fwd").addEventListener("click", () => jump(hix + 1));
document.getElementById("q").addEventListener("input", filterTree);
window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.altKey && e.key === "ArrowLeft") jump(hix - 1);
  if (e.altKey && e.key === "ArrowRight") jump(hix + 1);
});
window.addEventListener("popstate", e => {
  const id = (e.state && e.state.at) || new URLSearchParams(location.search).get("at");
  if (id && A[id]) { at = id; expand = { in: false, out: false, kids: false }; render(); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });

buildTree();
filterTree();
const start = new URLSearchParams(location.search).get("at");
at = (start && A[start]) ? start : "argo";
hist = [at]; hix = 0;
const params = new URLSearchParams(location.search);
if (params.get("ask")) question = params.get("ask");
if (ASPECTS.some(a => a.key === params.get("aspect"))) aspect = params.get("aspect");
(params.get("open") || "").split(",").forEach(k => { if (k in expand) expand[k] = true; });
render();
})();
</script>
</body>
</html>
