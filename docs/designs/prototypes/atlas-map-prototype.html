<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Project Atlas as a chart</title>
<!--
  THROWAWAY PROTOTYPE for #650 (map #643). The Project Atlas as an interactive chart: one
  eagle-eye view of the whole system, drilled by opening a node in place. Three chart forms,
  switchable with ?variant=A|B|C, the floating bar, or the arrow keys.

  IT BREAKS ONE SETTLED REFUSAL, ON PURPOSE. #648 refused a boxes-and-lines diagram, and it
  refused meaningful card position. This artifact does both. The reaction to the prose-card
  build was that an atlas without a chart is not an atlas. #650 decides which of the two is
  right, so the contradiction is the study.

  Every other refusal still holds: no provenance badge, no tier chip, no graded freshness, no
  progress or seen-tracking, no tour mode, no global next, no jump list, no per-Claim expand,
  no third prose length, no edit surface, no file viewer.

  LAYOUT COMES FROM LIBRARIES, NOT FROM HAND-PLACED COORDINATES.
    A — dagre 0.8.5, a layered graph layout for a directed graph. Compound mode places the
        opened domain as a cluster with its Areas inside it.
    B — d3-hierarchy (d3.cluster), mapped to polar coordinates.
    C — d3-force, the same simulation that Grape ports to SwiftUI.
  Both libraries are vendored under vendor/, so this file opens with no network.
  What each one means for the Swift build is in atlas-map-prototype.md.

  Content comes from atlas-content.js: nine domains, one path down to a leaf Area, two Flows,
  seven Concepts. Every file:line is real as of 2026-09-01. The graph is derived from that
  content. A node's home domain is read off its anchor paths, and a Flow's path is its own
  steps mapped the same way.

  Colours, radii, spacing, elevation and durations come from
  apps/macOS/Packages/ArgoUI/Sources/ArgoUI/VisualContract/. Type is San Francisco only.
  A value marked INVENTED is prototype-only material that the contract does not name.
-->
<style>
  :root {
    /* GraphitePalette.swift — surface */
    --sunken:  #191A1D;
    --base:    #1E2024;
    --raised:  #252729;
    --overlay: #2E3136;
    --hover:      rgba(255,255,255,.045);
    --control:    rgba(255,255,255,.06);
    --selected:   rgba(255,255,255,.058);
    --marked:     rgba(255,255,255,.07);

    /* text */
    --text-1: #F2F4F6;
    --text-2: #A8AEB5;
    --text-3: #929AA1;
    --text-off: #4E545A;
    --on-accent: #05070A;

    /* edge */
    --hairline: rgba(255,255,255,.08);
    --subtle:   rgba(255,255,255,.13);
    --strong:   rgba(255,255,255,.22);

    /* interaction and state */
    --accent: #3E9BFF;
    --accent-bright: #6FB6FF;
    --selection-ground: #203146;
    --attention: #E8B24A;

    /* ArgoRadius.swift */
    --r-marker: 3px; --r-control: 6px; --r-popover: 12px;
    /* ArgoSpacing.swift */
    --s-tight: 4px; --s-snug: 6px; --s-base: 8px;
    --s-comfortable: 12px; --s-loose: 16px; --s-section: 24px; --s-region: 32px;
    /* ArgoElevation.swift */
    --e-popover: 0 8px 18px rgba(0,0,0,.34);
    /* ArgoMotion.swift */
    --m-selection: 140ms; --m-state: 180ms; --m-reveal: 220ms; --m-resettle: 280ms;
    --ease-out: cubic-bezier(.2,.7,.3,1);
    /* ArgoTypeScale.swift */
    --t-title2: 17px; --t-title3: 15px; --t-body: 13px; --t-callout: 12px;
    --t-subheadline: 11px; --t-footnote: 10px;

    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

    /* INVENTED — prototype-only. The contract names no canvas grid and no desktop ground. */
    --desktop: #0d0e10;
    --grid: rgba(255,255,255,.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--desktop); color: var(--text-1);
    font: var(--t-body)/1.45 var(--sans);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: var(--r-marker); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ================= shell ================= */
  #app {
    height: 100%;
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 352px;
    grid-template-rows: 46px minmax(0, 1fr);
    background: var(--base);
  }
  .bar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: var(--s-comfortable);
    padding: 0 var(--s-loose);
    border-bottom: 1px solid var(--hairline);
  }
  .brand {
    font: 600 var(--t-footnote)/1 var(--mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--text-3);
    padding-right: var(--s-comfortable); border-right: 1px solid var(--hairline);
  }
  .crumb { display: flex; align-items: center; gap: var(--s-snug); min-width: 0; }
  .crumb .alt { font: 600 9px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--text-off); }
  .crumb button { color: var(--text-2); padding: 2px 0; }
  .crumb button:hover { color: var(--text-1); }
  .crumb .here { color: var(--text-1); font-weight: 590; }
  .crumb .sep { color: var(--text-off); }
  .spacer { flex: 1; }
  .vname { font: var(--t-footnote)/1 var(--mono); color: var(--text-off); letter-spacing: .06em; }

  .ctl {
    font: var(--t-callout)/1 var(--sans);
    color: var(--text-2); background: var(--control);
    border: 1px solid var(--hairline); border-radius: var(--r-control);
    padding: 5px var(--s-base);
    transition: background var(--m-selection) var(--ease-out);
  }
  .ctl:hover:not(:disabled) { background: var(--hover); color: var(--text-1); }
  .ctl:disabled { color: var(--text-off); cursor: default; }
  .ctl.on { background: var(--selection-ground); color: var(--text-1); border-color: transparent; }

  /* ================= left rail ================= */
  .rail { border-right: 1px solid var(--hairline); padding: var(--s-loose) 0 var(--s-section); overflow-y: auto; }
  .rail h2 {
    font: 600 var(--t-footnote)/1 var(--mono);
    letter-spacing: .1em; text-transform: uppercase; color: var(--text-3);
    padding: 0 var(--s-loose) var(--s-base);
  }
  .rail section + section { margin-top: var(--s-section); }
  .rail .hint { padding: var(--s-base) var(--s-loose) 0; font: var(--t-footnote)/1.55 var(--sans); color: var(--text-off); }
  .rail .hint b { color: var(--text-3); font-weight: 590; }
  .chip {
    display: block; width: 100%; text-align: left;
    padding: var(--s-base) var(--s-loose); color: var(--text-2);
    transition: background var(--m-selection) var(--ease-out);
  }
  .chip:hover { background: var(--hover); color: var(--text-1); }
  .chip.on { background: var(--selection-ground); color: var(--text-1); }  /* the ground alone */
  .chip .cname { display: block; font-size: var(--t-body); }
  .chip .csub { display: block; margin-top: 2px; font: var(--t-footnote)/1.4 var(--mono); color: var(--text-off); }
  .chip.on .csub { color: var(--text-3); }

  /* ================= canvas ================= */
  .canvas {
    position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.022), transparent 70%), var(--sunken);
  }
  .canvas::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .legend {
    position: absolute; left: var(--s-loose); bottom: var(--s-loose);
    display: flex; gap: var(--s-loose); align-items: center;
    padding: var(--s-snug) var(--s-comfortable);
    background: var(--base); border: 1px solid var(--hairline); border-radius: var(--r-control);
    font: var(--t-footnote)/1 var(--mono); color: var(--text-3); letter-spacing: .04em;
  }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 1.5px solid var(--strong); vertical-align: middle; margin-right: 6px; }
  .legend .side i { border-top-style: dashed; }
  .legend .dep i { border-top-style: dotted; }
  .hintbar {
    position: absolute; right: var(--s-loose); bottom: var(--s-loose);
    font: var(--t-footnote)/1 var(--mono); color: var(--text-off);
  }

  /* ---- svg atoms, shared by all three charts ---- */
  .edge { fill: none; stroke: var(--subtle); stroke-width: 1.4;
          transition: stroke var(--m-state) var(--ease-out), opacity var(--m-state) var(--ease-out); }
  .edge.side    { stroke-dasharray: 5 4; }
  .edge.intent  { stroke-dasharray: 5 4; }
  .edge.depends { stroke-dasharray: 1.5 4; }
  .edge.inject  { stroke-dasharray: 1.5 4; stroke: var(--hairline); }
  .edge.hold    { stroke: var(--hairline); }
  .edge.lit     { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: none; opacity: 1; }
  .edge.dim     { opacity: .18; }

  .elabel { font: 9.5px/1.2 var(--mono); fill: var(--text-off); text-anchor: middle;
            transition: fill var(--m-state) var(--ease-out), opacity var(--m-state) var(--ease-out); }
  .elabel.lit { fill: var(--accent-bright); }
  .elabel.dim { opacity: .18; }

  .node { cursor: pointer; transition: opacity var(--m-state) var(--ease-out); }
  .node .bg {
    fill: var(--raised); stroke: var(--hairline); stroke-width: 1;
    transition: fill var(--m-selection) var(--ease-out), stroke var(--m-state) var(--ease-out);
  }
  .node:hover .bg { fill: var(--overlay); }
  .node.focus .bg, .node.lit .bg { fill: var(--selection-ground); stroke: transparent; }
  .node.dim { opacity: .34; }
  .node.thin .bg { fill: rgba(37,39,41,.55); stroke-dasharray: 3 3; }
  .node .nm { fill: var(--text-1); font: 590 var(--t-body)/1 var(--sans); }
  .node .alt { fill: var(--text-3); font: 600 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .node .ct { fill: var(--text-off); font: var(--t-footnote)/1 var(--mono); }
  .kindrule { stroke: var(--subtle); stroke-width: 1; }
  .kindrule.flow { stroke-dasharray: 4 3; }
  .kindrule.concept { stroke-dasharray: 1.5 3; }

  /* A badge numbers a real sequence only — the steps of one Flow. */
  .badge circle { fill: var(--accent); }
  .badge text { fill: var(--on-accent); font: 700 9px/1 var(--mono); text-anchor: middle; }
  .stalemark { fill: var(--attention); }

  .cluster rect { fill: rgba(255,255,255,.02); stroke: var(--hairline); }
  .cluster .clabel { fill: var(--text-3); font: 600 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }

  /* ================= right rail ================= */
  .panel { border-left: 1px solid var(--hairline); overflow-y: auto; padding: var(--s-section) var(--s-loose) var(--s-region); }
  .kindword {
    display: inline-block; font: 600 var(--t-footnote)/1 var(--mono);
    letter-spacing: .09em; text-transform: uppercase; color: var(--text-3);
    padding-bottom: 3px; border-bottom: 1px solid var(--subtle);
  }
  .kindword.flow { border-bottom-style: dashed; }
  .kindword.concept { border-bottom-style: dotted; }
  .panel h1 { font: 600 var(--t-title2)/1.25 var(--sans); margin: var(--s-comfortable) 0 var(--s-snug); letter-spacing: -.005em; }
  .panel .line { color: var(--text-2); font-size: var(--t-callout); line-height: 1.5; }
  .panel h3 {
    font: 600 var(--t-footnote)/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3); margin: var(--s-section) 0 var(--s-base);
    padding-bottom: var(--s-snug); border-bottom: 1px solid var(--hairline);
  }
  .panel p { color: var(--text-2); margin-bottom: var(--s-comfortable); }
  .panel p b { color: var(--text-1); font-weight: 590; }
  .panel p i { color: var(--text-1); font-style: italic; }
  code, .mk { font: 11.5px/1.4 var(--mono); background: var(--marked); border-radius: var(--r-marker); padding: 1px 4px; }
  .exits { display: flex; flex-direction: column; gap: 1px; }
  .exit { display: block; width: 100%; text-align: left; padding: var(--s-base) var(--s-snug);
          border-radius: var(--r-marker); transition: background var(--m-selection) var(--ease-out); }
  .exit:hover { background: var(--hover); }
  .exit .lbl { display: block; color: var(--text-2); font-size: var(--t-callout); }
  .exit:hover .lbl { color: var(--text-1); }
  .exit .loc { display: block; margin-top: 2px; font: 10.5px/1.4 var(--mono); color: var(--accent); word-break: break-all; }
  .exit .gone { color: var(--text-off); text-decoration: line-through; }
  .stale {
    display: inline-flex; align-items: center; gap: var(--s-snug);
    background: rgba(232,178,74,.16); border: 1px solid rgba(232,178,74,.5);
    border-radius: var(--r-marker); font: var(--t-footnote)/1 var(--mono);
    color: var(--attention); padding: 4px var(--s-snug);
  }
  .stalebox { margin-bottom: var(--s-comfortable); }
  .stalebox .why { color: var(--text-3); font-size: var(--t-callout); margin-top: var(--s-snug); line-height: 1.5; }
  .step { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: var(--s-base);
          padding: var(--s-base) 0; border-top: 1px solid var(--hairline); }
  .step:first-child { border-top: 0; }
  .step .n { font: 600 var(--t-footnote)/1.5 var(--mono); color: var(--text-off); }
  .step .t { font-size: var(--t-callout); color: var(--text-1); }
  .step .w { font: var(--t-footnote)/1.4 var(--mono); color: var(--text-3); margin-top: 3px; }
  .step:hover { background: var(--hover); }
  .none { color: var(--text-3); font-size: var(--t-callout); line-height: 1.55; }

  /* ================= switcher and toast ================= */
  .switch {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: var(--s-base);
    background: #fff; color: #111; border-radius: 999px;
    padding: 6px 6px 6px 14px; box-shadow: var(--e-popover);
    font: 12px/1 var(--sans); z-index: 40;
  }
  .switch button { width: 26px; height: 26px; border-radius: 999px; color: #111; background: rgba(0,0,0,.06); font-size: 14px; }
  .switch button:hover { background: rgba(0,0,0,.12); }
  #toast {
    position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(6px);
    background: var(--overlay); border: 1px solid var(--subtle); border-radius: var(--r-control);
    padding: var(--s-base) var(--s-comfortable); box-shadow: var(--e-popover);
    font-size: var(--t-callout); color: var(--text-1);
    opacity: 0; pointer-events: none; z-index: 50;
    transition: opacity var(--m-state) var(--ease-out), transform var(--m-state) var(--ease-out);
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  body[data-render="1"] .switch { display: none; }
</style>
</head>
<body>

<div id="app">
  <div class="bar">
    <span class="brand">Project Atlas</span>
    <nav class="crumb" id="crumb"></nav>
    <span class="spacer"></span>
    <span class="vname" id="vname"></span>
    <button class="ctl" id="back" onclick="back()">← Back</button>
  </div>
  <aside class="rail" id="rail"></aside>
  <main class="canvas" id="canvas"></main>
  <aside class="panel" id="panel"></aside>
</div>

<div class="switch">
  <button onclick="cycle(-1)" aria-label="Previous chart">‹</button>
  <span id="switch-label"></span>
  <button onclick="cycle(1)" aria-label="Next chart">›</button>
</div>
<div id="toast" role="status"></div>

<script src="vendor/d3.v7.min.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="atlas-content.js"></script>
<script>
/* ============================================================================
   THE GRAPH — derived from the atlas content, not drawn by hand.

   A node knows its home domain from its anchor paths. A Flow knows its path from its own
   steps, mapped the same way. So the chart cannot claim a relation that the content does not
   carry. A Flow that skips a domain shows that, and nobody tidies it away.

   The three relation kinds are the one hand-written part, because the content keeps them as
   prose. Each label is a phrase from the node's own "what leaves it" Claim.
   ========================================================================== */

const DIR_DOMAIN = {
  Discovery: 'find', Transcript: 'read', Session: 'read', Hub: 'join',
  Drive: 'drive', Companion: 'companion', Repository: 'ports', Paths: 'owned',
};
function domainOf(path) {
  if (path.startsWith('ArgoUI/')) return path.includes('CockpitPresentation') ? 'project' : 'surfaces';
  return DIR_DOMAIN[path.split('/')[1]] || null;
}

const DOMAINS = A.argo.inside;
const REL = [
  ['find', 'read', 'pipeline', 'the files that belong here'],
  ['read', 'join', 'pipeline', 'typed events, in batches'],
  ['join', 'project', 'pipeline', 'one reading per pass'],
  ['project', 'surfaces', 'pipeline', 'values, never live state'],
  ['surfaces', 'drive', 'intent', 'intents back'],
  ['drive', 'join', 'side', 'into the claim ledger'],
  ['companion', 'join', 'side', 'one closure, same ledger'],
  ['ports', 'join', 'side', 'joined on a branch name'],
];
const INJECTED = ['find', 'read', 'join', 'project', 'surfaces', 'drive', 'companion', 'ports'];
const REL_IN = {
  read: [
    ['read-lines', 'read-record', 'pipeline', 'complete lines'],
    ['read-record', 'read-reader', 'pipeline', 'one record'],
    ['read-reader', 'read-outcome', 'side', 'answered calls'],
    ['read-record', 'read-vocab', 'depends', ''],
    ['read-reader', 'read-vocab', 'depends', ''],
  ],
};

const FLOWS = A.argo.flows;
const CONCEPTS = A.argo.concepts;

/* A Flow's path across the map: its steps, in order, mapped to domains. A repeat collapses
   into one node that carries every step number that landed on it. */
function flowPath(id) {
  const seen = new Map();
  A[id].steps.forEach((s, i) => {
    const d = domainOf(s[2][0]);
    if (!d) return;
    if (!seen.has(d)) seen.set(d, []);
    seen.get(d).push(i + 1);
  });
  return seen;
}
function conceptHomes(id) {
  const out = new Set();
  (A[id].evidence || []).forEach(e => { const d = domainOf(e[0]); if (d) out.add(d); });
  return out;
}
const PATH = {}; FLOWS.forEach(f => { PATH[f] = flowPath(f); });
const HOME = {}; CONCEPTS.forEach(c => { HOME[c] = conceptHomes(c); });

/* ============================================================================
   STATE, URL, and the pieces that all three charts share.
   ========================================================================== */

const NAMES = {
  A: 'Pipeline — the system as a machine, opened in place',
  B: 'Orrery — the whole atlas in one circle',
  C: 'Field — one settled field, zoomed into',
};
const LIB = { A: 'dagre · layered', B: 'd3-hierarchy · radial', C: 'd3-force · simulation' };
const KEYS = ['A', 'B', 'C'];

const state = {
  variant: 'A',
  focus: 'argo',   // whose reading the panel shows
  open: null,      // which domain is opened in place
  overlay: null,   // a Flow or a Concept, lit across the map
  hover: null,
  len: 'short',
  trail: [],
  refreshed: {},
};

function readURL() {
  const q = new URLSearchParams(location.search);
  const v = (q.get('variant') || 'A').toUpperCase();
  state.variant = KEYS.includes(v) ? v : 'A';
  if (q.get('n') && A[q.get('n')]) state.focus = q.get('n');
  if (q.get('open') !== 'argo' && childrenOf(q.get('open')).length) state.open = q.get('open');
  if (q.get('overlay') && A[q.get('overlay')]) state.overlay = q.get('overlay');
  if (q.get('len') === 'long') state.len = 'long';
  if (q.get('render') === '1') document.body.dataset.render = '1';
  /* A URL that names a node opens what that node needs open, the way a click would. */
  if (state.focus !== 'argo' && childrenOf(state.focus).length) state.open = state.focus;
  else if (state.focus !== 'argo' && childrenOf(A[state.focus].parent || '').length) state.open = A[state.focus].parent;
}
function writeURL() {
  const q = new URLSearchParams();
  q.set('variant', state.variant);
  if (state.focus !== 'argo') q.set('n', state.focus);
  if (state.open) q.set('open', state.open);
  if (state.overlay) q.set('overlay', state.overlay);
  if (state.len === 'long') q.set('len', 'long');
  if (document.body.dataset.render === '1') q.set('render', '1');
  history.replaceState(null, '', '?' + q);
}

function containment(id) {
  const chain = [];
  for (let n = A[id]; n; n = n.parent ? A[n.parent] : null) chain.unshift(n);
  return chain;
}
function idOf(n) { return Object.keys(A).find(k => A[k] === n); }
function prose(n) { return (state.len === 'long' && n.long) ? n.long : n.short; }
function childrenOf(id) { return (A[id] && A[id].inside) || []; }

/* A stale Claim stays where it is. Argo offers a refresh. When the refresh cannot run, it
   says so and the Claim does not move. */
function staleClaim(n, key) {
  const s = n.stale && n.stale[key];
  if (!s) return null;
  if (state.refreshed[idOf(n) + ':' + key] === 'done') return null;
  return s;
}
function nodeStale(n) { return Object.keys(n.stale || {}).some(k => staleClaim(n, k)); }

function focusNode(id, remember = true) {
  if (!A[id]) return;
  if (remember && id !== state.focus) state.trail.push({ focus: state.focus, open: state.open });
  state.focus = id;
  state.len = 'short';
  /* The Project is never opened. It is the map. Only a Domain opens in place. */
  if (id !== 'argo' && childrenOf(id).length) state.open = id;
  else if (id === 'argo' || (state.open && !containment(id).some(n => idOf(n) === state.open))) state.open = null;
  render();
}
function back() {
  const p = state.trail.pop();
  if (!p) return;
  state.focus = p.focus; state.open = p.open; state.len = 'short';
  render();
}
function toggleOverlay(id) {
  state.overlay = state.overlay === id ? null : id;
  if (state.overlay) { state.focus = id; state.len = 'short'; }
  render();
}
function setLen(l) { state.len = l; render(); }
function refresh(nodeId, key) {
  const s = A[nodeId].stale[key];
  if (s.reason) { s.tried = true; toast('That refresh cannot run.'); }
  else { state.refreshed[nodeId + ':' + key] = 'done'; toast('The Claim is refreshed.'); }
  render();
}

let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3400);
}
function exitTo(path, line) {
  toast('Argo opens ' + path + ':' + line + ' in your editor. It never shows the file.');
}
function cycle(d) {
  state.variant = KEYS[(KEYS.indexOf(state.variant) + d + KEYS.length) % KEYS.length];
  render();
}
function hoverNode(id) { state.hover = id; }

/* ---------- what the map lights, when an overlay is on ---------- */
function overlayLit() {
  const o = state.overlay;
  if (!o) return null;
  const n = A[o];
  if (n.kind === 'flow') return { kind: 'flow', steps: PATH[o] };
  if (n.kind === 'concept') return { kind: 'concept', homes: HOME[o] };
  return null;
}
function litSets() {
  const lit = overlayLit();
  if (!lit) return { nodes: null, edges: new Set(), lit: null };
  const nodes = new Set(lit.kind === 'flow' ? [...lit.steps.keys()] : [...lit.homes]);
  const edges = new Set();
  if (lit.kind === 'flow') {
    const seq = [...lit.steps.keys()];
    for (let i = 0; i < seq.length - 1; i++) {
      edges.add(seq[i] + '>' + seq[i + 1]);
      edges.add(seq[i + 1] + '>' + seq[i]);
    }
  }
  return { nodes, edges, lit };
}

function wrap(text, chars, max = 3) {
  const words = String(text).split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > chars && cur) { lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  return lines.slice(0, max);
}
function countLine(id) {
  const n = A[id];
  if (id === 'owned') return 'goes into all eight';
  if (childrenOf(id).length) return childrenOf(id).length + ' areas inside';
  if (n.altitude === 'Domain') return 'one level only';
  return (n.anchors || []).length + ' exits';
}

/* ============================================================================
   THE READING — one panel shape for every node, at every altitude.
   ========================================================================== */

function panelHTML() {
  const id = state.focus, n = A[id];
  const out = [];
  out.push(`<span class="kindword ${n.kind}">${n.altitude}</span>`);
  out.push(`<h1>${n.name}</h1>`);
  out.push(`<div class="line">${n.line}</div>`);
  if (nodeStale(n)) out.push(`<div style="margin-top:var(--s-comfortable)"><span class="stale">◆ one Claim is stale</span></div>`);

  out.push(`<h3>The reading</h3>`);
  out.push(prose(n).map(p => `<p>${p}</p>`).join(''));
  if (n.long) {
    out.push(`<div style="display:flex;gap:var(--s-snug)">
      <button class="ctl ${state.len === 'short' ? 'on' : ''}" onclick="setLen('short')">Short</button>
      <button class="ctl ${state.len === 'long' ? 'on' : ''}" onclick="setLen('long')">Longer</button>
    </div>`);
  }
  if (n.kind === 'flow') out.push(stepsHTML(id, n));
  if (n.kind === 'concept') out.push(conceptHTML(id, n));
  if (n.kind === 'area') out.push(areaHTML(id, n));
  return out.join('');
}

function areaHTML(id, n) {
  const out = [];
  const kids = childrenOf(id);
  if (kids.length) {
    const s = staleClaim(n, 'order');
    out.push(`<h3>What is inside${s ? ' — the order is stale' : ''}</h3>`);
    if (s) out.push(staleBox(id, 'order', s));
    out.push((n.among || []).map(p => `<p>${p}</p>`).join(''));
  } else if (n.altitude === 'Domain') {
    out.push(`<h3>What is inside</h3>`);
    out.push(`<p class="none">Nobody wrote this level for this study. #650 asks for one path from
      top to bottom. <b>Reading the record</b> carries that path, and the other eight domains
      stop here. An empty node says so, and does not pretend to be a leaf.</p>`);
  }
  const sl = staleClaim(n, 'leaving');
  out.push(`<h3>What leaves it${sl ? ' — stale' : ''}</h3>`);
  if (sl) out.push(staleBox(id, 'leaving', sl));
  out.push((n.leaving || []).map(p => `<p>${p}</p>`).join(''));
  if (n.anchors) {
    out.push(`<h3>Exits into the code</h3>`);
    out.push(`<div class="exits">${n.anchors.map(a => exitHTML(a)).join('')}</div>`);
  }
  return out.join('');
}

function conceptHTML(id, n) {
  const out = [];
  const homes = [...HOME[id]];
  out.push(`<h3>Where it lives</h3>`);
  if (homes.length) {
    out.push(`<p>${homes.map(h => `<b>${A[h].name}</b>`).join(', ')}.</p>`);
    if (state.overlay !== id) out.push(`<button class="ctl" onclick="toggleOverlay('${id}')">Light it on the map</button>`);
  } else {
    out.push(`<p class="none">Nothing lights up, because the evidence points nowhere. That is the
      finding. It is not a gap in the chart.</p>`);
  }
  if (n.noneFound) {
    out.push(`<h3>None found</h3>`);
    out.push(`<p class="none">${n.noneFound}</p>`);
  }
  if (n.evidence && n.evidence.length) {
    out.push(`<h3>Evidence</h3>`);
    out.push(`<div class="exits">${n.evidence.map(e => exitHTML(e)).join('')}</div>`);
  }
  const s = staleClaim(n, 'evidence');
  if (s) out.push(staleBox(id, 'evidence', s));
  return out.join('');
}

function stepsHTML(id, n) {
  const out = [`<h3>Every step, in order</h3>`];
  n.steps.forEach((s, i) => {
    const d = domainOf(s[2][0]);
    out.push(`<div class="step">
      <div class="n">${String(i + 1).padStart(2, '0')}</div>
      <div><div class="t">${s[0]}</div>
        <div class="w">${d ? A[d].name : '—'}</div>
        <button class="exit" style="padding:var(--s-snug) 0 0" onclick="exitTo('${s[2][0]}', ${s[2][1]})">
          <span class="loc">${s[2][0]}:${s[2][1]}</span></button>
      </div></div>`);
  });
  if (state.overlay !== id) out.push(`<button class="ctl" onclick="toggleOverlay('${id}')">Light this path on the map</button>`);
  return out.join('');
}

function exitHTML(a) {
  const gone = a[3] === 'gone';
  return `<button class="exit" onclick="${gone
    ? `toast('The anchor is gone. Argo says so, and it keeps the Claim.')`
    : `exitTo('${a[0]}', ${a[1]})`}">
    <span class="lbl">${a[2] || ''}</span>
    <span class="loc ${gone ? 'gone' : ''}">${a[0]}:${a[1]}</span></button>`;
}

function staleBox(id, key, s) {
  return `<div class="stalebox">
    <span class="stale">◆ stale — ${s.what}</span>
    <div style="margin-top:var(--s-base)">
      <button class="ctl" onclick="refresh('${id}','${key}')">Refresh this Claim</button></div>
    ${s.tried && s.reason ? `<div class="why">The refresh cannot run. ${s.reason.replace(/\s+/g, ' ')}</div>` : ''}
  </div>`;
}

/* ============================================================================
   LEFT RAIL — the overlays. A Flow and a Concept are not places on the map. They are
   things that the map can be asked to show.
   ========================================================================== */

function railHTML() {
  const out = [];
  out.push(`<section><h2>Flows</h2>`);
  FLOWS.forEach(f => {
    const n = A[f];
    out.push(`<button class="chip ${state.overlay === f ? 'on' : ''}" onclick="toggleOverlay('${f}')">
      <span class="cname">${n.name}</span>
      <span class="csub">${n.steps.length} steps · ${PATH[f].size} domains</span></button>`);
  });
  out.push(`<div class="hint">A Flow is one path. When you light it, the map draws that path and
    numbers each node in the order that the Flow reaches it.</div></section>`);

  out.push(`<section><h2>Concepts</h2>`);
  CONCEPTS.forEach(c => {
    const n = A[c], homes = HOME[c];
    out.push(`<button class="chip ${state.overlay === c ? 'on' : ''}" onclick="toggleOverlay('${c}')">
      <span class="cname">${n.name}</span>
      <span class="csub">${homes.size ? homes.size + ' domains' : 'none found'}</span></button>`);
  });
  out.push(`<div class="hint">A Concept has no place of its own. It lights the domains that its
    own evidence points to. <b>Person</b> lights nothing, because the search found none.</div></section>`);
  return out.join('');
}

/* ============================================================================
   CHART A — PIPELINE, laid out by dagre.

   dagre ranks a directed graph and routes its edges. Position means dataflow and nothing
   else. In compound mode the opened domain becomes a cluster, and its Areas are laid out
   inside it by the same pass, so the drill step costs no second layout.
   ========================================================================== */

const A_W = 190, A_H = 104;

/* dagre cannot attach an edge to a cluster, so an opened domain hands its edges to the Areas
   that actually carry them. The content already says which: lines come in, the reader emits. */
const PORTS = { read: { entry: 'read-lines', exit: 'read-reader' } };

function openDomain() {
  const o = state.open;
  return (o && o !== 'argo' && childrenOf(o).length) ? o : null;
}

function graphA() {
  const open = openDomain();
  const port = (id, dir) => (id === open && PORTS[id]) ? PORTS[id][dir] : id;
  const g = new dagre.graphlib.Graph({ compound: true, multigraph: false });
  g.setGraph({ rankdir: 'TB', ranksep: 70, nodesep: 96, edgesep: 20, marginx: 30, marginy: 30 });
  g.setDefaultEdgeLabel(() => ({}));

  /* "What Argo owns" goes into all eight. It is a substrate, not a rank, so it stays out of
     the layered pass and gets a band of its own below the machine. */
  DOMAINS.filter(id => id !== 'owned').forEach(id => g.setNode(id, { width: A_W, height: A_H, id }));

  if (open) {
    childrenOf(open).forEach(k => {
      g.setNode(k, { width: 172, height: 58, id: k, child: true });
      g.setParent(k, open);
    });
    delete g.node(open).width;
    delete g.node(open).height;
  }

  REL.forEach(([a, b, kind, label]) => {
    const lines = wrap(label, 18, 2);
    g.setEdge(port(a, 'exit'), port(b, 'entry'),
      { kind, label, lines, width: 112, height: lines.length * 12, labelpos: 'c' });
  });

  if (open) {
    (REL_IN[open] || []).forEach(([a, b, kind, label]) => {
      g.setEdge(a, b, { kind, lines: label ? wrap(label, 14, 1) : [], width: label ? 84 : 0, height: label ? 12 : 0 });
    });
  }
  dagre.layout(g);
  return g;
}

function renderA() {
  const g = graphA();
  const { nodes: litNodes, edges: litEdges, lit } = litSets();
  const size = g.graph();
  const pad = 34;   /* room for the Project frame around everything dagre placed */
  const bandGap = 44, bandH = 66;
  const W = Math.max(size.width, 620) + pad * 2, H = size.height + pad * 2 + bandGap + bandH;
  const band = { x: pad, y: pad + size.height + bandGap, w: W - pad * 2, h: bandH };
  const line = d3.line().x(p => p.x + pad).y(p => p.y + pad).curve(d3.curveBasis);

  const inj = INJECTED.map(t => {
    const n = g.node(t);
    if (!n) return '';
    const x = n.x + pad;
    return `<path class="edge inject" d="M${x} ${band.y} V${n.y + n.height / 2 + pad}"/>`;
  }).join('');

  const edges = g.edges().map(e => {
    const d = g.edge(e);
    const on = litEdges.has(e.v + '>' + e.w);
    const dim = litNodes && !on;
    const label = d.lines && d.lines.length
      ? `<text class="elabel ${on ? 'lit' : ''} ${dim ? 'dim' : ''}" x="${d.x + pad}" y="${d.y + pad}">
          ${d.lines.map((l, i) => `<tspan x="${d.x + pad}" dy="${i ? 11 : 0}">${l}</tspan>`).join('')}</text>`
      : '';
    return `<path class="edge ${d.kind} ${on ? 'lit' : ''} ${dim ? 'dim' : ''}" d="${line(d.points)}"
      marker-end="url(#arw${on ? '-lit' : ''})"/>${label}`;
  }).join('');

  const clusterIds = openDomain() ? [openDomain()] : [];
  const boxes = clusterIds.map(id => {
    const n = g.node(id);
    return `<g class="cluster node ${state.focus === id ? 'focus' : ''}" data-id="${id}"
        onclick="focusNode('${id}')">
      <rect x="${n.x - n.width / 2 + pad}" y="${n.y - n.height / 2 + pad}"
        width="${n.width}" height="${n.height}" rx="8"/>
      <text class="alt clabel" x="${n.x - n.width / 2 + pad + 14}" y="${n.y - n.height / 2 + pad + 20}">Domain</text>
      <text class="nm" x="${n.x - n.width / 2 + pad + 14}" y="${n.y - n.height / 2 + pad + 40}">${A[id].name}</text>
      <text class="ct" x="${n.x - n.width / 2 + pad + 14}" y="${n.y - n.height / 2 + pad + 56}">${countLine(id)}</text>
    </g>`;
  }).join('');

  const nodes = g.nodes().filter(id => !clusterIds.includes(id)).map(id => {
    const n = g.node(id);
    return nodeBox(id, n.x - n.width / 2 + pad, n.y - n.height / 2 + pad, n.width, n.height, litNodes, lit, n.child);
  }).join('') + nodeBox('owned', band.x, band.y, band.w, band.h, litNodes, lit, false);

  const frame = `<g onclick="focusNode('argo')" style="cursor:pointer">
    <rect x="10" y="26" width="${W - 20}" height="${H - 36}" rx="10"
      fill="${state.focus === 'argo' ? 'rgba(32,49,70,.30)' : 'none'}" stroke="var(--hairline)"/>
    <text class="alt" x="26" y="18">Project</text>
    <text class="nm" x="76" y="19" style="font-size:14px">Argo</text>
    <text class="ct" x="122" y="19">9 domains · 2 flows · 7 concepts</text>
    ${nodeStale(A.argo) ? `<circle class="stalemark" cx="330" cy="15" r="3"/>` : ''}
  </g>`;

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 1 L7 4 L0 7 z" fill="rgba(255,255,255,.24)"/></marker>
        <marker id="arw-lit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 1 L7 4 L0 7 z" fill="#3E9BFF"/></marker>
      </defs>
      ${frame}${inj}${edges}${boxes}${nodes}
    </svg>
    ${legend()}
    <div class="hintbar">dagre · layered layout</div>`;
}

function nodeBox(id, x, y, w, h, litNodes, lit, small) {
  const n = A[id];
  const on = litNodes && litNodes.has(id);
  const dim = litNodes && !on;
  const steps = lit && lit.kind === 'flow' ? lit.steps.get(id) : null;
  const nameLines = wrap(n.name, small ? 24 : 19, 2);
  const nameY = small ? 22 : 46;
  const subY = nameY + (nameLines.length - 1) * 16 + 16;
  const roomForCount = subY <= h - 8;   /* a short box drops the count rather than overlap */
  return `<g class="node ${state.focus === id ? 'focus' : ''} ${on ? 'lit' : ''} ${dim ? 'dim' : ''}"
      data-id="${id}" transform="translate(${x} ${y})"
      onclick="event.stopPropagation();focusNode('${id}')"
      onmouseenter="hoverNode('${id}')" onmouseleave="hoverNode(null)">
    <rect class="bg" width="${w}" height="${h}" rx="6"/>
    ${small ? '' : `<text class="alt" x="14" y="20">${n.altitude}</text>
      <line class="kindrule ${n.kind}" x1="14" y1="26" x2="48" y2="26"/>`}
    <text class="nm" x="14" y="${nameY}" ${small ? 'style="font-size:12px"' : ''}>${
      nameLines.map((l, i) => `<tspan x="14" dy="${i ? 16 : 0}">${l}</tspan>`).join('')}</text>
    ${roomForCount ? `<text class="ct" x="14" y="${subY}">${
      small ? (n.anchors || []).length + ' exits' : countLine(id)}</text>` : ''}
    ${nodeStale(n) ? `<circle class="stalemark" cx="${w - 13}" cy="15" r="3"/>` : ''}
    ${steps ? `<g class="badge" transform="translate(${w - 16} ${h - 16})">
      <circle r="9"/><text y="3">${steps.join(',')}</text></g>` : ''}
  </g>`;
}

function legend() {
  return `<div class="legend">
    <span><i></i>pipeline</span>
    <span class="side"><i></i>attaches at the side</span>
    <span class="dep"><i></i>depends on</span>
  </div>`;
}

/* ============================================================================
   CHART B — ORRERY, laid out by d3.cluster in polar coordinates.

   d3-hierarchy places containment. The Project sits at the centre, the nine domains sit on
   a ring, and the Areas of the opened domain sit on an outer ring. Relation edges cross the
   middle as bundled curves, so the whole atlas fits in one circle with no scrolling.
   ========================================================================== */

const B_W = 1180, B_H = 1080, B_R1 = 292, B_R2 = 466;

function layoutB() {
  const kids = openDomain() ? childrenOf(openDomain()) : [];
  const root = d3.hierarchy({
    id: 'argo',
    children: DOMAINS.map(id => ({
      id,
      children: (id === openDomain() ? kids.map(k => ({ id: k })) : []),
    })),
  });
  d3.cluster().size([2 * Math.PI, B_R2]).separation((a, b) => (a.parent === b.parent ? 1 : 1.5))(root);

  const pos = {};
  root.each(d => {
    const angle = d.x - Math.PI / 2;
    /* d3.cluster puts every leaf on the outer ring. The atlas wants one ring per altitude. */
    const r = d.depth === 0 ? 0 : d.depth === 1 ? B_R1 : B_R2;
    pos[d.data.id] = { cx: B_W / 2 + Math.cos(angle) * r, cy: B_H / 2 + Math.sin(angle) * r, depth: d.depth };
  });
  return pos;
}

function renderB() {
  const pos = layoutB();
  const { nodes: litNodes, edges: litEdges, lit } = litSets();
  const cx = B_W / 2, cy = B_H / 2;

  const chord = (a, b) => {
    const p = pos[a], q = pos[b];
    if (!p || !q) return null;
    const mx = (p.cx + q.cx) / 2, my = (p.cy + q.cy) / 2, t = .45;
    return `M${p.cx} ${p.cy} Q${mx + (cx - mx) * t} ${my + (cy - my) * t} ${q.cx} ${q.cy}`;
  };

  const spokes = DOMAINS.map(id =>
    `<path class="edge hold" d="${chord('argo', id)}" opacity=".6"/>`).join('');

  const rings = `<circle cx="${cx}" cy="${cy}" r="${B_R1}" fill="none" stroke="var(--hairline)"/>
    ${openDomain() ? `<circle cx="${cx}" cy="${cy}" r="${B_R2}" fill="none" stroke="var(--hairline)" stroke-dasharray="2 6"/>` : ''}`;

  const edges = REL.map(([a, b, kind, label]) => {
    const d = chord(a, b);
    if (!d) return '';
    const on = litEdges.has(a + '>' + b), dim = litNodes && !on;
    return `<path class="edge ${kind} ${on ? 'lit' : ''} ${dim ? 'dim' : ''}" d="${d}"><title>${label}</title></path>`;
  }).join('');

  const kidEdges = openDomain() ? (REL_IN[openDomain()] || []).map(([a, b, kind]) => {
    const d = chord(a, b);
    return d ? `<path class="edge ${kind}" d="${d}"/>` : '';
  }).join('') : '';

  const centre = (() => {
    const r = 78;
    return `<g class="node ${state.focus === 'argo' ? 'focus' : ''}" data-id="argo"
        onclick="focusNode('argo')" onmouseenter="hoverNode('argo')" onmouseleave="hoverNode(null)">
      <circle class="bg" cx="${cx}" cy="${cy}" r="${r}"/>
      <text class="alt" x="${cx}" y="${cy - 18}" text-anchor="middle">Project</text>
      <line class="kindrule" x1="${cx - 17}" y1="${cy - 12}" x2="${cx + 17}" y2="${cy - 12}"/>
      <text class="nm" x="${cx}" y="${cy + 8}" text-anchor="middle" style="font-size:19px">Argo</text>
      <text class="ct" x="${cx}" y="${cy + 28}" text-anchor="middle">9 domains</text>
      ${nodeStale(A.argo) ? `<circle class="stalemark" cx="${cx}" cy="${cy + 46}" r="3"/>` : ''}
    </g>`;
  })();

  const nodes = Object.keys(pos).filter(id => id !== 'argo').map(id => {
    const p = pos[id];
    const small = p.depth === 2;
    const w = small ? 142 : 156, h = small ? 46 : 74;
    return nodeBox(id, p.cx - w / 2, p.cy - h / 2, w, h, litNodes, lit, small);
  }).join('');

  return `<svg viewBox="0 0 ${B_W} ${B_H}" preserveAspectRatio="xMidYMid meet">
      ${rings}${spokes}${edges}${kidEdges}${centre}${nodes}
    </svg>
    ${legend()}
    <div class="hintbar">d3-hierarchy · radial cluster · hover a chord for what crosses it</div>`;
}

/* ============================================================================
   CHART C — FIELD, settled by d3-force.

   Every node in the atlas is here at once: the Project, the nine domains, the five Areas,
   the two Flows and the seven Concepts. A Concept has no place of its own, so the links to
   the domains of its evidence pull it between them. That position is a result, not a
   decision. Scroll to zoom, and drag to pan, through d3.zoom.
   ========================================================================== */

const C_W = 1200, C_H = 860;
let FIELD = null, ZOOM = null, CT = d3.zoomIdentity;

function layoutC() {
  if (FIELD) return FIELD;
  const ids = Object.keys(A);
  const nodes = ids.map(id => {
    const n = A[id];
    const weight = (n.inside || []).length * 2 + (n.anchors || []).length
      + (n.evidence || []).length + (n.steps || []).length;
    return { id, kind: n.kind, r: id === 'argo' ? 50 : Math.max(18, Math.min(40, 18 + weight * 2)) };
  });
  const links = [];
  ids.forEach(id => { if (A[id].parent) links.push({ source: A[id].parent, target: id, type: 'hold', d: 150 }); });
  REL.forEach(([a, b]) => links.push({ source: a, target: b, type: 'pipeline', d: 200 }));
  (REL_IN.read || []).forEach(([a, b, k]) => links.push({ source: a, target: b, type: k, d: 120 }));
  CONCEPTS.forEach(c => HOME[c].forEach(d => links.push({ source: c, target: d, type: 'depends', d: 160 })));
  FLOWS.forEach(f => [...PATH[f].keys()].forEach(d => links.push({ source: f, target: d, type: 'depends', d: 210 })));

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.d).strength(.34))
    .force('charge', d3.forceManyBody().strength(-860))
    .force('collide', d3.forceCollide().radius(d => d.r + 26).strength(.9))
    .force('x', d3.forceX(C_W / 2).strength(.08))
    .force('y', d3.forceY(C_H / 2).strength(.09))
    .stop();
  sim.tick(520);
  FIELD = { nodes, links, byId: Object.fromEntries(nodes.map(n => [n.id, n])) };
  return FIELD;
}

function renderC() {
  const F = layoutC();
  const { nodes: litNodes0, lit } = litSets();
  const litNodes = litNodes0 ? new Set([state.overlay, ...litNodes0]) : null;
  const k = CT.k;

  const edges = F.links.map(l => {
    const a = l.source.id || l.source, b = l.target.id || l.target;
    const on = litNodes && litNodes.has(a) && litNodes.has(b);
    const dim = litNodes && !on;
    return `<line class="edge ${l.type} ${on ? 'lit' : ''} ${dim ? 'dim' : ''}"
      x1="${l.source.x}" y1="${l.source.y}" x2="${l.target.x}" y2="${l.target.y}"/>`;
  }).join('');

  const nodes = F.nodes.map(d => {
    const n = A[d.id];
    const on = litNodes && litNodes.has(d.id), dim = litNodes && !on;
    const steps = lit && lit.kind === 'flow' ? lit.steps.get(d.id) : null;
    const big = n.altitude === 'Project' || n.altitude === 'Domain';
    const show = big || k >= .95 || on;
    const nm = wrap(n.name, 17, 2);
    return `<g class="node ${n.kind !== 'area' ? 'thin' : ''} ${state.focus === d.id ? 'focus' : ''}
        ${on ? 'lit' : ''} ${dim ? 'dim' : ''}" data-id="${d.id}"
        onclick="focusNode('${d.id}')" onmouseenter="hoverNode('${d.id}')" onmouseleave="hoverNode(null)">
      <circle class="bg" cx="${d.x}" cy="${d.y}" r="${d.r}"/>
      <text class="alt" x="${d.x}" y="${d.y + 4}" text-anchor="middle">${n.kind === 'area' ? '' : n.altitude}</text>
      ${nodeStale(n) ? `<circle class="stalemark" cx="${d.x + d.r * .72}" cy="${d.y - d.r * .72}" r="3.2"/>` : ''}
      ${show ? `<text class="nm" x="${d.x}" y="${d.y + d.r + 15}" text-anchor="middle"
        style="font-size:${big ? 12.5 : 11}px">${nm.map((l, i) =>
          `<tspan x="${d.x}" dy="${i ? 13 : 0}">${l}</tspan>`).join('')}</text>` : ''}
      ${steps ? `<g class="badge" transform="translate(${d.x + d.r * .7} ${d.y + d.r * .7})">
        <circle r="9"/><text y="3">${steps.join(',')}</text></g>` : ''}
    </g>`;
  }).join('');

  return `<svg id="csvg" viewBox="0 0 ${C_W} ${C_H}" preserveAspectRatio="xMidYMid meet">
      <g id="cworld" transform="${CT}">${edges}${nodes}</g>
    </svg>
    ${legend()}
    <div class="hintbar">d3-force · scroll to zoom · drag to pan · ${k.toFixed(2)}×</div>`;
}

function bindC() {
  const svg = d3.select('#csvg');
  ZOOM = d3.zoom().scaleExtent([.6, 3.4]).on('zoom', e => {
    CT = e.transform;
    d3.select('#cworld').attr('transform', CT);
    const hb = document.querySelector('.hintbar');
    if (hb) hb.textContent = 'd3-force · scroll to zoom · drag to pan · ' + CT.k.toFixed(2) + '×';
  });
  svg.call(ZOOM).call(ZOOM.transform, CT);
}

/* ============================================================================
   RENDER
   ========================================================================== */

const CHART = { A: renderA, B: renderB, C: renderC };

function render() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = CHART[state.variant]();
  if (state.variant === 'C') bindC();

  document.getElementById('rail').innerHTML = railHTML();
  document.getElementById('panel').innerHTML = panelHTML();
  document.getElementById('panel').scrollTop = 0;

  const chain = containment(state.focus);
  document.getElementById('crumb').innerHTML = chain.map((n, i) => `
    <span class="alt">${n.altitude}</span>
    <button class="${i === chain.length - 1 ? 'here' : ''}" onclick="focusNode('${idOf(n)}')">${n.name}</button>
    ${i < chain.length - 1 ? '<span class="sep">›</span>' : ''}`).join('');
  document.getElementById('back').disabled = !state.trail.length;
  document.getElementById('vname').textContent = LIB[state.variant];
  document.getElementById('switch-label').textContent =
    state.variant + ' · ' + NAMES[state.variant].split(' — ')[0];
  writeURL();
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'Escape') { if (state.overlay) { state.overlay = null; render(); } else back(); }
});

readURL();
render();
</script>
</body>
</html>
