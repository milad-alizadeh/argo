<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas · one surface</title>
<link rel="stylesheet" href="atlas-tokens.css">
<style>
  /* ---- page overrides of the token contract ------------------------------
     Two values in atlas-tokens.css cannot carry text on this canvas:
     --text-off (#4E545A) is 2.5:1 on --desktop, below the 4.5:1 floor, and
     --t-footnote (10px) is below this page's 11px floor. --text-off survives
     only as a stroke on non-text marks. */
  :root { --t-footnote: 11px; }

  /* ---- shell ------------------------------------------------------------ */
  body { overflow: hidden; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  header.bar {
    display: flex; align-items: stretch; gap: var(--s-loose);
    padding: 0 var(--s-section); background: var(--base);
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; flex-direction: column; justify-content: center; padding: 10px 0; min-width: 132px; }
  .brand b { font-size: var(--t-title3); font-weight: 590; letter-spacing: -.01em; }
  .brand span { font-size: var(--t-footnote); color: var(--text-3); }

  nav.aspects { display: flex; align-items: stretch; }
  nav.aspects button {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 9px var(--s-base); text-align: left; min-width: 112px;
    border-radius: var(--r-control); margin: var(--s-snug) 2px;
    transition: background var(--m-selection) var(--ease-out);
  }
  nav.aspects button:hover { background: var(--hover); }
  nav.aspects button[aria-current="true"] { background: var(--selected); }
  nav.aspects b { font-size: var(--t-callout); font-weight: 590; color: var(--text-2); }
  nav.aspects button[aria-current="true"] b { color: var(--text-1); }
  nav.aspects span { font-size: var(--t-footnote); color: var(--text-3); }
  nav.aspects button[aria-current="true"] span { color: var(--text-3); }

  .scale { display: flex; align-items: center; gap: var(--s-comfortable); margin-left: auto; }
  .scale-label { font-size: var(--t-footnote); color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
  .rungs { display: flex; gap: 2px; padding: 3px; background: var(--sunken); border-radius: var(--r-control); }
  .rungs button {
    padding: 5px 11px; border-radius: var(--r-marker); font-size: var(--t-callout); color: var(--text-3);
    transition: background var(--m-selection) var(--ease-out), color var(--m-selection) var(--ease-out);
  }
  .rungs button:hover { color: var(--text-2); }
  .rungs button[aria-current="true"] { background: var(--marked); color: var(--text-1); }
  .rungs button b { font-weight: 590; }
  .rungs button i { font-style: normal; color: var(--text-3); margin-right: 6px; font-family: var(--mono); font-size: var(--t-footnote); }
  .rungs button[aria-current="true"] i { color: var(--text-3); }

  .routes-btn { align-self: center; font-size: var(--t-callout); color: var(--text-2);
                border: 1px solid var(--subtle); border-radius: var(--r-control); padding: 5px 11px; }
  .routes-btn:hover { background: var(--hover); color: var(--text-1); }
  .routes-btn[aria-expanded="true"] { background: var(--selected); color: var(--text-1); }

  /* ---- routes menu ------------------------------------------------------- */
  #routemenu { position: absolute; right: var(--s-section); top: 58px; z-index: 30; width: 460px;
               background: var(--overlay); border: 1px solid var(--subtle); border-radius: var(--r-popover);
               box-shadow: var(--e-popover); padding: var(--s-base); }
  #routemenu[hidden] { display: none; }
  #routemenu h4 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em;
                  color: var(--text-3); padding: var(--s-base) var(--s-base) var(--s-snug); }
  #routemenu button { display: block; width: 100%; text-align: left; padding: var(--s-base) var(--s-comfortable);
                      border-radius: var(--r-control); }
  #routemenu button:hover { background: var(--hover); }
  #routemenu b { font-size: var(--t-callout); font-weight: 590; }
  #routemenu span { display: block; font-size: var(--t-footnote); color: var(--text-3); margin-top: 2px; }
  #routemenu em { font-style: normal; font-size: var(--t-footnote); color: var(--text-3); }

  /* ---- body ------------------------------------------------------------- */
  /* The fold marker has a row of its own, so it can never sit over a figure. */
  main { display: grid; grid-template-columns: 1fr auto; grid-template-rows: minmax(0, 1fr) auto;
         min-height: 0; position: relative; }
  #stage { grid-area: 1 / 1; }
  #foldbar { grid-area: 2 / 1; height: 30px; display: flex; align-items: center; justify-content: center; }
  /* The panel and the Ask block are siblings in one column, so the Ask block is
     outside the panel's scroll flow and can never sit over panel content. */
  #side { grid-area: 1 / 2 / span 2 / auto; display: flex; flex-direction: column;
          width: 396px; min-height: 0; border-left: 1px solid var(--hairline); }
  #fold { font-size: var(--t-footnote); color: var(--text-3); background: var(--overlay);
          border: 1px solid var(--hairline); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  #fold[hidden] { display: none; }
  #stage { overflow-x: auto; overflow-y: scroll; scrollbar-gutter: stable; position: relative; }
  /* the fold pill sits in reserved ground, never over the figure */
  #stage .inner { padding: var(--s-section) var(--s-region) var(--s-loose); display: inline-block; min-width: 100%; }
  .rung-title { margin-bottom: var(--s-loose); max-width: 820px; }
  .rung-title h1 { font-size: var(--t-title2); font-weight: 590; letter-spacing: -.015em; }
  .rung-title p { font-size: var(--t-body); color: var(--text-2); margin-top: 3px; }
  .rung-title p em { font-style: normal; color: var(--text-3); }

  /* ---- panel ------------------------------------------------------------ */
  aside#panel {
    background: var(--base); position: relative;
    display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  }
  /* the scroll edge rides the scroll area itself, so it lands wherever that area
     ends, and it is drawn only while the column continues past it */
  .p-body.continues { mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), rgba(0,0,0,.12) 100%); }
  /* The two disclosures every kind carries are chrome, not content, so they sit
     in a foot that never scrolls: no reader has to find out they exist. */
  .p-foot { flex: 0 0 auto; display: flex; gap: 5px; background: var(--base);
            border-top: 1px solid var(--hairline); padding: var(--s-base) var(--s-section); }
  .p-foot .disc { margin-top: 0; flex: 1 1 0; min-width: 0;
                  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-snug); }
  .p-foot .disc i { float: none; flex: 0 0 auto; }
  /* the header is pinned: name, kind and close never scroll away */
  .p-head { flex: 0 0 auto; padding: var(--s-comfortable) var(--s-section);
            border-bottom: 1px solid var(--hairline); background: var(--base); }
  .p-body { overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
            padding: var(--s-comfortable) var(--s-section) var(--s-loose); flex: 1 1 auto; min-height: 0; }
  .p-kind { font-size: var(--t-footnote); color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; }
  .p-name { font-size: var(--t-title3); font-weight: 590; margin: 4px 0 0; letter-spacing: -.01em; }
  .p-meta { font: var(--t-footnote)/1.4 var(--mono); color: var(--text-3); margin-top: 3px; word-break: break-all; }
  .p-line { font-size: var(--t-callout); color: var(--text-2); }
  .p-sec { margin-top: var(--s-loose); }
  .p-sec h3 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin-bottom: var(--s-base); }
  .p-sec p { font-size: var(--t-callout); color: var(--text-2); margin-bottom: var(--s-base); }
  .p-sec p:last-child { margin-bottom: 0; }
  .p-fact { display: flex; gap: var(--s-base); font-size: var(--t-footnote); color: var(--text-3); margin-bottom: 4px; }
  .p-fact b { color: var(--text-2); font-weight: 400; min-width: 44px; }
  .p-fact .path { font-family: var(--mono); color: var(--text-3); word-break: break-word; }
  .anchor { font-family: var(--mono); font-size: var(--t-footnote); color: var(--text-3); word-break: break-all; margin-bottom: 2px; }
  .anchor b { color: var(--text-2); font-weight: 400; }
  .anchor + .what { font-size: var(--t-footnote); color: var(--text-3); margin-bottom: var(--s-base); }
  .edge-item { display: flex; gap: var(--s-base); font-size: var(--t-footnote); color: var(--text-3); margin-bottom: 5px; align-items: baseline; }
  .edge-item .to { color: var(--text-2); white-space: nowrap; }
  .p-close { float: right; font-size: var(--t-callout); color: var(--text-3); padding: 2px 6px; border-radius: var(--r-marker); }
  .p-close:hover { background: var(--hover); color: var(--text-1); }
  a.xlink { color: var(--accent); text-decoration: none; cursor: pointer; }
  a.xlink:hover { color: var(--accent-bright); text-decoration: underline; }
  .disc { display: block; width: 100%; text-align: left; margin-top: var(--s-base);
          border: 1px solid var(--hairline); border-radius: var(--r-control);
          padding: 6px var(--s-comfortable); font-size: var(--t-footnote); color: var(--text-3); }
  .disc:hover { background: var(--hover); color: var(--text-1); }
  .disc[aria-expanded="true"] { color: var(--text-1); background: var(--control); }
  .disc i { font-style: normal; color: var(--text-3); float: right; }
  .p-empty { font-size: var(--t-callout); color: var(--text-3); }

  /* ---- ask -------------------------------------------------------------- */
  #askdock { flex: 0 0 auto; }
  .ask { border-top: 1px solid var(--hairline); background: var(--sunken);
         padding: var(--s-comfortable) var(--s-section) var(--s-comfortable); }
  .ask h3 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em; color: var(--text-3);
            display: flex; justify-content: space-between; gap: var(--s-base); }
  .ask .honest { font-size: var(--t-footnote); color: var(--text-3); margin-top: 4px; line-height: 1.45; }
  .ask .subj { font-size: var(--t-footnote); color: var(--text-3); margin-top: var(--s-base); }
  .ask .subj b { color: var(--text-2); font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: var(--s-base); }
  .chips button { font-size: var(--t-footnote); border: 1px solid var(--hairline); border-radius: var(--r-marker);
                  padding: 3px 7px; color: var(--text-2); background: var(--raised); }
  .chips button:hover { border-color: var(--accent); color: var(--accent-bright); }
  .chips button[disabled] { opacity: .38; cursor: default; border-color: var(--hairline); color: var(--text-off); }
  .ask-row { display: flex; gap: var(--s-base); margin-top: var(--s-base); }
  .ask-row input { flex: 1 1 auto; min-width: 0; background: var(--raised); border: 1px solid var(--subtle);
                   border-radius: var(--r-control); padding: 6px var(--s-base); color: var(--text-1);
                   font: var(--t-callout)/1.4 var(--sans); }
  .ask-row input:focus { outline: 2px solid var(--accent-bright); outline-offset: 0; }
  .ask-row button { border: 1px solid var(--subtle); border-radius: var(--r-control); padding: 5px 12px;
                    font-size: var(--t-callout); background: var(--control); }
  .ask-row button:hover { background: var(--hover); }
  /* The answer slot is reserved whether or not there is an answer, so a chip
     never moves out from under the pointer that is about to click the next one. */
  .slot { margin-top: var(--s-base); height: 80px; overflow: auto; overscroll-behavior: contain;
          border-left: 2px solid var(--hairline); padding-left: var(--s-comfortable); }
  .slot.live { border-left-color: var(--accent); }
  .slot .idle { font-size: var(--t-footnote); color: var(--text-3); line-height: 1.45; }
  .answer .q { font-size: var(--t-footnote); color: var(--text-3); margin-bottom: 5px; }
  .names { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .answer p { font-size: var(--t-callout); color: var(--text-2); margin-bottom: var(--s-base); overflow-wrap: anywhere; }
  .answer .none { color: var(--attention); }
  .answer h4 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em;
               color: var(--text-3); margin: var(--s-comfortable) 0 5px; }

  /* ---- route chrome ------------------------------------------------------ */
  .r-bar { display: flex; align-items: center; gap: var(--s-base); padding: var(--s-comfortable) var(--s-section);
           border-bottom: 1px solid var(--hairline); background: var(--overlay); flex: 0 0 auto; }
  .r-bar .title { font-size: var(--t-callout); font-weight: 590; }
  .r-bar .count { font: var(--t-footnote)/1 var(--mono); color: var(--text-3); }
  .ticks { display: flex; gap: 3px; margin-left: auto; }
  .tick { width: 11px; height: 3px; border-radius: 2px; background: var(--subtle); }
  .tick.done { background: var(--text-off); }
  .tick.now { background: var(--accent); }
  .r-body h2 { font-size: 19px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; margin: var(--s-comfortable) 0; }
  .r-body p { color: var(--text-2); font-size: var(--t-body); line-height: 1.55; margin-bottom: var(--s-comfortable); }
  .r-view { font: var(--t-footnote)/1.5 var(--sans); color: var(--text-3); margin-top: var(--s-loose);
            border-top: 1px solid var(--hairline); padding-top: var(--s-base); word-break: break-word; }
  .src { margin-top: var(--s-comfortable); font: var(--t-footnote)/1.5 var(--mono); color: var(--text-3); word-break: break-all; }
  .src b { color: var(--text-3); font-weight: 400; }
  .r-foot { flex: 0 0 auto; display: flex; align-items: center; gap: var(--s-base); flex-wrap: wrap;
            padding: var(--s-comfortable) var(--s-section); border-top: 1px solid var(--hairline); background: var(--overlay); }
  .nav { border: 1px solid var(--subtle); border-radius: var(--r-control); padding: 5px 13px;
         font-size: var(--t-callout); color: var(--text-1); background: var(--control); }
  .nav:hover:not([disabled]) { background: var(--hover); }
  .nav[disabled] { opacity: .35; cursor: default; }
  .nav.primary { background: var(--selection-ground); border-color: var(--accent); }
  .r-foot .leave { margin-left: auto; font-size: var(--t-footnote); color: var(--text-3); padding: 4px 8px; border-radius: var(--r-marker); }
  .r-foot .leave:hover { background: var(--hover); color: var(--text-1); }
  .r-foot .hint { flex-basis: 100%; font: var(--t-footnote)/1.4 var(--sans); color: var(--text-3); }
  .r-end { margin-top: var(--s-loose); border-top: 1px solid var(--subtle); padding-top: var(--s-comfortable); }
  .r-end h3 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em; color: var(--accent); }
  .r-end p { margin-top: var(--s-base); }
  .r-next { margin-top: var(--s-base); }

  /* ---- context strip ----------------------------------------------------- */
  .strip { display: flex; gap: var(--s-base); align-items: stretch; margin-bottom: var(--s-loose); flex-wrap: wrap; }
  .strip .up { padding: 7px var(--s-comfortable); border-radius: var(--r-control); border: 1px solid var(--subtle);
               font-size: var(--t-callout); color: var(--text-2); background: var(--raised); }
  .strip .up:hover { background: var(--overlay); color: var(--text-1); }
  .ctx-item { padding: 7px var(--s-comfortable); border-radius: var(--r-control); border: 1px solid var(--hairline);
              background: transparent; text-align: left; opacity: .5;
              transition: opacity var(--m-state) var(--ease-out), background var(--m-state) var(--ease-out); }
  .ctx-item:hover { opacity: 1; background: var(--hover); }
  .ctx-item[data-sel] { cursor: default; }     /* it has nothing inside to open */
  .ctx-item b { display: block; font-size: var(--t-callout); font-weight: 590; color: var(--text-2); }
  .ctx-item i { display: block; font-style: normal; font-size: var(--t-footnote); color: var(--text-3); margin-top: 1px; }
  .ctx-item[aria-current="true"] { opacity: 1; background: var(--selection-ground); border-color: var(--subtle); }
  .ctx-item[aria-current="true"] b { color: var(--text-1); }
  .strip-note { align-self: center; font-size: var(--t-footnote); color: var(--text-3); }

  /* ---- legend ----------------------------------------------------------- */
  footer.legend {
    display: flex; gap: var(--s-section); align-items: flex-start; flex-wrap: wrap;
    padding: var(--s-comfortable) var(--s-region); background: var(--base);
    border-top: 1px solid var(--hairline); font-size: var(--t-footnote); color: var(--text-3);
  }
  .leg-group { display: flex; gap: var(--s-loose); align-items: flex-start; }
  .leg-group > h4 { font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); padding-top: 2px; min-width: 58px; }
  .leg-item { display: flex; gap: 7px; align-items: center; max-width: 260px; }
  .leg-item span { color: var(--text-3); }
  .leg-note { color: var(--text-3); max-width: 420px; line-height: 1.5; }

  /* ---- svg -------------------------------------------------------------- */
  svg.fig { display: block; }
  svg.fig text { fill: var(--text-1); }
  .t-name { font: 590 13px var(--sans); fill: var(--text-1); }
  .t-name-sm { font: 590 12px var(--sans); fill: var(--text-1); }
  .t-line { font: 400 11px var(--sans); fill: var(--text-2); }
  .t-edge { font: 400 11px var(--sans); fill: var(--text-2); }
  .t-meta { font: 400 11px var(--sans); fill: var(--text-3); }
  .t-path { font: 400 11px var(--mono); fill: var(--text-3); }
  .t-cap  { font: 590 11px var(--sans); fill: var(--text-3); letter-spacing: .07em; }
  .t-prose{ font: 400 11px var(--sans); fill: var(--text-3); }
  .t-num  { font: 590 11px var(--mono); fill: var(--text-3); }

  .box  { fill: var(--raised); stroke: var(--subtle); stroke-width: 1; }
  .box.sys { fill: var(--overlay); stroke: var(--strong); }
  .box.ext { fill: none; stroke: var(--subtle); stroke-dasharray: 3 3; }
  .box.grp { fill: rgba(255,255,255,.022); stroke: var(--hairline); }
  .box.cmp { fill: var(--overlay); stroke: none; }
  .box.band{ fill: var(--sunken); stroke: var(--hairline); }
  .box.ghost { fill: none; stroke: var(--hairline); stroke-dasharray: 2 4; }
  .box.over { fill: none; stroke: var(--subtle); stroke-dasharray: 3 3; }
  .box.sel { fill: var(--selection-ground); stroke: var(--subtle); }
  .box.cmp.sel { fill: var(--selection-ground); }
  /* only .hit rects take a click, so no glyph or plate can shadow a box */
  svg.fig text, svg.fig path, svg.fig circle, svg.fig rect:not(.hit) { pointer-events: none; }
  .hit { fill: transparent; cursor: default; }
  .hit.drill { cursor: pointer; }             /* pointer is promised only where a click drills */
  .hit.drill:hover { fill: var(--hover); }
  .hit:focus-visible { outline: none; stroke: var(--accent-bright); stroke-width: 2; fill: rgba(62,155,255,.08); }
  rect.chipbox { fill: var(--control); stroke: var(--subtle); }
  rect.chipbox.link { stroke: var(--accent); }
  g.faded { opacity: .34; }

  .edge { stroke: var(--strong); stroke-width: 1.25; fill: none; }
  .edge.call { stroke-dasharray: 6 4; }
  .edge.dim  { stroke: var(--subtle); }
  .edge.lit  { stroke: var(--accent); stroke-width: 1.75; }
  .edge.forbidden { stroke: var(--text-off); }
  .strike { stroke: var(--text-1); stroke-width: 1.5; }
  .strike.lit { stroke: var(--accent-bright); }
  .rule-hair { stroke: var(--hairline); stroke-width: 1; stroke-dasharray: 2 3; }
  .life { stroke: var(--subtle); stroke-width: 1; stroke-dasharray: 2 5; }
  .frame { fill: none; stroke: var(--subtle); stroke-width: 1; }
  .frame-tab { fill: var(--overlay); }
  .lbl-plate { fill: var(--base); }
  .lbl-mask { fill: var(--desktop); }

  /* ---- glossary / table ------------------------------------------------- */
  .glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(266px, 1fr)); gap: var(--s-comfortable); align-items: start; }
  .gl-card { background: var(--raised); border: 1px solid var(--hairline); border-radius: var(--r-popover); padding: var(--s-comfortable);
             transition: background var(--m-selection) var(--ease-out); }
  .gl-card:hover { background: var(--overlay); }
  .gl-card[data-on="true"] { background: var(--selection-ground); border-color: var(--subtle); }
  .gl-term { font-size: var(--t-title3); font-weight: 590; letter-spacing: -.01em; }
  .gl-line { font-size: var(--t-callout); color: var(--text-2); margin-top: 5px; }
  .gl-body { margin-top: var(--s-base); }
  .gl-body p { font-size: var(--t-callout); color: var(--text-3); margin-bottom: var(--s-snug); }
  .gl-refs { margin-top: var(--s-base); display: flex; flex-wrap: wrap; gap: 5px; align-items: baseline; }
  .chip { font-size: var(--t-footnote); color: var(--text-3);
          border: 1px solid var(--hairline); border-radius: var(--r-marker); padding: 2px 6px; }
  .chip.link { color: var(--accent); cursor: pointer; }
  .chip.link:hover { color: var(--accent-bright); border-color: var(--accent); }
  .gl-ev { margin-top: var(--s-comfortable); border-top: 1px solid var(--hairline); padding-top: var(--s-comfortable); }

  table.rules { border-collapse: collapse; width: 100%; }
  table.rules th { text-align: left; font-size: var(--t-footnote); text-transform: uppercase; letter-spacing: .07em;
                   color: var(--text-3); font-weight: 400; padding: 0 var(--s-comfortable) var(--s-base) 0; }
  table.rules td { padding: var(--s-base) var(--s-comfortable) var(--s-base) 0; vertical-align: top;
                   border-top: 1px solid var(--hairline); font-size: var(--t-callout); color: var(--text-2); }
  table.rules tr { transition: background var(--m-selection) var(--ease-out); }
  table.rules tbody tr:hover td { background: var(--hover); }
  table.rules tbody tr[data-on="true"] td { background: var(--selection-ground); }
  table.rules td.id { font-family: var(--mono); font-size: var(--t-footnote); color: var(--text-3); white-space: nowrap; padding-left: var(--s-base); }
  table.rules td .stmt { color: var(--text-1); }
  table.rules td .breaks { color: var(--text-3); margin-top: 5px; }
  .rules-wrap { display: flex; gap: var(--s-region); align-items: flex-start; flex-wrap: wrap; }
  .rules-wrap > .fig-col { flex: 0 0 auto; }
  .rules-wrap > .tbl-col { flex: 1 1 380px; min-width: 340px; }

  .picker { display: flex; gap: var(--s-base); margin-bottom: var(--s-loose); flex-wrap: wrap; }
  .picker button { padding: 8px var(--s-comfortable); border-radius: var(--r-control); background: var(--raised);
                   border: 1px solid var(--hairline); font-size: var(--t-callout); color: var(--text-2); text-align: left; max-width: 300px;
                   transition: background var(--m-selection) var(--ease-out); }
  .picker button:hover { background: var(--overlay); }
  .picker button[aria-current="true"] { background: var(--selection-ground); border-color: var(--subtle); color: var(--text-1); }
  .picker button i { display: block; font-style: normal; font-size: var(--t-footnote); color: var(--text-3); margin-top: 2px; }

  /* ---- narrow ------------------------------------------------------------
     The side column survives as a column as long as there is width for it: a
     bottom sheet on a short viewport leaves the panel too little to show its
     own disclosures. Below 1040px there is no width left, and it becomes one. */
  @media (max-width: 1440px) {
    #side { width: 340px; }
    footer.legend { max-height: 56px; overflow: auto; gap: var(--s-loose); padding: var(--s-base) var(--s-loose); }
    header.bar { flex-wrap: wrap; padding: 0 var(--s-loose); gap: var(--s-base) var(--s-comfortable); }
    .brand { min-width: 0; padding-right: var(--s-base); }
    nav.aspects { flex: 1 1 auto; flex-wrap: wrap; }
    nav.aspects button { min-width: 0; padding: 9px var(--s-snug); }
    nav.aspects span { display: none; }        /* the sub-question stays on the accessible name */
    .scale { margin-left: auto; }
    #routemenu { right: var(--s-loose); width: min(460px, calc(100vw - 2 * var(--s-loose))); }
    .glossary { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  }
  /* A short viewport pays for the Ask block's chrome, not for its content. */
  @media (max-height: 940px) {
    .ask .honest { display: none; }
    .slot { height: 64px; }
    .disc { margin-top: var(--s-snug); padding: 5px var(--s-comfortable); }
    .p-sec { margin-top: var(--s-comfortable); }
  }
  @media (max-height: 840px) {
    .slot { height: 44px; }
    footer.legend { max-height: 42px; }
    header.bar .brand { padding: 6px 0; }
    .ask { padding: var(--s-base) var(--s-comfortable); }
    .p-head { padding: var(--s-base) var(--s-comfortable); }
    .p-body { padding: var(--s-base) var(--s-comfortable) var(--s-tight); }
    .p-foot { padding: var(--s-snug) var(--s-comfortable); }
    .p-sec { margin-top: var(--s-base); }
  }
  @media (max-width: 1040px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto auto; }
    #foldbar { grid-area: 2 / 1; }
    #side { grid-area: 3 / 1; width: auto; max-height: min(56vh, 440px);
            border-left: 0; border-top: 1px solid var(--hairline); }
    aside#panel { min-height: 96px; }
    .scale-label { display: none; }
    .rungs button i { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>Atlas</b><span>apps/macOS · one surface</span></div>
    <nav class="aspects" id="aspects" role="tablist" aria-label="Aspect"></nav>
    <div class="scale">
      <div class="scale-label" id="scalelabel">Scale</div>
      <div class="rungs" id="rungs" role="tablist" aria-labelledby="scalelabel"></div>
      <button class="routes-btn" id="routesbtn" aria-expanded="false" aria-haspopup="menu"
        aria-controls="routemenu" aria-label="Routes — a camera path over these figures">Routes</button>
    </div>
  </header>
  <div id="routemenu" role="menu" aria-label="Routes" hidden></div>
  <main>
    <section id="stage"><div class="inner" id="inner"></div></section>
    <div id="foldbar"><div id="fold" hidden></div></div>
    <div id="side">
      <aside id="panel"></aside>
      <div id="askdock"></div>
    </div>
  </main>
  <footer class="legend" id="legend"></footer>
</div>

<script src="atlas-content.js"></script>
<script>
"use strict";
const A = window.ATLAS;
const ALL = Object.values(A);
const parts = ALL.filter(n => n.kind === "part");
const flows = ALL.filter(n => n.kind === "flow");
const concepts = ALL.filter(n => n.kind === "concept");
const rooms = (A.product.inside || []).map(id => A[id]);

/* ---------------------------------------------------------------- marks --
   One table styles the marks AND prints the legend, so the two cannot drift. */
const SENSE = {
  data: { label: "data handoff", cls: "data", head: "solid", note: "the value one part hands another" },
  call: { label: "call", cls: "call", head: "open", note: "one part reaching into another" }
};
const SHAPE = {
  sys:  { label: "the system", note: "Argo itself" },
  ext:  { label: "outside Argo", note: "a person, a process, a service" },
  band: { label: "a build target", note: "vertical position is layer, nothing else" },
  grp:  { label: "a group", note: "the folder-level grouping the target names" },
  cmp:  { label: "a component", note: "one folder of Swift" },
  over: { label: "z 1", note: "floats over its parent" },
  ghost:{ label: "another room", note: "the same slot, a different room" }
};

/* ------------------------------------------------------------- measuring -- */
const SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
const MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace';
const F = {
  name:  "590 13px " + SANS,
  nameSm:"590 12px " + SANS,
  line:  "400 11px " + SANS,
  edge:  "400 11px " + SANS,
  prose: "400 11px " + SANS,
  meta:  "400 11px " + SANS,
  path:  "400 11px " + MONO
};
const LH = { name: 16, nameSm: 15, line: 14, edge: 14, prose: 14, meta: 14 };

/* Every figure is laid out inside the pane it is drawn in, never wider. One
   measurement, read before the figure is built, and no figure may exceed it. */
let BUD = 1180, BUDH = 700;
function measureStage() {
  const stage = document.getElementById("stage");
  const cs = getComputedStyle(document.getElementById("inner"));
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (w > 0) BUD = Math.floor(w);
  if (h > 0) BUDH = Math.floor(h);
}
const _ctx = document.createElement("canvas").getContext("2d");
function tw(s, font) { _ctx.font = font; return _ctx.measureText(s).width; }
function wrap(text, width, font, maxLines) {
  const words = String(text || "").split(/\s+/).filter(Boolean);
  const out = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (tw(t, font) <= width || !cur) cur = t; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  if (maxLines && out.length > maxLines) {
    const kept = out.slice(0, maxLines);
    let last = kept[maxLines - 1];
    while (last.length > 1 && tw(last + "…", font) > width) last = last.slice(0, -1);
    kept[maxLines - 1] = last + "…";
    return kept;
  }
  return out;
}
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const clause = s => { const i = String(s).indexOf(","); return i > 18 ? String(s).slice(0, i) : String(s); };

/* --------------------------------------------------------------- svg bits -- */
function T(x, y, lines, cls, lh, anchor) {
  if (!lines.length) return "";
  const a = anchor ? ` text-anchor="${anchor}"` : "";
  return `<text x="${x}" y="${y}" class="${cls}"${a}>` +
    lines.map((l, i) => `<tspan x="${x}"${i ? ` dy="${lh}"` : ""}>${esc(l)}</tspan>`).join("") + "</text>";
}
function R(x, y, w, h, cls, r) {
  return `<rect x="${x}" y="${y}" width="${Math.max(1, w)}" height="${Math.max(1, h)}" rx="${r == null ? 6 : r}" class="${cls}"/>`;
}
function hit(x, y, w, h, id, extra) {
  return `<rect x="${x}" y="${y}" width="${Math.max(1, w)}" height="${Math.max(1, h)}" class="hit${extra ? " " + extra : ""}"
    tabindex="0" role="button" aria-label="${esc(labelOf(id))}" data-sel="${esc(id)}"/>`;
}
/* One mark means "open this one as the subject", and it appears nowhere a click
   cannot do that. It carries its own hit, so drilling never needs two clicks. */
const OPEN = "\u2922";
function drillChip(xRight, y, label, attr, val, linky) {
  const t = OPEN + " " + label, w = tw(t, F.meta) + 18, x = xRight - w, h = 21;
  return R(x, y, w, h, "chipbox" + (linky ? " link" : ""), 5) +
    T(x + 9, y + 14, [t], "t-meta", LH.meta) +
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="hit drill" tabindex="0" role="button"
      aria-label="${esc(label)}" ${attr}="${esc(val)}"/>`;
}
function labelOf(id) { return (GROUPS[id] ? GROUPS[id].def.name : (A[id] ? A[id].name : id)) + " — select"; }
function arrow(d, sense, lit) {
  const s = SENSE[sense] || SENSE.data;
  const m = (lit ? "lit-" : "") + s.head;
  return `<path d="${d}" class="edge ${s.cls}${lit ? " lit" : ""}" marker-end="url(#h-${m})"/>`;
}
const DEFS = `<defs>
  <marker id="h-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#A8AEB5"/></marker>
  <marker id="h-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#A8AEB5" stroke-width="1.3"/></marker>
  <marker id="h-lit-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#3E9BFF"/></marker>
  <marker id="h-lit-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9" fill="none" stroke="#3E9BFF" stroke-width="1.3"/></marker>
</defs>`;
function fig(w, h, body) {
  return `<svg class="fig" width="${Math.ceil(w)}" height="${Math.ceil(h)}" viewBox="0 0 ${Math.ceil(w)} ${Math.ceil(h)}">${DEFS}${body}</svg>`;
}

/* ------------------------------------------------------------------ state -- */
const ASPECTS = [
  { id: "product",    name: "Product",    q: "What is this app for?",    rungs: ["Rooms", "What you can do", "The honest bits"] },
  { id: "context",    name: "Context",    q: "What does it touch?",      rungs: ["Neighbours", "Cargo", "In full"] },
  { id: "structure",  name: "Structure",  q: "What is it made of?",      rungs: ["Targets", "Groups", "Components"] },
  { id: "runtime",    name: "Runtime",    q: "What happens, in order?",  rungs: ["Crossings", "Steps", "Evidence"] },
  { id: "cockpit",    name: "Cockpit",    q: "Where is it on screen?",   rungs: ["Window", "Zones", "Rows"] },
  { id: "vocabulary", name: "Vocabulary", q: "What does this word mean?",rungs: ["Terms", "Meaning", "Evidence"] },
  { id: "rules",      name: "Rules",      q: "What may I not do?",       rungs: ["Six rules", "Enforcement", "Breakage"] }
];
/* zoom is the open container on Structure; group is the open group inside it.
   One of each, at most, is ever open. */
const state = {
  aspect: "product", rung: 1, sel: null, zoom: null, group: null,
  roomLens: null, focus: null,
  route: null, step: 0, resume: null, badRoute: null,
  more: false, full: false, anchorsOpen: false,
  outOpen: false, inOpen: false, holdsOpen: false, stepsOpen: false, namesOpen: false,
  pair: null, ask: null, menu: false
};
/* Every disclosure in the panel, so a new selection opens closed. */
const DISCS = ["more", "full", "anchorsOpen", "outOpen", "inOpen", "holdsOpen", "stepsOpen",
  "wordsOpen", "spelledOpen", "crossedOpen"];
function closeDiscs() { for (const k of DISCS) state[k] = false; }

function readURL() {
  const q = new URLSearchParams(location.search);
  const a = q.get("aspect"); if (ASPECTS.some(x => x.id === a)) state.aspect = a;
  const r = parseInt(q.get("rung"), 10); if (r >= 1 && r <= 3) state.rung = r;
  const s = q.get("sel"); if (s) state.sel = s;
  const z = q.get("zoom"); if (z) state.zoom = z;
  const g = q.get("group"); if (g) state.group = g;
  const rm = q.get("room"); if (rm && A[rm]) state.roomLens = rm;
  const fc = (q.get("focus") || "").split(":");
  if (A[fc[0]] && fc[1] !== undefined) state.focus = { flow: fc[0], i: parseInt(fc[1], 10) };
  const rt = q.get("route");
  if (rt && ROUTES.some(x => x.id === rt)) {
    const route = ROUTES.find(x => x.id === rt);
    const n = parseInt(q.get("step"), 10);
    state.route = rt;
    state.step = Math.max(0, Math.min(route.steps.length - 1, (isNaN(n) ? 1 : n) - 1));
    applyStep(route.steps[state.step]);
  } else if (rt) {
    // a link naming a route this atlas does not carry says so, rather than failing quietly
    state.badRoute = rt;
  }
}
/* Every gesture that changes what is on the figure pushes a history entry, so
   Back walks back through the atlas instead of leaving it. */
function applyURL() {
  Object.assign(state, { aspect: "product", rung: 1, sel: null, zoom: null, group: null,
    roomLens: null, focus: null, route: null, step: 0, badRoute: null, pair: null, ask: null, menu: false });
  closeDiscs();
  readURL(); render();
}
function writeURL(push) {
  const q = new URLSearchParams();
  q.set("aspect", state.aspect); q.set("rung", String(state.rung));
  if (state.sel) q.set("sel", state.sel);
  if (state.zoom) q.set("zoom", state.zoom);
  if (state.group) q.set("group", state.group);
  if (state.roomLens) q.set("room", state.roomLens);
  if (state.focus) q.set("focus", state.focus.flow + ":" + state.focus.i);
  if (state.route) { q.set("route", state.route); q.set("step", String(state.step + 1)); }
  const url = location.pathname + "?" + q.toString();
  if (url === location.pathname + location.search) return;
  if (push) history.pushState(null, "", url); else history.replaceState(null, "", url);
}
/* A patch that moves the camera earns a history entry; opening a disclosure or
   typing a question does not, because Back should not undo a reading gesture. */
const CAMERA = ["aspect", "rung", "sel", "zoom", "group", "roomLens", "focus"];
function go(patch) {
  if (patch && "sel" in patch && patch.sel !== state.sel) {
    closeDiscs(); state.ask = null;
    if (!("pair" in patch)) state.pair = null;
  }
  const push = !!patch && CAMERA.some(k => k in patch && patch[k] !== state[k]);
  Object.assign(state, patch); writeURL(push); render();
}

/* ------------------------------------------------------- group resolution -- */
const GROUPS = {};                       // group id -> { owner, def }
for (const p of parts) for (const g of (p.groups || [])) GROUPS[g.id] = { owner: p.id, def: g };
function membersOf(gid) {
  const g = GROUPS[gid]; if (!g) return [];
  return parts.filter(n => n.parent === g.owner && n.group === gid);
}
function groupPath(gid) { return GROUPS[gid] ? GROUPS[gid].def.path : null; }
function groupName(gid) { return GROUPS[gid] ? GROUPS[gid].def.name : gid; }
function ownerOf(id) {
  const n = A[id];
  if (!n) return null;
  if (GROUPS[id]) return GROUPS[id].owner;
  return n.parent;
}
/* every edge, indexed both ways, so the panel can state what reaches a part */
const INCOMING = {};
const _seenEdge = new Set();
function _index(e) {
  const k = e.slice(0, 3).join("|");
  if (_seenEdge.has(k)) return;
  _seenEdge.add(k);
  (INCOMING[e[1]] ||= []).push(e);
}
for (const n of ALL) for (const e of (n.leaving || [])) _index(e);
for (const e of (A.argo.among || [])) _index(e);

/* ================================================================ PRODUCT == */
/* Authored here, not in the content: the content names the room "Tickets" and
   carries no earlier name, so the rename is stated as this prototype's own note. */
const ROOM_NOTE = {
  "r-tickets": "The room people mean when they say “the work room”. It is called Tickets — the earlier name is gone from the code and from this content.",
  "r-code": "Bare ground. `case .code: Color.clear` is the whole room. The spec for a file explorer, a light editor and a scratch terminal is approved and unbuilt.",
  "r-sessions": "Where Argo opens, and the only room you can type into.",
  "r-connect": "A sheet over whichever room you are in, not a fourth room. `CockpitRoom` names three cases and no connect case."
};
function renderProduct() {
  const rung = state.rung;
  const GAP = 14, PAD = 16;
  const shown = rooms;
  // the width budget is the pane, less the frame's own margins, split over the rooms
  const CW = Math.max(150, Math.min(258, Math.floor((BUD - 48 - GAP * (shown.length - 1)) / shown.length)));
  const cells = shown.map(r => {
    const nameL = wrap(r.name, CW - 2 * PAD, F.name, 2);
    const lineL = wrap(r.line, CW - 2 * PAD, F.line, 3);
    const does = rung >= 2 ? (r.does || []).map(d => wrap("· " + d, CW - 2 * PAD - 6, F.line, 3)) : [];
    const note = rung >= 3 ? wrap(ROOM_NOTE[r.id], CW - 2 * PAD, F.prose, 5) : [];
    let h = 22 + nameL.length * LH.name + 6 + lineL.length * LH.line + 10;
    if (does.length) { h += 8; does.forEach(d => { h += d.length * LH.line + 5; }); }
    if (note.length) h += 12 + note.length * LH.prose;
    h += 34;                                   // ground for the link chip at the foot
    return { r, nameL, lineL, does, note, h };
  });
  const H = Math.max(120, ...cells.map(c => c.h));
  const inner = shown.length * CW + (shown.length - 1) * GAP;
  const FRX = 0, FRY = 42, FRW = inner + 2 * 22, FRH = H + 76;

  let s = "";
  // no eyebrow: the page heading above the figure already says what Argo is for
  s += T(FRX + 2, 26, wrap(A.product.line, FRW - 20, F.line, 1), "t-line", LH.line);
  s += R(FRX, FRY, FRW, FRH, "box sys" + (state.sel === "product" ? " sel" : ""), 12);
  s += T(FRX + 22, FRY + 26, ["Argo · one window on one repository"], "t-name-sm", LH.nameSm);
  s += hit(FRX, FRY, FRW, FRH, "product");
  cells.forEach((c, i) => {
    const x = FRX + 22 + i * (CW + GAP), y = FRY + 42;
    const sheet = (c.r.renders || []).length === 1 && c.r.id === "r-connect";
    const sel = state.sel === c.r.id;
    s += R(x, y, CW, H, "box " + (sheet ? "over" : "cmp") + (sel ? " sel" : ""), 8);
    let ty = y + 22;
    s += T(x + PAD, ty, c.nameL, "t-name", LH.name); ty += (c.nameL.length - 1) * LH.name + 6;
    ty += LH.line; s += T(x + PAD, ty, c.lineL, "t-line", LH.line); ty += (c.lineL.length - 1) * LH.line;
    if (c.does.length) {
      ty += 18;
      s += T(x + PAD, ty, ["YOU CAN"], "t-cap", 13); ty += 5;
      c.does.forEach(d => { ty += LH.line; s += T(x + PAD, ty, d, "t-line", LH.line); ty += (d.length - 1) * LH.line + 5; });
    }
    if (c.note.length) {
      ty += 14; s += T(x + PAD, ty, c.note, "t-prose", LH.prose); ty += (c.note.length - 1) * LH.prose;
    }
    const rc = (c.r.renders || []).length;
    s += hit(x, y, CW, H, c.r.id);
    if (rc) {
      // a cross-aspect link, not a drill: it leaves for the Cockpit figure
      s += drillChip(x + CW - PAD + 8, y + H - 30, rc + (rc === 1 ? " region draws it" : " regions draw it"),
        "data-room-goto", c.r.id + ":" + c.r.renders[0], true);
    } else s += T(x + PAD, y + H - 15, ["nothing draws it"], "t-meta", LH.meta);
  });
  return { svg: fig(FRW + 40, FRY + FRH + 20, s),
    note: "A room is a tab of the window. The chip at the foot of a room opens the Cockpit figure with the regions that draw it lit." };
}

/* ================================================================ CONTEXT == */
function actorEdges(id) {
  const into = [], out = [];
  for (const f of flows) (f.steps || []).forEach(s => {
    if (s.from === id) into.push({ flow: f, step: s });
    if (s.to === id) out.push({ flow: f, step: s });
  });
  return { into, out };
}
function renderContext() {
  const rung = state.rung;
  const GAP = 22;
  /* Three columns and two lanes fill the pane exactly. The right lane is the
     wider one because nine cargo labels hang in it and two in the left. */
  const COLW = Math.max(150, Math.min(268, Math.floor((BUD - 520) / 3)));
  const LANEL = Math.max(110, Math.round((BUD - 3 * COLW) * 0.36));
  const LANER = BUD - 3 * COLW - LANEL;
  const xL = 0, xArgo = COLW + LANEL, xR = xArgo + COLW + LANER;
  const W = xR + COLW;
  const laneOf = side => side === "left" ? LANEL : LANER;

  const lefts = ["person", "agent-process"].map(id => {
    const n = A[id], e = actorEdges(id);
    const lines = [];
    if (e.into.length) lines.push({ dir: "in", sense: "data", label: e.into[0].step.title, all: e.into });
    if (e.out.length) lines.push({ dir: "out", sense: "data", label: e.out[0].step.title, all: e.out });
    return { id, name: n.name, what: null, line: n.line, shape: "ext", edges: lines };
  });
  // A neighbour's only prose IS the cargo on its line, so repeating it inside the box says nothing.
  const rights = (A.argo.leaving || []).map(([, to, cargo, sense]) => ({
    id: null, name: to, what: null, line: null, shape: "ext",
    edges: [{ dir: "out", sense, label: cargo, all: [] }]
  }));

  function boxOf(o, x) {
    const nameL = wrap(o.name, COLW - 24, F.nameSm);
    // the dashed outline is what says "outside Argo", and the legend states it once
    const body = [];
    if (rung >= 2 && o.what) body.push({ cls: "t-meta", lines: [o.what], lh: LH.meta });
    if (rung >= 3 && o.line) body.push({ cls: "t-line", lines: wrap(o.line, COLW - 24, F.line, 4), lh: LH.line });
    let h = 12 + nameL.length * LH.nameSm;
    body.forEach(b => { h += 6 + b.lines.length * b.lh; });
    h += 12;
    return { o, x, w: COLW, h: Math.max(h, 44), nameL, body };
  }
  function stack(list, x, lane) {
    const boxes = list.map(o => boxOf(o, x));
    let y = 12;
    for (const b of boxes) {
      const labelH = rung === 1 ? 0 : b.o.edges.reduce((a, e) =>
        a + wrap(rung >= 3 ? e.label : clause(e.label), lane - 30, F.edge, rung >= 3 ? 6 : 2).length * LH.edge + 10, 0);
      b.rowH = Math.max(b.h, labelH, 52, b.o.edges.length * 48);
      b.y = y + (b.rowH - b.h) / 2; b.rowY = y; y += b.rowH + GAP;
    }
    return { boxes, total: y - GAP };
  }
  const L = stack(lefts, xL, LANEL), Rt = stack(rights, xR, LANER);
  const H = Math.max(L.total, Rt.total, 200);
  /* Two neighbours on one side and nine on the other: the shorter stack spreads
     over the same height rather than leaving a quarter of the figure empty. */
  const spread = pack => {
    if (pack.total >= H - 40 || pack.boxes.length < 2) {
      const dy = (H - pack.total) / 2;
      pack.boxes.forEach(b => { b.y += dy; b.rowY += dy; });
      return;
    }
    const step = H / pack.boxes.length;
    pack.boxes.forEach((b, i) => { b.rowY = i * step; b.rowH = step; b.y = b.rowY + (step - b.h) / 2; });
  };
  spread(L); spread(Rt);

  let s = "";
  const argoNameL = ["Argo"];
  const argoBody = [];
  argoBody.push({ cls: "t-meta", lines: ["the software system · Swift"], lh: LH.meta });
  if (rung >= 2) argoBody.push({ cls: "t-line", lines: wrap(A.argo.line, COLW - 28, F.line, 8), lh: LH.line });
  if (rung >= 3) {
    argoBody.push({ cls: "t-meta", lines: [A.argo.lines.toLocaleString() + " lines · 5 targets"], lh: LH.meta });
    (A.argo.short || []).forEach(p => argoBody.push({ cls: "t-line", lines: wrap(p, COLW - 28, F.line, 14), lh: LH.line }));
  }
  const selArgo = state.sel === "argo";
  s += R(xArgo, 0, COLW, H, "box sys" + (selArgo ? " sel" : ""), 10);
  const argoH = LH.name + argoBody.reduce((a, b) => a + b.lh * b.lines.length + 8, 0);
  let ay = Math.max(26, (H - argoH) / 2);
  s += T(xArgo + 14, ay, argoNameL, "t-name", LH.name); ay += 10;
  for (const b of argoBody) { ay += b.lh; s += T(xArgo + 14, ay, b.lines, b.cls, b.lh); ay += (b.lines.length - 1) * b.lh + 8; }
  s += hit(xArgo, 0, COLW, H, "argo");

  function drawSide(pack, side) {
    for (const b of pack.boxes) {
      const cls = "box " + b.o.shape + (state.sel && state.sel === b.o.id ? " sel" : "");
      s += R(b.x, b.y, b.w, b.h, cls, 8);
      let y = b.y + 20;
      s += T(b.x + 12, y, b.nameL, "t-name-sm", LH.nameSm);
      y += (b.nameL.length - 1) * LH.nameSm;
      for (const bb of b.body) { y += 6 + bb.lh; s += T(b.x + 12, y, bb.lines, bb.cls, bb.lh); y += (bb.lines.length - 1) * bb.lh; }
      if (b.o.id) s += hit(b.x, b.y, b.w, b.h, b.o.id);
      const n = b.o.edges.length;
      b.o.edges.forEach((e, i) => {
        const ey = b.rowY + b.rowH * (i + 1) / (n + 1);
        const lit = !!(state.sel && (state.sel === b.o.id || state.sel === "argo"));
        const from = side === "left" ? b.x + b.w : xArgo + COLW;
        const to = side === "left" ? xArgo : b.x;
        const inward = e.dir === "in";
        const d = side === "left"
          ? (inward ? `M${from},${ey} L${to},${ey}` : `M${to},${ey} L${from},${ey}`)
          : (inward ? `M${to},${ey} L${from},${ey}` : `M${from},${ey} L${to},${ey}`);
        s += arrow(d, e.sense, lit);
        if (rung >= 2) {
          const lw = laneOf(side) - 30;
          const lines = wrap(rung >= 3 ? e.label : clause(e.label), lw, F.edge, rung >= 3 ? 6 : 2);
          const lx = side === "left" ? b.x + b.w + 15 : xArgo + COLW + 15;
          const ly = ey - 8 - (lines.length - 1) * LH.edge;
          s += `<rect x="${lx - 5}" y="${ly - 12}" width="${Math.min(lw, Math.max(...lines.map(l => tw(l, F.edge)))) + 10}" height="${lines.length * LH.edge + 6}" class="lbl-plate" rx="3"/>`;
          s += T(lx, ly, lines, "t-edge", LH.edge);
        }
      });
    }
  }
  drawSide(L, "left"); drawSide(Rt, "right");
  return { svg: fig(W, H + 4, s) };
}

/* ============================================================== STRUCTURE ==
   Structure zooms. One container is the subject; every other target drops to a
   dimmed strip above the canvas, and one group at most is open inside. */
const LAYERS = ["app", "ui", "engine"];          // top to bottom; position means layer
const TARGETS = ["app", "ui", "engine", "terminal", "observe"];

function bandContent(id, rung, W) {
  const n = A[id], PAD = 14, META = 128;
  const gs = n.groups || [];
  const nameL = wrap(n.name, W - 2 * PAD - META, F.name, 1);
  const lineL = wrap(n.line, W - 2 * PAD - META, F.line, 3);
  /* Names only. A brace path is longer than this column and would have to be
     severed, and the group figure one drill down states every one of them. */
  const heads = rung >= 2 && gs.length ? wrap(gs.map(g => g.name).join("  ·  "), W - 2 * PAD - META, F.meta, 2) : [];
  let h = 24 + LH.name + lineL.length * LH.line + 14;
  if (heads.length) h += 8 + heads.length * LH.meta;
  if (gs.length) h = Math.max(h, 80);
  return { h, draw: (x, y) => {
    let s = T(x + PAD, y + 26, nameL, "t-name", LH.name);
    s += T(x + PAD, y + 26 + LH.line + 6, lineL, "t-line", LH.line);
    s += T(x + W - PAD, y + 26, [n.lines.toLocaleString() + " lines"], "t-meta", LH.meta, "end");
    if (heads.length) s += T(x + PAD, y + 26 + LH.line + 6 + lineL.length * LH.line + 8 + LH.meta, heads, "t-meta", LH.meta);
    if (gs.length) s += drillChip(x + W - PAD, y + h - 30, gs.length + (gs.length === 1 ? " group" : " groups"), "data-drill", id);
    return s;
  } };
}
function structureStack() {
  const rung = state.rung;
  /* Every dimension is a share of the pane, so the figure is never wider than
     the ground it is drawn on. Left to right: argo-observe, the gutter its two
     lines and the app↔engine pair are labelled in, the three layer bands, the
     gutter the terminal crossings are labelled in, and ArgoTerminal. */
  const cl = (lo, hi, v) => Math.max(lo, Math.min(hi, Math.round(v)));
  const OBSX = 26;
  const OBSW = cl(130, 170, BUD * 0.14);
  const LEFTGUT = 60;                                 // only the routed pair turns here
  const TERMW = cl(150, 200, BUD * 0.17);
  const TERMGAP = cl(140, 190, BUD * 0.16);
  const BX = OBSX + OBSW + LEFTGUT;
  const BW = Math.max(300, BUD - BX - TERMW - TERMGAP - 6);
  const parts3 = LAYERS.map(id => bandContent(id, rung, BW));
  // the two gaps take whatever height the stage has left, so the stack fits it
  const bandsH = parts3.reduce((a, c) => a + c.h, 0);
  const GAPH = rung === 1 ? 128 : Math.max(150, Math.min(190, (BUDH - 200 - bandsH) / 2));
  const bands = {};
  let y = 0;
  LAYERS.forEach((id, i) => {
    const c = parts3[i];
    bands[id] = { id, x: BX, y, w: BW, h: c.h, c };
    y += c.h + GAPH;
  });
  const bottom = y - GAPH;
  const side = (id, x, atY, w) => {
    const n = A[id];
    const nameL = wrap(n.name, w - 24, F.name, 1);
    const lineL = wrap(n.line, w - 24, F.line, 5);
    const h = 24 + LH.name + 6 + lineL.length * LH.line + 14;
    return { id, x, y: atY, w, h, nameL, lineL, n };
  };
  const terminal = side("terminal", BX + BW + TERMGAP, bands.engine.y, TERMW);
  const observe = side("observe", OBSX, bands.ui.y, OBSW);

  let s = "";
  for (const id of LAYERS) {
    const b = bands[id];
    s += R(b.x, b.y, b.w, b.h, "box band" + (state.sel === id ? " sel" : ""), 10);
    s += hit(b.x, b.y, b.w, b.h, id);
    s += b.c.draw(b.x, b.y);
  }
  for (const o of [terminal, observe]) {
    s += R(o.x, o.y, o.w, o.h, "box" + (state.sel === o.id ? " sel" : ""), 10);
    s += T(o.x + 14, o.y + 26, o.nameL, "t-name", LH.name);
    s += T(o.x + 14, o.y + 26 + LH.line + 8, o.lineL, "t-line", LH.line);
    s += T(o.x + o.w - 14, o.y + o.h - 12, [o.n.lines + " lines"], "t-meta", LH.meta, "end");
    s += hit(o.x, o.y, o.w, o.h, o.id);
  }
  // the one axis: height is layer
  const axisMid = (bands.app.y + bottom) / 2;
  s += `<path d="M14,${bands.app.y + 10} L14,${bottom - 6}" class="edge dim" marker-end="url(#h-open)"/>`;
  s += `<text x="8" y="${axisMid}" class="t-cap" text-anchor="middle" transform="rotate(-90 8 ${axisMid})">DEPENDS ON WHAT IS BELOW</text>`;

  const among = A.argo.among || [];
  const inGap = { "app|ui": [], "engine|ui": [] };
  const routedLeft = [], termEdges = [], obsEdges = [], routedRight = [];
  among.forEach((e) => {
    const [f, t] = e;
    const key = [f, t].sort().join("|");
    if (inGap[key] && LAYERS.includes(f) && LAYERS.includes(t)) inGap[key].push(e);
    else if ((f === "app" && t === "engine") || (f === "engine" && t === "app")) routedLeft.push(e);
    else if (f === "observe" || t === "observe") obsEdges.push(e);
    else if ((f === "app" && t === "terminal")) routedRight.push(e);
    else termEdges.push(e);
  });

  const litPair = e => !!(state.sel && (state.sel === e[0] || state.sel === e[1]));
  /* No lane is numbered anywhere on this figure, because no key for a number
     exists at any rung. Every label is drawn beside the lane it belongs to. */
  function labelBlock(x, w, ly, list, lit, maxLines) {
    // one direction's cargo, listed against its own lane
    let g = "", ty = ly, wmax = 0;
    const rows = list.map(e => wrap("· " + clause(e[2]), w, F.edge, maxLines || 2));
    rows.forEach(lines => { wmax = Math.max(wmax, ...lines.map(l => tw(l, F.edge))); });
    const hgt = rows.reduce((a, l) => a + l.length * LH.edge + 4, 0);
    g += `<rect x="${x - 8}" y="${ly - 13}" width="${wmax + 16}" height="${hgt + 6}" class="lbl-plate" rx="3"/>`;
    rows.forEach(lines => {
      g += T(x, ty, lines, lit ? "t-edge" : "t-meta", LH.edge);
      ty += lines.length * LH.edge + 4;
    });
    return { svg: g, h: hgt };
  }
  /* One lane per direction in each gap, and that direction's whole cargo listed
     beside it. Five parallel lanes cannot carry five readable labels in a pane
     this wide, so the lanes fold and nothing is truncated. */
  function gapEdges(list, upper, lower, reserve) {
    const y0 = bands[upper].y + bands[upper].h, y1 = bands[lower].y;
    const down = list.filter(e => e[0] === upper), up = list.filter(e => e[0] !== upper);
    const dirs = [down, up].filter(d => d.length);
    const room = BW - reserve, half = room / dirs.length;
    dirs.forEach((d, i) => {
      const x = BX + reserve + half * i + 16;
      const isDown = d === down;
      const lit = d.some(litPair);
      s += arrow(isDown ? `M${x},${y0 + 6} L${x},${y1 - 6}` : `M${x},${y1 - 6} L${x},${y0 + 6}`, d[0][3], lit);
      if (rung >= 2) s += labelBlock(x + 12, half - 44, y0 + 30, d, lit, 3).svg;
    });
  }
  // the app ↔ engine pair turns clear of the bands, and is labelled in the first gap
  const RESERVE = rung >= 2 ? Math.round(BW * 0.34) : 0;
  gapEdges(inGap["app|ui"], "app", "ui", RESERVE);
  gapEdges(inGap["engine|ui"], "ui", "engine", 0);
  routedLeft.forEach((e, i) => {
    const x = BX - 20 - i * 14, down = e[0] === "app", lit = litPair(e);
    const ya = bands.app.y + bands.app.h / 2, yb = bands.engine.y + bands.engine.h / 2;
    s += arrow(down
      ? `M${BX},${ya} L${x},${ya} L${x},${yb} L${BX - 4},${yb}`
      : `M${BX},${yb} L${x},${yb} L${x},${ya} L${BX - 4},${ya}`, e[3], lit);
    if (rung >= 2) {
      const ly = bands.app.y + bands.app.h + 32 + i * 74;
      s += `<path d="M${x},${ly - 4} L${BX + 8},${ly - 4}" class="rule-hair"/>`;
      s += labelBlock(BX + 14, RESERVE - 30, ly, [e], lit, 5).svg;
    }
  });
  /* argo-observe drops its two lines, runs each under the ui band on its own row,
     and turns down into the engine. One row, one label, no numbering needed. */
  obsEdges.forEach((e, i) => {
    const lit = litPair(e);
    const x0 = observe.x + 30 + i * 26;
    const down = e[0] === "observe";
    const y0 = observe.y + observe.h;
    const ly = y0 + 40 + i * 74;
    const x1 = BX + 26 + i * 30, y1 = bands.engine.y;
    s += arrow(down
      ? `M${x0},${y0 + 6} L${x0},${ly} L${x1},${ly} L${x1},${y1 - 6}`
      : `M${x1},${y1 - 6} L${x1},${ly} L${x0},${ly} L${x0},${y0 + 6}`, e[3], lit);
    if (rung >= 2) s += labelBlock(OBSX + 4, BX - OBSX - 40, ly - 8, [e], lit, 3).svg;
  });
  // ArgoTerminal: one row per crossing, its label on the row of its own lane
  const GX = BX + BW + 12, GW = TERMGAP - 34, BEND = terminal.x - 8;
  const termRows = termEdges.map(e => {
    const lines = rung >= 2 ? wrap(clause(e[2]), GW, F.edge, 3) : [];
    return { e, lines, h: rung >= 2 ? lines.length * LH.edge + 22 : 46 };
  });
  let ry = terminal.y + terminal.h / 2 - termRows.reduce((a, r) => a + r.h, 0) / 2;
  termRows.forEach((r, i) => {
    const e = r.e, lit = litPair(e);
    const ty = terminal.y + terminal.h * (i + 1) / (termRows.length + 1);
    const ey = ry + r.h - 9;
    const out = e[0] === "engine";
    s += arrow(out
      ? `M${BX + BW},${ey} L${BEND},${ey} L${BEND},${ty} L${terminal.x - 4},${ty}`
      : `M${terminal.x},${ty} L${BEND},${ty} L${BEND},${ey} L${BX + BW + 4},${ey}`, e[3], lit);
    if (rung >= 2) s += T(GX, ry + LH.edge, r.lines, lit ? "t-edge" : "t-meta", LH.edge);
    ry += r.h;
  });
  // the app target reaches ArgoTerminal over the top of the engine
  routedRight.forEach(e => {
    const lit = litPair(e);
    const x = terminal.x + terminal.w / 2;
    const ya = bands.app.y + bands.app.h / 2;
    s += arrow(`M${BX + BW},${ya} L${x},${ya} L${x},${terminal.y - 4}`, e[3], lit);
    if (rung >= 2) {
      const lines = wrap(clause(e[2]), TERMW + TERMGAP - 40, F.edge, 3);
      const ly = terminal.y - 22 - (lines.length - 1) * LH.edge;
      const wmax = Math.max(...lines.map(l => tw(l, F.edge)));
      s += `<rect x="${x - 12 - wmax - 8}" y="${ly - 13}" width="${wmax + 20}" height="${lines.length * LH.edge + 8}" class="lbl-plate" rx="3"/>`;
      s += T(x - 12, ly, lines, lit ? "t-edge" : "t-meta", LH.edge, "end");
    }
  });

  const W = Math.min(BUD, terminal.x + terminal.w + 6);
  return { svg: fig(W, bottom + 12, s),
    note: "The mark on a box opens it as the subject: only the target you open draws its parts, and the rest drop to the strip above. A click anywhere else on a box selects it without leaving this view." };
}

/* the strip: every target that is not the subject, dimmed and still clickable */
function contextStrip(subject) {
  const items = TARGETS.filter(id => id !== subject).map(id => {
    const n = A[id];
    const can = (n.groups || []).length;
    return `<button class="ctx-item" ${can ? `data-drill="${id}"` : `data-sel="${id}"`}
      aria-label="${esc(n.name + (can ? " — open as the subject" : " — select"))}"><b>${esc(n.name)}</b><i>${n.lines.toLocaleString()} lines${can ? " · " + can + " groups " + OPEN : ""}</i></button>`;
  }).join("");
  return `<div class="strip"><button class="up" data-zoom="" aria-label="Back to all five targets">← all targets</button>${items}
    <span class="strip-note">the rest of the program, in context — ${esc(OPEN)} makes one of them the subject</span></div>`;
}

function structureZoom() {
  const subject = state.zoom, n = A[subject];
  const gs = n.groups || [];
  const rung = state.rung;
  const open = rung >= 3 ? (state.group && gs.some(g => g.id === state.group) ? state.group : gs[0].id) : null;

  const memberIndex = {};
  for (const p of parts.filter(p => p.parent === subject)) memberIndex[p.id] = p.group;

  if (!open) return zoomGroups(subject, gs, memberIndex);
  return zoomMembers(subject, gs, open, memberIndex);
}

/* rung 2: the subject fills the canvas and draws its groups */
function zoomGroups(subject, gs, memberIndex) {
  const n = A[subject];
  const HEAD = 84;
  // crossings between groups, ordered pairs, numbered once each
  const pairs = [], pairKey = {};
  for (const p of parts.filter(p => p.parent === subject)) {
    for (const e of (p.leaving || [])) {
      const tg = memberIndex[e[1]];
      if (!tg || tg === p.group) continue;
      const k = p.group + "|" + tg;
      if (!(k in pairKey)) { pairKey[k] = pairs.length + 1; pairs.push({ from: p.group, to: tg, n: pairs.length + 1, edges: [] }); }
      const pair = pairs[pairKey[k] - 1];
      pair.edges.push(e);
    }
  }
  const GUTW = Math.max(220, Math.min(360, Math.round(BUD * 0.30)));
  const CW = Math.max(260, Math.min(560, BUD - 60 - GUTW - pairs.length * 16));
  const cells = gs.map(g => {
    const nameL = wrap(g.name, CW - 2 * 14, F.name, 1);
    const pathL = wrap(g.path, CW - 2 * 14, F.path, 2);
    const lineL = wrap(g.line, CW - 2 * 14, F.line, 3);
    const mem = membersOf(g.id);
    const h = 18 + LH.name + 4 + pathL.length * LH.meta + 4 + lineL.length * LH.line + 6 + 21 + 6;
    return { g, mem, nameL, pathL, lineL, h };
  });
  const laneStep = 16;
  const GUT = GUTW;
  const lane0 = CW + 26;
  const gutter = lane0 + pairs.length * laneStep + 26;
  let y = HEAD, s = "";
  const at = {};
  cells.forEach(c => { at[c.g.id] = { y, h: c.h }; y += c.h + 12; });
  const bottom = y;
  const W = Math.min(BUD, gutter + GUT + 8);

  s += T(0, 18, [n.name.toUpperCase() + " · " + gs.length + " GROUPS"], "t-cap", 13);
  s += T(0, 38, [n.path], "t-path", LH.meta);
  s += T(0, 56, wrap(n.line, W - 20, F.line, 1), "t-line", LH.line);
  s += R(-12, HEAD - 12, CW + 24, bottom - HEAD + 8, "box band", 12);

  cells.forEach(c => {
    const yy = at[c.g.id].y, sel = state.sel === c.g.id;
    s += R(0, yy, CW, c.h, "box grp" + (sel ? " sel" : ""), 8);
    let ty = yy + 20;
    s += T(14, ty, c.nameL, "t-name", LH.name); ty += 4;
    ty += LH.meta; s += T(14, ty, c.pathL, "t-path", LH.meta); ty += (c.pathL.length - 1) * LH.meta + 6;
    ty += LH.line; s += T(14, ty, c.lineL, "t-line", LH.line); ty += (c.lineL.length - 1) * LH.line + 6;
    s += hit(0, yy, CW, c.h, c.g.id);
    s += drillChip(CW - 14, yy + c.h - 29, c.mem.length + " components", "data-drill", c.g.id);
  });

  pairs.forEach((p, i) => {
    const lit = !!(state.sel && (state.sel === p.from || state.sel === p.to));
    const faded = state.sel && GROUPS[state.sel] && !lit;
    const x = lane0 + i * laneStep;
    const ya = at[p.from].y + at[p.from].h / 2, yb = at[p.to].y + at[p.to].h / 2;
    const d = `M${CW + 2},${ya} L${x},${ya} L${x},${yb} L${CW + 6},${yb}`;
    const g = arrow(d, p.edges[0][3], lit) + T(x, Math.min(ya, yb) - 6 - (i % 2) * 14, [String(p.n)], "t-num", 12, "middle");
    s += faded ? `<g class="faded">${g}</g>` : g;
  });
  // the gutter says, in words, what each numbered lane carries
  let gy = HEAD + 4;
  pairs.forEach(p => {
    const lit = !!(state.sel && (state.sel === p.from || state.sel === p.to));
    const faded = state.sel && GROUPS[state.sel] && !lit;
    const head = groupName(p.from) + " → " + groupName(p.to);
    const lines = wrap(head + " · " + p.edges.length + (p.edges.length === 1 ? " crossing" : " crossings"), GUT - 20, F.edge, 2);
    const g = T(gutter, gy + LH.edge, [String(p.n)], "t-num", 11) + T(gutter + 18, gy + LH.edge, lines, lit ? "t-edge" : "t-meta", LH.edge);
    s += faded ? `<g class="faded">${g}</g>` : g;
    gy += lines.length * LH.edge + 8;
  });

  return { svg: fig(W, Math.max(bottom, gy) + 20, s),
    strip: contextStrip(subject),
    note: "One target is the subject. The numbered lanes are keyed by the list beside them. The mark on a group opens it; a click anywhere else on it selects it." };
}

/* rung 3: one group open, its siblings dimmed to strips */
function zoomMembers(subject, gs, open, memberIndex) {
  const n = A[subject], g = GROUPS[open].def;
  const GAPX = 20;
  const mem = membersOf(open);
  const RAIL = Math.max(150, Math.min(200, Math.round(BUD * 0.16)));
  const GUT = Math.max(220, Math.min(340, Math.round(BUD * 0.28)));
  let innerN = 0;
  for (const m of mem) for (const e of (m.leaving || [])) if (mem.some(x => x.id === e[1])) innerN++;
  const CW = Math.max(240, Math.min(440, BUD - RAIL - GAPX - 24 - innerN * 16 - 26 - GUT));
  const cells = mem.map(m => {
    const nameL = wrap(m.name, CW - 24, F.nameSm, 2);
    const lineL = wrap(m.line, CW - 24, F.line, 3);
    const h = 14 + nameL.length * LH.nameSm + 5 + lineL.length * LH.line + 3 + LH.meta + 10;
    return { m, nameL, lineL, h };
  });
  const X = RAIL + GAPX;
  let y = 86, s = "";
  const at = {};
  cells.forEach(c => { at[c.m.id] = { y, h: c.h }; y += c.h + 8; });
  const bottom = y + 6;

  const inner = [], leaves = [];
  for (const m of mem) for (const e of (m.leaving || [])) {
    if (at[e[1]]) inner.push(e); else leaves.push(e);
  }
  const lane0 = X + CW + 24, laneStep = 16;
  const gutter = lane0 + inner.length * laneStep + 26;
  const W = Math.min(BUD, gutter + GUT + 8);

  s += T(0, 18, [n.name.toUpperCase() + " · " + g.name.toUpperCase()], "t-cap", 13);
  s += T(0, 38, [g.path], "t-path", LH.meta);
  s += T(0, 56, wrap(g.line, W - 20, F.line, 2), "t-line", LH.line);

  // sibling groups: still visible, no detail
  let ry = 86;
  gs.filter(x => x.id !== open).forEach(x => {
    const nameL = wrap(x.name, RAIL - 20, F.nameSm, 2);
    const h = 14 + nameL.length * LH.nameSm + 29;
    const body = R(0, ry, RAIL, h, "box grp", 8) + T(10, ry + 18, nameL, "t-name-sm", LH.nameSm);
    s += `<g class="faded">${body}</g>` + hit(0, ry, RAIL, h, x.id);
    s += drillChip(RAIL - 10, ry + h - 27, membersOf(x.id).length + " components", "data-drill", x.id);
    ry += h + 10;
  });
  s += T(0, ry + 14, wrap("the other groups of " + n.name, RAIL, F.meta, 2), "t-meta", LH.meta);

  s += R(X - 12, 72, CW + 24, bottom - 66, "box grp" + (state.sel === open ? " sel" : ""), 10);
  cells.forEach(c => {
    const yy = at[c.m.id].y, sel = state.sel === c.m.id || (state.pair || []).includes(c.m.id);
    s += R(X, yy, CW, c.h, "box cmp" + (sel ? " sel" : ""), 6);
    let ty = yy + 18;
    s += T(X + 12, ty, c.nameL, "t-name-sm", LH.nameSm); ty += (c.nameL.length - 1) * LH.nameSm + 6;
    ty += LH.line; s += T(X + 12, ty, c.lineL, "t-line", LH.line); ty += (c.lineL.length - 1) * LH.line + 4;
    ty += LH.meta;
    s += T(X + 12, ty, [c.m.lines.toLocaleString() + " ln · " + (c.m.leaving || []).length + " out · " +
      (INCOMING[c.m.id] || []).length + " in"], "t-meta", LH.meta);
    s += hit(X, yy, CW, c.h, c.m.id);
  });

  inner.forEach((e, i) => {
    const lit = !!(state.sel && (state.sel === e[0] || state.sel === e[1]));
    const x = lane0 + i * laneStep;
    const ya = at[e[0]].y + at[e[0]].h / 2, yb = at[e[1]].y + at[e[1]].h / 2;
    const d = `M${X + CW + 2},${ya} L${x},${ya} L${x},${yb} L${X + CW + 6},${yb}`;
    s += arrow(d, e[3], lit) + T(x, Math.min(ya, yb) - 6 - (i % 2) * 14, [String(i + 1)], "t-num", 12, "middle");
  });
  /* The one key on this figure: every number drawn on a lane resolves here, and
     the cargo is stated once. The panel repeats none of it unasked. */
  let gy = 86;
  inner.forEach((e, i) => {
    const lit = !!(state.sel && (state.sel === e[0] || state.sel === e[1]));
    const lines = wrap(clause(e[2]), GUT - 22, F.edge, 2);
    s += T(gutter, gy + LH.edge, [String(i + 1)], "t-num", 12);
    s += T(gutter + 20, gy + LH.edge, lines, lit ? "t-edge" : "t-meta", LH.edge);
    gy += lines.length * LH.edge + 7;
  });
  if (!inner.length) s += T(gutter, 110, wrap("Nothing inside this group reaches anything else inside it. Every line it carries leaves the group.", GUT - 22, F.edge, 4), "t-edge", LH.edge);
  gy += 10;
  s += T(gutter, gy + LH.meta, wrap(leaves.length + " more lines leave this group", GUT - 22, F.meta, 2), "t-meta", LH.meta);

  return { svg: fig(W, Math.max(bottom, gy + 24), s),
    strip: contextStrip(subject),
    note: "One group is open. Its siblings keep their place on the left; the mark on one opens it instead." };
}

function renderStructure() {
  if (state.rung >= 3 && !state.zoom) state.zoom = "engine";
  if (state.zoom && !(A[state.zoom] && (A[state.zoom].groups || []).length)) state.zoom = null;
  if (state.rung === 1 || !state.zoom) return structureStack();
  return structureZoom();
}

/* ================================================================ RUNTIME == */
function renderRuntime() {
  const rung = state.rung;
  const flow = flows.find(f => f.id === state.sel) || flows.find(f => (f.parts || []).includes(state.sel)) || flows[0];
  const lifelines = flow.parts;
  /* The lifelines share the pane, so the last one is always on it. */
  const NUMW = 26, X0 = NUMW + 12;
  const COL = Math.max(112, Math.min(210, Math.floor((BUD - X0 - 16) / lifelines.length)));
  const HEADW = COL - 22;
  const W = Math.min(BUD, X0 + lifelines.length * COL + 8);
  const xOf = id => X0 + lifelines.indexOf(id) * COL + HEADW / 2;
  const focus = (state.focus && state.focus.flow === flow.id) ? state.focus.i : -1;

  const heads = lifelines.map(id => {
    const n = A[id];
    const nl = wrap(n.name, HEADW - 20, F.nameSm, 3);
    return { id, n, nl, h: 14 + nl.length * LH.nameSm + (rung >= 2 ? LH.meta + 6 : 0) + 10 };
  });
  const headH = Math.max(...heads.map(h => h.h));

  const steps = (flow.steps || []).map((s, i) => ({ ...s, i }));
  const shown = [];
  let prevActor = null, hidden = 0;
  for (const st of steps) {
    const dst = st.to || st.actor;
    // A step that names only where it goes leaves from its own actor, never from whoever spoke last.
    const src = st.from || (st.kind === "self" || prevActor === dst ? st.actor : prevActor || st.actor);
    const crosses = src !== dst;
    if (rung === 1 && !crosses && st.i !== focus) { hidden++; }
    else { shown.push({ ...st, src, dst, hiddenBefore: hidden }); hidden = 0; }
    prevActor = st.to ? st.to : st.actor;
  }
  const rows = shown.map(st => {
    const x1 = xOf(st.src), x2 = xOf(st.dst);
    // the label starts beside its own arrow, and slides left rather than off the pane
    let lx = (st.kind === "self" || x1 === x2) ? xOf(st.actor) + 48 : Math.min(x1, x2) + 14;
    let lw = W - 12 - lx;
    if (lw < 250) { lx = Math.max(X0 + 4, W - 12 - 250); lw = W - 12 - lx; }
    const title = wrap(st.title, Math.min(lw, 460), F.nameSm, 2);
    /* Rung 3 is Evidence: every step names the file that carries it, and the
       paragraph belongs to the one step being followed. Twelve paragraphs is
       three screens, and the rung would not fit the stage it is drawn for. */
    const prose = st.i === focus ? wrap(st.prose, Math.min(lw, 560), F.prose, 4) : [];
    const at = (rung >= 3 || st.i === focus) ? [st.at[0].split("/").pop() + ":" + st.at[1]] : [];
    const h = 16 + title.length * LH.nameSm + (prose.length ? 6 + prose.length * LH.prose : 0) + (at.length ? 4 + LH.meta : 0) + 12;
    return { st, title, prose, at, lx, lw, h };
  });

  let y = headH + 26;
  const frames = [];
  rows.forEach((r, i) => {
    r.y = y;
    const isFrame = r.st.kind === "alt" || r.st.kind === "loop";
    const prev = rows[i - 1];
    if (isFrame) {
      const cont = prev && (prev.st.kind === r.st.kind) && frames.length && frames[frames.length - 1].kind === r.st.kind && frames[frames.length - 1].endIdx === i - 1;
      if (cont) { const f = frames[frames.length - 1]; f.endIdx = i; f.dividers.push(y - 6); }
      else { frames.push({ kind: r.st.kind, startIdx: i, endIdx: i, dividers: [] }); y += 16; r.y = y; }
    }
    y += r.h;
  });
  frames.forEach(f => {
    const a = rows[f.startIdx], b = rows[f.endIdx];
    f.top = a.y - 22; f.bot = b.y + b.h - 6;
  });
  const bodyBottom = y + 10;

  let s = "";
  frames.forEach(f => {
    const x0 = X0 - 8, x1 = W - 10;
    s += R(x0, f.top, x1 - x0, f.bot - f.top, "frame", 4);
    const label = f.kind === "alt" ? "alt" : "loop";
    const lw2 = tw(label, F.meta) + 16;
    s += `<path d="M${x0},${f.top} h${lw2} l8,14 v0 h-${lw2 + 8} z" class="frame-tab"/>`;
    s += T(x0 + 8, f.top + 12, [label], "t-meta", LH.meta);
    f.dividers.forEach(dy => { s += `<path d="M${x0},${dy} L${x1},${dy}" class="rule-hair"/>`; });
  });
  heads.forEach((h, i) => {
    const x = X0 + i * COL;
    const sel = state.sel === h.id;
    s += R(x, 0, HEADW, headH, "box" + (sel ? " sel" : (A[h.id].external ? " ext" : "")), 8);
    s += T(x + 10, 20, h.nl, "t-name-sm", LH.nameSm);
    if (rung >= 2) s += T(x + 10, 20 + (h.nl.length - 1) * LH.nameSm + 16, [A[h.id].parent === "argo" ? h.id : (A[h.id].parent || "")], "t-path", LH.meta);
    s += hit(x, 0, HEADW, headH, h.id);
    s += `<path d="M${x + HEADW / 2},${headH} L${x + HEADW / 2},${bodyBottom}" class="life"/>`;
  });
  rows.forEach(r => {
    const st = r.st;
    const onPath = st.i === focus;
    const lit = onPath || (focus < 0 && state.sel && (state.sel === st.actor || state.sel === st.src || state.sel === st.dst));
    const x1 = xOf(st.src), x2 = xOf(st.dst);
    const ly = r.y + 6 + r.title.length * LH.nameSm;
    const lx = r.lx;
    if (st.kind === "self" || x1 === x2) {
      const x = xOf(st.actor);
      s += `<path d="M${x},${ly} h30 v18 h-24" class="edge ${SENSE.data.cls}${lit ? " lit" : ""}" marker-end="url(#h-${lit ? "lit-" : ""}solid)"/>`;
    } else {
      const sense = st.kind === "return" ? "call" : "data";
      s += arrow(`M${x1 + (x2 > x1 ? 4 : -4)},${ly + 4} L${x2 + (x2 > x1 ? -6 : 6)},${ly + 4}`, sense, lit);
    }
    // the step's own number, so a sequence can be talked about in order
    s += T(NUMW, r.y + 12, [String(st.i + 1)], "t-num", 12, "end");
    if (st.hiddenBefore) s += T(NUMW, r.y - 4, ["+" + st.hiddenBefore], "t-meta", LH.meta, "end");
    const plateW = Math.max(
      ...r.title.map(l => tw(l, F.nameSm)),
      ...(r.prose.length ? r.prose.map(l => tw(l, F.prose)) : [0])) + 16;
    s += `<rect x="${lx - 8}" y="${r.y - 1}" width="${plateW}" height="${r.title.length * LH.nameSm + 5}" class="lbl-mask" rx="3"/>`;
    s += T(lx, r.y + 12, (onPath ? ["◆ " + r.title[0]].concat(r.title.slice(1)) : r.title), "t-name-sm", LH.nameSm);
    if (r.prose.length) {
      s += `<rect x="${lx - 8}" y="${ly + 14}" width="${plateW}" height="${r.prose.length * LH.prose + 6}" class="lbl-mask" rx="3"/>`;
      s += T(lx, ly + 26, r.prose, "t-prose", LH.prose);
    }
    if (r.at.length) s += T(lx, ly + 26 + r.prose.length * LH.prose + 12, r.at, "t-path", LH.meta);
    if (st.answers && flow.steps[st.answers - 1]) {
      const t = "↩ answers step " + st.answers + " · " + flow.steps[st.answers - 1].title;
      s += T(lx, r.y - 6, wrap(t, r.lw, F.meta, 1), "t-meta", LH.meta);
    }
    const hx = Math.min(x1, x2, lx) - 10;
    const hw = Math.min(W - hx - 2, Math.max(Math.abs(x2 - x1) + 300, r.lw + 30));
    s += `<rect x="${hx}" y="${r.y - 4}" width="${Math.max(1, hw)}" height="${r.h}" class="hit step" tabindex="0" role="button"
      ${onPath ? 'data-focused="1"' : ""} aria-label="${esc("Step " + (st.i + 1) + " — " + st.title)}"
      data-focus="${flow.id}:${st.i}" data-sel="${esc(st.actor)}"/>`;
  });

  const pick = `<div class="picker">` + flows.map(f =>
    `<button data-flow="${f.id}" aria-current="${f.id === flow.id}" aria-label="${esc(f.name + " — " + (f.steps || []).length + " steps")}">${esc(f.name)}<i>${(f.steps || []).length} steps · ${f.parts.length} lifelines</i></button>`).join("") + `</div>`;
  return { svg: fig(W, bodyBottom + 20, s), pre: pick,
    note: rung === 1 ? "Only the steps that cross a lifeline are drawn, and each keeps the number it has in the whole sequence. A <b>+n</b> above a number counts the steps that stayed inside one part."
      : rung === 3 ? "Every step names the file it happens in. Click a step for its paragraph."
      : "Time runs down, and every step carries its number in the sequence." };
}

/* ================================================================ COCKPIT == */
const WIRE = {
  "u-shell":    [0, 0, 1180, 800],
  "u-toolbar":  [0, 0, 1180, 54],
  "u-sidebar":  [0, 54, 272, 746],
  "u-tickets":  [288, 70, 892, 730],
  "u-deck":     [272, 54, 908, 746],
  "u-connect":  [40, 330, 372, 230],
  "u-header":   [284, 116, 884, 50],
  "u-agents":   [284, 182, 124, 600],
  "u-feed":     [420, 182, 486, 600],
  "u-minimap":  [918, 182, 46, 600],
  "u-evidence": [976, 182, 192, 600],
  "u-plan":     [432, 240, 462, 34],
  "u-prose":    [432, 286, 462, 96],
  "u-call":     [432, 390, 462, 96],
  "u-ask":      [432, 494, 462, 96],
  "u-media":    [432, 598, 462, 96],
  "u-composer": [432, 702, 462, 68]
};
const RUNG_SHOW = {
  1: ["u-shell", "u-toolbar", "u-sidebar", "u-tickets", "u-deck", "u-connect"],
  2: ["u-shell", "u-toolbar", "u-sidebar", "u-tickets", "u-deck", "u-header", "u-agents", "u-feed", "u-minimap", "u-evidence", "u-connect"],
  3: ["u-shell", "u-toolbar", "u-sidebar", "u-tickets", "u-deck", "u-header", "u-agents", "u-feed", "u-minimap", "u-evidence",
      "u-plan", "u-prose", "u-call", "u-ask", "u-media", "u-composer", "u-connect"]
};
/* The window is a containment tree, so it drills the way Structure does: the
   subject fills the canvas and its siblings drop to the strip. A region with
   nothing drawn inside it carries no drill mark. */
const CHILDREN = {
  "u-shell": ["u-toolbar", "u-sidebar", "u-deck", "u-tickets", "u-connect"],
  "u-deck":  ["u-header", "u-agents", "u-feed", "u-minimap", "u-evidence"],
  "u-feed":  ["u-plan", "u-prose", "u-call", "u-ask", "u-media", "u-composer"]
};
const CHILD_RUNG = { "u-shell": 1, "u-deck": 2, "u-feed": 3 };
const COCK_PARENT = {};
for (const p of Object.keys(CHILDREN)) for (const c of CHILDREN[p]) COCK_PARENT[c] = p;
function cockpitKin(id) {
  const out = [];
  for (const c of (CHILDREN[id] || [])) { out.push(c); out.push(...cockpitKin(c)); }
  return out;
}
function cockpitStrip(subject) {
  if (subject === "u-shell") return "";
  const sibs = (CHILDREN[COCK_PARENT[subject]] || []).filter(id => id !== subject);
  const items = sibs.map(id => {
    const n = A[id], can = (CHILDREN[id] || []).length;
    return `<button class="ctx-item" ${can ? `data-drill="${id}"` : `data-sel="${id}"`}
      aria-label="${esc(n.name + (can ? " — open as the subject" : " — select"))}"><b>${esc(n.name)}</b><i>z ${n.region.z}${can ? " · " + can + " inside " + OPEN : ""}</i></button>`;
  }).join("");
  return `<div class="strip"><button class="up" data-drill="u-shell" aria-label="Back to the whole window">← the whole window</button>${items}
    <span class="strip-note">${esc(A[subject].name)} is the subject — the rest of ${esc(A[COCK_PARENT[subject]].name)}, beside it</span></div>`;
}
function renderCockpit() {
  const rung = state.rung;
  const zoom = CHILDREN[state.zoom] ? state.zoom : null;
  const subject = zoom || "u-shell";
  const keep = new Set([subject].concat(cockpitKin(subject)));
  const ids = RUNG_SHOW[rung].filter(id => keep.has(id));
  const [vx, vy, vw, vh] = WIRE[subject];
  /* the wire is a fixed 1180 × 800; it is scaled to the pane, never drawn past it */
  const NOTEW = Math.max(150, Math.min(250, Math.round(BUD * 0.21)));
  const OX = 16, OY = 34, GAPN = 28;
  const k = Math.min((BUD - OX - GAPN - NOTEW) / vw, Math.max(560, BUDH - (zoom ? 240 : 130)) / vh, 2.4);
  const AX = Math.round(OX + vw * k + GAPN);
  const sx = x0 => OX + (x0 - vx) * k, sy = y0 => OY + (y0 - vy) * k;
  const lens = state.roomLens ? new Set(A[state.roomLens].renders || []) : null;
  const notes = [];
  let s = "", chips = "";
  s += T(OX, 18, [ids.length + (ids.length === 1 ? " REGION" : " REGIONS") + " AT THIS RUNG" +
    (zoom ? " · INSIDE " + A[subject].name.toUpperCase() : "") +
    (lens ? " · LIT: " + A[state.roomLens].name.toUpperCase() : "")], "t-cap", 13);
  const metaOf = n => {
    const bits = ["z " + n.region.z];
    if (n.region.room) bits.push("room: " + n.region.room);
    const out = [bits.join(" · ")];
    if (rung >= 3) out.push(n.lines.toLocaleString() + " ln · " + n.region.evidence[0].split("/").pop() + ":" + n.region.evidence[1]);
    return rung >= 2 ? out : [];
  };
  for (const id of ids) {
    const n = A[id], r = n.region, [x0, y0, w0, h0] = WIRE[id];
    const x = sx(x0), y = sy(y0), w = w0 * k, h = h0 * k;
    const sel = state.sel === id;
    const ghost = id === "u-tickets";
