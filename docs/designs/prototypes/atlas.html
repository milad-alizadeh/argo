    const faded = lens && !lens.has(id) && id !== subject;
    const cls = "box " + (id === "u-shell" ? "band" : ghost ? "ghost" : r.z === 1 ? "over" : "") + (sel ? " sel" : "");
    let g = R(x, y, w, h, cls.trim(), id === "u-shell" ? 10 : 6);
    const meta = metaOf(n);
    if (ghost) {
      notes.push({ y, x: x + w, id, name: n.name, lines: ["the other room in the same slot"].concat(meta), faded });
    } else if (w < 90) {
      const cx = x + w / 2, cy = y + h / 2;
      g += `<text x="${cx}" y="${cy}" class="t-name-sm" text-anchor="middle" transform="rotate(-90 ${cx} ${cy})">${esc(n.name)}</text>`;
      if (meta.length) g += `<text x="${cx + 15}" y="${cy}" class="t-meta" text-anchor="middle" transform="rotate(-90 ${cx + 15} ${cy})">${esc(meta[0])}</text>`;
    } else {
      const nl = wrap(n.name, w - 20, F.nameSm, 2);
      const need = 19 + (nl.length - 1) * LH.nameSm + meta.length * 15 + 8;
      const fits = meta.every(m => tw(m, F.meta) <= w - 20);
      // a region that draws its own children owns no interior to write in
      const hasKids = (CHILDREN[id] || []).some(c => ids.includes(c));
      const inside = need <= h && fits && !hasKids;
      if (r.z === 1) {                       // a floating region hides nothing, so it needs its own plate
        const pw = Math.max(...nl.map(l => tw(l, F.nameSm)), ...(inside ? meta.map(l => tw(l, F.meta)) : [0])) + 20;
        g += R(x + 1, y + 1, Math.min(pw, w - 2), Math.min(inside ? need - 4 : 26, h - 2), "lbl-plate", 5);
      }
      g += T(x + 10, y + 19, nl, "t-name-sm", LH.nameSm);
      if (inside) {
        let ty = y + 19 + (nl.length - 1) * LH.nameSm;
        meta.forEach(m => { ty += 15; g += T(x + 10, ty, [m], "t-meta", LH.meta); });
      } else if (meta.length) {
        notes.push({ y, x: x + w, id, name: n.name, lines: meta, faded });
      }
    }
    s += faded ? `<g class="faded">${g}</g>` : g;
    // the whole rect takes the click; a child painted after it wins its own ground
    if (!ghost) s += hit(x, y, w, h, id);
    const kids = (CHILDREN[id] || []).filter(c => ids.includes(c)).length;
    if (kids && id !== subject && w > 130 && h > 60) {
      chips += drillChip(x + w - 8, y + 5, kids + " inside", "data-drill", id);
    }
  }
  s += chips;              // after every box, so no child paints over the mark
  // Anything that would not fit inside its own box is said in the margin instead.
  let last = 0;
  notes.sort((a, b) => a.y - b.y).forEach(nt => {
    const ny = Math.max(nt.y + 14, last + 22);
    let g = "";
    if (nt.x + 40 > OX + vw * k) {  // a leader from deep inside the window crosses more than it explains
      g += `<path d="M${nt.x},${nt.y + 12} L${nt.x + 12},${nt.y + 12} L${AX - 12},${ny - 4} L${AX - 6},${ny - 4}" class="rule-hair"/>`;
    }
    g += T(AX, ny, wrap(nt.name, NOTEW - 8, F.nameSm, 2), "t-name-sm", LH.nameSm);
    // a note is wrapped to its own column: an evidence path is longer than one line of it
    const nl = nt.lines.flatMap(l => wrap(l, NOTEW - 8, rung >= 3 ? F.path : F.meta, 2));
    g += T(AX, ny + 14, nl, rung >= 3 ? "t-path" : "t-meta", LH.meta);
    s += nt.faded ? `<g class="faded">${g}</g>` : g;
    // the margin note is the ghost's only clickable ground, its box being under the deck
    s += hit(AX - 6, ny - 13, NOTEW, 17 + nl.length * LH.meta, nt.id);
    last = ny + 14 + nl.length * LH.meta;
  });
  const roomStrip = state.roomLens
    ? `<div class="strip"><button class="up" data-room="" aria-label="Show every region again">← every region</button>
       <span class="strip-note">Lit: ${esc(A[state.roomLens].name)} — the ${(A[state.roomLens].renders || []).length} region${(A[state.roomLens].renders || []).length === 1 ? "" : "s"} the content says draw${(A[state.roomLens].renders || []).length === 1 ? "s" : ""} it.</span></div>`
    : "";
  return { svg: fig(Math.min(BUD, AX + NOTEW), Math.max(OY + vh * k + 24, last + 30), s),
    pre: cockpitStrip(subject) + roomStrip,
    note: zoom ? null : "Each region is a rectangle of the real window. The mark on a region opens it as the subject; a click anywhere else on it selects it." };
}

/* ============================================================= VOCABULARY == */
function spellers(cid) { return parts.filter(p => (p.concepts || []).includes(cid)); }
/* Rung 3 is one word at a time. Eight cards, each carrying its meaning, its
   cross-links and its anchors, is nearly three screens of figure, and the pane
   the figure is drawn in is one. */
function vocabOneWord() {
  const c = concepts.find(x => x.id === state.sel) || concepts[0];
  const sp = spellers(c.id), fl = flows.filter(f => (f.concepts || []).includes(c.id));
  const rail = `<div class="picker">` + concepts.map(x =>
    `<button data-pick="${x.id}" aria-current="${x.id === c.id}" aria-label="${esc(x.name)}">${esc(x.name)}</button>`).join("") + `</div>`;
  const body = `<div class="gl-card" data-on="true" style="max-width:900px">
    <div class="gl-term">${esc(c.name)}</div>
    <div class="gl-line">${esc(c.line)}</div>
    <div class="gl-body">${(c.short || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <div class="gl-refs"><span class="chip">spelled in</span>${sp.map(p =>
      `<span class="chip link" data-goto="structure:${p.id}">${esc(p.name)}</span>`).join("")}
      ${fl.length ? `<span class="chip">crossed by</span>` + fl.map(f => `<span class="chip link" data-goto="runtime:${f.id}">${esc(f.name)}</span>`).join("") : ""}</div>
    <div class="gl-ev">${(c.evidence || []).map(([p, l, w]) =>
      `<div class="anchor"><b>${esc(p)}</b>:${l}</div><div class="what">${esc(w)}</div>`).join("")}</div></div>`;
  return { html: rail + body };
}
function renderVocabulary() {
  const rung = state.rung;
  if (rung >= 3) return vocabOneWord();
  const cards = concepts.map(c => {
    const sp = spellers(c.id), fl = flows.filter(f => (f.concepts || []).includes(c.id));
    /* Rung 3 is Evidence, and evidence is what it adds. The long form is a
       screen and a half per word, so it stays behind the panel's disclosure. */
    let body = "";
    if (rung >= 2) body += `<div class="gl-body">` + (c.short || []).map(p => `<p>${esc(p)}</p>`).join("") + `</div>`;
    let refs = "";
    if (rung >= 2) {
      refs = `<div class="gl-refs"><span class="chip">spelled in</span>` +
        sp.map(p => `<span class="chip link" data-goto="structure:${p.id}">${esc(p.name)}</span>`).join("") +
        (fl.length ? `<span class="chip">crossed by</span>` + fl.map(f => `<span class="chip link" data-goto="runtime:${f.id}">${esc(f.name)}</span>`).join("") : "") +
        `</div>`;
    }
    let ev = "";
    if (rung >= 3) {
      const all = c.evidence || [], show = all.slice(0, 2);
      ev = `<div class="gl-ev">` + show.map(([p, l, w]) =>
        `<div class="anchor"><b>${esc(p)}</b>:${l}</div><div class="what">${esc(w)}</div>`).join("") +
        (all.length > show.length ? `<div class="what">${all.length - show.length} more anchors — in the panel</div>` : "") + `</div>`;
    }
    return `<div class="gl-card" data-on="${state.sel === c.id}" data-pick="${c.id}" tabindex="0" role="button"
      aria-label="${esc(c.name + " — " + c.line)}">
      <div class="gl-term">${esc(c.name)}</div>
      <div class="gl-line">${esc(c.line)}</div>${body}${refs}${ev}</div>`;
  }).join("");
  return { html: `<div class="glossary">${cards}</div>` };
}

/* ================================================================== RULES == */
/* Where each rule lands on the layer figure. The rules carry no coordinates, so this
   mapping is read off each statement by hand and is the one authored thing here. */
const RULE_MARK = {
  "no-live-hub-in-views":     { kind: "edge", from: "ui", to: "engine", say: "live Hub — one file only" },
  "engine-links-no-ui":       { kind: "edge", from: "engine", to: "ui", say: "no SwiftUI, AppKit or ArgoUI" },
  "app-target-declares-no-view": { kind: "badge", on: "app", say: "declares no View" },
  "app-target-line-cap":      { kind: "badge", on: "app", say: "under 600 code lines" },
  "projection-is-total":      { kind: "badge", on: "ui", say: "every HubSession fact lands, or is named" },
  "initializer-parameter-cap":{ kind: "everywhere", say: "every initializer, in every target" }
};
function renderRules() {
  const rung = state.rung;
  const rules = A.argo.rules || [];
  const sel = rules.find(r => r.id === state.sel);
  /* The figure answers the rung: rung 1 marks where each rule lands and counts
     them, rung 2 names each mark, rung 3 keeps the names and drops every mark
     but the one selected to a whisper. */
  const FIGW = Math.max(320, Math.min(440, Math.round(BUD * 0.36)));
  const BX = 6, BW = Math.min(200, Math.round(FIGW * 0.46)), BH = 58;
  // only the ui → engine gap carries marks, so only it is given the room for them
  const GAPS = { app: 46, ui: 104, engine: 0 };
  const TX = BX + BW + 18, TW = FIGW - TX - 6;
  const order = ["app", "ui", "engine"];
  let s = "", y = 34;
  const at = {};
  order.forEach(id => { at[id] = y; y += BH + GAPS[id]; });
  const figBottom = y;
  s += T(BX, 18, ["WHERE EACH RULE LANDS · SCALE " + rung + " OF 3"], "t-cap", 13);

  // one tag, drawn where the rule lands, and never at rung 1
  const tag = (r, x, ty, w) => {
    const isSel = sel && sel.id === r.id;
    if (rung === 1) return { svg: "", h: 0 };
    const lines = wrap((isSel ? "◆ " : "· ") + RULE_MARK[r.id].say, w, F.edge, 3);
    let g = T(x, ty, lines, isSel ? "t-edge" : "t-meta", LH.edge);
    const h = lines.length * LH.edge;
    // the file that enforces it is the table's column; the figure never restates it
    const faded = rung >= 3 && sel && !isSel;
    return { svg: faded ? `<g class="faded">${g}</g>` : g, h: h + 6 };
  };

  order.forEach(id => {
    const mark = sel && RULE_MARK[sel.id];
    const lit = mark && (mark.on === id || mark.from === id || mark.to === id || mark.kind === "everywhere");
    s += R(BX, at[id], BW, BH, "box band" + (lit ? " sel" : ""), 8);
    s += T(BX + 12, at[id] + 24, [A[id].name], "t-name", LH.name);
    s += T(BX + 12, at[id] + 42, [A[id].lines.toLocaleString() + " lines"], "t-meta", LH.meta);
    const badges = rules.filter(r => RULE_MARK[r.id] && RULE_MARK[r.id].kind === "badge" && RULE_MARK[r.id].on === id);
    if (!badges.length) return;
    if (rung === 1) {
      s += T(TX, at[id] + 24, [badges.length + (badges.length === 1 ? " rule here" : " rules here")], "t-meta", LH.meta);
      return;
    }
    let by = at[id] + 20;
    badges.forEach(r => { const t = tag(r, TX, by, TW); s += t.svg; by += t.h; });
  });

  const gy0 = at.ui + BH, gy1 = at.engine;
  let ty = gy0 + 26;
  [["ui", "engine", BX + 52], ["engine", "ui", BX + BW - 40]].forEach(([f, t, x]) => {
    const rule = rules.find(r => RULE_MARK[r.id] && RULE_MARK[r.id].kind === "edge" && RULE_MARK[r.id].from === f && RULE_MARK[r.id].to === t);
    const isSel = sel && rule && sel.id === rule.id;
    const down = f === "ui";
    s += `<path d="${down ? `M${x},${gy0 + 6} L${x},${gy1 - 6}` : `M${x},${gy1 - 6} L${x},${gy0 + 6}`}" class="edge forbidden" marker-end="url(#h-open)"/>`;
    const mid = (gy0 + gy1) / 2;
    s += `<circle cx="${x}" cy="${mid}" r="11" class="lbl-plate"/>`;
    s += `<path d="M${x - 7},${mid + 7} L${x + 7},${mid - 7} M${x - 7},${mid - 7} L${x + 7},${mid + 7}" class="strike${isSel ? " lit" : ""}"/>`;
    if (rung === 1) return;
    s += `<path d="M${x + 12},${mid} L${TX - 6},${ty - 4}" class="rule-hair"/>`;
    const tt = tag(rule, TX, ty, TW); s += tt.svg; ty += tt.h + 8;
  });
  if (rung === 1) s += T(TX, (gy0 + gy1) / 2, ["2 refused dependencies"], "t-meta", LH.meta);

  const ev = rules.find(r => RULE_MARK[r.id].kind === "everywhere");
  s += `<path d="M${BX},${figBottom + 22} L${FIGW - 8},${figBottom + 22}" class="rule-hair"/>`;
  const evT = rung === 1 ? { svg: T(BX, figBottom + 40, ["1 rule, in every target"], "t-meta", LH.meta), h: LH.meta }
                         : tag(ev, BX, figBottom + 40, FIGW - 20);
  s += evT.svg;

  const table = `<table class="rules"><thead><tr>
      <th style="width:46%">The rule</th>${rung >= 2 ? "<th>Enforced in scripts/</th>" : ""}<th class="id">id</th></tr></thead><tbody>` +
    rules.map(r => `<tr data-pick="${r.id}" data-on="${state.sel === r.id}" tabindex="0" role="button" aria-label="${esc(r.id + " — " + r.statement)}">
      <td><div class="stmt">${esc(r.statement)}</div>${rung >= 3 ? `<div class="breaks">${esc(r.what_breaks)}</div>` : ""}</td>
      ${rung >= 2 ? `<td><div class="anchor"><b>${esc(r.enforced_at[0].split("/").pop())}</b>:${r.enforced_at[1]}</div>${r.adr ? `<div class="what">${esc(r.adr)}</div>` : `<div class="what">no ADR</div>`}</td>` : ""}
      <td class="id">${esc(r.id)}</td></tr>`).join("") + `</tbody></table>`;

  return { html: `<div class="rules-wrap"><div class="fig-col">${fig(FIGW, figBottom + 60 + evT.h, s)}</div><div class="tbl-col">${table}</div></div>` };
}

/* ==================================================================== ASK ==
   Every answer below is read out of the atlas content. Nothing is generated. */
function edgesBetween(a, b) {
  const out = [];
  const scan = list => { for (const e of (list || [])) if ((e[0] === a && e[1] === b) || (e[0] === b && e[1] === a)) out.push(e); };
  scan((A[a] || {}).leaving); scan((A[b] || {}).leaving); scan(A.argo.among);
  const seen = new Set();
  return out.filter(e => { const k = e.join("|"); if (seen.has(k)) return false; seen.add(k); return true; });
}
function flowsTouching(a, b) {
  const res = [];
  for (const f of flows) {
    const touches = id => (f.steps || []).some(s => s.actor === id || s.from === id || s.to === id);
    if (!touches(a) || !touches(b)) continue;
    const joint = (f.steps || []).map((s, i) => ({ s, i })).filter(({ s }) => {
      const set = [s.actor, s.from, s.to].filter(Boolean);
      return set.includes(a) && set.includes(b);
    });
    res.push({ f, joint });
  }

    btns.push(discBtn("more", "the paragraphs", (paras.length + extra.length) + " para"));
    panes.push(discPane("more", () => paras.map(p => `<p>${esc(p)}</p>`).join("") +
      (extra.length ? `<h3>What you can do here</h3>` + extra.map(d => `<p>· ${esc(d)}</p>`).join("") : "") +
      ((n.long || []).length
        ? disc("full", "the long form", n.long.length + " para", () => n.long.map(p => `<p>${esc(p)}</p>`).join(""))
        : "")));
  }
  if (anchors.length) {
    btns.push(discBtn("anchorsOpen", "where to look", anchors.length));
    panes.push(discPane("anchorsOpen", () => anchorRows(anchors)));
  }
  return { foot: btns.length ? `<div class="p-foot">${btns.join("")}</div>` : "", panes: panes.join("") };
}
/* argo-observe states no folder of its own, but the first file of its way in
   sits in one, and a row every other target carries may not silently go missing
   on one of them. */
function anchorFolder(n) {
  const first = orderedAnchors(n)[0];
  if (!first) return null;
  const dir = first[0].split("/").slice(0, -1).join("/");
  return dir.split("/").length > 3 ? dir : null;
}

/* A group is a subject too, and wherever its name appears it carries its path. */
function groupPanelFor(id) {
  const g = GROUPS[id].def, mem = membersOf(id);
  const ids = new Set(mem.map(m => m.id));
  let out = 0, into = 0;
  for (const m of mem) {
    for (const e of (m.leaving || [])) if (!ids.has(e[1])) out++;
    for (const e of (INCOMING[m.id] || [])) if (!ids.has(e[0])) into++;
  }
  const head = headHTML("group · inside " + A[GROUPS[id].owner].name, g.name);
  let h = `<div class="p-line">${esc(g.line)}</div>`;
  h += `<div class="p-sec"><h3>Where it is</h3>
    <div class="p-fact"><b>folders</b><span><span class="path">${esc(g.path)}</span></span></div>
    <div class="p-fact"><b>size</b><span>${mem.length} components · ${mem.reduce((a, m) => a + m.lines, 0).toLocaleString()} lines</span></div>
    <div class="p-fact"><b>lines</b><span>${out} leave the group, ${into} arrive from outside it</span></div></div>`;
  /* Names only. A child's sentence chopped at its first comma is a false
     sentence, and the child's own panel is one click away. */
  const row = m => `<div class="edge-item"><span class="to">${nameLink(m.id)}</span></div>`;
  h += `<div class="p-sec"><h3>Holds ${mem.length}</h3>` + mem.slice(0, CAP).map(row).join("") + `</div>`;
  if (mem.length > CAP) h += disc("holdsOpen", "the other components", "+" + (mem.length - CAP) + " more",
    () => mem.slice(CAP).map(row).join(""));
  const f = readingFoot(g, groupAnchors(mem));
  return { head, body: h + f.panes, foot: f.foot };
}
function panelFor(id) {
  if (GROUPS[id]) return groupPanelFor(id);
  const n = A[id];
  if (!n) return null;
  const kind = n.kind === "part" ? (n.external ? "outside Argo" : "part · depth " + n.depth)
    : n.kind === "room" ? "room" : n.kind;
  const head = headHTML(kind, n.name);
  let h = `<div class="p-line">${esc(n.line)}</div>`;

  /* "Where it is" is for things that are somewhere. A word and a flow are not
     in a folder, and "inside Argo" is a row that tells nobody anything. */
  const facts = [];
  if (n.kind === "part") {
    // the group's own folders are one drill away; its name is enough here
    if (n.group) facts.push(["group", esc(groupName(n.group)), ""]);
    const folder = n.path || (n.depth === 1 ? anchorFolder(n) : null);
    if (folder) facts.push(["folder", "", esc(folder)]);
    if (n.parent && A[n.parent] && n.depth > 1) facts.push(["inside", esc(A[n.parent].name), ""]);
    if (n.lines) facts.push(["size", n.lines.toLocaleString() + " lines", ""]);
    if (n.region) facts.push(["on screen", "z " + n.region.z + (n.region.room ? " · room: " + esc(n.region.room) : " · always drawn"), ""]);
  }
  if (facts.length) {
    h += `<div class="p-sec"><h3>Where it is</h3>` + facts.map(([k, v, p]) =>
      `<div class="p-fact"><b>${k}</b><span>${v}${v && p ? "<br>" : ""}${p ? `<span class="path">${p}</span>` : ""}</span></div>`).join("") + `</div>`;
  }
  if (n.kind === "room" && (n.renders || []).length) {
    h += `<div class="p-sec"><h3>Drawn by ${n.renders.length}</h3><div class="gl-refs">` + n.renders.map(r =>
      `<span class="chip link" data-room-goto="${esc(n.id)}:${esc(r)}">${esc(A[r].name)}</span>`).join("") + `</div></div>`;
  }
  /* A flow is an ordered sequence and used to show none of it. Three, in order,
     with the rest one click away. */
  if ((n.steps || []).length) {
    const st = n.steps, srow = (s, i) => `<div class="edge-item"><span class="to">${i + 1}</span><span>${esc(s.title)}</span></div>`;
    h += `<div class="p-sec"><h3>Steps (${st.length})</h3>` + st.slice(0, CAP).map(srow).join("") + `</div>`;
    if (st.length > CAP) h += disc("stepsOpen", "the other steps", "+" + (st.length - CAP) + " more",
      () => st.slice(CAP).map((s, i) => srow(s, i + CAP)).join(""));
  }
  const out = oneAltitude(n.leaving || [], 1), inc = oneAltitude(INCOMING[id] || [], 0);
  h += edgeSection("Lines out", "outOpen", out, 1);
  // both are available and one is open: what leaves is the reading, what arrives is asked for
  if (inc.length) h += disc("inOpen", "what reaches it", inc.length, () => edgeRows(inc, 0));
  if ((n.inside || []).length && n.kind !== "room") {
    h += disc("holdsOpen", "what it holds", n.inside.length, () => n.inside.map(cid =>
      `<div class="edge-item"><span class="to">${nameLink(cid)}</span></div>`).join(""));
  }
  h += chipSection("Words it spells", "wordsOpen", (n.concepts || []).map(c => A[c]), x => "vocabulary:" + x.id);
  /* A word is not in a folder, so its connections are the whole of where it is:
     which parts spell it, and which flows cross it. */
  if (n.kind === "concept") {
    h += chipSection("Spelled in", "spelledOpen", spellers(n.id), x => "structure:" + x.id);
    h += chipSection("Crossed by", "crossedOpen", flows.filter(f => (f.concepts || []).includes(n.id)), x => "runtime:" + x.id);
  }
  const f = readingFoot(n, orderedAnchors(n));
  return { head, body: h + f.panes, foot: f.foot };
}
function ruleFor(id) {
  const r = (A.argo.rules || []).find(x => x.id === id);
  if (!r) return null;
  // the human sentence is the title; the machine id is metadata, which is what it is
  const head = headHTML("rule", r.statement, r.id);
  let h = `<div class="p-sec"><h3>Enforced at</h3><div class="anchor"><b>${esc(r.enforced_at[0])}</b>:${r.enforced_at[1]}</div>
      <div class="what">${esc(r.adr || "no ADR")}</div></div>`;
  // a rule is about targets, so it states them like every other kind states its edges
  const m = RULE_MARK[id];
  if (m) {
    const on = m.kind === "everywhere" ? TARGETS.slice() : [m.on, m.from, m.to].filter(Boolean);
    h += `<div class="p-sec"><h3>Lands on (${on.length})</h3>` + on.map(t =>
      `<div class="edge-item"><span class="to">${nameLink(t)}</span></div>`).join("") + `</div>`;
  }
  h += `<div class="p-sec"><h3>What breaks</h3><p>${esc(r.what_breaks)}</p></div>`;
  return { head, body: h };
}
function routeChrome() {
  const r = routeById(state.route), i = state.step, step = r.steps[i];
  const body = `<h2>${esc(step.h)}</h2>` +
    (step.p || []).map(p => `<p>${esc(p)}</p>`).join("") +
    (step.src ? `<div class="src"><b>in the source:</b><br>${esc(step.src[0])}<br>line ${step.src[1]}</div>` : "");
  const asp = ASPECTS.find(a => a.id === state.aspect);
  const where = [asp.name, asp.rungs[state.rung - 1]]
    .concat(state.zoom ? ["zoom: " + A[state.zoom].name] : [])
    .concat(state.group ? ["group: " + groupName(state.group) + " \u2014 " + groupPath(state.group)] : [])
    .concat(state.roomLens ? ["lens: " + A[state.roomLens].name] : [])
    .concat(state.sel ? ["selected: " + nameOf(state.sel)] : []).join(" \u00b7 ");
  const last = i === r.steps.length - 1;
  /* The last step hands the panel back. Its own prose points at the annotation
     the route is standing on, so the route has to say plainly that it is done
     and what to read next. */
  const end = last ? `<div class="r-end"><h3>End of the route</h3>
      <p>That is all ${r.steps.length} steps. Leave the route and the panel goes back to annotating whatever is selected \u2014 which is where this step has left you.</p>
      <div class="r-next">` +
      ROUTES.filter(x => x.id !== r.id).map(x =>
        `<button class="disc" data-route="${x.id}">Walk \u201c${esc(x.n)}\u201d<i>${x.steps.length} steps</i></button>`).join("") +
      `</div></div>` : "";
  return `<div class="r-bar"><span class="title">${esc(r.n)}</span>
      <span class="count">${i + 1}/${r.steps.length}</span>
      <span class="ticks">${r.steps.map((_, k) => `<span class="tick ${k === i ? "now" : (k < i ? "done" : "")}"></span>`).join("")}</span></div>
    <div class="p-body r-body">${body}${end}<div class="r-view">the view this step sets<br>${esc(where)}</div></div>
    <div class="r-foot">
      <button class="nav" data-rstep="${i - 1}" ${i === 0 ? "disabled" : ""}>\u2190 Back</button>
      ${last ? `<button class="nav primary" data-leave="1">Give the panel back</button>`
             : `<button class="nav primary" data-rstep="${i + 1}">Next \u2192</button>`}
      <button class="leave" data-leave="1">Leave the route, keep this view</button>
      <span class="hint">\u2190 \u2192 to move \u00b7 esc to leave</span>
    </div>`;
}
function routeMenuHTML() {
  const res = state.resume && routeById(state.resume.route);
  return `<h4>Routes — a camera path over these same figures</h4>` +
    ROUTES.map(r => `<button data-route="${r.id}"><b>${esc(r.n)}</b><span>${esc(r.line)}</span>
      <em>${r.steps.length} steps</em></button>`).join("") +
    (res ? `<h4>Where you stopped</h4><button data-resume="1"><b>Resume \u201c${esc(res.n)}\u201d</b><span>at step ${state.resume.step + 1} of ${res.steps.length}</span></button>` : "");
}

/* What the fold hides, said out loud, so nobody mistakes the edge for the end.
   The noun is the aspect's own, so a region is never counted as a target. */
const FOLD_KINDS = {
  product:   [["rect.cmp", "rooms"]],
  context:   [["rect.ext", "neighbours"]],
  structure: [["rect.cmp", "components"], ["rect.grp", "groups"], ["rect.band", "targets"]],
  runtime:   [["rect.step", "steps"]],
  cockpit:   [["rect.box", "regions"]],
  rules:     [["rect.band", "targets"]]
};
function updateFold() {
  const stage = document.getElementById("stage"), el = document.getElementById("fold");
  const fold = stage.getBoundingClientRect().bottom;
  const left = stage.scrollHeight - stage.clientHeight - stage.scrollTop;
  if (left <= 40) { el.hidden = true; return; }
  let n = 0, noun = "";
  for (const [sel, word] of (FOLD_KINDS[state.aspect] || [])) {
    n = [...stage.querySelectorAll(sel)].filter(e => {
      const r = e.getBoundingClientRect();
      return (r.top + r.bottom) / 2 > fold;
    }).length;
    if (n) { noun = word; break; }
  }
  el.hidden = false;
  el.textContent = (n ? n + " more " + (n === 1 ? noun.replace(/s$/, "") : noun) : "more") + " below ↓";
}

const HEADS = {
  product: ["What Argo is for", "Three rooms and one sheet. <em>Every capability under a room is the content's own sentence, not a summary of it.</em>"],
  context: ["What Argo is, and what it touches", "One system, eleven neighbours. Every line is directed and carries the cargo the content states."],
  structure: ["What Argo is made of", "Height is layer. <em>ArgoEngine links no UI framework, so it sits at the bottom and nothing below it may reach up.</em>"],
  runtime: ["What happens, in what order", "One flow at a time. Lifelines across the top, time downward."],
  cockpit: ["Where this is on screen", "The containment tree of the cockpit window, with z-order and room."],
  vocabulary: ["What these words mean here", "Eight words the codebase uses in a narrow sense. No diagram — a diagram of a word is a lie."],
  rules: ["What you may not do", "Six rules the build enforces, and what breaks when one is broken."]
};

function render() {
  document.getElementById("aspects").innerHTML = ASPECTS.map(a =>
    `<button data-aspect="${a.id}" role="tab" aria-selected="${a.id === state.aspect}" aria-current="${a.id === state.aspect}"
      aria-label="${esc(a.name + " — " + a.q)}" title="${esc(a.q)}"><b>${a.name}</b><span>${esc(a.q)}</span></button>`).join("");
  const asp = ASPECTS.find(a => a.id === state.aspect);
  document.getElementById("rungs").innerHTML = asp.rungs.map((r, i) =>
    `<button data-rung="${i + 1}" role="tab" aria-selected="${i + 1 === state.rung}" aria-current="${i + 1 === state.rung}"
      aria-label="${esc("Scale " + (i + 1) + " of 3 — " + r)}"><i>${i + 1}</i><b>${r}</b></button>`).join("");
  measureStage();

  const out = { product: renderProduct, context: renderContext, structure: renderStructure, runtime: renderRuntime,
    cockpit: renderCockpit, vocabulary: renderVocabulary, rules: renderRules }[state.aspect]();

  const heads = HEADS[state.aspect];
  const inner = document.getElementById("inner");
  inner.innerHTML = `<div class="rung-title"><h1>${heads[0]}</h1><p>${heads[1]}</p></div>` +
    (out.strip || "") + (out.pre || "") + (out.svg || out.html || "") +
    (out.note ? `<p class="leg-note" style="margin-top:var(--s-loose);font-size:var(--t-footnote)">${out.note}</p>` : "");

  const panel = document.getElementById("panel");
  const dock = document.getElementById("askdock");
  if (state.route) {
    panel.innerHTML = routeChrome();
    dock.innerHTML = "";
  } else {
    const p = state.sel ? (panelFor(state.sel) || ruleFor(state.sel)) : null;
    // a link naming a route this atlas does not carry is answered, not swallowed
    const bad = state.badRoute
      ? `<p class="p-empty" style="color:var(--attention)">There is no route called “${esc(state.badRoute)}”. The Routes menu lists the ${ROUTES.length} this atlas carries.</p>`
      : "";
    panel.innerHTML = p
      ? p.head + `<div class="p-body">${bad}${p.body}</div>` + (p.foot || "")
      : headHTML("annotation", "Nothing selected") +
        `<div class="p-body">${bad}<p class="p-empty">Click anything on the figure. The panel states what it is, where it lives, its size, and who it is connected to — and keeps every long thing behind a control that counts it.</p></div>`;
    dock.innerHTML = askHTML();
  }
  document.getElementById("routesbtn").setAttribute("aria-expanded", String(state.menu));
  const menu = document.getElementById("routemenu");
  menu.hidden = !state.menu;
  if (state.menu) menu.innerHTML = routeMenuHTML();
  document.getElementById("legend").innerHTML = legendFor(state.aspect);
  // a step a route is standing on is brought into the pane, not left under the fold
  const lit = document.querySelector("#stage [data-focused]");
  if (lit) {
    const stage = document.getElementById("stage"), r = lit.getBoundingClientRect();
    const box = stage.getBoundingClientRect();
    if (r.top < box.top + 20 || r.bottom > box.bottom - 20) {
      stage.scrollTop += r.top - box.top - Math.max(20, (box.height - r.height) / 2);
    }
  }
  updateFold(); updatePanelEdge();
}
/* The panel says out loud that it continues, because a column that just stops
   at the Ask block reads as the end of the annotation. */
function updatePanelEdge() {
  const body = document.querySelector("#panel .p-body");
  if (!body) return;
  const left = body.scrollHeight - body.clientHeight - body.scrollTop;
  body.classList.toggle("continues", left > 8);
}
document.getElementById("stage").addEventListener("scroll", updateFold, { passive: true });
document.getElementById("panel").addEventListener("scroll", updatePanelEdge, { passive: true, capture: true });
addEventListener("resize", () => render());

/* ---------------------------------------------------------------- events -- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-aspect],[data-rung],[data-sel],[data-pick],[data-goto],[data-flow],[data-close],[data-drill],[data-zoom],[data-room],[data-room-goto],[data-disc],[data-route],[data-rstep],[data-leave],[data-shape],[data-resume],#routesbtn,#asksend");
  if (!t) { if (state.menu) go({ menu: false }); return; }
  if (t.id === "routesbtn") return go({ menu: !state.menu });
  if (t.id === "asksend") {
    const box = document.getElementById("askbox");
    if (!box.value.trim()) return;                 // an empty submit asks nothing, so it wipes nothing
    return go({ ask: parseAsk(box.value) });
  }
  if (t.dataset.shape) return go({ ask: { shape: t.dataset.shape, a: state.pair ? state.pair[0] : state.sel, b: state.pair ? state.pair[1] : null, text: "" } });
  /* Shift-click arms a pair, and it means the same thing on every figure. It is
     resolved before drilling and zooming, because on Structure and Cockpit the
     same mark carries both gestures and only the modifier tells them apart. */
  const pid = t.dataset.sel || t.dataset.pick || t.dataset.drill || t.dataset.zoom;
  if (ev.shiftKey && pid && subject(pid)) {
    ev.preventDefault();
    if (state.sel && state.sel !== pid) return go({ pair: [state.sel, pid], ask: null });
    return go({ sel: pid, pair: null });
  }
  if (t.dataset.route) return startRoute(t.dataset.route);
  if (t.dataset.resume) { state.route = state.resume.route; state.step = state.resume.step;
    applyStep(routeById(state.route).steps[state.step]); state.menu = false; writeURL(); return render(); }
  if (t.dataset.leave) return leaveRoute();
  if (t.dataset.rstep) return goStep(+t.dataset.rstep);
  if (t.dataset.disc) return go({ [t.dataset.disc]: !state[t.dataset.disc] });
  if (t.dataset.aspect) return go({ aspect: t.dataset.aspect, rung: 1, sel: null, zoom: null, group: null, roomLens: null, focus: null, pair: null, badRoute: null });
  if (t.dataset.rung) return go({ rung: +t.dataset.rung });
  if (t.dataset.close) return go({ sel: null, pair: null, badRoute: null });
  /* Drilling is its own gesture, on its own mark. A plain click selects and
     never moves the view, so a thing can be read in the picture that holds it. */
  if (t.dataset.drill) {
    const d = t.dataset.drill;
    if (state.aspect === "cockpit") return go({ zoom: d, rung: Math.max(state.rung, CHILD_RUNG[d] || 1), sel: d });
    if (GROUPS[d]) return go({ zoom: GROUPS[d].owner, group: d, rung: 3, sel: d });
    return go({ zoom: d, group: null, rung: Math.max(2, state.rung), sel: d });
  }
  if ("zoom" in t.dataset) return go({ zoom: t.dataset.zoom || null, group: null,
    rung: t.dataset.zoom ? Math.max(2, state.rung) : Math.min(2, state.rung), sel: t.dataset.zoom || null });
  if (t.dataset.flow) return go({ sel: t.dataset.flow, focus: null });
  if (t.dataset.focus) {
    const [f, i] = t.dataset.focus.split(":");
    const same = state.focus && state.focus.flow === f && state.focus.i === +i;
    return go({ focus: same ? null : { flow: f, i: +i }, sel: same ? null : t.dataset.sel });
  }
  if ("room" in t.dataset) return go({ roomLens: t.dataset.room || null });
  if (t.dataset.roomGoto) {
    const [room, id] = t.dataset.roomGoto.split(":");
    return go({ aspect: "cockpit", rung: 2, roomLens: room, sel: id });
  }
  if (t.dataset.goto) { const [a, id] = t.dataset.goto.split(":"); return go({ aspect: a, sel: id, focus: null }); }
  const id = t.dataset.sel || t.dataset.pick;
  if (!id) return;
  // a room on the Product aspect cross-links to the regions that draw it
  if (A[id] && A[id].kind === "room" && (A[id].renders || []).length && state.sel === id) {
    return go({ aspect: "cockpit", rung: 2, roomLens: id, sel: A[id].renders[0] });
  }
  return go({ sel: state.sel === id ? null : id });
});
// the selection a shift-click would otherwise paint across the figure, refused at source
document.addEventListener("mousedown", ev => {
  if (ev.shiftKey && ev.target.closest && ev.target.closest("#stage")) ev.preventDefault();
});
addEventListener("popstate", applyURL);
document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey) return;
  // a figure node is in the tab order, so Enter and Space have to reach it
  const focused = document.activeElement;
  if (focused && (ev.key === "Enter" || ev.key === " ") && focused.matches("rect.hit,[data-pick]")) {
    ev.preventDefault();
    return focused.dispatchEvent(new MouseEvent("click", { bubbles: true, shiftKey: ev.shiftKey }));
  }
  if (ev.target && ev.target.id === "askbox") {
    if (ev.key === "Enter" && ev.target.value.trim()) go({ ask: parseAsk(ev.target.value) });
    return;
  }
  if (state.route) {
    if (ev.key === "ArrowRight") return goStep(state.step + 1);
    if (ev.key === "ArrowLeft") return goStep(state.step - 1);
    if (ev.key === "Escape") return leaveRoute();
  }
  const i = "1234567".indexOf(ev.key);
  if (i >= 0) return go({ aspect: ASPECTS[i].id, rung: 1, sel: null, zoom: null, group: null, roomLens: null, focus: null, pair: null });
  if (ev.key === "[") return go({ rung: Math.max(1, state.rung - 1) });
  if (ev.key === "]") return go({ rung: Math.min(3, state.rung + 1) });
  if (ev.key === "Escape") return go({ sel: null, pair: null, menu: false });
});

readURL(); writeURL(); render();
</script>
</body>
</html>
