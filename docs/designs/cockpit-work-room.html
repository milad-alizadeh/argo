        <span class="kv"><span class="k">Bucket</span><span class="v mono">${t.bucket === 'blocked' ? 'blocked' : 'open'}</span></span>
        <span class="kv"><span class="k">Labels</span>
          <span class="labels">${labels.map(([n, tint]) => `<span class="label ${tint}">${n}</span>`).join('')}</span></span>
      </div>
      <div class="body">
        <span class="cap" style="display:block;margin-bottom:var(--s-snug)">Deliveries</span>
        ${deliveryChips(t.id, false)}
        <p>The backlog’s home, with the sidebar freed: views at 280, the backlog at 520 where
        a title reads whole at depth three, and the ticket beside it.</p>
        <h2>Acceptance criteria</h2>
        <p>Any node — parent or leaf — opens in detail through the same view; type is a
        property. Parents show a Children section and an <code>n/m</code> roll-up.</p>
        ${t.kids ? `<h2>Children · ${t.kids[0]} of ${t.kids[1]} closed</h2>${childList(t.id)}` : ''}
        ${blk === null ? '' : `<h2>Blocked by${blk.length ? ` · ${blk.length}` : ''}</h2>
          ${blk.length ? blockerList(blk) : `<p>Nothing.</p>`}`}
      </div>
    </div>
  </div>`;
}

/* ============================================================================
   The pane headers. Icons are drawn rather than named, so this file says what shape it means.

   THE MARKS, RE-CUT. A toolbar mark is not a place to be inventive: the band is chrome, and
   chrome that has to be learned costs more than the space a familiar mark saves. `Start` is
   `play.fill` and not a bolt — a bolt reads as speed or as power, and neither is the act.
   New ticket is `square.and.pencil`, Mail's own compose mark, which is free here because #836
   took New Session out of this room rather than sharing a row with it.

   THREE MARKS ARE GONE AND CANNOT COME BACK WITHOUT SOMETHING TO PUT BEHIND THEM: the funnel
   (#900) drew a live mark over an empty closure, the Group-by menu (#1242) opened onto one
   stated row, and the two link verbs (#1242) said what the ticket's own number says.
   ========================================================================= */
const IC = {
  compose: '<path d="M13 2.6 8 7.6l-.6 2 2-.6 5-5z"/><path d="M13.5 9.5v3.2a1 1 0 0 1-1 1H3.3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h3.2"/>',
  search:  '<circle cx="6.6" cy="6.6" r="4.2"/><path d="M9.8 9.8 14 14"/>',
  play:    '<path d="M4.6 3 12 8l-7.4 5z" fill="currentColor" stroke="none"/>',
  chev:    '<path d="M4 6.5 8 10.5l4-4"/>',
  close:   '<circle cx="8" cy="8" r="5.6"/><path d="M5.9 5.9 10.1 10.1M10.1 5.9 5.9 10.1"/>',
  tick:    '<path d="M3 8.4 6.2 11.6 13 4.8"/>',
};
const svg = k => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
  stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const ibtn = (k, label) => `<button class="ibtn" title="${label}">${svg(k)}</button>`;

const LIGHTS = `<div class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>`;
const CONN = `<span class="conn" id="conn"><i></i>GitHub · milad-alizadeh</span>`;

/* THE SKILL PICKER (#1242), and it is NOT #872's chevron coming back. #872 deleted a menu of
   Mode RUNGS over a Session that did not exist yet: every open of it confirmed the value already
   there, and the rung is honestly changeable one place downstream, over a live Session whose
   rung that control reads back. This menu offers which SKILL the Session opens on, which has
   more than one answer in practice, whose default is a guess off a label rather than a value the
   reader set, and which nothing downstream can change — once the Session has opened on
   `/implement` no control anywhere re-opens it on `/grill-me`.

   IT NAMES WHY THE DEFAULT MATCHED, so the guess is inspectable rather than magic. */
const SKILLS = [
  { n:'/implement',     d:'nothing refuses it' },
  { n:'/design-to-code', d:'the screen has a design' },
  { n:'/grill-me',      d:'a decision, unanswered' },
  { n:'/triage',        d:'no priority, no type' },
  { n:'/prototype',     d:'a question, not a build' },
  { n:'/wayfinder',     d:'a PRD-shaped parent' },
];
/* The popover hangs off the COMMAND segment — the thing you read is the thing you press to
   change, which is the only arrangement in which a chevron beside a fact is not a second control
   over the same fact. */
const SKILL_MENU = `<div class="menu" style="left:82px">
  ${SKILLS.map((s, i) => `<div class="menu-row${i === 0 ? ' on' : ''}">
    <span class="tick">${i === 0 ? svg('tick') : ''}</span>
    <span>${s.n}</span><span class="why">${s.d}</span></div>`).join('')}
  <div class="menu-rule"></div>
  <div class="menu-row"><span class="tick"></span><span>Fresh Session</span></div>
  <span class="foot">Every Session started here carries this ticket.</span>
</div>`;

/* THE LIST PANE'S HEADER: New ticket at the pane's leading edge, search at its trailing one.
   Both act on the list, which is why both are here rather than in a window-wide row — a control
   placed off the window's trailing edge and a pane whose leading edge the reader can drag are
   two independent numbers, and they coincided by luck (#1242).

   New ticket SURVIVES a list with no rows where the field does not: the field goes with the list
   it searches, and the one thing this window creates is exactly what you want when there is
   nothing in it. Neither survives a VACANCY — that page replaces the deck, bands and all. */
function backlogPaneHeader() {
  const narrows = Boolean(visibleTickets().length) || Boolean(query());
  return `<div class="pane-head list">
    <div class="icap">${ibtn('compose', 'New ticket')}</div>
    <span class="grow"></span>
    ${narrows ? `<div class="search glass">${svg('search')}
      ${query() ? `<span class="typed">${query()}</span>` : '<span>Search the backlog</span>'}
    </div>` : ''}
  </div>`;
}

/* THE TICKET PANE'S HEADER: the `Start` pill at the pane's leading edge, and the closure verb
   beside it (#1333). It KEEPS ITS BAND with no ticket open — the pill goes, because a verb
   addressing nobody must not be one press away from being drawn, but a band that collapsed would
   move every pane beside it on the first click of the day. */
function ticketPaneHeader() {
  return `<div class="pane-head ticket">
    <div class="icap pill">
      <button class="seg verb" title="Start a Session on this ticket">${svg('play')}Start</button>
      <button class="seg cmd" title="Which skill the Session opens on">/implement${svg('chev')}</button>
    </div>
    <div class="icap">${ibtn('close', 'Close this ticket')}</div>
    ${state === 'skill-menu' ? SKILL_MENU : ''}
  </div>`;
}

/* The sidebar's band holds NOTHING but the traffic lights' zone, kept clear. The Project scope
   stays a `.navigation` toolbar item — the WINDOW's scope, not a pane's — so the room contributes
   nothing to `.toolbar` at all.

   OBSERVED, and not what this design draws: in the shipped room `.navigation` slides past the
   cleared sidebar band and lands on the LIST pane's leading vertical, on top of New ticket, so
   `ticketsRoom` renders the scope capsule there and no compose mark anywhere. `ticketsChrome`,
   which is the panes without the window, draws the arrangement below. That disagreement is a
   `/pixel-review` catch against the app, not a second answer to the column question. */
function titlebarHTML() {
  return `<div class="tb-lead">${LIGHTS}</div>`;
}

/* ============================================================================
   Assembly.
   ========================================================================= */
function render() {
  const panes = document.getElementById('panes');
  const tb = document.getElementById('titlebar');
  const railClass = state === 'unbound' ? 'rail-0' : 'rail-work';
  panes.className = 'panes ' + railClass;
  tb.className = 'titlebar ' + railClass;
  tb.innerHTML = titlebarHTML();
  const conn = document.getElementById('conn');
  if (conn) conn.style.visibility = state === 'unbound' ? 'hidden' : 'visible';

  // A VACANCY REPLACES THE WHOLE DECK — the pane headers go with the panes they belong to. The
  // unbound page takes the sidebar too: the room hides whole rather than rendering an empty
  // backlog beside views that read zero for a reason nobody stated (#272, #818).
  if (state === 'unbound') {
    panes.innerHTML = `<section class="deck"><div class="deck-head"></div>${unbound()}</section>`;
    return;
  }

  // A VACANCY is any page that replaces the deck. `unread` and `nothing-closed` are two of the
  // four, and they take the deck exactly as `cleared` does — headers and all.
  const page = state === 'unread' ? unread()
    : state === 'nothing-closed' ? nothingClosed()
    : !openTickets().length ? cleared()
    : null;
  const vacant = page !== null;
  const body = state === 'route' ? routeView() : page ?? '';

  panes.innerHTML = navSidebar() + `<section class="deck">
    ${state === 'route' || vacant
      ? `<div class="deck-head"></div>${body}`
      : `<div class="work">${listPane()}<div class="ticket-pane">${ticketPaneHeader()}${detailD()}</div></div>`}
    </section>`;
}

function select(id) { selected = id; render(); }

function setState(k) {
  state = k;
  shut = new Set(STATES[k].shut || []);
  selected = STATES[k].sel || (state === 'deep' ? '#607' : '#272');
  const u = new URLSearchParams(location.search);
  u.set('state', state);
  history.replaceState(null, '', '?' + u);
  paintChrome();
  render();
}
function paintChrome() {
  document.getElementById('state-note').textContent = STATES[state].q;
  const sel = document.getElementById('state-select');
  sel.innerHTML = Object.entries(STATES)
    .map(([k, v]) => `<option value="${k}"${k === state ? ' selected' : ''}>${v.n}</option>`).join('');
}

addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  const ks = Object.keys(STATES);
  const i = ks.indexOf(state);
  if (e.key === 'ArrowLeft')  setState(ks[(i - 1 + ks.length) % ks.length]);
  if (e.key === 'ArrowRight') setState(ks[(i + 1) % ks.length]);
});

(function boot() {
  const q = new URLSearchParams(location.search);
  if (q.get('render')) document.body.classList.add('render');
  const s = q.get('state');
  if (s && STATES[s]) state = s;
  shut = new Set(STATES[state].shut || []);
  selected = STATES[state].sel || (state === 'deep' ? '#607' : '#272');
  paintChrome();
  render();
})();
</script>
</body>
</html>
