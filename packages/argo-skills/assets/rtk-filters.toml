# Project RTK filters, copied in by `setup-argo-skills`. rtk (github.com/rtk-ai/rtk)
# filters command output before it reaches agent context; these cover commands rtk has no
# built-in filter for. Inert until you run `rtk trust --yes` — trust is keyed to this
# file's hash, so re-run it after any edit. `rtk verify` runs the [[tests.*]] blocks.
# A filter whose match_command never fires in your project is harmless — delete freely.
#
# rtk reads this file from the WORKING DIRECTORY only — never a parent, not even the git
# root. A monorepo whose commands run inside package directories needs a `.rtk` symlink
# back to this file in each of them, or these filters simply never apply there.
#
# Bound output with `tail_lines`, never `max_lines`. `max_lines` cuts from the head, so on a
# build with more warnings than the cap it is the trailing compiler error that is dropped and
# the run reads as clean; `tail_lines` keeps the end, where a build's diagnostics land, and
# announces what it dropped. For the same reason `on_empty` must never say "ok" — a failing
# run whose every line was stripped would then be reported as a success.
#
# Every filter you add that can see a build wants a fixture LONGER than its own cap: a case
# that fits inside the cap cannot prove anything about the cap, which is how a filter that hid
# every compiler error once passed its own tests. The Swift sidecar's last case is 520 lines
# for exactly that reason.
#
# This file carries no filters of its own. The per-toolchain blocks are sidecars, appended by
# `setup-argo-skills` only when it detects the toolchain: `rtk-filters.swift.toml` for a
# `Package.swift`, `rtk-filters.bun.toml` for a `bun.lock`. A filter for a command your
# project never runs is dead weight nobody deletes, so it is better never copied in.
#
# One standing exemption: a code review's input diff must be read UNFILTERED
# (`RTK_DISABLED=1 git diff …`) — a truncated diff makes review findings unfalsifiable.
schema_version = 1
