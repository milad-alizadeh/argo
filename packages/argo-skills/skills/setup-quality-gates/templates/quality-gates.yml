# Runs the repo's `quality` script on every PR; the caps live in the linter config.
name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: {{SETUP_ACTION}} # your package manager's setup action
        with:
          bun-version: latest
      - run: {{INSTALL_COMMAND}} # a frozen/locked install, not a resolving one
      - name: Quality gates
        working-directory: "{{WORKSPACE_DIR}}" # e.g. packages/web; "." for a single-package repo
        run: {{GATE_COMMAND}} # the one script wired in step 6 of the skill
