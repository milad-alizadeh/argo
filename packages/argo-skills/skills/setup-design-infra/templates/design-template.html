<!doctype html>
<!-- A design speaks only tokens (var(--token), .text-<role>) and names every region with
     data-component; repeated shapes are kit.js render functions. Rules: rules/design.md -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DESIGN — screen name</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      /* Page-local layout only — colour and spacing from tokens, type from role classes. */
      .panel {
        background: var(--panel);
        border-radius: var(--radius);
        padding: var(--space-inset);
      }
      .panel h2 {
        margin: 0;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <main data-component="ExampleScreen">
      <section class="panel" data-component="ExamplePanel">
        <h2 class="text-label">Section label</h2>
        <p class="text-body">Row copy uses the blessed ladder — no bespoke sizes.</p>
        <!-- rows via kit.js: document.write / DOM-append from named render fns -->
      </section>
    </main>
    <script src="./kit.js"></script>
  </body>
</html>
