# SwiftLint — the arithmetic half of rules/swift-style.md and rules/code-style.md, as a
# build failure. Every rule here is an ERROR: a warning is a note nobody reads, and the
# caps are the rules. Exemptions are ratchets, listed at the bottom with a reason.
#
# The numbers are biome.jsonc's numbers. A 200-line function is as unreadable in Swift as
# in TypeScript, so the ceilings do not get to differ by language.

included:
  - Argo
  - Packages/ArgoUI/Sources
  - Packages/ArgoEngine/Sources
  - Packages/ArgoEngine/Tests
  - Packages/ArgoUI/Tests

excluded:
  - build
  - .build
  - Argo.xcodeproj
  - Packages/ArgoEngine/Tests/ArgoEngineTests/Fixtures

analyzer_rules:
  - unused_import

# --- the caps (code-style.md) ---

file_length:
  # 150 code lines is the house ceiling. SwiftLint can skip comment-only lines but has no
  # option to skip BLANK ones, which biome's noExcessiveLinesPerFile does — so the raw
  # number is raised by roughly the blank-line share of a formatted Swift file to enforce
  # the same intent. Raise this only by fixing the tool, never to fit a file.
  error: 175
  warning: 175
  ignore_comment_only_lines: true

type_body_length:
  # 150 code lines is the house ceiling for a type, and nothing in the tree is over it. #793 swept
  # the last of it — every body between 151 and 169 was split along a boundary its own doc comment
  # states. This is a cap rather than a target now: split the type, never raise the number.
  error: 150
  warning: 150

function_body_length:
  # Counts neither comments nor blank lines, so this is biome's 50 exactly.
  error: 50
  warning: 50

closure_body_length:
  # The same 50 as a function body, deliberately. A SwiftUI `body` IS a closure, so a tighter
  # cap here would hold view code to a stricter ceiling than the JSX it is the counterpart of
  # — and biome gates that at 50. The fix when it fires is the same either way: the nested
  # layers are subviews (rules/swift-style.md, "a body is a composition").
  error: 50
  warning: 50

function_parameter_count:
  # The fourth positional parameter is forbidden; pass a struct.
  #
  # This rule visits FUNCTION declarations only — an initializer is invisible to it, which is how
  # a 27-parameter init sat under a cap of 4 for as long as it did (#755). `swift-boundaries.sh`
  # edge 6 applies THIS number to `init`, so the cap is stated once and no second figure can drift
  # above it: the 18 that used to sit here as a ratchet was a gate nothing anyone writes could
  # fail (#992).
  error: 4
  warning: 4
  # RATCHET initializer-parameter-count — the LIST is the ratchet, not a wider number. Edge 6 fails
  # any init over the cap above that is not named here, and fails a name that is not over the cap
  # any more, so the list can only shrink. Group the parameters by the reading each comes from and
  # pass one value per reading, the way CockpitPresentation.Session does, then delete the line.
  # Matched by file and width, so no line number churns; #992 found these 34 all passing silently.
  #
  # INIT: Ticket.swift 12 — a provider's whole ticket record, field for field
  # INIT: Ticket+Copy.swift 10 — Ticket's memberwise copy, one slot per field it carries
  # INIT: CockpitPresentation+Session.swift 10 — the projected Session, one group per reading
  # INIT: ArgoPalette.swift 10 — one ground per surface layer
  # INIT: SpawnServices.swift 9 — the Hub's spawn collaborators and the files they own
  # INIT: ConnectReading.swift 9 — the connect panel's whole reading
  # INIT: ConnectPanelActions.swift 8 — one closure per connect step
  # INIT: ToolCall.swift 7 — a call as the transcript declares it
  # INIT: ComposerDraft.swift 7 — what the composer holds between sends
  # INIT: ArgoPalette.swift 7 — the palette's role groups, one per family
  # INIT: ArgoPalette.swift 7 — one colour per interaction role
  # INIT: DeliveryPullRequest.swift 6 — the PR's own fields; its git facts are grouped already
  # INIT: CockpitPresentation.swift 6 — one project row, a field per column
  # INIT: CockpitPresentation+SessionValues.swift 6 — the autonomy reading, one fact per rung
  # INIT: GitHubDeviceChallenge.swift 5 — the device-flow response as GitHub documents it
  # INIT: SessionAttachment.swift 5 — an attachment's own facts
  # INIT: LaunchConfiguration.swift 5 — the launch arguments as parsed
  # INIT: SessionSignals.swift 5 — the signals one transcript record carries
  # INIT: SessionSeed.swift 5 — what a New Session opens with
  # INIT: LiveClaudeFixture.swift 5 — a live-CLI fixture's collaborators
  # INIT: CockpitPresentation.swift 5 — the cockpit reading's parts
  # INIT: ComposerSpecimen.swift 5 — the composer specimen's inputs
  # INIT: TextRoles.swift 5 — one colour per text role

cyclomatic_complexity:
  # biome gates cognitive complexity at 15; SwiftLint measures cyclomatic. Same ceiling,
  # slightly stricter metric — a flat switch inflates it, which is what the `ignores_case_
  # statements` option is for.
  error: 15
  warning: 15
  ignores_case_statements: true

line_length:
  # Matches biome's lineWidth and .swiftformat's --maxwidth, and applies to CODE only —
  # neither formatter reflows a comment, so gating prose here would be stricter than the
  # TypeScript side for no reading benefit. URLs and interpolated strings cannot be wrapped.
  error: 100
  warning: 100
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  # "Names are words, not abbreviations". The default min of 3 already blocks `ctx`-shaped
  # names; the allowed shorts are the loop/coordinate idioms the rule exempts everywhere.
  min_length:
    error: 3
  max_length:
    error: 50
  allowed_symbols: ["_"]
  # EXEMPTION pr, ci — #258, 2026-08-27. `CONTEXT.md` L4 spells two of the five lifecycle nodes
  # exactly this way, and code-style.md exempts a domain's own acronyms from the min length.
  excluded: [id, x, y, to, at, on, up, pr, ci]

type_name:
  min_length:
    error: 3
  max_length:
    error: 50

# --- the escape hatches (swift-style.md "No escape hatches") ---

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unavailable_function
  - explicit_init
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - toggle_bool
  - unowned_variable_capture
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - sorted_first_last
  - joined_default_parameter
  - legacy_multiple
  - static_operator
  - closure_body_length
  - overridden_super_call
  - prohibited_super_call
  - private_action
  - private_outlet
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - vertical_parameter_alignment_on_call
  - yoda_condition

# `Bool?` and `[T]?` are the right shape at the JSON boundary — absent is not false and not
# empty — so discouraged_optional_boolean / _collection are deliberately NOT enabled.

disabled_rules:
  # SwiftFormat owns wrapping and blank lines; two formatters disagreeing is a loop.
  - opening_brace
  - trailing_comma
  # `todo` is a warning-shaped rule in an errors-only config, and rules/comments.md already
  # says where a TODO may live.
  - todo

custom_rules:
  unchecked_sendable:
    name: "@unchecked Sendable"
    regex: '@unchecked\s+Sendable'
    message: "A promise to the concurrency checker that nothing verifies — make the type a value type, or put it behind an actor (rules/swift-style.md)."
    severity: error

  swiftlint_disable:
    name: "swiftlint:disable"
    regex: 'swiftlint:disable(?!:this-file-is-the-config)'
    message: "The caps are the rules. Fix the code, or add a ratchet to .swiftlint.yml where it is visible."
    severity: error

reporter: "xcode"
